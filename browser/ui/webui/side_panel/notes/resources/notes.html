<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./notes.css">
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <form id="note-form">
        <input id="note-title" aria-label="Title" placeholder="Title">
        <textarea id="note-content" aria-label="Note" placeholder="Write a note"></textarea>
        <button type="submit">Save note</button>
      </form>
      <div id="notes"></div>
    </main>
    <script type="module" src="./notes.js"></script>
  </body>
</html>
