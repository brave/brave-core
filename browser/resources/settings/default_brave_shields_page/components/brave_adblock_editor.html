<style include="cr-shared-style settings-shared">
  :host {
    --cr-input-background-color: var(--google-grey-100);
  }

  @media (prefers-color-scheme: dark) {
    :host {
      --cr-input-background-color: rgba(0, 0, 0, .3);
    }
  }

  .editor-box {
    position: relative;
    box-sizing: border-box;
    display: flex;
    flex-direction: row;
    align-items: center;
    overflow: hidden;
    width: 100%;
    height: 300px;
    margin-bottom: 10px;
    background-color: var(--cr-input-background-color);
    padding: 5px 5px 5px 0;
    border-radius: 4px;
    border: 1px solid transparent;
  }
</style>

<div>
  <div class="editor-box">
    <brave-code-editor
      id="codeEditor"
      value="[[value]]"
      readonly="[[!developerModePref_.value]]"
      on-code-change="handleCodeChange_">
    </brave-code-editor>
  </div>
  <cr-button
    on-click="handleSave_"
    disabled="[[!developerModePref_.value]]">
    $i18n{adblockSaveChangesButtonLabel}
  </cr-button>
</div>
