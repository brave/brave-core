<style include="cr-shared-style settings-shared md-select">
  /* Lines up with cr-input. */
  #custom-input {
    /* (cr-input line-height + cr-input top/bottom padding) / 2 -
       cr-radio disc-wrapper height / 2 */
    --cr-radio-button-disc-margin-block-start: calc(
        (1.54em + 12px) / 2 - 8px);
    align-items: start;
  }
</style>
<settings-toggle-button elide-label
  class="cr-row"
  hidden="[[!pageVisibility.homeButton]]"
  pref-key="browser.show_home_button"
  label="$i18n{showHomeButton}"
  sub-label="[[getShowHomeSubLabel_(
                showHomeButtonPref_.value,
                homepageIsNewTabPagePref_.value,
                homepagePref_.value)]]">
</settings-toggle-button>
<template is="dom-if" if="[[showHomeButtonPref_.value]]">
  <div id="home-button-options" class="list-frame"
    hidden="[[!pageVisibility.homeButton]]">
    <settings-radio-group pref-key="homepage_is_newtabpage">
      <controlled-radio-button class="list-item" name="true"
        pref-key="homepage_is_newtabpage"
        label="$i18n{homePageNtp}" no-extension-indicator>
      </controlled-radio-button>
      <controlled-radio-button id="custom-input" class="list-item"
        name="false" pref-key="homepage_is_newtabpage"
        no-extension-indicator>
        <home-url-input id="customHomePage"
          can-tab="[[!homepageIsNewTabPagePref_.value]]">
        </home-url-input>
      </controlled-radio-button>
      <template is="dom-if" if="[[homepagePref_.extensionId]]">
        <extension-controlled-indicator
          extension-id="[[homepagePref_.extensionId]]"
          extension-can-be-disabled="[[
                        homepagePref_.extensionCanBeDisabled]]"
          extension-name="[[homepagePref_.controlledByName]]"
          on-disable-extension="onDisableExtension_">
        </extension-controlled-indicator>
      </template>
    </settings-radio-group>
  </div>
</template>
<settings-toggle-button class="hr"
  hidden="[[!isShowBraveShieldsInPageInfoEnabled_]]"
  pref-key="brave.subtle_app_menu_logo"
  label="$i18n{appearanceSettingsSubtleAppMenuLogo}">
</settings-toggle-button>
<settings-brave-appearance-bookmark-bar>
</settings-brave-appearance-bookmark-bar>
<settings-toggle-button class="hr" id="showSavedTabGroups"
    pref-key="bookmark_bar.show_tab_groups"
    label="$i18n{showTabGroupsInBookmarksBar}">
</settings-toggle-button>
<settings-toggle-button class="hr" id="autoPinNewTabGroups"
    pref-key="auto_pin_new_tab_groups"
    label="$i18n{autoPinNewTabGroups}">
</settings-toggle-button>
<settings-toggle-button
  id="autocomplete-suggestion-sources"
  class="cr-row"
  pref-key="brave.autocomplete_enabled"
  label="$i18n{appearanceSettingsShowAutocompleteInAddressBar}">
</settings-toggle-button>
<template
  is="dom-if"
  if="[[autocompleteEnabledPref_.value]]">
  <div class="list-frame vertical-list">
    <settings-checkbox
      class="cr-row list-item"
      pref-key="brave.top_site_suggestions_enabled"
      label="$i18n{appearanceSettingsUseOnDeviceSuggestions}">
    </settings-checkbox>
    <settings-checkbox
      class="cr-row list-item"
      pref-key="brave.omnibox.history_suggestions_enabled"
      label="$i18n{appearanceSettingsUseHistorySuggestions}">
    </settings-checkbox>
    <settings-checkbox
      class="cr-row list-item"
      pref-key="brave.omnibox.bookmark_suggestions_enabled"
      label="$i18n{appearanceSettingsUseBookmarkSuggestions}">
    </settings-checkbox>
    <template is="dom-if" if="[[showCommandsInOmnibox_()]]">
      <settings-checkbox
        class="cr-row list-item"
        pref-key="brave.omnibox.commander_suggestions_enabled"
        label="$i18n{appearanceSettingsUseCommanderSuggestions}">
      </settings-checkbox>
    </template>
    <if expr="enable_ai_chat">
    <template is="dom-if" if="[[showLeoAssistant_()]]">
      <settings-checkbox class="cr-row list-item"
        pref-key="brave.ai_chat.autocomplete_provider_enabled"
        label="$i18n{appearanceSettingsUseLeoSuggestions}">
      </settings-checkbox>
    </template>
    </if>
  </div>
</template>
<settings-toggle-button
  class="cr-row"
  pref-key="brave.location_bar_is_wide"
  label="$i18n{appearanceSettingsLocationBarIsWide}">
</settings-toggle-button>
<settings-toggle-button
  pref-key="omnibox.prevent_url_elisions"
  class="cr-row"
  label="$i18n{showFullUrls}">
</settings-toggle-button>

<if expr="is_macosx">
  <settings-toggle-button
    pref-key="browser.show_fullscreen_toolbar"
    class="cr-row"
    label="$i18n{showToolbarInFullScreen}">
  </settings-toggle-button>
</if>

<settings-toggle-button
  id="compactModeToggle"
  class="cr-row"
  pref-key="brave.tabs.compact_horizontal_tabs"
  label="$i18n{SETTINGS_APPEARANCE_SETTINGS_TABS_USE_COMPACT_HORIZONTAL_TABS}"
  disabled="[[!compactModeToggleEnabled_]]">
</settings-toggle-button>

<settings-toggle-button
  class="cr-row"
  pref-key="brave.web_view_rounded_corners"
  label="$i18n{appearanceSettingsWebViewRoundedCorners}">
</settings-toggle-button>
