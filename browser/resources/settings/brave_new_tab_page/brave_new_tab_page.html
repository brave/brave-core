<link rel="import" href="chrome://resources/cr_elements/md_select.css.html">

<style include="settings-shared md-select">
</style>

<settings-section
  id="newTab"
  page-title="$i18n{braveNewTab}">

  <div class="settings-box first">
    <div class="flex cr-padded-text" aria-hidden="true">
      $i18n{braveNewTabNewTabPageShows}
    </div>
    <settings-dropdown-menu
      label="$i18n{braveNewTabNewTabPageShows}"
      pref-key="brave.new_tab_page.shows_options"
      menu-options="[[newTabShowOptions_]]">
    </settings-dropdown-menu>
  </div>
  <settings-toggle-button
    class="hr"
    pref-key="brave.brave_private_new_tab.show_search_box"
    label="$i18n{braveNewTabPrivateWindowSearchBox}"
    sub-label="$i18n{braveNewTabPrivateWindowSearchBoxDesc}">
  </settings-toggle-button>
  <template is="dom-if" if="[[showNewTabDashboardSettings_]]">
    <div class="settings-row">
      <cr-link-row
	class="hr"
	label="$i18n{braveNewTabNewTabCustomizeWidgets}"
	on-click="openNewTabPage_" external>
      </cr-link-row>
    </div>
  </template>

</settings-section>
