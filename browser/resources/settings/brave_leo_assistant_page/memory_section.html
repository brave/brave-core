<style include="cr-shared-style settings-shared">
  .list {
    display: flex;
    flex-direction: column;
    width: 100%;
    border: 1px solid var(--leo-color-divider-subtle);
    border-radius: var(--leo-radius-m);
  }

  .memory {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--leo-spacing-l) var(--leo-spacing-xl);
    border-bottom: 1px solid var(--leo-color-divider-subtle);
  }

  .memory:last-of-type {
    border-bottom: none;
  }

  .list-container {
    padding: var(--leo-spacing-l) var(--leo-spacing-2xl)
  }

  .action-box {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: var(--leo-spacing-m);
    padding: var(--leo-spacing-xl) var(--leo-spacing-2xl) var(--leo-spacing-m) var(--leo-spacing-2xl);
  }

  .label-secondary {
    font: var(--leo-font-default-regular);
    color: var(--leo-color-text-secondary);
  }

  .header {
    padding: var(--leo-spacing-2xl) var(--leo-spacing-2xl) 0 var(--leo-spacing-2xl);
  }

  .main-header {
    font: var(--leo-font-heading-h4);
  }

  .memory-actions {
    display: flex;
    height: 36px;
    justify-content: flex-end;
    align-items: center;
    gap: var(--leo-spacing-m);
  }

  settings-toggle-button {
    padding: var(--leo-spacing-l) var(--leo-spacing-2xl);
  }

  .empty-memories-table {
    display: flex;
    flex-direction: column;
    align-items: center;
    align-self: stretch;
    border-radius: var(--leo-radius-m);
    border: 1px solid var(--leo-color-divider-subtle);
    width: 100%;
    padding: var(--leo-spacing-4xl) 0px;
    justify-content: center;
  }

  .empty-memories-title {
    color: var(--leo-color-text-tertiary);
    text-align: center;
    font-weight: 600;
  }

  .empty-memories-desc {
    color: var(--leo-color-text-tertiary);
    text-align: center;
    font-weight: 400;
  }

  cr-dialog [slot="title"] {
    color: var(--leo-color-text-primary);
    font: var(--leo-font-heading-h3);
    display: flex;
    padding: var(--leo-spacing-2xl);
    align-items: flex-start;
    gap: var(--leo-spacing-xl);
    align-self: stretch;
  }

  cr-dialog [slot="body"] {
    display: flex;
    padding: var(--leo-spacing-m) var(--leo-spacing-2xl);
    flex-direction: column;
    align-items: center;
    gap: var(--leo-spacing-2xl);
    align-self: stretch;
  }

  cr-dialog [slot="button-container"] {
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    gap: var(--leo-spacing-m);
  }

  /* Avoid stretching the buttons */
  .action-box leo-button,
  cr-dialog [slot="button-container"] leo-button {
    width: auto !important;
    min-width: unset !important;
    flex: 0 0 auto !important;
  }

  .delete-button {
    --leo-button-color: var(--leo-color-systemfeedback-error-text);
  }

  .error-message {
    --leo-icon-color: var(--leo-color-systemfeedback-error-icon);

    display: flex;
    align-items: center;
    gap: var(--leo-spacing-s);
    color: var(--leo-color-systemfeedback-error-text);
    font: var(--leo-font-small-regular);
  }

  .memory-input {
    width: 100%;
  }

  .search-container {
    margin-bottom: var(--leo-spacing-l);
  }

  .related-heading {
    margin-bottom: var(--leo-spacing-m);
    color: var(--leo-color-text-secondary);
    font: var(--leo-font-small-semibold);
  }

  .related-memories {
    margin-bottom: var(--leo-spacing-xl);
  }

  /* The part of a memory that the search box matches. */
  .match {
    background-color: var(--leo-color-container-highlight);
    border-radius: var(--leo-radius-s);
    font-weight: 600;
  }

  .no-results-title {
    color: var(--leo-color-text-primary);
    font-weight: 600;
  }

  .clear-search-link {
    color: var(--leo-color-text-primary);
    text-decoration: underline;
    font-weight: 400;
  }

  .memory-info {
    flex: 1;
  }

  .details,
  .previous {
    font: var(--leo-font-small-regular);
    color: var(--leo-color-text-tertiary);
  }

  /* The lock of a memory that Leo keeps as it is. */
  .keep {
    --leo-icon-color: var(--leo-color-icon-default);
  }

  .keep.kept,
  .kept-icon {
    --leo-icon-color: var(--leo-color-icon-interactive);
    color: var(--leo-color-icon-interactive);
  }

  /* The same box as the icon buttons of a learned memory, so that the
     icons of both kinds of row line up. */
  .kept-icon {
    --leo-icon-size: 20px;
  }

  .learn-box {
    padding: 0 var(--leo-spacing-2xl);
  }

  .dream-result {
    font: var(--leo-font-small-regular);
    color: var(--leo-color-text-secondary);
  }

  /* The notice that a run of "Learn from chats" left changes to review. */
  .review-notice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--leo-spacing-xl);
    margin: var(--leo-spacing-l) var(--leo-spacing-2xl) 0;
    padding: var(--leo-spacing-l) var(--leo-spacing-xl);
    border: 1px solid var(--leo-color-divider-subtle);
    border-radius: var(--leo-radius-m);
    font: var(--leo-font-default-regular);
    color: var(--leo-color-text-primary);
  }

  .review-notice leo-button {
    flex: 0 0 auto;
  }

  /* The review dialog. */
  #dreamingReviewDialog [slot="body"] {
    align-items: stretch;
    gap: var(--leo-spacing-l);
  }

  .review-intro {
    font: var(--leo-font-default-regular);
    color: var(--leo-color-text-secondary);
  }

  .review-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--leo-spacing-xl);
    font: var(--leo-font-small-regular);
    color: var(--leo-color-text-secondary);
  }

  .review-list {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--leo-color-divider-subtle);
    border-radius: var(--leo-radius-m);
  }

  .review-group-heading {
    padding: var(--leo-spacing-l) var(--leo-spacing-xl) var(--leo-spacing-m);
    font: var(--leo-font-small-semibold);
    color: var(--leo-color-text-secondary);
  }

  .review-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--leo-spacing-m);
    padding-block: var(--leo-spacing-m);
    padding-inline: var(--leo-spacing-xl) var(--leo-spacing-m);
    border-bottom: 1px solid var(--leo-color-divider-subtle);
    color: var(--leo-color-text-primary);
  }

  /* The text box can grow, and the button stays at its first line. */
  .review-item.editing {
    align-items: flex-start;
  }

  .review-item:last-child {
    border-bottom: none;
  }

  /* A change that the user does not keep. The checkbox says it too. */
  .review-item.skipped {
    color: var(--leo-color-text-tertiary);
  }

  .review-item-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: var(--leo-spacing-xs);
    min-width: 0;
    /* Lines up with the text of the checkbox: 20px box, then the gap. */
    padding-top: var(--leo-spacing-s);
    padding-bottom: var(--leo-spacing-s);
  }

  .review-item-body leo-checkbox {
    display: block;
  }

  .review-before {
    padding-inline-start: calc(20px + var(--leo-spacing-m));
    font: var(--leo-font-small-regular);
    color: var(--leo-color-text-tertiary);
  }

  .review-edit {
    display: flex;
    flex: 1;
    align-items: flex-start;
    gap: var(--leo-spacing-m);
    min-width: 0;
    padding-top: var(--leo-spacing-s);
  }

  .review-edit leo-textarea {
    flex: 1;
    min-width: 0;
  }

  .review-item-actions {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
  }

  .review-error {
    font: var(--leo-font-small-regular);
    color: var(--leo-color-systemfeedback-error-text);
  }
</style>

<div class="settings-box header">
  <div class="flex">
    <div class="main-header">$i18n{braveLeoAssistantYourMemoriesTitle}</div>
    <div class="label secondary">
      <span>$i18nRaw{braveLeoAssistantYourMemoriesDesc}</span>
    </div>
  </div>
</div>

<settings-toggle-button id="userMemoryEnabled"
    icon="database"
    pref="{{prefs.brave.ai_chat.user_memory_enabled}}"
    label="$i18n{braveLeoAssistantUserMemoryEnabledLabel}">
</settings-toggle-button>

<template is="dom-if" if="[[prefs.brave.ai_chat.user_memory_enabled.value]]" restamp>
  <template is="dom-if" if="[[hasReview_(reviewItems_)]]">
    <div class="review-notice">
      <span>$i18n{braveLeoAssistantDreamReviewPending}</span>
      <leo-button id="reviewButton" kind="filled" size="small"
          on-click="openReview_">
        $i18n{braveLeoAssistantDreamReviewButton}
      </leo-button>
    </div>
  </template>

  <div class="list-container">
    <div class="search-container">
      <leo-input
        type="text"
        placeholder="$i18n{braveLeoAssistantSearchMemoriesPlaceholder}"
        value="[[searchQuery]]"
        disabled$="[[!hasRows_(rows_)]]"
        on-input="onSearchInput_">
        <leo-icon name="search" slot="left-icon"></leo-icon>
        <template is="dom-if" if="[[searchQuery]]">
          <leo-button
            kind="plain-faint"
            fab
            size="small"
            slot="right-icon"
            on-click="clearSearch_">
            <leo-icon name="close"></leo-icon>
          </leo-button>
        </template>
      </leo-input>
    </div>

    <template is="dom-if" if="[[showEmptyList_(rows_, searchQuery)]]">
      <div class="empty-memories-table">
        <div class="empty-memories-title">$i18n{braveLeoAssistantMemoryListEmptyTitle}</div>
        <div class="empty-memories-desc">
          $i18n{braveLeoAssistantMemoryListEmptyDescription}
        </div>
        <template is="dom-if" if="[[available_]]">
          <div class="empty-memories-desc">
            $i18n{braveLeoAssistantLearnedMemoriesEmptyDescription}
          </div>
        </template>
      </div>
    </template>

    <template is="dom-if" if="[[hasNoSearchResults_(rows_, groups_, searchQuery)]]">
      <div class="empty-memories-table">
        <div class="no-results-title">$i18n{braveLeoAssistantNoSearchResultsFound}</div>
        <div class="clear-search-link" on-click="clearSearch_">$i18n{braveLeoAssistantClearSearch}</div>
      </div>
    </template>

    <template is="dom-repeat" items="[[groups_]]" as="group">
      <template is="dom-if" if="[[group.related]]">
        <div class="related-heading">
          $i18n{braveLeoAssistantRelatedMemoriesHeading}
        </div>
      </template>
      <div class$="[[getGroupClass_(group)]]">
        <template is="dom-repeat" items="[[group.rows]]" as="row">
          <div class="memory">
            <div class="memory-info">
              <div class="label"><template is="dom-repeat" items="[[getSegments_(row, searchQuery)]]" as="segment"
                  ><span class$="[[getSegmentClass_(segment)]]">[[segment.text]]</span
              ></template></div>
              <div class="details" title$="[[getDetailsTitle_(row)]]">[[getDetails_(row)]]</div>
              <template is="dom-if" if="[[hasPreviousText_(row)]]">
                <div class="previous">[[getPreviousText_(row)]]</div>
              </template>
            </div>
            <div class="memory-actions">
              <leo-button
                kind="plain-faint"
                fab size="medium"
                title="$i18n{braveLeoAssistantMemoryEditLabel}"
                aria-label="$i18n{braveLeoAssistantMemoryEditLabel}"
                on-click="handleEdit_">
                <leo-icon name="edit-pencil"></leo-icon>
              </leo-button>
              <template is="dom-if" if="[[!row.learned]]">
                <leo-icon
                  class="kept-icon"
                  name="lock"
                  title="$i18n{braveLeoAssistantMemoryWrittenKept}">
                </leo-icon>
              </template>
              <template is="dom-if" if="[[row.learned]]">
                <leo-button
                  class$="[[getKeepClass_(row)]]"
                  kind="plain-faint"
                  fab size="medium"
                  title$="[[getKeepLabel_(row)]]"
                  aria-label$="[[getKeepLabel_(row)]]"
                  on-click="onToggleKeep_">
                  <leo-icon name$="[[getKeepIcon_(row)]]"></leo-icon>
                </leo-button>
              </template>
              <leo-button
                kind="plain-faint"
                fab size="medium"
                title="$i18n{braveLeoAssistantMemoryDeleteLabel}"
                aria-label="$i18n{braveLeoAssistantMemoryDeleteLabel}"
                on-click="handleDelete_">
                <leo-icon name="trash"></leo-icon>
              </leo-button>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <div class="action-box">
    <leo-button
      on-click="handleAddNewMemory_"
      kind="outline"
      class="action-button">
      $i18n{braveLeoAssistantAddNewMemoryButtonLabel}
    </leo-button>
    <template is="dom-if" if="[[available_]]">
      <leo-button
        id="dreamNowButton"
        kind="outline"
        on-click="onDreamNow_"
        isDisabled$="[[isDreaming_]]">
        [[getDreamButtonText_(isDreaming_)]]
      </leo-button>
    </template>
    <leo-button
      id="deleteAllButton"
      on-click="handleDeleteAllMemories_"
      kind="plain"
      class="delete-button"
      isDisabled$="[[!canDeleteAll_(rows_, isDreaming_)]]">
      $i18n{braveLeoAssistantDeleteAllMemoriesConfirmationTitle}
    </leo-button>
  </div>

  <template is="dom-if" if="[[available_]]">
    <div class="learn-box">
      <template is="dom-if" if="[[hasDreamResult_(dreamResult_)]]">
        <div class="dream-result">[[dreamResult_]]</div>
      </template>
      <div class="label-secondary">
        $i18n{braveLeoAssistantLearnedMemoriesDesc}
      </div>
    </div>
  </template>
</template>

<template
  is="dom-if"
  if="[[showMemoryDialog_]]"
  restamp
>
  <cr-dialog id="memoryDialog" show-on-attach show-close-button on-close="onDialogCancel_">
    <div slot="title">[[getDialogTitle_(editingRow_)]]</div>
    <div slot="body">
      <leo-input required type="text"
        value="[[editingMemory_]]" on-input="onDialogInput_"
        showErrors$="[[isTooLong(editingMemory_)]]"
        placeholder="$i18n{braveLeoAssistantMemoryInputPlaceholder}"
        class="memory-input">
        <div slot="errors" class="error-message" hidden$="[[!isTooLong(editingMemory_)]]">
          <leo-icon name="warning-triangle-filled"></leo-icon>
          <span>$i18n{braveLeoAssistantInputLengthError}</span>
        </div>
      </leo-input>
    </div>
    <div slot="button-container">
      <leo-button kind="plain-faint" on-click="onDialogCancel_">$i18n{cancel}</leo-button>
      <leo-button class="action-button" on-click="onDialogSave_" isDisabled$="[[!isMemoryInputValid_]]">$i18n{save}</leo-button>
    </div>
  </cr-dialog>
</template>

<template is="dom-if" if="[[showDeleteDialog_]]" restamp>
  <cr-dialog show-on-attach show-close-button on-close="onDeleteDialogCancel_">
    <div slot="title">$i18n{braveLeoAssistantDeleteMemoryConfirmationTitle}</div>
    <div slot="body">
      $i18n{braveLeoAssistantDeleteMemoryConfirmation}
    </div>
    <div slot="button-container">
      <leo-button kind="plain-faint" on-click="onDeleteDialogCancel_">$i18n{cancel}</leo-button>
      <leo-button class="delete-button" on-click="onDeleteDialogConfirm_">
        $i18n{delete}
      </leo-button>
    </div>
  </cr-dialog>
</template>

<template is="dom-if" if="[[showDeleteAllDialog_]]" restamp>
  <cr-dialog id="deleteAllDialog" show-on-attach show-close-button on-close="onDeleteAllDialogCancel_">
    <div slot="title">$i18n{braveLeoAssistantDeleteAllMemoriesConfirmationTitle}</div>
    <div slot="body">
      $i18n{braveLeoAssistantDeleteAllMemoriesConfirmation}
      <template is="dom-if" if="[[available_]]">
        $i18n{braveLeoAssistantDeleteAllLearnedMemoriesNote}
      </template>
    </div>
    <div slot="button-container">
      <leo-button kind="plain-faint" on-click="onDeleteAllDialogCancel_">$i18n{cancel}</leo-button>
      <leo-button id="deleteAllConfirmButton" class="delete-button" on-click="onDeleteAllDialogConfirm_">
        $i18n{delete}
      </leo-button>
    </div>
  </cr-dialog>
</template>

<template is="dom-if" if="[[showReviewDialog_]]" restamp>
  <cr-dialog id="dreamingReviewDialog" show-on-attach show-close-button
      on-close="onReviewDialogClose_">
    <div slot="title">$i18n{braveLeoAssistantDreamReviewTitle}</div>
    <div slot="body">
      <div class="review-intro">
        $i18n{braveLeoAssistantDreamReviewDescription}
      </div>
      <div class="review-toolbar">
        <leo-checkbox id="reviewKeepAll" size="small"
            checked="[[reviewAllKept_]]" on-change="onReviewKeepAllChange_">
          $i18n{braveLeoAssistantDreamReviewSelectAll}
        </leo-checkbox>
        <span>[[getKeptCountText_(reviewKeptCount_, reviewItems_.length)]]</span>
      </div>
      <div class="review-list">
        <template is="dom-repeat" items="[[reviewItems_]]">
          <template is="dom-if" if="[[item.firstOfKind]]">
            <div class="review-group-heading" role="heading" aria-level="3">
              [[getChangeLabel_(item)]]
            </div>
          </template>
          <div class$="[[getReviewItemClass_(item.keep, item.editing)]]">
            <template is="dom-if" if="[[!item.editing]]">
              <div class="review-item-body">
                <leo-checkbox class="review-keep"
                    checked="[[item.keep]]" on-change="onReviewKeepChange_">
                  [[item.text]]
                </leo-checkbox>
                <template is="dom-if" if="[[hasStoredText_(item)]]">
                  <div class="review-before">[[getStoredText_(item)]]</div>
                </template>
              </div>
              <div class="review-item-actions">
                <leo-button class="review-edit-button"
                    data-index$="[[index]]"
                    kind="plain-faint" fab size="medium"
                    title="$i18n{braveLeoAssistantMemoryEditLabel}"
                    aria-label="$i18n{braveLeoAssistantMemoryEditLabel}"
                    on-click="onReviewEdit_">
                  <leo-icon name="edit-pencil"></leo-icon>
                </leo-button>
              </div>
            </template>
            <template is="dom-if" if="[[item.editing]]">
              <div class="review-edit">
                <leo-textarea class="review-text"
                    data-index$="[[index]]"
                    minRows="1" maxRows="4"
                    aria-label="$i18n{braveLeoAssistantMemoryEditLabel}"
                    value="[[item.text]]"
                    showErrors$="[[hasReviewTextError_(item.error)]]"
                    on-input="onReviewTextInput_"
                    on-keydown="onReviewTextKeyDown_">
                  <div slot="errors" class="error-message">
                    <leo-icon name="warning-triangle-filled"></leo-icon>
                    <span>[[getReviewTextErrorText_(item.error)]]</span>
                  </div>
                </leo-textarea>
              </div>
              <div class="review-item-actions">
                <leo-button kind="plain-faint" fab size="medium"
                    title="$i18n{braveLeoAssistantDreamReviewDone}"
                    aria-label="$i18n{braveLeoAssistantDreamReviewDone}"
                    on-click="onReviewEditDone_">
                  <leo-icon name="check-normal"></leo-icon>
                </leo-button>
              </div>
            </template>
          </div>
        </template>
      </div>
      <template is="dom-if" if="[[reviewError_]]">
        <div class="review-error" role="alert">
          $i18n{braveLeoAssistantDreamReviewError}
        </div>
      </template>
    </div>
    <div slot="button-container">
      <leo-button id="reviewDiscardButton" kind="plain-faint"
          isDisabled$="[[reviewSaving_]]" on-click="onReviewDiscard_">
        $i18n{braveLeoAssistantDreamReviewDiscard}
      </leo-button>
      <leo-button id="reviewSaveButton"
          isLoading$="[[reviewSaving_]]"
          isDisabled$="[[!canSaveReview_(reviewKeptCount_, reviewSaving_)]]"
          on-click="onReviewSave_">
        $i18n{braveLeoAssistantDreamReviewSave}
      </leo-button>
    </div>
  </cr-dialog>
</template>
