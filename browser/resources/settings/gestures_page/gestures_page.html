<style include="settings-shared md-select">
  .gestures-content {
    box-sizing: border-box;
    padding: var(--cr-section-vertical-margin, 12px) var(--cr-section-padding, 20px);
    width: 100%;
  }

  .header {
    padding: var(--leo-spacing-2xl);
  }

  .gestures-row {
    align-items: center;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    padding-block: 8px;
    width: 100%;
  }

  .gestures-label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-inline-end: 16px;
  }

  .gestures-site-origin {
    overflow: hidden;
    padding-inline-end: 16px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gestures-sublabel {
    color: var(--leo-color-text-secondary);
    font: var(--leo-font-small-regular);
  }

  /* Aligns under the chained-actions trail it describes, which is itself
     right-aligned (see .chained-actions). */
  .gestures-sublabel.command-clash-sublabel {
    display: block;
    text-align: end;
  }

  .gestures-sublabel.chained-actions-help {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.directional-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.custom-gestures-help {
    display: block;
  }

  .gestures-sublabel.closed-shape-help {
    display: block;
    margin-top: var(--leo-spacing-l);
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.capture-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.chained-actions-help leo-icon {
    --leo-icon-size: 16px;
  }

  /* `.chain-drag-handle`'s own `margin-inline-end` (needed where it's a real
     drag handle outside this flex row) would otherwise stack with this
     span's `gap`, making the drag icon's trailing space wider than every
     other icon's. */
  .gestures-sublabel.chained-actions-help .chain-drag-handle {
    margin-inline-end: 0;
  }

  #captureBox {
    aspect-ratio: 4 / 3;
    background: var(--leo-color-container-background);
    border: 1px dashed var(--leo-color-divider-strong);
    border-radius: var(--leo-radius-m);
    cursor: crosshair;
    margin: 8px 0;
    position: relative;
    width: 100%;
  }

  .capture-actions {
    display: flex;
    gap: 8px;
  }

  #captureBox svg {
    height: 100%;
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  .gesture-icons {
    align-items: center;
    display: flex;
    gap: 4px;
    --leo-icon-size: 24px;
  }

  .custom-gesture-preview {
    aspect-ratio: 1 / 1;
    background: var(--leo-color-container-background);
    border-radius: var(--leo-radius-s);
    flex-shrink: 0;
    /* A fixed size, rather than stretching to the row's height: a row with
       multiple chained actions stacks them vertically and is taller than a
       single select control, which would otherwise balloon the preview (via
       its aspect-ratio) into a huge square. Centered so it still lines up
       with the row's content when the row is taller than this. */
    align-self: center;
    height: 40px;
    width: 40px;
  }

  /* A static preview icon doesn't show the stroke's direction/order, which
     makes some shapes hard to reproduce; replaying it as a drawing
     animation on hover does. 500 comfortably exceeds any path length
     possible within the 32x32 viewBox, so the dash covers the whole path
     without visible gaps. */
  .custom-gesture-preview path {
    stroke-dasharray: 500;
    stroke-dashoffset: 0;
  }

  .custom-gesture-item:hover .custom-gesture-preview path {
    animation: brave-gestures-draw-preview 10s linear infinite;
  }

  /* Draws over the first 9.5s, then holds the finished shape for half a
     second before looping back to redraw, for as long as the row is
     hovered. */
  @keyframes brave-gestures-draw-preview {
    0% {
      stroke-dashoffset: 500;
    }
    95% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 0;
    }
  }

  .custom-gesture-actions {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  .gestures-divider {
    border: none;
    border-top: 1px solid var(--leo-color-divider-subtle);
    margin: 0;
    margin-bottom: var(--leo-spacing-l);
  }

  /* `.gestures-content`'s own top padding already provides this gap; without
     this, the two would stack into a visibly larger gap than any other
     divider on this page gets. */
  .gestures-divider:has(+ .gestures-content) {
    margin-bottom: 0;
  }

  .gestures-mapping-item + .gestures-mapping-item,
  .custom-gesture-item + .custom-gesture-item,
  .gestures-row + .gestures-row {
    border-top: 1px solid var(--leo-color-divider-subtle);
    margin-top: var(--leo-spacing-m);
    padding-top: var(--leo-spacing-m);
  }

  /* `!important` needed to beat md-select's own `color` rule, which has
     higher specificity (`select.md-select:not(.z)`). */
  .command-unassigned {
    color: var(--leo-color-text-secondary) !important;
  }

  /* Marks a gesture whose action is also used by another gesture; both are
     now allowed to share it, so this is just a visual heads-up, not an
     error state. A border rather than a filled background avoids fighting
     the select's own text color for contrast. The primitive step is used
     directly, rather than the systemfeedback-warning token, since that
     token flips to a near-black brown in dark mode (it's designed as a
     subtle tint behind matching warning text/icon colors, not as a
     standalone highlight). */
  .command-clash select {
    border: 2px solid var(--leo-color-primitive-yellow-70) !important;
  }

  .chained-actions {
    align-items: center;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-inline-start: auto;
  }

  .chained-action-trail {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }

  .chained-action-buttons {
    display: flex;
    flex-shrink: 0;
    gap: 4px;
  }

  /* No gap: the select and every param-attach control after it (a command's
     own param, the remove slot) sit flush against each other as one group.
     Stretch rather than center, so param-attach exactly matches the select's
     actual rendered height instead of a separately guessed pixel value. */
  .chained-action-row {
    align-items: stretch;
    display: flex;
  }

  .chain-link {
    --leo-icon-size: 16px;
    align-self: center;
    color: var(--leo-color-icon-secondary);
  }

  .chain-drag-handle {
    --leo-icon-size: 16px;
    color: var(--leo-color-icon-secondary);
    cursor: grab;
    margin-inline-end: 4px;
  }

  /* Shrinks each chain entry's select to its chosen command's text width;
     the dropdown's own option list still sizes to fit the widest option. */
  .chained-action-row select {
    --md-select-width: auto;
  }

  /* Same as above: "Left"/"Middle"/"Right" shouldn't stretch to md-select's
     wide default. */
  .wheel-modifier-button-select {
    --md-select-width: auto;
  }

  /* md-select's own :focus (not :focus-visible) always shows an outline,
     including right after a mouse-driven selection. Keep it for keyboard
     navigation only. */
  .chained-action-row select:focus:not(:focus-visible) {
    outline: none;
  }

  /* Squares off the trailing corner of the row's command select, or of an
     earlier param-attach control, when a later VISIBLE param-attach control
     follows it anywhere in the row (the URL param, the remove button, or
     both; `hidden$` leaves a param-less command's controls in the DOM, just
     display:none, so [hidden] siblings don't count), so the row's visible
     controls always read as one joined group with only outer corners
     rounded. A command with no param and no remove button (a single
     standalone action) has nothing later to match, so stays fully rounded. */
  .chained-action-row select:has(~ .param-attach:not([hidden])),
  .param-attach:has(~ .param-attach:not([hidden])) {
    border-start-end-radius: 0;
    border-end-end-radius: 0;
  }

  /* The counterpart to the rule above: every visible param-attach control's
     leading corner is squared, since the row's command select always
     precedes it (and is therefore always squared on its trailing side by
     the rule above, whenever this control is the thing making that true). */
  .param-attach:not([hidden]) {
    border-start-start-radius: 0;
    border-end-start-radius: 0;
  }

  /* Sits flush against the row's command select, sharing its border, so a
     command param (e.g. the URL for Navigate to URL) reads as part of the
     same control instead of a separate field next to it. */
  .param-attach {
    align-items: center;
    border: solid 1px var(--leo-color-divider-subtle);
    border-start-start-radius: 0;
    border-end-start-radius: 0;
    border-start-end-radius: 8px;
    border-end-end-radius: 8px;
    box-sizing: border-box;
    display: flex;
    gap: 4px;
    margin-inline-start: -1px;
    padding-inline-end: 6px;
    padding-inline-start: 10px;
  }

  .param-attach-label {
    font-size: 12px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* No label, just an icon, so needs less side padding than .param-attach's
     default. */
  .remove-attach {
    padding-inline: 6px;
  }

  .param-attach cr-icon-button {
    --cr-icon-button-margin-end: 0;
    --cr-icon-button-margin-start: 0;
    --cr-icon-button-size: 24px;
  }
</style>

<settings-section page-title="$i18n{braveGesturesPage}">
  <settings-toggle-button
      pref="{{prefs.brave.gestures.enabled}}"
      label="$i18n{braveGesturesEnable}"
      sub-label="$i18n{braveGesturesAboutDesc}">
  </settings-toggle-button>

  <template is="dom-if" if="[[prefs.brave.gestures.enabled.value]]">
    <settings-toggle-button class="cr-row"
        pref="{{prefs.brave.gestures.show_trail}}"
        label="$i18n{braveGesturesShowTrail}"
        sub-label="$i18n{braveGesturesShowTrailDesc}">
    </settings-toggle-button>

    <settings-toggle-button class="cr-row"
        pref="{{prefs.brave.gestures.show_matched_gesture}}"
        label="$i18n{braveGesturesShowMatchedGesture}"
        sub-label="$i18n{braveGesturesShowMatchedGestureDesc}">
    </settings-toggle-button>

    <label class="gestures-row settings-box">
      <div class="gestures-label">
        <span>$i18n{braveGesturesSensitivity}</span>
        <span class="gestures-sublabel">
          $i18n{braveGesturesSensitivityDesc}
        </span>
      </div>
      <input type="range" min="0" max="60"
          value="[[prefs.brave.gestures.sensitivity_in_pixels.value]]"
          on-change="onSensitivityChanged_">
    </label>
  </template>
</settings-section>

<template is="dom-if" if="[[prefs.brave.gestures.enabled.value]]">
<settings-section page-title="$i18n{braveGesturesMappings}">
  <div class="gestures-content">
    <span class="gestures-sublabel directional-help">
      $i18n{braveGesturesMappingsHelp}
    </span>
    <span class="gestures-sublabel chained-actions-help">
      $i18n{braveGesturesChainedActionsHelpDragPrefix}
      <leo-icon name="drag" class="chain-drag-handle"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpDragSuffix}
      $i18n{braveGesturesChainedActionsHelpAddPrefix}
      <leo-icon name="plus-add"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpAddSuffix}
      $i18n{braveGesturesChainedActionsHelpRemovePrefix}
      <leo-icon name="minus"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpRemoveSuffix}
    </span>
    <template is="dom-repeat" items="[[mappingRows_]]">
      <div class$="gestures-mapping-item
          [[mappingRowClashClass_(item, mappingRows_, customGestureRows_)]]">
        <div class="gestures-row">
          <div class="gesture-icons">
            <template is="dom-repeat" items="[[item.icons]]" as="iconName">
              <leo-icon name="[[iconName]]"></leo-icon>
            </template>
          </div>
          <div class="chained-actions">
            <div class="chained-action-trail">
              <div class="chained-action-row"
                  on-dragover="onChainedActionDragOver_"
                  on-drop="onMappingPrimaryActionDrop_">
                <leo-icon name="drag" class="chain-drag-handle"
                    hidden$="[[!item.chainedActions.length]]"
                    draggable="true"
                    on-dragstart="onMappingPrimaryActionDragStart_"
                    on-dragend="onChainedActionDragEnd_">
                </leo-icon>
                <select on-change="onCommandChanged_"
                    class$="[[getCommandSelectClass_(
                        item.gestureCommand, item.navigateToUrl)]]">
                  <template is="dom-repeat" items="[[commandOptions_]]"
                      as="option">
                    <option value$="[[option.value]]"
                        selected="[[optionMatchesCommand_(
                            option.value, item.gestureCommand)]]">
                      [[option.name]]
                    </option>
                  </template>
                </select>
                <div class$="[[getUrlAttachClass_(item.navigateToUrl)]]"
                    hidden$="[[!hasTextParam_(item.gestureCommand)]]">
                  <span class="param-attach-label">
                    [[getUrlButtonLabel_(item.gestureCommand, item.navigateToUrl)]]
                  </span>
                  <cr-icon-button iron-icon="edit-pencil"
                      on-click="onEditMappingUrlClick_">
                  </cr-icon-button>
                </div>
                <div class="param-attach remove-attach"
                    hidden$="[[!item.chainedActions.length]]">
                  <cr-icon-button iron-icon="minus"
                      on-click="onRemoveMappingPrimaryActionClick_">
                  </cr-icon-button>
                </div>
              </div>
              <template is="dom-repeat" items="[[item.chainedActions]]"
                  as="chainedAction">
                <leo-icon name="arrow-small-right" class="chain-link">
                </leo-icon>
                <div class="chained-action-row"
                    on-dragover="onChainedActionDragOver_"
                    on-drop="onMappingChainedActionDrop_">
                  <leo-icon name="drag" class="chain-drag-handle"
                      draggable="true"
                      on-dragstart="onMappingChainedActionDragStart_"
                      on-dragend="onChainedActionDragEnd_">
                  </leo-icon>
                  <select
                      on-change="onMappingChainedActionCommandChanged_"
                      class$="[[getCommandSelectClass_(
                          chainedAction.gestureCommand,
                          chainedAction.navigateToUrl)]]">
                    <template is="dom-repeat" items="[[commandOptions_]]"
                        as="option">
                      <option value$="[[option.value]]"
                          selected="[[optionMatchesCommand_(
                              option.value, chainedAction.gestureCommand)]]">
                        [[option.name]]
                      </option>
                    </template>
                  </select>
                  <div
                      class$="[[getUrlAttachClass_(
                          chainedAction.navigateToUrl)]]"
                      hidden$="[[!hasTextParam_(
                          chainedAction.gestureCommand)]]">
                    <span class="param-attach-label">
                      [[getUrlButtonLabel_(chainedAction.gestureCommand, chainedAction.navigateToUrl)]]
                    </span>
                    <cr-icon-button iron-icon="edit-pencil"
                        on-click="onEditMappingChainedUrlClick_">
                    </cr-icon-button>
                  </div>
                  <div class="param-attach remove-attach">
                    <cr-icon-button iron-icon="minus"
                        on-click="onRemoveMappingChainedActionClick_">
                    </cr-icon-button>
                  </div>
                </div>
              </template>
            </div>
            <div class="chained-action-buttons">
              <cr-icon-button iron-icon="plus-add"
                  on-click="onAddMappingChainedActionClick_">
              </cr-icon-button>
            </div>
          </div>
        </div>
        <span class="gestures-sublabel command-clash-sublabel"
            hidden$="[[!mappingClashDescription_(
                item, mappingRows_, customGestureRows_)]]">
          [[mappingClashDescription_(item, mappingRows_, customGestureRows_)]]
        </span>
      </div>
    </template>
    <cr-button on-click="onResetMappingsClick_">
      $i18n{braveGesturesReset}
    </cr-button>
  </div>
</settings-section>

<settings-section page-title="$i18n{braveGesturesCustomGestures}">
  <div class="gestures-content">
    <span class="gestures-sublabel custom-gestures-help">
      $i18n{braveGesturesCustomGesturesHelp}
    </span>
    <span class="gestures-sublabel closed-shape-help"
        hidden$="[[!customGestureRows_.length]]">
      $i18n{braveGesturesClosedShapeHelp}
    </span>
    <span class="gestures-sublabel chained-actions-help"
        hidden$="[[!customGestureRows_.length]]">
      $i18n{braveGesturesChainedActionsHelpDragPrefix}
      <leo-icon name="drag" class="chain-drag-handle"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpDragSuffix}
      $i18n{braveGesturesChainedActionsHelpAddPrefix}
      <leo-icon name="plus-add"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpAddSuffix}
      $i18n{braveGesturesChainedActionsHelpRemovePrefix}
      <leo-icon name="minus"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpRemoveSuffix}
      $i18n{braveGesturesCustomGestureHelpRemovePrefix}
      <leo-icon name="close"></leo-icon>
      $i18n{braveGesturesCustomGestureHelpRemoveSuffix}
    </span>
    <template is="dom-repeat" items="[[customGestureRows_]]">
      <div class$="custom-gesture-item
          [[customGestureRowClashClass_(item, mappingRows_, customGestureRows_)]]">
      <div class="gestures-row">
        <svg class="custom-gesture-preview" viewBox="0 0 32 32">
          <path d$="[[item.previewPath]]"
              fill="none"
              stroke="var(--leo-color-icon-interactive)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
          </path>
        </svg>
        <div class="chained-actions">
          <div class="chained-action-trail">
            <div class="chained-action-row"
                on-dragover="onChainedActionDragOver_"
                on-drop="onCustomGesturePrimaryActionDrop_">
              <leo-icon name="drag" class="chain-drag-handle"
                  hidden$="[[!item.chainedActions.length]]"
                  draggable="true"
                  on-dragstart="onCustomGesturePrimaryActionDragStart_"
                  on-dragend="onChainedActionDragEnd_">
              </leo-icon>
              <select on-change="onCustomGestureCommandChanged_"
                  class$="[[getCommandSelectClass_(
                      item.gestureCommand, item.navigateToUrl)]]">
                <template is="dom-repeat" items="[[commandOptions_]]"
                    as="option">
                  <option value$="[[option.value]]"
                      selected="[[optionMatchesCommand_(
                          option.value, item.gestureCommand)]]">
                    [[option.name]]
                  </option>
                </template>
              </select>
              <div class$="[[getUrlAttachClass_(item.navigateToUrl)]]"
                  hidden$="[[!hasTextParam_(item.gestureCommand)]]">
                <span class="param-attach-label">
                  [[getUrlButtonLabel_(item.gestureCommand, item.navigateToUrl)]]
                </span>
                <cr-icon-button iron-icon="edit-pencil"
                    on-click="onEditCustomGestureUrlClick_">
                </cr-icon-button>
              </div>
              <div class="param-attach remove-attach"
                  hidden$="[[!item.chainedActions.length]]">
                <cr-icon-button iron-icon="minus"
                    on-click="onRemoveCustomGesturePrimaryActionClick_">
                </cr-icon-button>
              </div>
            </div>
            <template is="dom-repeat" items="[[item.chainedActions]]"
                as="chainedAction">
              <leo-icon name="arrow-small-right" class="chain-link">
              </leo-icon>
              <div class="chained-action-row"
                  on-dragover="onChainedActionDragOver_"
                  on-drop="onCustomGestureChainedActionDrop_">
                <leo-icon name="drag" class="chain-drag-handle"
                    draggable="true"
                    on-dragstart="onCustomGestureChainedActionDragStart_"
                    on-dragend="onChainedActionDragEnd_">
                </leo-icon>
                <select
                    on-change="onCustomGestureChainedActionCommandChanged_"
                    class$="[[getCommandSelectClass_(
                        chainedAction.gestureCommand,
                        chainedAction.navigateToUrl)]]">
                  <template is="dom-repeat" items="[[commandOptions_]]"
                      as="option">
                    <option value$="[[option.value]]"
                        selected="[[optionMatchesCommand_(
                            option.value, chainedAction.gestureCommand)]]">
                      [[option.name]]
                    </option>
                  </template>
                </select>
                <div
                    class$="[[getUrlAttachClass_(
                        chainedAction.navigateToUrl)]]"
                    hidden$="[[!hasTextParam_(
                        chainedAction.gestureCommand)]]">
                  <span class="param-attach-label">
                    [[getUrlButtonLabel_(chainedAction.gestureCommand, chainedAction.navigateToUrl)]]
                  </span>
                  <cr-icon-button iron-icon="edit-pencil"
                      on-click="onEditCustomGestureChainedUrlClick_">
                  </cr-icon-button>
                </div>
                <div class="param-attach remove-attach">
                  <cr-icon-button iron-icon="minus"
                      on-click="onRemoveCustomGestureChainedActionClick_">
                  </cr-icon-button>
                </div>
              </div>
            </template>
          </div>
          <div class="chained-action-buttons">
            <cr-icon-button iron-icon="plus-add"
                on-click="onAddCustomGestureChainedActionClick_">
            </cr-icon-button>
            <cr-icon-button iron-icon="close"
                on-click="onRemoveCustomGestureClick_">
            </cr-icon-button>
          </div>
        </div>
      </div>
      <span class="gestures-sublabel command-clash-sublabel"
          hidden$="[[!customGestureClashDescription_(
              item, mappingRows_, customGestureRows_)]]">
        [[customGestureClashDescription_(
            item, mappingRows_, customGestureRows_)]]
      </span>
      </div>
    </template>
  </div>
</settings-section>

<settings-section page-title="$i18n{braveGesturesAddCustomGesture}">
  <div class="gestures-content">
    <span class="gestures-sublabel capture-help">
      $i18n{braveGesturesCaptureHelp}
    </span>
    <span class="gestures-sublabel chained-actions-help">
      $i18n{braveGesturesChainedActionsHelpDragPrefix}
      <leo-icon name="drag" class="chain-drag-handle"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpDragSuffix}
      $i18n{braveGesturesChainedActionsHelpAddPrefix}
      <leo-icon name="plus-add"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpAddSuffix}
      $i18n{braveGesturesChainedActionsHelpRemovePrefix}
      <leo-icon name="minus"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpRemoveSuffix}
    </span>
    <div class="gestures-row">
      <div class="chained-actions">
        <div class="chained-action-trail">
          <div class="chained-action-row"

            </leo-icon>
            <select on-change="onCaptureCommandChanged_"

                    selectedCaptureCommand_, selectedCaptureNavigateToUrl_)]]">
              <template is="dom-repeat" items="[[commandOptions_]]"

            <div

              <cr-icon-button iron-icon="edit-pencil"

      <cr-button class="cancel-button" on-click="onClearGestureDialogClose_">
        $i18n{cancel}
      </cr-button>
      <cr-button class="action-button" on-click="onConfirmClearGestureClick_">
        $i18n{braveGesturesClearCustomGesture}
      </cr-button>
    </div>
  </cr-dialog>
</template>

<settings-section page-title="$i18n{braveGesturesDisallowedSites}">
  <div class="gestures-content">
    <template is="dom-repeat" items="[[disallowedSiteRows_]]">
      <div class="gestures-row">
        <span class="gestures-site-origin">[[item.origin]]</span>
        <div class="custom-gesture-actions">
          <cr-icon-button iron-icon="edit-pencil"
              on-click="onEditSiteClick_">
          </cr-icon-button>
          <cr-icon-button iron-icon="close"
              on-click="onRemoveSiteClick_">
          </cr-icon-button>
        </div>
      </div>
    </template>
    <cr-button on-click="onAddSiteClick_">
      $i18n{braveGesturesAddSite}
    </cr-button>
  </div>
</settings-section>

<template is="dom-if" if="[[showAddSiteDialog_]]" restamp>
  <cr-dialog id="addSiteDialog" show-on-attach
      on-close="onAddSiteDialogClose_">
    <div slot="title">[[getAddSiteDialogTitle_(isEditingSite_)]]</div>
    <div slot="body">
      <cr-input value="[[addSiteInput_]]"
          label="$i18n{braveGesturesAddSitePrompt}"
          on-input="onAddSiteInputChanged_">
      </cr-input>
    </div>
    <div slot="button-container">
      <cr-button class="cancel-button" on-click="onAddSiteDialogClose_">
        $i18n{cancel}
      </cr-button>
      <cr-button class="action-button" on-click="onConfirmAddSiteClick_">
        [[getAddSiteDialogTitle_(isEditingSite_)]]
      </cr-button>
    </div>
  </cr-dialog>
</template>

<template is="dom-if" if="[[showUrlDialog_]]" restamp>
  <cr-dialog id="urlDialog" show-on-attach on-close="onUrlDialogClose_">
    <div slot="title">[[urlDialogTitle_()]]</div>
    <div slot="body">
      <cr-input value="[[urlDialogInput_]]"
          placeholder="[[urlDialogPlaceholder_()]]"
          on-input="onUrlDialogInputChanged_">
      </cr-input>
    </div>
    <div slot="button-container">
      <cr-button class="cancel-button" on-click="onUrlDialogClose_">
        $i18n{cancel}
      </cr-button>
      <cr-button class="action-button" on-click="onConfirmUrlDialogClick_">
        $i18n{save}
      </cr-button>
    </div>
  </cr-dialog>
</template>
</template>
