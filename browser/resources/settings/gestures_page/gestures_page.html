<style include="settings-shared md-select">
  .gestures-content {
    box-sizing: border-box;
    padding: var(--cr-section-vertical-margin, 12px) var(--cr-section-padding, 20px);
    width: 100%;
  }

  .header {
    padding: var(--leo-spacing-2xl);
  }

  .gestures-row {
    align-items: center;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    padding-block: 8px;
    width: 100%;
  }

  .gestures-label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-inline-end: 16px;
  }

  .gestures-site-origin {
    overflow: hidden;
    padding-inline-end: 16px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gestures-sublabel {
    color: var(--leo-color-text-secondary);
    font: var(--leo-font-small-regular);
  }

  .smart-gestures-subsection-label {
    font: var(--leo-font-heading-h4);
    margin: var(--leo-spacing-xl) 0 0;
  }

  /* Uses the raw yellow token directly; the semantic warning token flips
     to near-black brown in dark mode. */
  .gestures-sublabel.command-conflict-sublabel {
    --leo-icon-color: var(--leo-color-primitive-yellow-70);
    --leo-icon-size: 14px;

    align-items: center;
    display: flex;
    gap: 4px;
    justify-content: flex-end;
  }

  .gestures-sublabel.action-chain-group-help {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.directional-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.smart-gestures-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.custom-gestures-help {
    display: block;
  }

  .gestures-sublabel.closed-shape-help {
    display: block;
    margin-top: var(--leo-spacing-l);
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.draw-custom-gesture-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.action-chain-group-help leo-icon {
    --leo-icon-size: 16px;
  }

  /* Avoids stacking with this span's own `gap`, which would widen this
     icon's trailing space versus every other icon's. */
  .gestures-sublabel.action-chain-group-help .action-drag-handle {
    margin-inline-end: 0;
  }

  #drawCustomGestureBox {
    aspect-ratio: 4 / 3;
    background: var(--leo-color-container-background);
    border: 1px dashed var(--leo-color-divider-strong);
    border-radius: var(--leo-radius-m);
    cursor: crosshair;
    margin: 8px 0;
    position: relative;
    width: 100%;
  }

  .draw-custom-gesture-actions {
    display: flex;
    gap: 8px;
  }

  #drawCustomGestureBox svg {
    height: 100%;
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  .gesture-icons {
    align-items: center;
    display: flex;
    gap: 4px;
    --leo-icon-size: 24px;
  }

  .custom-gesture-preview {
    aspect-ratio: 1 / 1;
    background: var(--leo-color-container-background);
    border-radius: var(--leo-radius-s);
    flex-shrink: 0;
    /* Fixed size so chained actions stacking taller doesn't balloon this
       via aspect-ratio; centered to still line up with taller rows. */
    align-self: center;
    height: 40px;
    width: 40px;
  }

  /* Replaying as a drawing animation on hover shows stroke direction/order
     that a static icon can't. 500 exceeds any possible gesture_path length here. */
  .custom-gesture-preview path {
    stroke-dasharray: 500;
    stroke-dashoffset: 0;
  }

  .custom-gesture-item:hover .custom-gesture-preview path {
    animation: brave-gestures-draw-preview 10s linear infinite;
  }

  /* 95%/100% hold the finished shape for the last half second of each
     10s loop, giving a brief pause before it redraws from scratch. */
  @keyframes brave-gestures-draw-preview {
    0% {
      stroke-dashoffset: 500;
    }
    95% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 0;
    }
  }

  .custom-gesture-actions {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  .gestures-divider {
    border: none;
    border-top: 1px solid var(--leo-color-divider-subtle);
    margin: 0;
    margin-bottom: var(--leo-spacing-l);
  }

  /* Avoids stacking with `.gestures-content`'s own top padding, which
     would make this gap bigger than any other divider's on this page. */
  .gestures-divider:has(+ .gestures-content) {
    margin-bottom: 0;
  }

  .gestures-mapping-item + .gestures-mapping-item,
  .custom-gesture-item + .custom-gesture-item,
  .gestures-row + .gestures-row,
  .command-conflict-sublabel + .gestures-row {
    border-top: 1px solid var(--leo-color-divider-subtle);
    margin-top: var(--leo-spacing-m);
    padding-top: var(--leo-spacing-m);
  }

  .action-chain-group {
    align-items: center;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-inline-start: auto;
  }

  .action-drag-handle {
    --leo-icon-size: 16px;
    color: var(--leo-color-icon-secondary);
    cursor: grab;
    margin-inline-end: 4px;
  }

  /* Narrows to fit the short "Left"/"Middle"/"Right" text, instead of
     `md-select`'s wide default width. */
  .mouse-wheel-modifier-button-select {
    --md-select-width: auto;
  }
</style>

        <span>$i18n{braveGesturesWheelUp}</span>
      </div>
      <gesture-action-chain-group
          data-pref$="[[mouseWheelUpActionRow_.prefName]]"
          action-rows="[[mouseWheelUpActionRow_.actionRows]]"
          option-sets="[[optionSets_]]"
          has-conflict="[[mouseWheelHasConflict_(mouseWheelUpActionRow_, conflictsSignature_)]]"
          on-action-rows-changed="onMouseActionRowsChanged_"
          on-edit-url-click="onMouseEditUrlClick_">

        hidden$="[[!mouseWheelConflictDescription_(mouseWheelUpActionRow_, conflictsSignature_)]]">
      <leo-icon name="warning-triangle-filled"></leo-icon>
      [[mouseWheelConflictDescription_(mouseWheelUpActionRow_, conflictsSignature_)]]
    </span>

    <label class="gestures-row"
        data-pref$="[[mouseWheelDownActionRow_.prefName]]">
      <div class="gestures-label">
        <span>$i18n{braveGesturesWheelDown}</span>
      </div>
      <gesture-action-chain-group
          data-pref$="[[mouseWheelDownActionRow_.prefName]]"
          action-rows="[[mouseWheelDownActionRow_.actionRows]]"
          option-sets="[[optionSets_]]"
          has-conflict="[[mouseWheelHasConflict_(mouseWheelDownActionRow_, conflictsSignature_)]]"
          on-action-rows-changed="onMouseActionRowsChanged_"
          on-edit-url-click="onMouseEditUrlClick_">
      </gesture-action-chain-group>
    </label>
    <span class="gestures-sublabel command-conflict-sublabel"
        hidden$="[[!mouseWheelConflictDescription_(mouseWheelDownActionRow_, conflictsSignature_)]]">
      <leo-icon name="warning-triangle-filled"></leo-icon>
      [[mouseWheelConflictDescription_(mouseWheelDownActionRow_, conflictsSignature_)]]
    </span>

    <cr-button on-click="onResetMouseWheelClick_">
      $i18n{braveGesturesReset}
    </cr-button>
  </div>
  </template>
</settings-section>
