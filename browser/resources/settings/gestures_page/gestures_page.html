<style include="settings-shared md-select">
  .gestures-content {
    box-sizing: border-box;
    padding: var(--cr-section-vertical-margin, 12px) var(--cr-section-padding, 20px);
    width: 100%;
  }

  .header {
    padding: var(--leo-spacing-2xl);
  }

  .gestures-row {
    align-items: center;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    padding-block: 8px;
    width: 100%;
  }

  .gestures-label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-inline-end: 16px;
  }

  .gestures-site-origin {
    overflow: hidden;
    padding-inline-end: 16px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gestures-sublabel {
    color: var(--leo-color-text-secondary);
    font: var(--leo-font-small-regular);
  }

  /* Aligns under the `.action-chain-group` it describes, which is itself
     right-aligned. */
  .gestures-sublabel.command-conflict-sublabel {
    display: block;
    text-align: end;
  }

  .gestures-sublabel.action-chain-group-help {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.directional-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.custom-gestures-help {
    display: block;
  }

  .gestures-sublabel.closed-shape-help {
    display: block;
    margin-top: var(--leo-spacing-l);
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.draw-custom-gesture-help {
    display: block;
    margin-bottom: var(--leo-spacing-l);
  }

  .gestures-sublabel.action-chain-group-help leo-icon {
    --leo-icon-size: 16px;
  }

  /* Avoids stacking with this span's own `gap`, which would widen this
     icon's trailing space versus every other icon's. */
  .gestures-sublabel.action-chain-group-help .action-drag-handle {
    margin-inline-end: 0;
  }

  #drawCustomGestureBox {
    aspect-ratio: 4 / 3;
    background: var(--leo-color-container-background);
    border: 1px dashed var(--leo-color-divider-strong);
    border-radius: var(--leo-radius-m);
    cursor: crosshair;
    margin: 8px 0;
    position: relative;
    width: 100%;
  }

  .draw-custom-gesture-actions {
    display: flex;
    gap: 8px;
  }

  #drawCustomGestureBox svg {
    height: 100%;
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  .gesture-icons {
    align-items: center;
    display: flex;
    gap: 4px;
    --leo-icon-size: 24px;
  }

  .custom-gesture-preview {
    aspect-ratio: 1 / 1;
    background: var(--leo-color-container-background);
    border-radius: var(--leo-radius-s);
    flex-shrink: 0;
    /* Fixed size so chained actions stacking taller doesn't balloon this
       via aspect-ratio; centered to still line up with taller rows. */
    align-self: center;
    height: 40px;
    width: 40px;
  }

  /* Replaying as a drawing animation on hover shows stroke direction/order
     that a static icon can't. 500 exceeds any possible path length here. */
  .custom-gesture-preview path {
    stroke-dasharray: 500;
    stroke-dashoffset: 0;
  }

  .custom-gesture-item:hover .custom-gesture-preview path {
    animation: brave-gestures-draw-preview 10s linear infinite;
  }

  /* 95%/100% hold the finished shape for the last half second of each
     10s loop, giving a brief pause before it redraws from scratch. */
  @keyframes brave-gestures-draw-preview {
    0% {
      stroke-dashoffset: 500;
    }
    95% {
      stroke-dashoffset: 0;
    }
    100% {
      stroke-dashoffset: 0;
    }
  }

  .custom-gesture-actions {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  .gestures-divider {
    border: none;
    border-top: 1px solid var(--leo-color-divider-subtle);
    margin: 0;
    margin-bottom: var(--leo-spacing-l);
  }

  /* Avoids stacking with `.gestures-content`'s own top padding, which
     would make this gap bigger than any other divider's on this page. */
  .gestures-divider:has(+ .gestures-content) {
    margin-bottom: 0;
  }

  .gestures-mapping-item + .gestures-mapping-item,
  .custom-gesture-item + .custom-gesture-item,
  .gestures-row + .gestures-row {
    border-top: 1px solid var(--leo-color-divider-subtle);
    margin-top: var(--leo-spacing-m);
    padding-top: var(--leo-spacing-m);
  }

  /* `!important` needed to beat `md-select`'s own `color` rule, which has
     higher specificity (`select.md-select:not(.z)`). */
  .command-unassigned {
    color: var(--leo-color-text-secondary) !important;
  }

  /* Warns when a command is also used by another gesture. The
     systemfeedback-warning token flips to near-black brown in dark mode. */
  .command-conflict select {
    border: 2px solid var(--leo-color-primitive-yellow-70) !important;
  }

  .action-chain-group {
    align-items: center;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-inline-start: auto;
  }

  .action-chain {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }

  .action-buttons {
    display: flex;
    flex-shrink: 0;
    gap: 4px;
  }

  /* No gap, so the select and its `.action-param` controls sit flush as
     one group; stretch so `.action-param` matches the select's height. */
  .action-row {
    align-items: stretch;
    display: flex;
  }

  .chain-connector {
    --leo-icon-size: 16px;
    align-self: center;
    color: var(--leo-color-icon-secondary);
  }

  .action-drag-handle {
    --leo-icon-size: 16px;
    color: var(--leo-color-icon-secondary);
    cursor: grab;
    margin-inline-end: 4px;
  }

  /* Shrinks each action's select to its command's text width; the
     dropdown's own option list still sizes to fit the widest option. */
  .action-row select {
    --md-select-width: auto;
  }

  /* Same as above: "Left"/"Middle"/"Right" shouldn't stretch to
     `md-select`'s wide default. */
  .mouse-wheel-modifier-button-select {
    --md-select-width: auto;
  }

  /* `md-select`'s own `:focus` always shows an outline, even after a
     mouse click; keep it for keyboard navigation only. */
  .action-row select:focus:not(:focus-visible) {
    outline: none;
  }

  /* Squares the trailing corner wherever a visible `.action-param`
     follows, so the row's visible controls read as one joined group. */
  .action-row select:has(~ .action-param:not([hidden])),
  .action-param:has(~ .action-param:not([hidden])) {
    border-start-end-radius: 0;
    border-end-end-radius: 0;
  }

  /* Counterpart to the rule above: a visible `.action-param` always
     follows the row's select, so its leading corner is always squared. */
  .action-param:not([hidden]) {
    border-start-start-radius: 0;
    border-end-start-radius: 0;
  }

  /* Shares the select's border so a command param reads as part of the
     same control, not a separate field next to it. */
  .action-param {
    align-items: center;
    border: solid 1px var(--leo-color-divider-subtle);
    border-start-start-radius: 0;
    border-end-start-radius: 0;
    border-start-end-radius: 8px;
    border-end-end-radius: 8px;
    box-sizing: border-box;
    display: flex;
    gap: 4px;
    margin-inline-start: -1px;
    padding-inline-end: 6px;
    padding-inline-start: 10px;
  }

  .action-param-label {
    font-size: 12px;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* No label, just an icon, so needs less side padding than
     `.action-param`'s default. */
  .remove-action-param {
    padding-inline: 6px;
  }

  .action-param cr-icon-button {
    --cr-icon-button-margin-end: 0;
    --cr-icon-button-margin-start: 0;
    --cr-icon-button-size: 24px;
  }
</style>

<settings-section page-title="$i18n{braveGesturesPage}">
  <settings-toggle-button
      pref="{{prefs.brave.gestures.enabled}}"
      label="$i18n{braveGesturesEnable}"
      sub-label="$i18n{braveGesturesAboutDesc}">
  </settings-toggle-button>

  <template is="dom-if" if="[[prefs.brave.gestures.enabled.value]]">
    <settings-toggle-button class="cr-row"
        pref="{{prefs.brave.gestures.show_trail}}"
        label="$i18n{braveGesturesShowTrail}"
        sub-label="$i18n{braveGesturesShowTrailDesc}">
    </settings-toggle-button>

    <settings-toggle-button class="cr-row"
        pref="{{prefs.brave.gestures.show_matched_gesture}}"
        label="$i18n{braveGesturesShowMatchedGesture}"
        sub-label="$i18n{braveGesturesShowMatchedGestureDesc}">
    </settings-toggle-button>

    <label class="gestures-row settings-box">
      <div class="gestures-label">
        <span>$i18n{braveGesturesSensitivity}</span>
        <span class="gestures-sublabel">
          $i18n{braveGesturesSensitivityDesc}
        </span>
      </div>
      <input type="range" min="0" max="60"
          value="[[prefs.brave.gestures.sensitivity_in_pixels.value]]"
          on-change="onSensitivityChanged_">
    </label>
  </template>
</settings-section>

<template is="dom-if" if="[[prefs.brave.gestures.enabled.value]]">
<settings-section page-title="$i18n{braveGesturesMappings}">
  <div class="gestures-content">
    <span class="gestures-sublabel directional-help">
      $i18n{braveGesturesMappingsHelp}
    </span>
    <span class="gestures-sublabel action-chain-group-help">
      $i18n{braveGesturesChainedActionsHelpDragPrefix}
      <leo-icon name="drag" class="action-drag-handle"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpDragSuffix}
      $i18n{braveGesturesChainedActionsHelpAddPrefix}
      <leo-icon name="plus-add"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpAddSuffix}
      $i18n{braveGesturesChainedActionsHelpRemovePrefix}
      <leo-icon name="minus"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpRemoveSuffix}
    </span>
    <template is="dom-repeat" items="[[directionalGestureMappingActionRows_]]">
      <div class$="gestures-mapping-item
          [[directionalGestureMappingRowConflictClass_(item, directionalGestureMappingActionRows_, customGestureActionRows_)]]">
        <div class="gestures-row">
          <div class="gesture-icons">
            <template is="dom-repeat" items="[[item.icons]]" as="iconName">
              <leo-icon name="[[iconName]]"></leo-icon>
            </template>
          </div>
          <div class="action-chain-group">
            <div class="action-chain">
              <div class="action-row"
                  on-dragover="onActionDragOver_"
                  on-drop="onDirectionalGestureMappingPrimaryActionDrop_">
                <leo-icon name="drag" class="action-drag-handle"
                    hidden$="[[!hasChainedActions_(item.actionRows)]]"
                    draggable="true"
                    on-dragstart="onDirectionalGestureMappingPrimaryActionDragStart_"
                    on-dragend="onActionDragEnd_">
                </leo-icon>
                <select on-change="onCommandChanged_"
                    class$="[[primaryCommandSelectClass_(item.actionRows)]]">
                  <template is="dom-repeat" items="[[commandOptions_]]"
                      as="option">
                    <option value$="[[option.value]]"
                        selected="[[optionMatchesPrimaryCommand_(
                            option.value, item.actionRows)]]">
                      [[option.name]]
                    </option>
                  </template>
                </select>
                <select class="md-select"
                    on-change="onDirectionalGestureMappingOpenSettingsPageChanged_"
                    hidden$="[[!isPrimaryOpenSettingsCommand_(item.actionRows)]]">
                  <template is="dom-repeat" items="[[openSettingsPageOptions_]]"
                      as="pageOption">
                    <option value$="[[pageOption.value]]"
                        selected="[[optionMatchesPrimaryOpenSettingsPage_(
                            pageOption.value, item.actionRows)]]">
                      [[pageOption.name]]
                    </option>
                  </template>
                </select>
                <div class$="[[primaryUrlAttachClass_(item.actionRows)]]"
                    hidden$="[[!primaryHasTextParam_(item.actionRows)]]">
                  <span class="action-param-label">
                    [[primaryUrlButtonLabel_(item.actionRows)]]
                  </span>
                  <cr-icon-button iron-icon="edit-pencil"
                      on-click="onEditDirectionalGestureMappingUrlClick_">
                  </cr-icon-button>
                </div>
                <div class="action-param remove-action-param"
                    hidden$="[[!hasChainedActions_(item.actionRows)]]">
                  <cr-icon-button iron-icon="minus"
                      on-click="onRemoveDirectionalGestureMappingPrimaryActionClick_">
                  </cr-icon-button>
                </div>
              </div>
              <template is="dom-repeat" items="[[chainedActionRows_(item.actionRows)]]"
                  as="chainedAction">
                <leo-icon name="arrow-small-right" class="chain-connector">
                </leo-icon>
                <div class="action-row"
                    on-dragover="onActionDragOver_"
                    on-drop="onDirectionalGestureMappingChainedActionDrop_">
                  <leo-icon name="drag" class="action-drag-handle"
                      draggable="true"
                      on-dragstart="onDirectionalGestureMappingChainedActionDragStart_"
                      on-dragend="onActionDragEnd_">
                  </leo-icon>
                  <select
                      on-change="onDirectionalGestureMappingChainedActionCommandChanged_"
                      class$="[[getCommandSelectClass_(
                          chainedAction.command,
                          chainedAction.textParam)]]">
                    <template is="dom-repeat" items="[[commandOptions_]]"
                        as="option">
                      <option value$="[[option.value]]"
                          selected="[[optionMatchesCommand_(
                              option.value, chainedAction.command)]]">
                        [[option.name]]
                      </option>
                    </template>
                  </select>
                  <select class="md-select"
                      on-change="onDirectionalGestureMappingChainedActionOpenSettingsPageChanged_"
                      hidden$="[[!isOpenSettingsCommand_(
                          chainedAction.command)]]">
                    <template is="dom-repeat" items="[[openSettingsPageOptions_]]"
                        as="pageOption">
                      <option value$="[[pageOption.value]]"
                          selected="[[optionMatchesCommand_(
                              pageOption.value,
                              chainedAction.openSettingsPage)]]">
                        [[pageOption.name]]
                      </option>
                    </template>
                  </select>
                  <div
                      class$="[[getUrlAttachClass_(
                          chainedAction.textParam)]]"
                      hidden$="[[!hasTextParam_(
                          chainedAction.command)]]">
                    <span class="action-param-label">
                      [[getUrlButtonLabel_(chainedAction.command, chainedAction.textParam)]]
                    </span>
                    <cr-icon-button iron-icon="edit-pencil"
                        on-click="onEditDirectionalGestureMappingChainedUrlClick_">
                    </cr-icon-button>
                  </div>
                  <div class="action-param remove-action-param">
                    <cr-icon-button iron-icon="minus"
                        on-click="onRemoveDirectionalGestureMappingChainedActionClick_">
                    </cr-icon-button>
                  </div>
                </div>
              </template>
            </div>
            <div class="action-buttons">
              <cr-icon-button iron-icon="plus-add"
                  on-click="onAddDirectionalGestureMappingChainedActionClick_">
              </cr-icon-button>
            </div>
          </div>
        </div>
        <span class="gestures-sublabel command-conflict-sublabel"
            hidden$="[[!directionalGestureMappingConflictDescription_(
                item, directionalGestureMappingActionRows_, customGestureActionRows_)]]">
          [[directionalGestureMappingConflictDescription_(item, directionalGestureMappingActionRows_, customGestureActionRows_)]]
        </span>
      </div>
    </template>
    <cr-button on-click="onResetDirectionalGestureMappingsClick_">
      $i18n{braveGesturesReset}
    </cr-button>
  </div>
</settings-section>

<settings-section page-title="$i18n{braveGesturesCustomGestures}">
  <div class="gestures-content">
    <span class="gestures-sublabel custom-gestures-help">
      $i18n{braveGesturesCustomGesturesHelp}
    </span>
    <span class="gestures-sublabel closed-shape-help"
        hidden$="[[!customGestureActionRows_.length]]">
      $i18n{braveGesturesClosedShapeHelp}
    </span>
    <span class="gestures-sublabel action-chain-group-help"
        hidden$="[[!customGestureActionRows_.length]]">
      $i18n{braveGesturesChainedActionsHelpDragPrefix}
      <leo-icon name="drag" class="action-drag-handle"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpDragSuffix}
      $i18n{braveGesturesChainedActionsHelpAddPrefix}
      <leo-icon name="plus-add"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpAddSuffix}
      $i18n{braveGesturesChainedActionsHelpRemovePrefix}
      <leo-icon name="minus"></leo-icon>
      $i18n{braveGesturesChainedActionsHelpRemoveSuffix}
      $i18n{braveGesturesCustomGestureHelpRemovePrefix}
      <leo-icon name="close"></leo-icon>
      $i18n{braveGesturesCustomGestureHelpRemoveSuffix}
    </span>
    <template is="dom-repeat" items="[[customGestureActionRows_]]">
      <div class$="custom-gesture-item
          [[customGestureRowConflictClass_(item, directionalGestureMappingActionRows_, customGestureActionRows_)]]">
      <div class="gestures-row">
        <svg class="custom-gesture-preview" viewBox="0 0 32 32">
          <path d$="[[item.previewSvgPathData]]"
              fill="none"
              stroke="var(--leo-color-icon-interactive)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
          </path>
        </svg>
        <div class="action-chain-group">
          <div class="action-chain">
            <div class="action-row"
                on-dragover="onActionDragOver_"
                on-drop="onCustomGesturePrimaryActionDrop_">
              <leo-icon name="drag" class="action-drag-handle"
                  hidden$="[[!hasChainedActions_(item.actionRows)]]"
                  draggable="true"
                  on-dragstart="onCustomGesturePrimaryActionDragStart_"
                  on-dragend="onActionDragEnd_">
              </leo-icon>
              <select on-change="onCustomGestureCommandChanged_"
                  class$="[[primaryCommandSelectClass_(item.actionRows)]]">
                <template is="dom-repeat" items="[[commandOptions_]]"
                    as="option">
                  <option value$="[[option.value]]"
                      selected="[[optionMatchesPrimaryCommand_(
                          option.value, item.actionRows)]]">
                    [[option.name]]
                  </option>
                </template>
              </select>
              <select class="md-select"
                  on-change="onCustomGestureOpenSettingsPageChanged_"
                  hidden$="[[!isPrimaryOpenSettingsCommand_(item.actionRows)]]">
                <template is="dom-repeat" items="[[openSettingsPageOptions_]]"
                    as="pageOption">
                  <option value$="[[pageOption.value]]"
                      selected="[[optionMatchesPrimaryOpenSettingsPage_(
                          pageOption.value, item.actionRows)]]">
                    [[pageOption.name]]
                  </option>
                </template>
              </select>
              <div class$="[[primaryUrlAttachClass_(item.actionRows)]]"
                  hidden$="[[!primaryHasTextParam_(item.actionRows)]]">
                <span class="action-param-label">
                  [[primaryUrlButtonLabel_(item.actionRows)]]
                </span>
                <cr-icon-button iron-icon="edit-pencil"
                    on-click="onEditCustomGestureUrlClick_">
                </cr-icon-button>
              </div>
              <div class="action-param remove-action-param"
                  hidden$="[[!hasChainedActions_(item.actionRows)]]">
                <cr-icon-button iron-icon="minus"
                    on-click="onRemoveCustomGesturePrimaryActionClick_">
                </cr-icon-button>
              </div>
            </div>
            <template is="dom-repeat" items="[[chainedActionRows_(item.actionRows)]]"
                as="chainedAction">
              <leo-icon name="arrow-small-right" class="chain-connector">
              </leo-icon>
              <div class="action-row"
                  on-dragover="onActionDragOver_"
                  on-drop="onCustomGestureChainedActionDrop_">
                <leo-icon name="drag" class="action-drag-handle"
                    draggable="true"
                    on-dragstart="onCustomGestureChainedActionDragStart_"
                    on-dragend="onActionDragEnd_">
                </leo-icon>
                <select
                    on-change="onCustomGestureChainedActionCommandChanged_"
                    class$="[[getCommandSelectClass_(
                        chainedAction.command,
                        chainedAction.textParam)]]">
                  <template is="dom-repeat" items="[[commandOptions_]]"
                      as="option">
                    <option value$="[[option.value]]"
                        selected="[[optionMatchesCommand_(
                            option.value, chainedAction.command)]]">
                      [[option.name]]
                    </option>
                  </template>
                </select>
                <select class="md-select"
                    on-change="onCustomGestureChainedActionOpenSettingsPageChanged_"
                    hidden$="[[!isOpenSettingsCommand_(
                        chainedAction.command)]]">
                  <template is="dom-repeat" items="[[openSettingsPageOptions_]]"
                      as="pageOption">
                    <option value$="[[pageOption.value]]"
                        selected="[[optionMatchesCommand_(
                            pageOption.value,
                            chainedAction.openSettingsPage)]]">
                      [[pageOption.name]]
                    </option>
                  </template>
                </select>
                <div
                    class$="[[getUrlAttachClass_(
                        chainedAction.textParam)]]"
                    hidden$="[[!hasTextParam_(
                        chainedAction.command)]]">
                  <span class="action-param-label">
                    [[getUrlButtonLabel_(chainedAction.command, chainedAction.textParam)]]
                  </span>
                  <cr-icon-button iron-icon="edit-pencil"
                      on-click="onEditCustomGestureChainedUrlClick_">
                  </cr-icon-button>
                </div>
                <div class="action-param remove-action-param">
                  <cr-icon-button iron-icon="minus"
                      on-click="onRemoveCustomGestureChainedActionClick_">
                  </cr-icon-button>
                </div>
              </div>
            </template>
          </div>
          <div class="action-buttons">
            <cr-icon-button iron-icon="plus-add"
                on-click="onAddCustomGestureChainedActionClick_">
            </cr-icon-button>
            <cr-icon-button iron-icon="close"
                on-click="onRemoveCustomGestureClick_">
            </cr-icon-button>
          </div>
        </div>
      </div>
      <span class="gestures-sublabel command-conflict-sublabel"
          hidden$="[[!customGestureConflictDescription_(
              item, directionalGestureMappingActionRows_, customGestureActionRows_)]]">
        [[customGestureConflictDescription_(
            item, directionalGestureMappingActionRows_, customGestureActionRows_)]]
      </span>
      </div>
    </template>
  </div>
</settings-section>

<settings-section page-title="$i18n{braveGesturesAddCustomGesture}">

    <span class="gestures-sublabel draw-custom-gesture-help">
      $i18n{braveGesturesDrawCustomGestureHelp}

    <span class="gestures-sublabel action-chain-group-help">

      <leo-icon name="drag" class="action-drag-handle"></leo-icon>

      $i18n{braveGesturesChainedActionsHelpAddPrefix}
      <leo-icon name="plus-add"></leo-icon>

            <div class="action-param remove-action-param"
                hidden$="[[!hasChainedActions_(mouseWheelDownActionRow_.actionRows)]]">
              <cr-icon-button iron-icon="minus"
                  on-click="onRemoveMouseWheelPrimaryActionClick_">
              </cr-icon-button>
            </div>
          </div>
          <template is="dom-repeat" items="[[chainedActionRows_(mouseWheelDownActionRow_.actionRows)]]"
              as="chainedAction">
            <leo-icon name="arrow-small-right" class="chain-connector">
            </leo-icon>
            <div class="action-row"
                on-dragover="onActionDragOver_"
                on-drop="onMouseWheelChainedActionDrop_">
              <leo-icon name="drag" class="action-drag-handle"
                  draggable="true"
                  on-dragstart="onMouseWheelChainedActionDragStart_"
                  on-dragend="onActionDragEnd_">
              </leo-icon>
              <select on-change="onMouseWheelChainedActionCommandChanged_"
                  class$="[[getCommandSelectClass_(
                      chainedAction.command,
                      chainedAction.textParam)]]">
                <template is="dom-repeat" items="[[commandOptions_]]"
                    as="option">
                  <option value$="[[option.value]]"
                      selected="[[optionMatchesCommand_(
                          option.value, chainedAction.command)]]">
                    [[option.name]]
                  </option>
                </template>
              </select>
              <select class="md-select"
                  on-change="onMouseWheelChainedActionOpenSettingsPageChanged_"
                  hidden$="[[!isOpenSettingsCommand_(
                      chainedAction.command)]]">
                <template is="dom-repeat" items="[[openSettingsPageOptions_]]"
                    as="pageOption">
                  <option value$="[[pageOption.value]]"
                      selected="[[optionMatchesCommand_(
                          pageOption.value, chainedAction.openSettingsPage)]]">
                    [[pageOption.name]]
                  </option>
                </template>
              </select>
              <div
                  class$="[[getUrlAttachClass_(chainedAction.textParam)]]"
                  hidden$="[[!hasTextParam_(
                      chainedAction.command)]]">
                <span class="action-param-label">
                  [[getUrlButtonLabel_(chainedAction.command, chainedAction.textParam)]]
                </span>
                <cr-icon-button iron-icon="edit-pencil"
                    on-click="onEditMouseWheelChainedUrlClick_">
                </cr-icon-button>
              </div>
              <div class="action-param remove-action-param">
                <cr-icon-button iron-icon="minus"
                    on-click="onRemoveMouseWheelChainedActionClick_">
                </cr-icon-button>
              </div>
            </div>
          </template>
        </div>
        <div class="action-buttons">
          <cr-icon-button iron-icon="plus-add"
              on-click="onAddMouseWheelChainedActionClick_">
          </cr-icon-button>
        </div>
      </div>
    </label>

    <cr-button on-click="onResetMouseWheelClick_">
      $i18n{braveGesturesReset}
    </cr-button>
  </div>
  </template>
</settings-section>
