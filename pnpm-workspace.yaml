# Packages allowed to run install/build lifecycle scripts.
allowBuilds:
  '@brave/leo-sf-symbols@https://codeload.github.com/brave/leo-sf-symbols/tar.gz/b5a6139df7ebd3f7d55aa8d6af60a524edab87b0': true
  '@brave/leo@https://codeload.github.com/brave/leo/tar.gz/ff620e4e53b70dc9868c2215c5cb56e8145e92df': true
  # No-op unless npm_config_build_from_source is set; prebuilt binaries ship as optionalDependencies.
  '@parcel/watcher': false
  # Falls back to pure-JS hashing (lib/js.js) if the native binding is unavailable.
  blake-hash: false
  # ws falls back to pure-JS framing/masking if unavailable.
  bufferutil: false
  # postinstall only prints a donation banner.
  core-js: false
  # Required: hardlinks the platform binary into bin/esbuild and verifies its version; no JS fallback exists (engine is a Go binary).
  esbuild: true
  # Falls back to pure-JS hashing (lib/js.js) if the native binding is unavailable.
  keccak: false
  # postinstall only warns about version-scheme mismatches.
  protobufjs: false
  # Falls back to the pure-JS elliptic implementation if the native binding is unavailable.
  secp256k1: false
  # postinstall only echoes a reminder message.
  svelte-preprocess: false
  # Falls back to the pure-JS implementation (js.js); otherwise always recompiles from source (no prebuilds shipped).
  tiny-secp256k1: false
  # Dev/test-only (jest-resolve); runtime loader requires the platform package directly.
  unrs-resolver: false
  # @trezor/transport's "browser" field swaps this for WebUSB in the actual webui bundle; never loaded.
  usb: false
  # ws falls back to pure-JS framing/masking if unavailable.
  utf-8-validate: false

catalog:
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'
  'react': '19.2.7'
  'react-dom': '19.2.7'
  'styled-components': '6.4.3'

# HTTP fetch timeout in milliseconds (5 minutes).
fetchTimeout: 300000

# Minimum age (minutes) a published dependency version must have.
minimumReleaseAge: 5040

# Use isolated node_modules layout (no package hoisting).
nodeLinker: isolated

# Force specific versions for dependencies across the graph.
overrides:
  # React overrides.
  '@brave/brave-ui>styled-components': 'catalog:'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  'react': 'catalog:'
  'react-dom': 'catalog:'

  # Security-related overrides.
  #
  # Scoped to Storybook's copy; webpack-dev-server already uses a patched 7.x.
  '@storybook/builder-webpack5>webpack-dev-middleware': '7.4.5'
  'axios': '1.20.0'
  # Pinned per major line: consumers span all three and the fixes were backported.
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'brace-expansion@5': '5.0.12'
  'devalue': '5.9.4'
  # GHSA-848j-6mx2-7j84 (low) is unfixed upstream; 6.6.2 is not published yet.
  'elliptic': '6.6.1'
  'esbuild': '0.28.1'
  # Scoped: ethers pins ws exactly, but jayson needs ws 7.x.
  'ethers>ws': '8.22.0'
  'fast-uri': '3.1.8'
  'http-proxy-middleware': '2.0.10'
  'ip-address': '10.7.2'
  'js-yaml@3': '3.15.2'
  'js-yaml@4': '4.3.2'
  'nanoid@3': '3.3.19'
  'postcss': '8.5.23'
  'prismjs': '1.30.0'
  'protobufjs': '7.6.5'
  'qs': '6.16.0'
  # stream-json is deliberately not overridden: GHSA-528h-pc64-c93x is only fixed
  # in 3.x, which moved every entry point under src/ and lowercased filenames, so
  # jayson's require('stream-json/streamers/StreamValues') would fail at runtime.
  'tiny-secp256k1': '1.1.7'
  'toml': '4.3.0'
  'uuid': '14.0.0'

# Relax peer dependency version checks for listed packages.
peerDependencyRules:
  allowedVersions:
    utf-8-validate: '6'

# Disable pnpm version management.
pmOnFail: ignore

# Hoist listed packages to the root node_modules.
#
# !!! Do not add new packages to this list without a real reason. By default,
# you should add a dependency to package.json. If you need to hoist a package,
# explain why it's necessary.
publicHoistPattern:
  ### Packages to move to package.json ###
  # Some @dnd-kit sub-packages are used without explicit dependencies.
  - '@dnd-kit/*'
  # Some @glif/filecoin sub-packages are used without explicit dependencies.
  - '@glif/filecoin-*'
  # Some @ledgerhq sub-packages are used without explicit dependencies.
  - '@ledgerhq/*'
  # Some @testing-library sub-packages are used without explicit dependencies.
  - '@testing-library/*'

  ### OK to hoist permanently ###
  # ESLint sub-packages are required by ESLint to work.
  - '@eslint/*'
  # Storybook sub-packages are required by Storybook to work.
  - '@storybook/*'
  # decode-named-character-reference can't be found correctly by some packages
  # in isolated mode.
  - 'decode-named-character-reference'

# Store exact versions.
savePrefix: ''

# Do not show pnpm update notifications.
updateNotifier: false

# Skip verifying that installed dependencies match the lockfile before scripts
# run. The check takes some time, we can't run it on each build/test command.
verifyDepsBeforeRun: false
