substitutions:
  - description: |-
      Fail .onion lookups that would leave the machine when the request
      context blocks them.

      ResolveLocally() ends with this cache-miss return once the cache, hosts
      file and config presets have no answer; its callers then start a job for
      the system resolver or DoH. Failing here instead keeps .onion names from
      reaching either, while local answers still apply.
    add_before_line:
      line:
        'return HostCache::Entry(ERR_DNS_CACHE_MISS,
        HostCache::Entry::SOURCE_UNKNOWN);'
      code: |2-
          if (IsOnionHostnameResolutionBlocked(job_key)) {
            out_tasks->clear();
            return HostCache::Entry(ERR_NAME_NOT_RESOLVED,
                                    HostCache::Entry::SOURCE_UNKNOWN);
          }
