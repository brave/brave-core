substitutions:
  - description: |-
      Fail .onion lookups when the request context blocks them.

      Every host resolution goes through ResolveLocally() before any cache,
      hosts file, system or DoH lookup, so failing here keeps .onion names
      away from all of them.
    preempt_function_impl:
      function_name: HostResolverManager::ResolveLocally
      code: |-
        if (IsOnionHostnameResolutionBlocked(job_key)) {
          return HostCache::Entry(ERR_NAME_NOT_RESOLVED,
                                  HostCache::Entry::SOURCE_UNKNOWN);
        }
