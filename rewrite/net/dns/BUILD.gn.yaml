substitutions:
  - description: Add the Brave DNS sources.
    add_literal_to_list:
      target: dns
      list_name: sources
      literal: brave_net_dns_sources

  - description: Add the Brave DNS deps.
    add_literal_to_list:
      target: dns
      list_name: deps
      literal: brave_net_dns_deps

  - description: Add the Brave DNS unit tests.
    add_literal_to_list:
      target: tests
      list_name: sources
      literal: brave_net_dns_unit_test_sources

  - description: Add the Brave DNS unit test deps.
    add_literal_to_list:
      target: tests
      list_name: deps
      literal: brave_net_dns_deps

  - description: musl lacks the glibc resolver internals the Linux DNS config service needs; use the stub service.
    regex:
      re_pattern: '(\n  \} else if \(is_linux\) \{\n    sources \+= \[\n      "dns_config_service_linux\.cc",)'
      replace: "\n  } else if (is_linux && is_musl) {\n    # The Linux service relies on glibc resolver internals. Use the stub\n    # service so lookups go through getaddrinfo().\n    sources += [\n      \"dns_config_service_fuchsia.cc\",\n      \"dns_config_service_fuchsia.h\",\n    ]\\1"

  - description: Skip the Linux DNS config service tests on musl.
    regex:
      re_pattern: '\} else if \(is_linux\) \{\n    sources \+= \[ "dns_config_service_linux_unittest\.cc" \]'
      replace: "} else if (is_linux && !is_musl) {\n    sources += [ \"dns_config_service_linux_unittest.cc\" ]"
