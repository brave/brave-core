substitutions:
  - description: Add the Brave DNS sources.
    add_literal_to_list:
      target: dns
      list_name: sources
      literal: brave_net_dns_sources

  - description: Add the Brave DNS deps.
    add_literal_to_list:
      target: dns
      list_name: deps
      literal: brave_net_dns_deps

  - description: Add the Brave DNS unit tests.
    add_literal_to_list:
      target: tests
      list_name: sources
      literal: brave_net_dns_unit_test_sources

  - description: Add the Brave DNS unit test deps.
    add_literal_to_list:
      target: tests
      list_name: deps
      literal: brave_net_dns_deps
