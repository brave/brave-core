substitutions:
  - description: |-
      Count secure DNS tasks for Brave's P3A, as a job's requests complete.

      `BRAVE_RECORD_DNS_COUNTS` is defined in the `chromium_src` override.
    add_after_line:
      line: 'RecordJobHistograms(results, task_type);'
      code: '    BRAVE_RECORD_DNS_COUNTS'
