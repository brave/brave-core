substitutions:
  - description: 'Ship kEnableWebTransportDraft07 disabled.'
    set_feature_flag_default_state:
      feature_name: kEnableWebTransportDraft07
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Enable NIK-partitioning by default.
    set_feature_flag_default_state:
      feature_name: kPartitionConnectionsByNetworkIsolationKey
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kTLSTrustAnchorIDs disabled.'
    set_feature_flag_default_state:
      feature_name: kTLSTrustAnchorIDs
      value: base::FEATURE_DISABLED_BY_DEFAULT
