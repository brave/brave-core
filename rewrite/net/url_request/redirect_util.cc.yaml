substitutions:
  - description: |-
      Cap the referrer after upstream updates the redirect request.

      Brave caps referrers at the network layer when the
      X-Brave-Cap-Referrer header is removed on redirect.
    after_function_impl:
      function_name: RedirectUtil::UpdateHttpRequest
      code: |-
        MaybeCapReferrer(removed_headers, redirect_info);
