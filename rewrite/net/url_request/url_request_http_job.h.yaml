substitutions:
  - description: |-
      Declare CreateCookieOptions() so Brave can fill in ephemeral storage
      params.

      Defined in chromium_src/net/url_request/url_request_http_job.cc.
    regex:
      re_pattern: '(\n private:\n)'
      replace: |
        \1  CookieOptions CreateCookieOptions(
              CookieOptions::SameSiteCookieContext same_site_context) const;
