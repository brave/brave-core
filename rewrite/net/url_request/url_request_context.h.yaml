blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Add accessors for blocking .onion hostname resolution.

      The host resolver reads this to refuse .onion lookups for contexts where
      .onion is only reachable through Tor.
    add_to_public:
      class_name: URLRequestContext
      code: |-
        void set_block_onion_hostname_resolution(bool block) {
          block_onion_hostname_resolution_ = block;
        }
        bool block_onion_hostname_resolution() const {
          return block_onion_hostname_resolution_;
        }

  - description: |-
      Add the bool block_onion_hostname_resolution_ member, true by default.

      A context that is never configured fails .onion lookups.
    add_to_protected:
      class_name: URLRequestContext
      code: bool block_onion_hostname_resolution_ = true;
