blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Add the TorMode of the context and its accessors.

      The host resolver reads it to refuse .onion lookups outside Tor contexts.
    add_to_public:
      class_name: URLRequestContext
      code: |-
        // How the context treats Tor and .onion hostnames. Builds without Tor
        // ignore it and never block .onion.
        enum class TorMode {
          // The context belongs to a Tor profile. .onion requests go through
          // the Tor proxy, so the host resolver does not block them.
          kEnabled,
          // The context is not Tor. .onion lookups fail before they reach the
          // system resolver or DoH.
          kDisabled,
        };
        void set_tor_mode(TorMode tor_mode) { tor_mode_ = tor_mode; }
        TorMode tor_mode() const { return tor_mode_; }

  - description: |-
      Add the tor_mode_ member, kDisabled by default.

      A context that is never configured fails .onion lookups.
    add_to_protected:
      class_name: URLRequestContext
      code: TorMode tor_mode_ = TorMode::kDisabled;
