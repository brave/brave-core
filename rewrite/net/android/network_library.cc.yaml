substitutions:
  - description: |-
      Return no match instead of calling into Java when there is no JVM.

      Android renderers can run without a JVM. With
      kWebUIInProcessResourceLoading, they look up WebUI resource types, such as
      brave://rewards/favicon.ico, through net::GetMimeTypeFromFile(), which
      calls this function for .ico. Exit early to avoid calling into the JVM
      when it is not available.
    preempt_function_impl:
      function_name: GetMimeTypeFromExtension
      code: |-
        if (!base::android::IsJavaAvailable()) {
          return false;
        }
