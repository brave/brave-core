substitutions:
  - description: |-
      Enable static key pins by default in official builds of any branding.

      Upstream gates them on Google Chrome branding, but Brave ships and
      updates the pins list too.
    regex:
      pattern: '#if !BUILDFLAG(GOOGLE_CHROME_BRANDING)'
      replace: '#if !defined(OFFICIAL_BUILD)'
