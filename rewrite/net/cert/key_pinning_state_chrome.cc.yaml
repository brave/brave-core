substitutions:
  - description: |-
      Enable static key pins by default.

      Upstream only enables them for Google Chrome branded builds, but Brave
      ships and updates the pins list too.
    regex:
      re_pattern: '(constexpr bool kDefaultEnableStaticPins =).*?#endif'
      replace: '\1 true;'
      re_flags: [DOTALL]
