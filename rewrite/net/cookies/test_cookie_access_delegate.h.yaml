substitutions:
  - description: |-
      Never use ephemeral storage in TestCookieAccessDelegate.

      Brave adds CookieAccessDelegate::ShouldUseEphemeralStorage(), whose base
      implementation is NOTREACHED(), so every delegate must override it. Tests
      that install this delegate exercise upstream cookie semantics, which have
      no ephemeral storage.
    add_to_public:
      class_name: TestCookieAccessDelegate
      code: |-
        bool ShouldUseEphemeralStorage(
            const GURL& url,
            const SiteForCookies& site_for_cookies,
            base::optional_ref<const url::Origin> top_frame_origin)
            const override;
