substitutions:
  - description: |-
      Log timestamps in 24-hour time.

      The default 12-hour format omits AM/PM, making bot log timestamps
      ambiguous.
    regex:
      pattern: "datefmt='%I:%M:%S'"
      replace: "datefmt='%H:%M:%S'"
