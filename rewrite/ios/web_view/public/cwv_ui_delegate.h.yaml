substitutions:
  - description: |
      Mark JavaScript dialog `pageURL` as nullable

      Dialogs from opaque origins (sandboxed iframes, `data:` URLs) have no
      URL, which crashes Swift delegates when bridging nil to `URL`.
    count: 3
    regex:
      pattern: 'pageURL:(NSURL*)URL'
      replace: 'pageURL:(nullable NSURL*)URL'
