substitutions:
  - description: |-
      Drop the BrowserState, only used to update the scripts of its
      configuration.

      Each WebState now configures the scripts when its web view is created.
    regex:
      re_pattern:
        '\n\s*// The browser state associated with this
        feature\.\n\s*web::BrowserState\* browser_state_;\n'
      replace: "\n"
