substitutions:
  - description: |-
      Assert against lottie whenever Brave does not link its framework

      Upstream keys this off the providers target, which Brave replaces.
    regex:
      re_pattern:
        'ios_provider_target
        !=\s+"//ios/chrome/browser/providers:chromium_providers"\) \{'
      replace: '!ios_chrome_links_with_lottie_framework) {'
