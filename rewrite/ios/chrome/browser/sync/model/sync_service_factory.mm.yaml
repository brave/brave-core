substitutions:
  - description: 'Create BraveSyncServiceImpl instead of SyncServiceImpl.'
    regex:
      pattern: 'std::make_unique<syncer::SyncServiceImpl>(std::move(init_params));'
      replace: |-
        std::make_unique<syncer::BraveSyncServiceImpl>(
                  std::move(init_params),
                  std::make_unique<syncer::BraveSyncServiceImplDelegate>(
                      DeviceInfoSyncServiceFactory::GetForProfile(profile),
                      ios::HistoryServiceFactory::GetForProfile(profile)),
                  GetApplicationContext()->GetOSCryptAsync());
