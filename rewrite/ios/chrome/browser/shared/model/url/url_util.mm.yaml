substitutions:
  - description: |
      Don't treat `itms-services` as an App Store scheme.

      Anchored on the `GetItmsSchemes` set so only that list is affected.
    regex:
      re_pattern: '(GetItmsSchemes\(\).*?)\s*@"itms-services",'
      re_flags: [DOTALL]
      replace: '\1'
