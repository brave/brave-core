substitutions:
  - description: |-
      Serve chrome-untrusted:// WebUI in the profile's request context.

      `URLRequestJobFactory::CreateJob()` only handles the schemes in this
      map, and Brave's untrusted WebUIs load from chrome-untrusted://.
    regex:
      re_pattern:
        '(\n(\s*)protocol_handlers\[kChromeUIScheme\]
        =\s*web::CreateWebUIProtocolHandler\(this\);)'
      replace: |-
        \1
        \2protocol_handlers[kChromeUIUntrustedScheme] =
        \2    web::CreateWebUIProtocolHandler(this);
