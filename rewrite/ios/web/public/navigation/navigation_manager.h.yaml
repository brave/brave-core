substitutions:
  - description: |-
      Expose whether a native session restore is in progress.

      Tab helpers need to tell a restore apart from a regular navigation. The
      method is not pure, so that implementations that know nothing about
      native restores, such as the fakes, remain concrete.
    add_to_public:
      class_name: NavigationManager
      code: virtual bool IsNativeRestoreInProgress() const { return false; }
