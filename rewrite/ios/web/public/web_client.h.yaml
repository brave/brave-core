substitutions:
  - description: |-
      Let the embedder provide JavaScriptFeatures for a single WebState.

      Each WebState configures its own WKUserContentController, so the features
      can differ between WebStates of the same BrowserState.
    regex:
      re_pattern:
        '(\n(\s*)virtual std::vector<JavaScriptFeature\*>
        GetJavaScriptFeatures\(\n\s*BrowserState\* browser_state\) const;\n)'
      replace: |
        \1
        \2// Gives the embedder a chance to provide custom JavaScriptFeatures for
        \2// `web_state` only, in addition to those of `GetJavaScriptFeatures`.
        \2// Called when the scripts of the WebState's configuration are updated,
        \2// and before each main frame navigation of the WebState, whose scripts
        \2// are rebuilt if the returned features changed.
        \2virtual std::vector<JavaScriptFeature*> GetWebStateJavaScriptFeatures(
        \2    WebState* web_state) const;
