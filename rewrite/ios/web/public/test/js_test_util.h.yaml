substitutions:
  - description: |-
      Override the features of a WebState.

      Each WebState has its own WKWebViewConfigurationProvider and
      JavaScriptFeatureManager.
    regex:
      pattern:
        'void OverrideJavaScriptFeatures(web::BrowserState* browser_state,'
      replace: 'void OverrideJavaScriptFeatures(web::WebState* web_state,'
