substitutions:
  - description: |-
      Look up the content world of a feature through the WebState.

      Each WebState has its own JavaScriptFeatureManager.
    regex:
      re_pattern: 'JavaScriptFeatureManager::FromBrowserState\(\n\s*web_state->GetBrowserState\(\)\);'
      replace: 'JavaScriptFeatureManager::FromWebState(web_state);'

  - description: Look up the page content world of the WebState.
    regex:
      re_pattern:
        'JavaScriptFeatureManager::GetContentWorldForBrowserState\(\n(\s*)ContentWorld::kPageContentWorld,
        web_state->GetBrowserState\(\)\);'
      replace: |-
        JavaScriptFeatureManager::GetContentWorldForWebState(
        \1ContentWorld::kPageContentWorld, web_state);
