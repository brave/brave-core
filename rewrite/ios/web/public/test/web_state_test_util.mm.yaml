substitutions:
  - description: |-
      Add the content rule list to the WebState's own configuration.

      Each WebState has its own WKWebViewConfigurationProvider.
    regex:
      re_pattern: 'web::WKWebViewConfigurationProvider::FromBrowserState\(\n(\s*)web_state->GetBrowserState\(\)\);'
      replace: 'web::WebStateImpl::FromWebState(web_state)\n\1->GetWKWebViewConfigurationProvider();'
