substitutions:
  - description: |-
      Let unit tests load chrome-untrusted:// iframes.
    regex:
      re_pattern: '(\n(\s*)context_builder->SetProtocolHandler\(\s*kTestWebUIScheme,\s*web::CreateWebUIProtocolHandler\(browser_state\)\);)'
      replace: |-
        \1
        \2context_builder->SetProtocolHandler(
        \2    "chrome-untrusted", web::CreateWebUIProtocolHandler(browser_state));
