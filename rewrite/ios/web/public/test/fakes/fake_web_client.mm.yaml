substitutions:
  - description: |-
      Overrides FakeWebClient's AddAdditionalSchemes.

      Override can registers kChromeUIUntrustedScheme as a standard scheme too,
      the same way BraveWebClient::AddAdditionalSchemes does for the real app.
      Without this, url::Origin::Create() can't build a real (non-opaque)
      chrome-untrusted:// origin in ios/web unit tests using FakeWebFrame, since
      the scheme registry is locked right after WebTestSuite::Initialize()
      registers FakeWebClient's own (unextended) scheme list.
    after_function_impl:
      function_name: FakeWebClient::AddAdditionalSchemes
      code: |-
        schemes->standard_schemes.push_back(kChromeUIUntrustedScheme);