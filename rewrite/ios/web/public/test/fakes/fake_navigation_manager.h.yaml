substitutions:
  - description: |-
      Implement Brave's `NavigationManager::IsNativeRestoreInProgress()`

      Brave adds it as a pure virtual, so without an override the fake is
      abstract and upstream tests that instantiate it fail to compile.
    add_to_public:
      class_name: FakeNavigationManager
      code: bool IsNativeRestoreInProgress() const override;
