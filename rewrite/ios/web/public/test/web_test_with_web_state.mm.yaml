substitutions:
  - description: Define `OverrideJavaScriptFeatures`, moved from WebTest.
    regex:
      re_pattern: '(\nvoid WebTestWithWebState::TearDown\(\) \{\n.*?\n\}\n)'
      re_flags: [DOTALL]
      replace: |
        \1
        void WebTestWithWebState::OverrideJavaScriptFeatures(
            std::vector<JavaScriptFeature*> features) {
          web::test::OverrideJavaScriptFeatures(web_state(), features);
        }
