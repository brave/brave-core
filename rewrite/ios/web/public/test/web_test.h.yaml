substitutions:
  - description: |-
      Move `OverrideJavaScriptFeatures` to WebTestWithWebState.

      The JavaScript features are configured per WebState, which this fixture
      does not have.
    regex:
      re_pattern:
        '\n\s*// Manually overrides the built in JavaScriptFeatures and those
        from\n.*?void
        OverrideJavaScriptFeatures\(std::vector<JavaScriptFeature\*>
        features\);\n'
      re_flags: [DOTALL]
      replace: "\n"
