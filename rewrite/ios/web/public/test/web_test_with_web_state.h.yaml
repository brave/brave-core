substitutions:
  - description: |-
      Override the JavaScript features of the fixture's WebState.

      Moved from WebTest, as the JavaScript features are configured per
      WebState.
    add_after_line:
      line: 'void TearDown() override;'
      code: |2-

          // Manually overrides the built in JavaScriptFeatures and those from
          // `GetWebClient()::GetJavaScriptFeatures()` for `web_state()`. This is
          // intended to be used to replace an instance of a built in feature with
          // one created by the test.
          // NOTE: Do not call this when using a ChromeWebClient or
          // `FakeWebClient::SetJavaScriptFeatures` as this will override those
          // features.
          void OverrideJavaScriptFeatures(std::vector<JavaScriptFeature*> features);
