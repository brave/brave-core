substitutions:
  - description: |-
      Configure the WebState's own WKWebViewConfiguration.

      Each WebState has its own WKWebViewConfigurationProvider.
    regex:
      re_pattern: 'WKWebViewConfigurationProvider::FromBrowserState\(GetBrowserState\(\)\)\n'
      replace: |
        WebStateImpl::FromWebState(web_state())
              ->GetWKWebViewConfigurationProvider()
