substitutions:
  - description: |-
      Implement `WebFrameInternal::GetWebState`.

      Fake frames are not owned by a WebState.
    regex:
      re_pattern: '(\n  // WebFrameInternal:\n)'
      replace: |+
        \1  WebState* GetWebState() override;

