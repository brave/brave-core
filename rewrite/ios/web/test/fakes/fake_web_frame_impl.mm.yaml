substitutions:
  - description: Define `GetWebState`, which is null for a fake frame.
    regex:
      re_pattern:
        '(\nBrowserState\* FakeWebFrameImpl::GetBrowserState\(\) \{.*?\n\}\n)'
      re_flags: [DOTALL]
      replace: |
        \1
        WebState* FakeWebFrameImpl::GetWebState() {
          return nullptr;
        }
