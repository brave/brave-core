substitutions:
  - description: |-
      Serve the frame handed to the constructor, defaulting to the main one.

      Every use of main_frame_ in this file means "the frame this facade
      talks to" rather than "the main frame of the WebState": the poll loop
      it drives, the frame it compares against when a poll completes, the
      frame it delivers watch callbacks to, and the frame whose
      disappearance tears its state down. Seeding it with the frame passed
      in is therefore all a sub-frame facade needs to be correct.
    regex:
      re_pattern:
        'MojoFacade::MojoFacade\(WebState\* web_state\)\s*:
        web_state_\(web_state\) \{'
      re_flags: [DOTALL]
      replace: |-
        MojoFacade::MojoFacade(WebState* web_state, WebFrame* frame)
            : web_state_(web_state) {
          served_frame_id_ = frame ? frame->GetFrameId() : std::string();

  - description: |-
      Take the frame to serve from the constructor argument.
    regex:
      re_pattern: |-
        WebFrame\* main_frame =
              web_state_->GetPageWorldWebFramesManager\(\)->GetMainWebFrame\(\);
      replace: |-
        WebFrame* main_frame =
              frame ? frame
                    : web_state_->GetPageWorldWebFramesManager()
                          ->GetMainWebFrame();

  - description: |-
      Track the served frame, not whichever frame happens to be the main one.

      For the main-frame facade ServesFrame() is exactly
      WebFrame::IsMainFrame(), so upstream's behaviour is unchanged there.
    regex:
      re_pattern: 'if \(web_frame && web_frame->IsMainFrame\(\)\) \{'
      replace: 'if (web_frame && ServesFrame(web_frame)) {'

  - description: |-
      Give each new sub-frame a facade of its own.

      Gated the same way upstream gates the main frame's own
      AwaitNextMessage() call in the constructor: only once the page isn't
      mid-load and something has actually registered an interface. Without
      that gate a frame that never uses mojo would still get polled forever,
      since OnAwaitNextMessageCompleted retries on error.
    after_function_impl:
      function_name: MojoFacade::WebFrameBecameAvailable
      code: |-
        if (IsMainFrameFacade() && web_frame && !web_frame->IsMainFrame() &&
            !web_state_->IsLoading() &&
            web_state_->GetInterfaceBinderForMainFrame()
                ->HasRegisteredInterfaces()) {
          sub_frame_facades_[web_frame->GetFrameId()] =
              std::make_unique<MojoFacade>(web_state_, web_frame);
        }

  - description: |-
      Drop a sub-frame's facade along with the frame.

      Erasing here destroys a facade from inside a WebFramesManager
      notification, which base::ObserverList supports: the facade being
      destroyed is a different observer from the one being notified, and its
      destructor's RemoveObserver() on an entry not currently being visited
      is well defined.
    after_function_impl:
      function_name: MojoFacade::WebFrameBecameUnavailable
      code: |-
        sub_frame_facades_.erase(frame_id);

  - description: |-
      Drop every sub-frame facade when a new document commits, before
      upstream resets the main frame's own state.
    preempt_function_impl:
      function_name: MojoFacade::PageLoaded
      code: |-
        sub_frame_facades_.clear();

  - description: |-
      Drop the sub-frame facades before the WebState they point at goes.
    preempt_function_impl:
      function_name: MojoFacade::WebStateDestroyed
      code: |-
        sub_frame_facades_.clear();

  - description: |-
      Gate Mojo.bindInterface against Brave's chrome-untrusted:// per-origin
      interface allowlist.

      Upstream doesn't check origin at all here; see
      InterfaceBinder::IsAllowedForOrigin in
      brave/chromium_src/ios/web/public/web_state.h for the allowlist itself.
    preempt_function_impl:
      function_name: MojoFacade::HandleMojoBindInterface
      return_if: '!IsBindInterfaceAllowedForFrame(args)'
      return_value: 'false'
