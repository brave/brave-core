substitutions:
  - description: |-
      Tie a MojoFacade to the WebUI host it serves.

      Chromium keeps one WebUIIOS per WebState, so its facade can assume the
      main frame. Brave keeps a map of them keyed by host (see
      brave/chromium_src/ios/web/web_state/web_state_impl_realized_web_state.h)
      so a chrome-untrusted:// frame can have a WebUI of its own, which is
      what AI Chat's conversation-entries iframe and Wallet's panels rely on.
      Every one of those builds a facade, and without a host to bind to they
      all poll the main frame: the frame's single JS message stream gets
      split between them, each keeping the half of pipes_ it happened to
      see, and each clobbering the one resolver slot
      Mojo.internal.fetchNextMessageFromJS parks its promise in.

      The host is the association the WebUI map is already keyed by, so it
      is the one to hand down. An empty host keeps upstream's behaviour of
      serving the main frame.
    regex:
      re_pattern: 'explicit MojoFacade\(WebState\* web_state\);'
      replace: |-
        explicit MojoFacade(WebState* web_state,
                              const std::string& webui_host = std::string());

  - description: |-
      Declare the host binding and the Brave-only helpers.
    add_to_protected:
      class_name: MojoFacade
      code: |-
        // Whether `frame` is the frame this facade serves, which is the one
        // whose security origin host matches served_host_. An empty
        // served_host_ means the main frame, as upstream assumes.
        bool ServesFrame(WebFrame* frame) const;
        // Gates Mojo.bindInterface from a chrome-untrusted:// frame against
        // InterfaceBinder::IsAllowedForOrigin. See
        // brave/chromium_src/ios/web/public/web_state.h for the allowlist.
        bool IsBindInterfaceAllowedForFrame(const base::DictValue& args);
        // Records what this facade knew when a message named a pipe id it
        // doesn't hold.
        void ReportUnknownPipe(const char* operation,
                               std::optional<int> pipe_id);
        // Whether a poll that came back empty is worth repeating. Counts the
        // consecutive failures, so a frame that can no longer run scripts
        // stops being asked.
        bool ShouldRetryPoll();

        // Host of the WebUI this facade serves, empty for the main frame.
        std::string served_host_;
        // Polls in a row that carried no message.
        int consecutive_poll_failures_ = 0;
