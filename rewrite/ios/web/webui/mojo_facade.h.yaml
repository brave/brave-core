substitutions:
  - description: |-
      Let a MojoFacade serve a frame other than the main one.

      Chromium's MojoFacade is one per WebState and only ever talks to the
      main frame. Brave's AI Chat embeds an untrusted chrome-untrusted://
      iframe inside the main WebUI page to render conversation entries (see
      brave/ios/browser/ui/webui/ai_chat/ai_chat_untrusted_conversation_ui.mm,
      which binds its own mojom handlers via AddUntrustedInterface), so that
      sub-frame needs a facade of its own.

      Passing the frame in, rather than teaching one facade to juggle
      several, keeps every piece of per-frame state upstream already holds
      (pipes_, watchers_, next_pipe_id_, last_watch_id_,
      is_awaiting_message_) correct by construction. Handle ids in
      particular are minted by a per-frame JS counter that restarts at 1 in
      every frame, so a shared pipes_ has two frames overwriting and erasing
      each other's live pipes.

      The default keeps upstream's own construction in
      ios/web/webui/web_ui_ios_impl.mm untouched.
    regex:
      re_pattern: 'explicit MojoFacade\(WebState\* web_state\);'
      replace: 'explicit MojoFacade(WebState* web_state, WebFrame* frame = nullptr);'

  - description: |-
      Declare the sub-frame facades and the "which frame do I serve" helpers.

      `sub_frame_facades_` is only ever populated on the facade serving the
      main frame; the ones it owns leave it empty, so sub-frames don't
      recurse into spawning facades of their own.
    add_to_protected:
      class_name: MojoFacade
      code: |-
        // Whether this facade serves the main frame, and so owns the
        // per-sub-frame facades below.
        bool IsMainFrameFacade() const;
        // Whether `frame` is the frame this facade serves.
        bool ServesFrame(WebFrame* frame) const;
        // Gives `frame` a facade of its own if it needs one, and makes sure
        // it is polling. Does nothing unless IsMainFrameFacade().
        void EnsureSubFrameFacade(WebFrame* frame);
        // Gates Mojo.bindInterface from a chrome-untrusted:// frame against
        // InterfaceBinder::IsAllowedForOrigin. See
        // brave/chromium_src/ios/web/public/web_state.h for the allowlist.
        bool IsBindInterfaceAllowedForFrame(const base::DictValue& args);
        // Records what this facade knew when a message named a pipe id it
        // doesn't hold.
        void ReportUnknownPipe(const char* operation,
                               std::optional<int> pipe_id);
        // Whether a poll that came back empty is worth repeating. Counts the
        // consecutive failures, so a frame that can no longer run scripts
        // stops being asked.
        bool ShouldRetryPoll();

        // Polls in a row that carried no message.
        int consecutive_poll_failures_ = 0;

        // Id of the frame this facade serves, empty for the main frame,
        // whose identity can change over the WebState's life.
        std::string served_frame_id_;
        // Facades for the sub-frames of this WebState, keyed by frame id.
        // Empty unless IsMainFrameFacade().
        std::map<std::string, std::unique_ptr<MojoFacade>> sub_frame_facades_;
