substitutions:
  - description: |-
      Add sub-frame Mojo routing to MojoFacade.

      Chromium's MojoFacade only ever polls/responds to a WebState's main
      frame. Brave's AI Chat embeds an untrusted chrome-untrusted:// iframe
      inside the main WebUI page to render conversation entries (see
      brave/ios/browser/ui/webui/ai_chat/ai_chat_untrusted_conversation_ui.mm,
      which binds its own mojom handlers via AddUntrustedInterface), so that
      sub-frame needs its own poll loop and its watches need to be routed
      back to it instead of always the main frame. See the corresponding
      mojo_facade.mm plaster for how these are wired up.
    add_to_protected:
      class_name: MojoFacade
      code: |-
        void AwaitNextMessageForFrame(const std::string& frame_id);
        void OnAwaitNextMessageForFrameCompleted(const std::string& frame_id,
                                                 const base::Value* value,
                                                 NSError* error);
        // Resolves which frame a watch's callback should be delivered to,
        // falling back to the main frame exactly as upstream's own
        // GetMainWebFrame() call in OnWatcherCallback would.
        web::WebFrame* GetFrameForWatch(int watch_id);
        // Erases every watch (and watchers_ entry) created by `frame_id`,
        // so a sub-frame's watches can't outlive it and later misdirect to
        // the main frame via GetFrameForWatch's fallback.
        void EraseWatchersForFrame(const std::string& frame_id);

        // Frame ids of sub-frames (other than the main frame, already
        // covered by upstream's own is_awaiting_message_) currently being
        // polled. A std::map<std::string, bool> stands in for a set since
        // <set> isn't included here and this is the only place that needs
        // one.
        std::map<std::string, bool> extra_polling_frame_ids_;
        // Maps an active watch_id to the frame id that created it via
        // MojoHandle.watch.
        std::map<int, std::string> watch_id_to_frame_id_;
        // Frame whose message is being handled, empty outside of one.
        std::string current_frame_id_;

  - description: |-
      Declare the chrome-untrusted:// per-origin interface allowlist check.

      See InterfaceBinder::IsAllowedForOrigin in
      brave/chromium_src/ios/web/public/web_state.h for the allowlist itself.
    add_to_protected:
      class_name: MojoFacade
      code: |-
        bool IsBindInterfaceAllowedForFrame(const base::DictValue& args);

  - description: |-
      Key live pipes by the frame that owns them.

      Every frame runs its own copy of ui/webui/resources/js/ios/mojo_api.js,
      whose Mojo.nextAvailableHandleId counter restarts at 1 in each frame's
      JS context, so a handle id is only unique within the frame that minted
      it. Keyed by id alone, AI Chat's chrome-untrusted:// conversation
      iframe and the WebUI page embedding it overwrite and erase each other's
      live pipes, which crashes the CHECK(pipe.is_valid()) in
      HandleMojoHandleWriteMessage.
    regex:
      re_pattern:
        'std::unordered_map<int, mojo::ScopedMessagePipeHandle> pipes_;'
      replace: |-
        // Keyed by frame id first: pipe ids are unique only within a frame.
          std::map<std::string, std::unordered_map<int, mojo::ScopedMessagePipeHandle>>
              pipes_;

  - description: |-
      Declare the per-frame pipe accessors.

      `current_frame_id_` is set for the duration of a single message (see the
      mojo_facade.mm plaster), which is what lets upstream's own pipe lookups
      stay written in terms of a bare pipe id.
    add_to_protected:
      class_name: MojoFacade
      code: |-
        // The pipe table of the frame currently being serviced.
        std::unordered_map<int, mojo::ScopedMessagePipeHandle>& CurrentFramePipes();
        // Stores `pipe` under `pipe_id` in the current frame's table.
        void StorePipeForCurrentFrame(int pipe_id,
                                      mojo::ScopedMessagePipeHandle pipe);
        // `frame_id` if it names a live frame, else the main frame's id.
        std::string ResolveFrameId(const std::string& frame_id);
        // Frame id that sent `message`, resolved as above.
        std::string GetFrameIdForMessage(const base::DictValue* message);
        // Frame id that created `watch_id`, resolved as above.
        std::string GetFrameIdForWatch(int watch_id);
