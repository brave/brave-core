substitutions:
  - description: Define `GetWebStateJavaScriptFeatures`, returning none.
    regex:
      re_pattern:
        '(\nstd::vector<JavaScriptFeature\*>
        WebClient::GetJavaScriptFeatures\(\n.*?\n\}\n)'
      re_flags: [DOTALL]
      replace: |
        \1
        std::vector<JavaScriptFeature*> WebClient::GetWebStateJavaScriptFeatures(
            WebState* web_state) const {
          return std::vector<JavaScriptFeature*>();
        }
