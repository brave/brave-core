substitutions:
  - description: |
      Expose the main frame WebUI and the WebUI count

      Brave keeps one WebUI per host, so a chrome-untrusted:// frame can have its
      own. Some Brave WebUI implementations need the main frame one, and tests
      the count.
    add_to_public:
      class_name: WebStateImpl
      code: |-
        WebUIIOS* GetMainFrameWebUI();
        size_t GetWebUICountForTesting();

  - description: |-
      Expose the WKWebViewConfigurationProvider of the WebState.

      Each WebState has its own WKWebViewConfiguration and
      WKUserContentController, so JavaScript features can be configured per
      WebState.
    add_after_line:
      line: 'WebFramesManagerImpl& GetWebFramesManagerImpl(ContentWorld world);'
      code: |2-

          // Returns the WKWebViewConfigurationProvider of this WebState.
          WKWebViewConfigurationProvider& GetWKWebViewConfigurationProvider();

  - description: Forward declare the provider returned above.
    add_after_line:
      line: 'class WebTestWithWebStateImpl;'
      code: 'class WKWebViewConfigurationProvider;'

  - description: |-
      Forward declare the types the substitutions above use

      For the main frame WebUI accessor added above.
    add_after_includes:
      code: |-
        namespace web {
        class WebUIIOS;
        }
