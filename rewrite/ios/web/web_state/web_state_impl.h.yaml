substitutions:
  - description: |
      Expose the main frame WebUI and the WebUI count

      Brave keeps one WebUI per host, so a chrome-untrusted:// frame can have its
      own. Some Brave WebUI implementations need the main frame one, and tests
      the count.
    add_to_public:
      class_name: WebStateImpl
      code: |-
        WebUIIOS* GetMainFrameWebUI();
        size_t GetWebUICountForTesting();

  - description: |-
      Forward declare the types the substitutions above use

      For the main frame WebUI accessor added above.
    add_after_includes:
      code: |-
        namespace web {
        class WebUIIOS;
        }
