substitutions:
  - description: |
      Expose the main frame WebUI and the WebUI count

      See the web_state_impl.h plaster.
    add_to_public:
      class_name: WebStateImpl::RealizedWebState
      code: |-
        WebUIIOS* GetMainFrameWebUI();
        size_t GetWebUICountForTesting();
  - description: |
      Keep the WebUIs in a map keyed by host

      Some of Brave's WebUI applications, such as AI Chat, host chrome-untrusted://
      frames, so a page can have more than one WebUI.
    regex:
      re_pattern: |-
        (  // `WebUIIOS` object for the current page if it is a WebUI page that
          // uses the web-based WebUI framework, or nullptr otherwise\.
        )  std::unique_ptr<WebUIIOS> web_ui_;
      replace: |-
        \1  // There is one per host.
          std::map<std::string, std::unique_ptr<WebUIIOS>, std::less<>> web_uis_;
