substitutions:
  - description: Define `GetWKWebViewConfigurationProvider`.
    regex:
      re_pattern:
        '(\nWebFramesManagerImpl&
        WebStateImpl::GetWebFramesManagerImpl\(\n.*?\n\}\n)'
      re_flags: [DOTALL]
      replace: |
        \1
        WKWebViewConfigurationProvider&
        WebStateImpl::GetWKWebViewConfigurationProvider() {
          DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);
          return RealizedState()->GetWKWebViewConfigurationProvider();
        }
