substitutions:
  - description: |-
      Include the shared resources the configuration is built from, in place of
      the rule list provider.
    regex:
      re_pattern:
        '#import
        "ios/web/web_state/ui/wk_content_rule_list_provider\.h"\n#import
        "ios/web/web_state/ui/wk_content_rule_list_util\.h"\n'
      replace: ''

  - description: Include the shared resources the configuration is built from.
    add_after_line:
      line: '#import "base/uuid.h"'
      code: |-
        #import "brave/ios/web/web_state/ui/wk_content_rule_list_applier.h"
        #import "brave/ios/web/web_state/ui/wk_web_view_shared_resources_provider.h"

  - description:
      Drop `ToNSUUID`, moved to the shared provider with the data store.
    regex:
      re_pattern:
        '\n// Converts `uuid` to an NSUUID\.\nNSUUID\* ToNSUUID\(const
        base::Uuid& uuid\) \{\n.*?\n\}\n'
      re_flags: [DOTALL]
      replace: ''

  - description:
      Drop `DeleteDataStorageForIdentifier`, moved to the shared provider.
    regex:
      re_pattern:
        '// static\nvoid
        WKWebViewConfigurationProvider::DeleteDataStorageForIdentifier\(.*?\n\}\n\n'
      re_flags: [DOTALL]
      replace: ''

  - description: |-
      Construct a rule list applier for the shared content rule lists, and the
      JavaScript features of the WebState.

      The rule lists used to be compiled by this provider. They are now compiled
      once per BrowserState by WKWebViewSharedResourcesProvider, including the
      static ones.

      The JavaScriptFeatureManager and web frames manager features configure
      this provider's WKUserContentController, so the provider owns them rather
      than the BrowserState.
    regex:
      re_pattern:
        '(WKWebViewConfigurationProvider::WKWebViewConfigurationProvider\(\n\s*BrowserState\*
        browser_state\)\n\s*:
        browser_state_\(browser_state\),\n)\s*content_rule_list_provider_\(std::make_unique<WKContentRuleListProvider>\(\n\s*browser_state->GetStatePath\(\)\)\)
        \{\n\s*Initialize\(\);\n\}\n\nWKWebViewConfigurationProvider::WKWebViewConfigurationProvider\(\n\s*BrowserState\*
        browser_state,\n\s*std::unique_ptr<WKContentRuleListProvider>
        rule_list_provider\)\n.*?\n\}\n'
      re_flags: [DOTALL]
      replace: |
        \1      web_state_(web_state),
              content_rule_list_applier_(std::make_unique<WKContentRuleListApplier>(
                  WKWebViewSharedResourcesProvider::FromBrowserState(browser_state)
                      .GetContentRuleListRegistry())),
              java_script_feature_manager_(
                  std::make_unique<JavaScriptFeatureManager>()) {
          for (ContentWorld world :
               java_script_feature_manager_->GetAllContentWorldEnums()) {
            web_frames_manager_features_.push_back(base::WrapUnique(
                new WebFramesManagerJavaScriptFeature(world, browser_state)));
          }
        }

  - description:
      Drop `Initialize`, as the shared provider compiles the static lists.
    regex:
      re_pattern:
        '\nvoid WKWebViewConfigurationProvider::Initialize\(\) \{\n.*?\n\}\n'
      re_flags: [DOTALL]
      replace: ''

  - description: |-
      Take the website data store from the shared provider.

      A configuration not originating from //ios/web replaces the BrowserState's
      data store, which WebStates created afterwards use as well. The data
      store is not restored when a WebState resets its configuration without
      one, as each WebState lazily does so when its web view is created.
    regex:
      re_pattern:
        '\n\s*WKWebsiteDataStore\* original_data_store =
        website_data_store_;\n(\s*)// Update the configuration''s website data
        store\.\n.*?website_data_store_updated_callbacks_\.Notify\(website_data_store_\);\n\s*\}\n'
      re_flags: [DOTALL]
      replace: |+


        \1WKWebViewSharedResourcesProvider& shared_resources_provider =
        \1    WKWebViewSharedResourcesProvider::FromBrowserState(browser_state_);
        \1// Update the configuration's website data store.
        \1if (!configuration) {
        \1  [configuration_
        \1      setWebsiteDataStore:shared_resources_provider.GetWebsiteDataStore()];
        \1} else {
        \1  shared_resources_provider.SetExternalWebsiteDataStore(
        \1      configuration.websiteDataStore);
        \1}
  - description: Install the shared content rule lists on this configuration.
    regex:
      pattern: 'content_rule_list_provider_->SetUserContentController('
      replace: 'content_rule_list_applier_->SetUserContentController('

  - description: Drop `GetWebsiteDataStore`, moved to the shared provider.
    regex:
      re_pattern:
        '\nWKWebsiteDataStore\*
        WKWebViewConfigurationProvider::GetWebsiteDataStore\(\) \{\n.*?\n\}\n'
      re_flags: [DOTALL]
      replace: ''

  - description: |-
      Drop `GetContentRuleListProvider` and
      `RegisterWebSiteDataStoreUpdatedCallback`, moved to the shared provider.
    regex:
      re_pattern:
        '\nWKContentRuleListProvider&\nWKWebViewConfigurationProvider::GetContentRuleListProvider\(\)
        \{\n.*?\nWKWebViewConfigurationProvider::RegisterWebSiteDataStoreUpdatedCallback\(.*?\n\}\n'
      re_flags: [DOTALL]
      replace: ''

  - description: |-
      Drop `FromBrowserState`, as each WebState now owns its provider.
    regex:
      re_pattern:
        '\nnamespace \{\n\n// A key used to associate a
        WKWebViewConfigurationProvider with a BrowserState\..*?\n\}  //
        namespace\n\n//
        static\nWKWebViewConfigurationProvider&\nWKWebViewConfigurationProvider::FromBrowserState\(.*?\n\}\n'
      re_flags: [DOTALL]
      replace: ''

  - description: |-
      Give this WebState its own WKUserContentController and WKPreferences.

      A configuration passed in may be shared with other WKWebViews. WebKit
      derives the configuration of a window opened by a page from the opener's,
      sharing its WKUserContentController, and an embedder may reuse a
      configuration for several web views. The scripts and preferences of each
      WebState are configured independently.
    regex:
      re_pattern: '(\n(\s*)configuration_ = \[configuration copy\];\n)'
      replace: |
        \1\2// `configuration` may be shared with other WKWebViews, so this WebState
        \2// gets its own WKUserContentController and WKPreferences.
        \2[configuration_
        \2    setUserContentController:[[WKUserContentController alloc] init]];
        \2[configuration_ setPreferences:[[configuration_ preferences] copy]];

  - description: |-
      Keep the WebUI scheme handlers of a configuration derived from another
      //ios/web managed WKWebView.

      WebKit throws when a scheme already has a handler, which is the case for
      the configuration of a window opened by a page, derived from the opener's.
    regex:
      re_pattern:
        '(\n(\s*)for \(std::string scheme : schemes\.standard_schemes\)
        \{\n)\s*\[configuration_
        setURLSchemeHandler:scheme_handler_\n\s*forURLScheme:base::SysUTF8ToNSString\(scheme\)\];\n'
      replace: |
        \1\2  NSString* url_scheme = base::SysUTF8ToNSString(scheme);
        \2  // A configuration derived from another //ios/web managed WKWebView
        \2  // already has the handlers.
        \2  if (![configuration_ urlSchemeHandlerForURLScheme:url_scheme]) {
        \2    [configuration_ setURLSchemeHandler:scheme_handler_
        \2                           forURLScheme:url_scheme];
        \2  }

  - description: Define `GetJavaScriptFeatureManager`.
    regex:
      re_pattern: '(\nvoid WKWebViewConfigurationProvider::Purge\(\) \{\n)'
      replace: |-

        JavaScriptFeatureManager*
        WKWebViewConfigurationProvider::GetJavaScriptFeatureManager() {
          DCHECK_CALLED_ON_VALID_SEQUENCE(_sequence_checker_);
          return java_script_feature_manager_.get();
        }
        \1

  - description: |-
      Apply Brave's adjustments to the configuration after a reset.

      Brave restores some WebKit defaults Chromium overrides, and lets the
      embedder finish setting up the configuration. `after_function_impl` can
      not be used, as the Objective-C++ body is not parsed correctly.
    regex:
      re_pattern:
        '(\nvoid
        WKWebViewConfigurationProvider::ResetWithWebViewConfiguration\(.*?)(\n\}\n\nWKWebViewConfiguration\*\nWKWebViewConfigurationProvider::GetWebViewConfiguration\(\))'
      re_flags: [DOTALL]
      replace: |-
        \1

          BraveDidResetConfiguration(web_state_, configuration_);\2

  - description: Take the WebState owning the provider.
    regex:
      re_pattern:
        '(\nWKWebViewConfigurationProvider::WKWebViewConfigurationProvider\(\n)(\s*)BrowserState\*
        browser_state\)\n(\s*): browser_state_\(browser_state\),\n'
      replace: |
        \1\2BrowserState* browser_state,
        \2WebState* web_state)
        \3: browser_state_(browser_state),

  - description: |-
      Derive the configuration from the BrowserState's external configuration
      when not given one.

      A WebState can create its web view before it is given a configuration
      not originating from //ios/web, e.g. when restoring its session, as it is
      created. Before each WebState had its own configuration, it got the
      BrowserState's, which was the last external one.
    regex:
      re_pattern: '(\n(\s*)if \(configuration_\) \{\n\s*Purge\(\);\n\s*\}\n)'
      replace: |
        \1
        \2if (!configuration) {
        \2  configuration =
        \2      WKWebViewSharedResourcesProvider::FromBrowserState(browser_state_)
        \2          .GetExternalConfiguration();
        \2}

  - description: |-
      Configure the JavaScript features of the WebState, and keep the signature
      of their scripts.

      The features are configured on this provider's WKUserContentController
      with the manager it owns. After the built-in features come the web frames
      manager features, owned by this provider and no longer part of the
      built-in features, the BrowserState's features and the features the
      embedder provides for the WebState. A provider without a WebState only
      configures the BrowserState's features.

      `UpdateScriptsIfNeeded` compares the features and the signature of their
      scripts with the ones last configured, so the scripts of a WebState can be
      rebuilt before a navigation when they changed.
    regex:
      re_pattern:
        '(\nvoid WKWebViewConfigurationProvider::UpdateScripts\(\)
        \{\n.*?\[configuration_\.userContentController
        removeAllUserScripts\];\n)\n\s*JavaScriptFeatureManager\*
        java_script_feature_manager =\n.*?\n\}\n'
      re_flags: [DOTALL]
      replace: |
        \1
          WKUserContentController* user_content_controller =
              GetWebViewConfiguration().userContentController;
          std::vector<JavaScriptFeature*> features = GetJavaScriptFeatures();
          scripts_signature_ = GetScriptsSignature(features);
          java_script_feature_manager_->ConfigureFeatures(user_content_controller,
                                                          features);

          for (const auto& feature : web_frames_manager_features_) {
            feature->ConfigureHandlers(user_content_controller);
          }
        }

        void WKWebViewConfigurationProvider::UpdateScriptsIfNeeded() {
          TRACE_EVENT("ui", "WKWebViewConfigurationProvider::UpdateScriptsIfNeeded");
          DCHECK_CALLED_ON_VALID_SEQUENCE(_sequence_checker_);
          if (!configuration_) {
            return;
          }
          if (GetScriptsSignature(GetJavaScriptFeatures()) != scripts_signature_) {
            UpdateScripts();
          }
        }

        std::vector<JavaScriptFeature*>
        WKWebViewConfigurationProvider::GetJavaScriptFeatures() const {
          std::vector<JavaScriptFeature*> features;
          for (JavaScriptFeature* feature :
               java_script_features::GetBuiltInJavaScriptFeatures(browser_state_)) {
            features.push_back(feature);
          }
          for (const auto& feature : web_frames_manager_features_) {
            features.push_back(feature.get());
          }
          for (JavaScriptFeature* feature :
               GetWebClient()->GetJavaScriptFeatures(browser_state_)) {
            features.push_back(feature);
          }
          if (web_state_) {
            for (JavaScriptFeature* feature :
                 GetWebClient()->GetWebStateJavaScriptFeatures(web_state_)) {
              features.push_back(feature);
            }
          }
          return features;
        }

        // static
        WKWebViewConfigurationProvider::ScriptsSignature
        WKWebViewConfigurationProvider::GetScriptsSignature(
            const std::vector<JavaScriptFeature*>& features) {
          ScriptsSignature signature;
          signature.reserve(features.size());
          for (JavaScriptFeature* feature : features) {
            signature.emplace_back(feature, feature->GetScriptsSignature());
          }
          return signature;
        }

  - description: |-
      Only enable Universal Opt-Out in the default webpage preferences when the
      configuration is created.

      Each WebState has its own configuration, so a change can not be applied
      to every web view through shared default webpage preferences. It is
      applied to the webpage preferences of each navigation instead.
    regex:
      re_pattern:
        '\n  if \(@available\(iOS 27, \*\)\) \{\n\s*// Materialize
        `defaultWebpagePreferences`
        before.*?SetUniversalOptOutEnabled\(true\);\n\s*\}\n\s*\}\n'
      re_flags: [DOTALL]
      replace: |

        #if defined(__IPHONE_27_0) && __IPHONE_OS_VERSION_MAX_ALLOWED >= __IPHONE_27_0
          if (@available(iOS 27, *)) {
            // On early versions of iOS 27 betas,
            // `-[WKWebPagePreferences setGlobalPrivacyControlEnabled:]` was not
            // defined correctly, causing crashes. As a workaround, only set the
            // preference if Universal Opt-Out is enabled.
            if (GetWebClient()->GetUniversalOptOutState(browser_state_) ==
                UniversalOptOutState::kEnabled) {
              [[configuration_ defaultWebpagePreferences]
                  setGlobalPrivacyControlEnabled:YES];
            }
          }
        #endif

  - description: Drop `SetUniversalOptOutEnabled`, inlined above.
    regex:
      re_pattern:
        '\nvoid WKWebViewConfigurationProvider::SetUniversalOptOutEnabled\(bool
        enabled\) \{\n.*?\n\}\n'
      re_flags: [DOTALL]
      replace: ''
