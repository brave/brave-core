substitutions:
  - description: Include the shared resources provider holding the data store.
    add_before_line:
      line: '#import "ios/web/public/browser_state.h"'
      code: |-
        #import "brave/ios/web/web_state/ui/wk_web_view_shared_resources_provider.h"

  - description: |-
      Get the data store from the shared resources provider.

      The website data store is shared by every WebState of the BrowserState,
      so it moved out of the WKWebViewConfigurationProvider.
    regex:
      re_pattern:
        'WKWebViewConfigurationProvider& provider
        =\n(\s*)WKWebViewConfigurationProvider::FromBrowserState\(browser_state\);\n(\s*)WKWebsiteDataStore\*
        data_store = provider\.GetWebsiteDataStore\(\);'
      replace: |-
        WKWebsiteDataStore* data_store =
        \1WKWebViewSharedResourcesProvider::FromBrowserState(browser_state)
        \1    .GetWebsiteDataStore();

  - description: Delete data storage through the shared resources provider.
    regex:
      pattern: 'WKWebViewConfigurationProvider::DeleteDataStorageForIdentifier('
      replace: 'WKWebViewSharedResourcesProvider::DeleteDataStorageForIdentifier('

  - description: |-
      Stop updating Universal Opt-Out on a BrowserState-wide configuration.

      Each WebState has its own configuration, which enables Universal Opt-Out
      when it is created if the BrowserState has it enabled. A change is
      applied to the webpage preferences of each navigation instead.
    regex:
      re_pattern:
        '(void SetUniversalOptOutEnabled\(BrowserState\* browser_state, bool
        enabled\) \{\n\s*CHECK\(browser_state\);\n).*?\n\}\n'
      re_flags: [DOTALL]
      replace: |
        \1}

  - description: Drop the include only Universal Opt-Out used.
    regex:
      pattern: |
        #import "ios/web/web_state/ui/wk_web_view_configuration_provider.h"
      replace: ''
