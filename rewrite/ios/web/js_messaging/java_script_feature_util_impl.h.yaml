substitutions:
  - description: |-
      Note that the web frames manager features are not built-in features.

      They are added by the owner of the configuration, which also configures
      their handlers.
    regex:
      pattern: '// Returns the JavaScriptFeatures built in to //ios/web.'
      replace: |-
        // Returns the JavaScriptFeatures built in to //ios/web. This excludes the
        // WebFramesManagerJavaScriptFeatures, which are configured separately.
