substitutions:
  - description: |-
      Drop the BrowserState user data key of the removed `Container`.

      The WKWebViewConfigurationProvider of each WebState owns the features.
    regex:
      re_pattern:
        'const char kWebFramesManagerJavaScriptFeatureContainerKeyName\[\]
        =\n[^;]*;\n\n'
      replace: ''

  - description: Drop the removed `Container`.
    regex:
      re_pattern:
        '#pragma mark -
        WebFramesManagerJavaScriptFeature::Container\n.*?(#pragma mark -
        WebFramesManagerJavaScriptFeature\n)'
      re_flags: [DOTALL]
      replace: '\1'

  - description: Drop the removed `AllContentWorldFeaturesFromBrowserState`.
    regex:
      re_pattern:
        '//
        static\nstd::vector<WebFramesManagerJavaScriptFeature\*>\nWebFramesManagerJavaScriptFeature::AllContentWorldFeaturesFromBrowserState\(.*?\n\}\n\n'
      re_flags: [DOTALL]
      replace: ''
