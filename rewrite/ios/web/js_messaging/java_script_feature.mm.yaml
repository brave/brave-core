substitutions:
  - description: |-
      Look up the content world of a feature through the frame's WebState.

      Each WebState has its own JavaScriptFeatureManager, configured on its own
      WKUserContentController. A frame without a WebState (e.g. a fake frame in
      tests) has no content worlds, so JavaScript can not be run in it.
    count: 5 # Every JavaScriptFeature API running JavaScript in a frame.
    regex:
      re_pattern:
        '(\n\s*)JavaScriptFeatureManager\* feature_manager
        =\n\s*JavaScriptFeatureManager::FromBrowserState\(web_frame->GetBrowserState\(\)\);'
      replace: |-
        \1WebState* web_state = web_frame->GetWebFrameInternal()->GetWebState();
          if (!web_state) {
            return false;
          }
          JavaScriptFeatureManager* feature_manager =
              JavaScriptFeatureManager::FromWebState(web_state);

  - description:
      Define `GetScriptsSignature`, for features with constant scripts.
    regex:
      re_pattern:
        '(\nstd::vector<JavaScriptFeature::FeatureScript>
        JavaScriptFeature::GetScripts\(\)\n\s*const \{\n\s*return
        scripts_;\n\}\n)'
      replace: |
        \1
        std::string JavaScriptFeature::GetScriptsSignature() const {
          return std::string();
        }
