substitutions:
  - description: Forward declare `WebState` for `GetWebState` below.
    add_after_line:
      line: 'class JavaScriptContentWorld;'
      code: |-
        class WebState;

  - description: |-
      Expose the frame's `WebState` internally.

      JavaScript injection state is moving from the `BrowserState` to the
      `WebState`, so internal callers holding only a `WebFrame` need a way to
      reach the `WebState` that owns it.
    add_to_public:
      class_name: WebFrameInternal
      code: |-

        // Returns the WebState which owns this frame.
        virtual WebState* GetWebState() = 0;
