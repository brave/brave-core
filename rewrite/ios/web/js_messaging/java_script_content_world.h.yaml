substitutions:
  - description: |-
      Declare `GetFeatureReplyingToPrompts`.

      Window prompts are answered by the feature registered for the prompt's
      script message handler name.
    add_to_public:
      class_name: JavaScriptContentWorld
      code: |-
        // Returns the added feature replying to prompts for `handler_name`, or
        // nullptr if there is none.
        const JavaScriptFeature* GetFeatureReplyingToPrompts(
            const std::string& handler_name);

  - description: 'Add the features replying to prompts, by handler name.'
    add_to_protected:
      class_name: JavaScriptContentWorld
      code: |-
        base::flat_map<std::string,
                       raw_ptr<const JavaScriptFeature, DanglingUntriaged>>
            prompt_replying_features_;
