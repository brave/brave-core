substitutions:
  - description: Implement `WebFrameInternal::GetWebState`.
    regex:
      pattern: 'WebState* GetWebState();'
      replace: 'WebState* GetWebState() override;'

  - description: |-
      Declare `ContentWorldForFrame`.

      Consolidates the lookup of the frame's JavaScriptContentWorld so it can be
      moved from the BrowserState to the WebState in one place.
    regex:
      re_pattern: '(class WebFrameImpl final .*?\n private:\n)'
      re_flags: [DOTALL]
      replace: |+
        \1  // Returns the JavaScriptContentWorld for this frame's content world.
          JavaScriptContentWorld* ContentWorldForFrame();

