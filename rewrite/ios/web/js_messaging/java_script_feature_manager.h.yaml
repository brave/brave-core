substitutions:
  - description: |-
      Configure features on a given `WKUserContentController`.

      The content worlds no longer look the controller up through the
      `BrowserState`, so the caller owning the configuration passes it in.
    regex:
      re_pattern:
        '// Configures `features` on `user_content_controller_` by adding user
        scripts\n(\s*)// and script message handlers\.\n(.*?)void
        ConfigureFeatures\(std::vector<JavaScriptFeature\*> features\);'
      re_flags: [DOTALL]
      replace: |-
        // Configures `features` on `user_content_controller` by adding user scripts
        \1// and script message handlers.
        \2void ConfigureFeatures(WKUserContentController* user_content_controller,
        \1                       std::vector<JavaScriptFeature*> features);
