substitutions:
  - description: |-
      Match the Python flags of Brave's Siso `python_bin`

      Siso's coverage rules are prefixed with `python_bin`, which Brave runs
      with `-S` rather than `-ES` so that GN actions read `PYTHONPATH`.
    regex:
      pattern: 'coverage_wrapper = "$python_path -ES ${_coverage_wrapper} "'
      replace: 'coverage_wrapper = "$python_path -S ${_coverage_wrapper} "'
