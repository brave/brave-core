substitutions:
  - description: |-
      Pick the rewrapper binary by host OS

      Cross-compiling for Windows from another host must still run that host's
      rewrapper.
    regex:
      re_pattern:
        '(rewrapper_path = "\$\{reclient_bin_dir\}/rewrapper"\n\s*)if \(is_win\)
        \{'
      replace: '\1if (host_os == "win") {'
