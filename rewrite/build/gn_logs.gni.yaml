substitutions:
  - description: Always output mac_sdk.gni logs on compiling from Mac host.

      This allows RBE-enabled win-arm64 compilation to work from mac-arm64 host.
    regex:
      pattern: if (target_os == "mac")
      replace: if (host_os == "mac")
