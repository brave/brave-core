substitutions:
  - description: |
      Unsafe buffers paths exclusions for Brave.

      The listed directories are vendored third-party code. Brave does not
      maintain them, so they cannot be converted to safe buffer usage and must
      be exempt from the unsafe-buffers checks that apply to the rest of the
      tree.

      The ffmpeg path is spelled through chromium_src on purpose. The generated
      ffmpeg wrappers include their sources through the chromium_src include
      directory, and the exclusions match a file by the path it was included
      with, so the plain third_party/ffmpeg path does not cover them.

    add_at_end_of_the_file:
      code: |-

        -brave/chromium_src/../../third_party/ffmpeg
        -brave/third_party/argon2/
        -brave/third_party/bip39wally-core-native/
        -brave/third_party/bitcoin-core/
        -brave/third_party/bspatch/
        -brave/third_party/ethash/
        -brave/vendor/bat-native-tweetnacl/
