substitutions:
  - description: |-
      Match the Python flags Brave's `script_executable` passes

      Brave's `//.gn` drops `-E` so that GN actions read `PYTHONPATH`, and the
      Siso rules built on this prefix must match those actions' commands.
    regex:
      pattern:
        '__python_bin = "../../third_party/cpython3/host/bin/python3 -ES"'
      replace: '__python_bin = "../../third_party/cpython3/host/bin/python3 -S"'
