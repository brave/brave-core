substitutions:
  - description: 'Load the Brave siso config after the upstream ones.'
    regex:
      re_pattern: '((?:^load\(.*\n)+)'
      re_flags: [MULTILINE]
      replace: |
        \1load("./brave_siso_config.star", "brave_siso_config")

  - description: |-
      Let the Brave siso config adjust the step config and handlers.

      It runs last in `init()`, once every upstream handler is registered.
    add_before_line:
      line: 'return module('
      code:
        '    brave_siso_config.configure(ctx, step_config, filegroups, handlers)'
