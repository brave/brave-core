substitutions:
  - description: |-
      Let Brave opt into large PDB pages

      Swaps the 8 KiB page size for 16 KiB wherever upstream picked 8 KiB,
      without restating upstream's condition for picking it.
    append_to_target:
      target: compiler
      type: config
      code: |-
        import("//brave/build/config/win/config.gni")
        if (brave_win_use_large_pdb &&
            filter_include(ldflags, [ "/pdbpagesize:8192" ]) != []) {
          ldflags -= [ "/pdbpagesize:8192" ]
          ldflags += [ "/pdbpagesize:16384" ]
        }
