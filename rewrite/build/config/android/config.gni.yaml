substitutions:
  - description: Make the Brave Android config available to Android builds.
    add_after_line:
      line:
        robolectric_toolchain =
        "//build/toolchain/android:robolectric_$host_cpu"
      code: |-

        if (is_android || is_robolectric) {
          import("//brave/build/android/config.gni")
        }
