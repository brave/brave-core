substitutions:
  - description: Add the Brave manifest includes to every jinja template.
    add_after_line:
      line: template("jinja_template") {
      code: |2-
            if (defined(invoker.includes)) {
              invoker.includes += brave_android_manifest_includes
            } else {
              invoker.includes = brave_android_manifest_includes
            }
