substitutions:
  - description: |
      Never pass --map-id-template to R8.

      Upstream added the flag in
      https://github.com/chromium/chromium/commit/278cce40eb2c6ee4c04ab40febb120e563186e7e
      to stamp a `pg_map_id` comment carrying the apk package name at the top
      of the .mapping file. Dropping the flag and its template argument omits
      that comment, so the package check on the mapping file does not apply.
      --source-file-template is left in place.
    regex:
      re_pattern: "\\s*'--map-id-template',\\n\\s*f'[^\\n]*',"
      replace: ''
