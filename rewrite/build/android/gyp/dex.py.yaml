substitutions:
  - description: 'Ignore d8/r8 warnings coming from Brave classes.'
    regex:
      re_pattern: '(DEFAULT_IGNORE_WARNINGS = \()'
      replace: |-
        \1
            r'.Brave',

  - description: |
      Never dex the WireGuard prebuilt as an intermediate.

      com_wireguard_android_java contains Java records, which d8 rejects when
      dexing with --intermediate. Upstream started passing that flag for all
      prebuilts in
      https://github.com/chromium/chromium/commit/556449588f050f9b6fc65f04a50967b27427e3e3,
      so the flag has to be dropped again for this one target.
    regex:
      re_pattern: '(def main\(args\):.*?options = _ParseArgs\(args\))'
      re_flags: [DOTALL]
      replace: |-
        \1
            options.intermediate = options.intermediate and not any(
                'com_wireguard_android_java' in c for c in options.class_inputs
            )
