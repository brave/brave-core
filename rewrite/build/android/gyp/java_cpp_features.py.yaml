substitutions:
  - description: |
      Support BASE_OVERRIDDEN_FEATURE() macro in cpp->java feature mapper.
    regex:
      pattern: |-
        r'BASE_FEATURE
      replace: |-
        r'(?:BASE_FEATURE|BASE_OVERRIDDEN_FEATURE)
