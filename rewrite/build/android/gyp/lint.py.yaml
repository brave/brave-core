substitutions:
  - description: |-
      Load the Brave chromium_src override before the script runs

      `inline_chromium_src_override` pulls in Brave's shadow of this file once
      upstream has defined its own symbols, and before `main()` runs.
    add_before_line:
      line: "if __name__ == '__main__':"
      code: |-
        from brave_chromium_utils import inline_chromium_src_override; inline_chromium_src_override(globals(), locals())
