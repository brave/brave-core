substitutions:
  - description: |
      Disable the UnnecessaryParentheses check.

      Java plasters short-circuit a method with `if ((true))`, mirroring the
      C++ plaster idiom, and this check rejects the doubled parentheses.
    regex:
      re_pattern: '(\nERRORPRONE_WARNINGS_TO_DISABLE = \[)'
      replace: |-
        \1
            'UnnecessaryParentheses',
