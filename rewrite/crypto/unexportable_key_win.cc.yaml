substitutions:
  - description: |
      Add `ECDSA_SHA384` fallthrough in `GetSrkHandleFor`.

      Treats ECDSA_SHA384 as kEcc for persistent Storage Root Key.
    regex:
      re_pattern: '(GetSrkHandleFor\([^)]*\)\s*\{.*?\n\s*switch[^{]*\{.*?)(\n\s*\})'
      re_flags: [DOTALL]
      replace: |-
        \1
            case SignatureVerifier::SignatureAlgorithm::ECDSA_SHA384:
              return WindowsSrkHandle::kEcc;\2

  - description: |
      Add `ECDSA_SHA384` fallthrough in `ToHashKind`.

      Treats ECDSA_SHA384 as hash::kSha384.
    regex:
      re_pattern: '(ToHashKind\([^)]*\)\s*\{.*?\n\s*switch[^{]*\{.*?)(\n\s*\})'
      re_flags: [DOTALL]
      replace: |-
        \1
            case SignatureVerifier::ECDSA_SHA384:
              return hash::kSha384;\2
