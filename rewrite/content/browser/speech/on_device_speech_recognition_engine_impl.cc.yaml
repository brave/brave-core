substitutions:
  - description: |
      Build no UI thread Core for sessions Brave serves itself

      BraveOnDeviceSpeechRecognitionEngine supplies the stream from Brave's own
      model, so it needs nothing the Core produces. Left to build, the Core asks
      the optimization guide broker for assets, which records the use case as
      recently used in local state, and that is one of the criteria the
      optimization guide weighs when deciding to register Chrome's on-device
      model for download.
    preempt_function_impl:
      function_name: OnDeviceSpeechRecognitionEngine::OnDeviceSpeechRecognitionEngine
      return_if: 'UsesBraveOnDeviceSpeech(config.quality)'
