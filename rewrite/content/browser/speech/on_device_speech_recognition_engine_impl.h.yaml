# `class CONTENT_EXPORT OnDeviceSpeechRecognitionEngine` cannot be parsed by
# tree-sitter with the export macro in place, so blank it out for AST matching.
blank_macros_for_ast_parsing: true

substitutions:
  - description: 'Let the Brave subclass reach private members.'
    add_friend:
      class_name: OnDeviceSpeechRecognitionEngine
      friend_type: class BraveOnDeviceSpeechRecognitionEngine
