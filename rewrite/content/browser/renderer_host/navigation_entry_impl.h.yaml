blank_macros_for_ast_parsing: true

substitutions:
  - description: Implement the storage partition key to restore an entry into.
    add_to_public:
      class_name: NavigationEntryImpl
      code: |-
        void SetStoragePartitionKeyToRestore(
            std::pair<std::string, std::string> storage_partition_key) override;
        base::optional_ref<const std::pair<std::string, std::string>>
        GetStoragePartitionKeyToRestore() override;

  - description: Hold the storage partition key to restore an entry into.
    add_to_protected:
      class_name: NavigationEntryImpl
      code: |-
        std::optional<std::pair<std::string, std::string>>
            storage_partition_key_to_restore_;
