substitutions:
  - description: |-
      Keep the opener for the Trezor popup in `GetSiteInstanceForNavigation`.

      Upstream swaps the BrowsingInstance on the first web navigation of a
      blank popup opened from a chrome-untrusted:// page, which severs
      `window.opener`. Trezor Connect relies on it.
    regex:
      re_pattern: |-
        \(!last_successful_url\.is_empty\(\) &&\s+!last_successful_url\.IsAboutBlank\(\)\)
      replace: |-
        BraveShouldUseLastSuccessfulUrl(render_frame_host_.get(),
                                              dest_url_info.url)
