blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Let a clipboard context sanitize URLs written via `WriteText`.

      Brave sanitizes copied URLs through the embedder, which needs the
      document's frame, and `ClipboardHostImpl` only reaches its frame through
      `Context`. Contexts without a frame don't sanitize.
    add_to_public:
      class_name: Context
      code: |-
        virtual std::optional<GURL> SanitizeURL(const GURL& url);
