substitutions:
  - description: |-
      Add hooks for Shields settings and the farbling level to reach shared
      worker requests. The farbling level is resolved from content settings on
      the browser because shared workers do not have renderer content setting
      rules.
    add_to_public:
      class_name: SharedWorkerContentSettingsProxyImpl
      code: |-
        void GetBraveShieldsSettings(
            GetBraveShieldsSettingsCallback callback) override;
        void GetBraveFarblingLevel(
            int32_t webcompat_settings_type,
            GetBraveFarblingLevelCallback callback) override;
