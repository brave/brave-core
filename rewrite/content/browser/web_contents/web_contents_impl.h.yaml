# This is necessary because of the use of `CONTENT_EXPORT` in the class
# declaration.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |
      Override `WebContents::GetShouldDoLearningForTesting()`.

      Brave's `ShouldDoLearning()` also depends on the Windows Recall state,
      which tests need to read back without relying on `ShouldDoLearning()`
      itself, since Windows Recall support is what's under test.
    add_to_public:
      class_name: WebContentsImpl
      code: 'bool GetShouldDoLearningForTesting() override;'
