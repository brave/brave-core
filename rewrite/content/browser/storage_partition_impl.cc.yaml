substitutions:
  - description: |-
      Allow Reporting API uploads based on kBraveReportingAPI, rather than the
      Background Sync permission, as part of disabling the Reporting API.

      kBraveReportingAPI is a flag available to re-enable the Chromium Reporting
      API.
    regex:
      re_pattern: '(StoragePartitionImpl::OnCanSendReportingReports\([^)]*\)\s*\{\s*CHECK\(initialized_[^;]*;\n).*?(?=\n\}\n)'
      replace: |-
        \1  std::move(callback).Run(
              base::FeatureList::IsEnabled(blink::features::kBraveReportingAPI)
                  ? origins
                  : std::vector<url::Origin>());
      re_flags: [DOTALL]
