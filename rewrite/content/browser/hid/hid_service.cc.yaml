substitutions:
  - description: |
      Let the delegate waive the transient activation check in
      `HidService::RequestDevice()`.

      The wallet's ledger subframe requests devices without a user gesture, so
      the browser-side activation check has to be skipped for it. The delegate
      check comes first to leave any activation the frame happens to have
      unconsumed.
    regex:
      re_pattern: '!FrameTreeNode::From\(render_frame_host_\)\s+->UpdateUserActivationState\(.+?UserActivationNotificationType::kNone\)'
      re_flags: [DOTALL]
      replace: |-
        (!delegate->AllowRequestDeviceWithoutTransientActivation(
                   render_frame_host_) &&
               \g<0>)
