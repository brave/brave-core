substitutions:
  - description: |-
      Fetch a WebUI service worker's script from its data source.

      The fetch is browser-initiated, so it reaches none of the
      ContentBrowserClient factory hooks that would otherwise supply a factory
      for the scheme, and it runs without a WebUIController, which is what would
      ordinarily have registered the data source it comes from.
    regex:
      re_pattern: '(loader_factory_bundle_for_update_check\(\)->Clone\(\);\n)'
      replace: |-
        \1
          MaybeAddUntrustedWebUIScriptFactory(browser_context(), scope,
                                              loader_factory_bundle_info.get());
