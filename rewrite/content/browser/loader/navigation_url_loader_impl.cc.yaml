substitutions:
  - description: |-
      Let a WebUI opt its navigations out of the interceptor-skipping shortcut.

      The shortcut returns before CreateInterceptors(), so a WebUI navigation
      reaches no interceptor and its document never gets a service worker
      client, which leaves a worker registered for the host unreachable - for
      the document's subresources as much as for the navigation itself. Hosts
      that have not opted in (see
      WebUIConfig::ShouldInterceptNavigationsWithServiceWorker()) keep taking
      it.
    regex:
      re_pattern: |-
        (contains\(URLDataManagerBackend::GetWebUISchemes\(\),\s+scheme\))(\) \{)
      replace: |-
        \1 &&
                !ShouldInterceptWebUINavigation(
                    browser_context_, request_info_->common_params->url)\2

  - description: |-
      Serve WebUI from the non-network navigation factories as well.

      Only the shortcut in Start() ever created a WebUI factory for a
      navigation, so a host that has left that shortcut, and whose service
      worker does not answer, would have nothing left to load it. This sits
      after the embedder's override, so a factory from the embedder still wins.
    regex:
      re_pattern: |-
        (return factory_from_client;\s+\})
      replace: |-
        \1

          if (mojo::PendingRemote<network::mojom::URLLoaderFactory> webui =
                  MaybeCreateWebUILoaderFactory(frame_tree_node, url)) {
            return webui;
          }
