substitutions:
  - description: |-
      Deny Background Fetch in Tor profiles.

      Off-the-record profiles download through InMemoryDownloadImpl, whose
      request carries no initiator, so the Origin header that
      BackgroundFetchDelegateProxy sets never reaches the check that hides a
      .onion page's address. Denying the permission makes
      backgroundFetch.fetch() reject before any request is made.
    preempt_function_impl:
      function_name: BackgroundFetchDelegateProxy::GetPermissionForOrigin
      code: |-
        if (auto* browser_context = GetBrowserContext();
            browser_context && browser_context->IsTor()) {
          std::move(callback).Run(BackgroundFetchPermission::BLOCKED);
          return;
        }
