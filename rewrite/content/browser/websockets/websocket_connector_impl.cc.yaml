substitutions:
  - description: |-
      Preserve renderer process and initiator origin for intercepted WebSockets.

      SharedWorker WebSockets have no RenderFrameHost, so embedders need this
      context to resolve the BrowserContext and per-site settings.
    regex:
      re_pattern:
        '(void
        WebSocketConnectorImpl::Connect\b.*?GetContentClient\(\)->browser\(\)->CreateWebSocket\([^;]*?)(\);)'
      re_flags: [DOTALL]
      replace: |-
        \1,
                frame_id_, origin_\2
