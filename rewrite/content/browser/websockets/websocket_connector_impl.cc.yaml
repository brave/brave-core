substitutions:
  - description: |-
      Preserve renderer process and initiator origin for intercepted WebSockets.

      SharedWorker and ServiceWorker WebSockets have no RenderFrameHost
      (crbug.com/40195467), so embedders need this context to resolve the
      BrowserContext and per-site settings. Drop this once upstream proxies
      frameless requests itself.
    regex:
      re_pattern:
        '(void
        WebSocketConnectorImpl::Connect\b.*?GetContentClient\(\)->browser\(\)->)CreateWebSocket(\([^;]*?)(\);)'
      re_flags: [DOTALL]
      replace: |-
        \1CreateWebSocketWithFrameId\2,
                frame_id_.child_id.value(), origin_\3

  - description: |-
      May send an opaque Origin for cross-origin WebSockets.

      For example for a .onion page must not disclose the address it came from.
      WebSockets do not go through CorsURLLoader, so the origin handed to the
      network service is made opaque here instead.
    regex:
      re_pattern: '(base::BindOnce\(\s*ConnectCalledByContentBrowserClient,.*?)\borigin_,'
      re_flags: [DOTALL]
      replace: '\1MaybeTreatCrossOriginAsOpaque(origin_, url),'
