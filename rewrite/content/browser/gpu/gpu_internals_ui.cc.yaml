blank_string_adjacent_macros_for_ast_parsing: true

substitutions:
  - description: |
      Report the GPU process executable path in about:gpu on Windows.

      GpuProcessHost only tracks the executable path on Windows (see
      gpu_process_host.h.yaml), so this is a no-op elsewhere.
    after_function_impl:
      function_name: GpuMessageHandler::GetClientInfo
      result_var: dict
      code: |-
        #if BUILDFLAG(IS_WIN)
        if (auto* host = GpuProcessHost::Get()) {
          dict.Set("executable_path", host->executable_path());
        }
        #endif  // BUILDFLAG(IS_WIN)
        return dict;
