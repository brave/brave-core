blank_macros_for_ast_parsing: true

substitutions:
  - description: |
      Track the GPU process executable path on Windows.

      Lets about:gpu report which executable actually launched the GPU
      process (see gpu_internals_ui.cc.yaml).
    add_to_protected:
      class_name: GpuProcessHost
      code: |-
        #if BUILDFLAG(IS_WIN)
        void DidGetExecutablePath(const std::string& path) override;
        std::string executable_path_;
        #endif  // BUILDFLAG(IS_WIN)

  - description: 'Expose the GPU process executable path.'
    add_to_public:
      class_name: GpuProcessHost
      code: |-
        #if BUILDFLAG(IS_WIN)
        const std::string& executable_path() const { return executable_path_; }
        #endif  // BUILDFLAG(IS_WIN)
