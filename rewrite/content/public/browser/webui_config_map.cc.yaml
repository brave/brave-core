substitutions:
  - description: |
      Retry the config lookup against the parent host, so a WebUIConfig that
      opts in via ShouldHandleSubdomains() also serves the single-label
      subdomains of its host as distinct origins. FindConfigForSubdomain() is
      defined in the chromium_src override.
    regex:
      re_pattern:
        '(auto origin_and_config =
        configs_map_\.find\(url::Origin::Create\(url\)\);)'
      replace: |-
        \1
          if (origin_and_config == configs_map_.end()) {
            origin_and_config = FindConfigForSubdomain(configs_map_, url);
          }
