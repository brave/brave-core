# WebUIConfig's class head carries CONTENT_EXPORT.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Let a WebUI ask for its navigations to reach the loader interceptors.

      WebUI navigations take a shortcut in NavigationURLLoaderImpl::Start()
      that returns before any interceptor is consulted, so a service worker
      registered for a WebUI host can never serve one, for subresources as much
      as for the navigation itself. A host that serves its own content from a
      worker overrides this to leave that shortcut.
    add_to_public:
      class_name: WebUIConfig
      code: 'virtual bool ShouldInterceptNavigationsWithServiceWorker();'

  - description: |
      Declare `WebUIConfig::ShouldHandleSubdomains()`.

      Brave gains the capability to serve some chrome-untrusted:// WebUIs from
      subdomains of their regular single-label domains, so that each instance
      gets its own origin (e.g. chrome-untrusted://<id>.leo-workspace).
      `WebUIConfigMap::GetConfig()` asks the config registered for the nearest
      registered ancestor host whether it handles its own subdomains, so the
      opt-in stays with the config instead of living in a separate registry. An
      opted-in config is handed subdomains at any depth and validates them
      itself in `ShouldHandleURL()`. Defaults to false, and is only honored for
      chrome-untrusted:// configs.
    add_to_public:
      class_name: WebUIConfig
      code: 'virtual bool ShouldHandleSubdomains() const;'
