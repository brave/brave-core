substitutions:
  - description: |-
      Append optional process and initiator context to WebSocket interception.

      SharedWorker and ServiceWorker WebSockets have no RenderFrameHost
      (crbug.com/40195467), so embedders need the renderer process ID and
      initiator origin as separate inputs. Drop this once upstream proxies
      frameless requests itself.
    regex:
      re_pattern: '(\bvirtual void CreateWebSocket\([^;]*?)(\);)'
      re_flags: [DOTALL]
      replace: |-
        \1,
              std::optional<int> process_id = std::nullopt,
              std::optional<url::Origin> initiator_origin = std::nullopt\2
