substitutions:
  - description: "Copy Brave's `requesting_origin` in the copy constructor."
    regex:
      re_pattern: '(\n  user_gesture = other\.user_gesture;\n)'
      replace: |
        \1  requesting_origin = other.requesting_origin;

  - description: "Compare Brave's `requesting_origin` in `operator==`."
    regex:
      re_pattern: '(return user_gesture == other\.user_gesture &&)'
      replace: |-
        \1
                 requesting_origin == other.requesting_origin &&
