substitutions:
  - description: 'Ship kDigitalGoodsApi disabled.'
    set_feature_flag_default_state:
      feature_name: kDigitalGoodsApi
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kEmailVerificationProtocol disabled.'
    set_feature_flag_default_state:
      feature_name: kEmailVerificationProtocol
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kFedCm disabled.'
    set_feature_flag_default_state:
      feature_name: kFedCm
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kPrefetchProxy disabled.'
    set_feature_flag_default_state:
      feature_name: kPrefetchProxy
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kPrivacySandboxAdsAPIsOverride disabled.'
    set_feature_flag_default_state:
      feature_name: kPrivacySandboxAdsAPIsOverride
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Ship kPwaNavigationCapturing disabled on Windows, Mac and Linux.

      Upstream ships this enabled on every platform, and Brave only
      overrides the desktop default, so set_feature_flag_default_state
      (which would pin one value everywhere) cannot be used here.
    regex:
      pattern:
        'BASE_FEATURE(kPwaNavigationCapturing,
        base::FEATURE_ENABLED_BY_DEFAULT);'
      replace: |-
        #if BUILDFLAG(IS_WIN) || BUILDFLAG(IS_MAC) || BUILDFLAG(IS_LINUX)
        BASE_FEATURE(kPwaNavigationCapturing, base::FEATURE_DISABLED_BY_DEFAULT);
        #else
        BASE_FEATURE(kPwaNavigationCapturing, base::FEATURE_ENABLED_BY_DEFAULT);
        #endif

  - description: 'Ship kServiceWorkerAutoPreload disabled.'
    set_feature_flag_default_state:
      feature_name: kServiceWorkerAutoPreload
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kWebIdentityDigitalCredentials disabled.'
    set_feature_flag_default_state:
      feature_name: kWebIdentityDigitalCredentials
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kWebIdentityDigitalCredentialsCreation disabled.'
    set_feature_flag_default_state:
      feature_name: kWebIdentityDigitalCredentialsCreation
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kWebOTP disabled.'
    set_feature_flag_default_state:
      feature_name: kWebOTP
      value: base::FEATURE_DISABLED_BY_DEFAULT
