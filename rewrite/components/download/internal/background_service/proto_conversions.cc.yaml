substitutions:
  - description: 'Convert CUSTOM_LIST_SUBSCRIPTIONS to its proto value.'
    regex:
      re_pattern: '(DownloadClientToProto\([^)]*\)\s*\{\s*switch\s*\([^)]*\)\s*\{)'
      replace: |-
        \1
            case DownloadClient::CUSTOM_LIST_SUBSCRIPTIONS:
              return protodb::DownloadClient::CUSTOM_LIST_SUBSCRIPTIONS;

  - description: 'Convert CUSTOM_LIST_SUBSCRIPTIONS back from its proto value.'
    regex:
      re_pattern: '(DownloadClientFromProto\([^)]*\)\s*\{\s*switch\s*\([^)]*\)\s*\{)'
      replace: |-
        \1
            case protodb::DownloadClient::CUSTOM_LIST_SUBSCRIPTIONS:
              return DownloadClient::CUSTOM_LIST_SUBSCRIPTIONS;
