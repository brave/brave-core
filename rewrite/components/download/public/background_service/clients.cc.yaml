substitutions:
  - description: 'Give CUSTOM_LIST_SUBSCRIPTIONS a display string.'
    regex:
      re_pattern: '(BackgroundDownloadClientToString\([^)]*\)\s*\{\s*switch\s*\([^)]*\)\s*\{)'
      replace: |-
        \1
            case DownloadClient::CUSTOM_LIST_SUBSCRIPTIONS:
              return "CustomListSubscriptions";
