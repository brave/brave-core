substitutions:
  - description: |
      Let AllSiteSettings supply its bottom inset view.

      Use the Brave base class for both embedded and standalone Settings so
      Storage and Zoom footer buttons stay above system navigation.
    regex:
      re_pattern: '(class AllSiteSettings extends )BaseSiteSettingsFragment\b'
      replace: '\1BraveAllSiteSettings'
