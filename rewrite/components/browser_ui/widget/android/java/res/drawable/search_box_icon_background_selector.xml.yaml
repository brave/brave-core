substitutions:
  - description: |-
      Make the search box icon's pressed/hovered/focused highlight circular.

      The QR code and mic buttons sit in a square icon slot, so a rectangular
      highlight reads as a rounded square next to the circular highlights used
      elsewhere in the location bar (e.g. the edit-url suggestion actions).
    count: 3
    regex:
      pattern: 'android:shape="rectangle"'
      replace: 'android:shape="oval"'
