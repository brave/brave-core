substitutions:
  - description: |-
      Round the frequent sites tile highlight to match the Figma spec.

      8dp barely rounds a ~80dp tile, so the hovered/focused highlight reads
      as a plain square. Leo's radius-l (12dp) is the corner radius specified
      for this tile in the design system.
    count: 3
    regex:
      pattern: 'android:radius="8dp"'
      replace: 'android:radius="12dp"'
