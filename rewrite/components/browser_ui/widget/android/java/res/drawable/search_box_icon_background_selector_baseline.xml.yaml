substitutions:
  - description: |-
      Make the search box icon's pressed/hovered/focused highlight circular.

      Baseline-theme counterpart of search_box_icon_background_selector.xml;
      keep both in sync so the QR code and mic buttons match the circular
      highlight used elsewhere in the location bar.
    count: 5
    regex:
      pattern: 'android:shape="rectangle"'
      replace: 'android:shape="oval"'
