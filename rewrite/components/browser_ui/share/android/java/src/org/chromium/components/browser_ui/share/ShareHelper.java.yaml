substitutions:
  - description: |-
      Import the tracker used below.
    regex:
      re_pattern: |-
        import org\.chromium\.base\.ContextUtils;
      replace: |-
        import org.chromium.base.BraveExternalActivityLaunchTracker;
        import org.chromium.base.ContextUtils;
  - description: |-
      Record that we're firing a share intent with no result callback
      (the only share path that bypasses WindowAndroid.showIntent, so it
      isn't already covered by the equivalent patch on
      ActivityIntentRequestTrackerDelegate), so BraveBrowserLockManager
      can tell a quick round trip through the share sheet apart from a
      real backgrounding.
    regex:
      re_pattern: |-
        ( +)activity\.startActivity\(intent\);
      replace: |-
        \1BraveExternalActivityLaunchTracker.notifyLaunchingExternalActivity();
        \1activity.startActivity(intent);
