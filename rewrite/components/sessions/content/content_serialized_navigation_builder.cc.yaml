# Each substitution anchors on the target function's qualified name, scans
# through its body with DOTALL, and inserts a call on the line just above the
# function's closing `return ...;`. Leading whitespace before `return` and any
# trailing content between `return` and the function's closing `}` are
# captured loosely, so reformatting of the surrounding lines does not break
# the match.

substitutions:
  - description:
      'Let Brave adjust the NavigationEntry restored from a
      SerializedNavigationEntry'
    regex:
      re_pattern:
        '(ContentSerializedNavigationBuilder::ToNavigationEntry\b.*?\n)([
        \t]*return entry;.*?\})'
      re_flags: [DOTALL]
      replace: |-
        \1  BraveRestoreNavigationEntry(navigation, entry.get());
        \2

  - description:
      'Let Brave adjust the SerializedNavigationEntry built from a
      NavigationEntry'
    regex:
      re_pattern:
        '(ContentSerializedNavigationBuilder::FromNavigationEntry\b.*?\n)([
        \t]*return navigation;.*?\})'
      re_flags: [DOTALL]
      replace: |-
        \1  BraveSerializeNavigationEntry(entry, &navigation);
        \2
