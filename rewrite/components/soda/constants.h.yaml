substitutions:
  - description: |-
      Add codes for the locales that Brave's on-device models serve and SODA
      has no code for.

      `SodaInstaller` keys installed languages and install replies on
      `LanguageCode`, so each locale needs its own code for `install()` to
      record it and settle it on its own. Nothing persists these values, and
      Brave reports no UMA.
    add_enum_entries:
      enum_name: LanguageCode
      max_value: kMaxValue
      entries:
        - kAr
        - kPtPt
        - kUkUa
