substitutions:
  - description: |
      Feed the Brave Leo icon overrides to the aggregate_vector_icons action.

      The template declares its target through `target_name`, so the action
      is named by what declares it rather than by a literal name.
    add_literal_to_list:
      target: target_name
      type: action
      list_name: inputs
      literal: '["//brave/components/vector_icons/leo_overrides.json"]'
