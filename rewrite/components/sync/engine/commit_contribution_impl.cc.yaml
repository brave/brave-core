substitutions:
  - description: |-
      Report any entity about to be committed with unencrypted specifics.

      Brave's sync chain is always in encrypt-everything mode, so an upstream
      type whose EncryptionPolicy is kNeverEncrypted commits plain text
      silently. Every outgoing entity is assembled here, right where upstream
      keeps its own fail-closed checks on password data, so checking here
      covers types added upstream in the future.
    regex:
      re_pattern: |-
        (\s+)(AdjustCommitProto\(sync_entity\);)
      replace: |-
        \1\2\1CheckCommitEntityEncryption(type_, passphrase_type_, *sync_entity);
