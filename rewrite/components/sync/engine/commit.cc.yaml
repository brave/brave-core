substitutions:
  - description: |-
      Report any entity about to be committed with unencrypted specifics.

      Brave's sync chain is always in encrypt-everything mode, so an upstream
      type whose EncryptionPolicy is kNeverEncrypted commits plain text
      silently. This is the single point every outgoing commit passes through,
      so checking here covers types added upstream in the future.
    preempt_function_impl:
      function_name: Commit::PostAndProcessResponse
      code: |-
        CheckCommitEntitiesEncryption(message_.commit());
