substitutions:
  - description: Add the Brave sync driver sources.
    add_literal_to_list:
      target: service
      list_name: sources
      literal: brave_components_sync_driver_sources
      import: //brave/components/sync/service/sources.gni

  - description: Add the Brave sync driver deps.
    add_literal_to_list:
      target: service
      list_name: deps
      literal: brave_components_sync_driver_deps
      import: //brave/components/sync/service/sources.gni
