substitutions:
  - description: |-
      Ship kSyncAutofillValuableMetadata disabled.

      Doing a manual replacement because `DEFINE_SYNC_AUTOFILL_AI_FEATURE` can
      expand in different ways depending on the build flags.
    regex:
      pattern: 'DEFINE_SYNC_AUTOFILL_AI_FEATURE(kSyncAutofillValuableMetadata);'
      replace:
        'BASE_OVERRIDDEN_FEATURE(kSyncAutofillValuableMetadata,
        base::FEATURE_DISABLED_BY_DEFAULT);'

  - description: |-
      Ship kSyncAutofillEntitySuppression disabled.

      Upstream enables it in the US, where Brave derives the variations country
      from the locale. It registers AUTOFILL_ENTITY_SUPPRESSION, which is an
      always-preferred sync type that Brave does not use.
    regex:
      re_pattern: 'BASE_FEATURE_WITH_COUNTRY_RESTRICTIONS\(kSyncAutofillEntitySuppression,\s*base::FEATURE_ENABLED_FOR_COUNTRIES,\s*"us"\);'
      replace:
        'BASE_OVERRIDDEN_FEATURE(kSyncAutofillEntitySuppression,
        base::FEATURE_DISABLED_BY_DEFAULT);'
