substitutions:
  - description: |
      Add BraveShouldShowPermission to the base PageInfoDelegate interface.

      Brave needs BraveShouldShowPermission on the base PageInfoDelegate
      interface so components/page_info/page_info.cc can call it polymorphically
      for Brave-specific permission checks.
    add_to_public:
      class_name: PageInfoDelegate
      code: |
        virtual bool BraveShouldShowPermission(ContentSettingsType type) = 0;
