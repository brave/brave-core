substitutions:
  - description: |
      Add BraveShouldShowPermission to the base PageInfoDelegate interface.

      Brave needs BraveShouldShowPermission on the base PageInfoDelegate
      interface so components/page_info/page_info.cc (already plaster-converted
      separately) can call it polymorphically; the declaration used to be
      spliced in via a #define IsContentDisplayedInVrHeadset token-hijack in
      the now-deleted chromium_src/components/page_info/page_info_delegate.h
      shadow.
    add_to_public:
      class_name: PageInfoDelegate
      code: |
        virtual bool BraveShouldShowPermission(ContentSettingsType type) = 0;
