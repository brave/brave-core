substitutions:
  - description: |
      Pass the content settings type to `CanBypassEmbeddingOriginCheck`

      Brave Wallet permissions bypass the embedding origin check, and the
      origins alone do not tell which permission is being checked.
    regex:
      pattern: 'CanBypassEmbeddingOriginCheck('
      replace: 'CanBypassEmbeddingOriginCheck(ContentSettingsType type,'
