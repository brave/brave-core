substitutions:
  - description: |
      Rename PermissionContextBase to PermissionContextBase_ChromiumImpl.
    rename_class:
      class_name: PermissionContextBase
      rename: PermissionContextBase_ChromiumImpl

  - description: |
      Pass the content settings type to `CanBypassEmbeddingOriginCheck`, so
      Brave Wallet permissions can bypass the check.
    regex:
      pattern: 'CanBypassEmbeddingOriginCheck('
      replace: 'CanBypassEmbeddingOriginCheck(content_settings_type_,'

    count: 2
