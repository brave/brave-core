substitutions:
  - description: |
      Override `CanBypassEmbeddingOriginCheck` with the content settings type
      parameter Brave adds to it.
    regex:
      pattern: 'bool CanBypassEmbeddingOriginCheck('
      replace: 'bool CanBypassEmbeddingOriginCheck(ContentSettingsType type, '
