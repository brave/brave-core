substitutions:
  - description: Build the common permissions code as a component.
    regex:
      pattern: source_set("permissions_common") {
      replace: component("permissions_common") {

  - description: Add the Brave permissions sources.
    add_literal_to_list:
      target: permissions
      list_name: sources
      literal: brave_components_permissions_sources
      import: //brave/components/permissions/sources.gni

  - description: Add the Brave permissions deps.
    add_literal_to_list:
      target: permissions
      list_name: deps
      literal: brave_components_permissions_deps
      import: //brave/components/permissions/sources.gni
