substitutions:
  - description: |-
      Request for the description's `requesting_origin`, when it names one.

      Brave Wallet requests account permissions for a per-account origin
      derived from the requesting frame's, so the prompt and the stored grant
      are keyed on that origin rather than the frame's.
    regex:
      re_pattern:
        '(const GURL requesting_origin
        =\s*)(render_frame_host->GetLastCommittedOrigin\(\)\.GetURL\(\));'
      replace: |-
        \1request_description.requesting_origin.is_empty()
                  ? \2
                  : request_description.requesting_origin;
