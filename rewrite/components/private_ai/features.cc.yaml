substitutions:
  - description: |-
      Ship kPrivateAi disabled outside of Android.

      Upstream ships this enabled on every platform. Brave only overrides
      the non-Android default, so set_feature_flag_default_state (which
      would pin one value everywhere) cannot be used here.
    regex:
      pattern: 'BASE_FEATURE(kPrivateAi, base::FEATURE_ENABLED_BY_DEFAULT);'
      replace: |-
        #if BUILDFLAG(IS_ANDROID)
        BASE_FEATURE(kPrivateAi, base::FEATURE_ENABLED_BY_DEFAULT);
        #else
        BASE_FEATURE(kPrivateAi, base::FEATURE_DISABLED_BY_DEFAULT);
        #endif
