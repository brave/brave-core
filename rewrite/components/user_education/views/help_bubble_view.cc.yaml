substitutions:
  - description: |
      Stop MdTextButton::UpdateTextColor() from overwriting the help bubble
      button's text color.

      MdIPHBubbleButton sets its text color in the constructor, but
      MdTextButton::UpdateTextColor() overwrites it afterwards. Overriding it
      with an empty body prevents that.
    add_to_public:
      class_name: MdIPHBubbleButton
      code: 'void UpdateTextColor() override {}'
