substitutions:
  - description: |-
      Handle TREE_NODE in FakeTabInterface::UpdateProperties().

      Like in TabModel::UpdateProperties(), a tree-tab node carries no
      pinned/group/split state of its own. TREE_NODE only exists outside
      Android, while this test support also builds on Android.
    regex:
      re_pattern:
        '(void FakeTabInterface::UpdateProperties\(\)\s*\{.*?switch
        \(ancestor->type\(\)\)\s*\{)'
      re_flags: [DOTALL]
      replace: |-
        \1
        #if !BUILDFLAG(IS_ANDROID)
              case TabCollection::Type::TREE_NODE:
                break;
        #endif  // !BUILDFLAG(IS_ANDROID)
