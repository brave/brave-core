substitutions:
  - description: Add the Brave history sources.
    add_literal_to_list:
      target: browser
      list_name: sources
      literal: brave_components_history_core_browser_sources
      import: //brave/components/history/core/browser/sources.gni

  - description: Add the Brave history deps.
    add_literal_to_list:
      target: browser
      list_name: deps
      literal: brave_components_history_core_browser_deps
      import: //brave/components/history/core/browser/sources.gni
