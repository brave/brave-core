substitutions:
  - description: |-
      Ship kSiteTokenProviderEnabled disabled.

      Feeds a per-domain, OAuth-authenticated token tied to the signed-in
      Google account to any origin that requests it via
      chrome-experimental-site-token-provider.
    set_feature_flag_default_state:
      feature_name: kSiteTokenProviderEnabled
      value: base::FEATURE_DISABLED_BY_DEFAULT
