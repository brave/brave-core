substitutions:
  - description: Add the Brave content settings renderer sources.
    add_literal_to_list:
      target: renderer
      list_name: sources
      literal: brave_components_content_settings_renderer_sources
      import: //brave/components/content_settings/renderer/sources.gni

  - description: Add the Brave content settings renderer deps.
    add_literal_to_list:
      target: renderer
      list_name: deps
      literal: brave_components_content_settings_renderer_deps
      import: //brave/components/content_settings/renderer/sources.gni
