                {ContentSettingsType::BRAVE_WEBCOMPAT_USER_AGENT, GetBraveHistogramValue(64)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_WEBGL, GetBraveHistogramValue(65)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_WEBGL2, GetBraveHistogramValue(66)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_WEBGPU, GetBraveHistogramValue(67)},
