substitutions:
  - description: |-
      Append Brave-specific entries to `kContentSettingsTypeToHistogramValue`
    regex:
      re_pattern:
        '(base::MakeFixedFlatMap<ContentSettingsType, int>\(\{.+?)(\s*\}\);)'
      re_flags: [DOTALL]
      replace: |-
        \1
                {ContentSettingsType::BRAVE_ADS, GetBraveHistogramValue(0)},
                {ContentSettingsType::BRAVE_COSMETIC_FILTERING, GetBraveHistogramValue(1)},
                {ContentSettingsType::BRAVE_TRACKERS, GetBraveHistogramValue(2)},
                {ContentSettingsType::BRAVE_HTTP_UPGRADABLE_RESOURCES, GetBraveHistogramValue(3)},
                {ContentSettingsType::BRAVE_FINGERPRINTING_V2, GetBraveHistogramValue(4)},
                {ContentSettingsType::BRAVE_SHIELDS, GetBraveHistogramValue(5)},
                {ContentSettingsType::BRAVE_REFERRERS, GetBraveHistogramValue(6)},
                {ContentSettingsType::BRAVE_COOKIES, GetBraveHistogramValue(7)},
                {ContentSettingsType::BRAVE_SPEEDREADER, GetBraveHistogramValue(8)},
                {ContentSettingsType::BRAVE_ETHEREUM, GetBraveHistogramValue(9)},
                {ContentSettingsType::BRAVE_SOLANA, GetBraveHistogramValue(10)},
                {ContentSettingsType::BRAVE_GOOGLE_SIGN_IN, GetBraveHistogramValue(11)},
                {ContentSettingsType::BRAVE_HTTPS_UPGRADE, GetBraveHistogramValue(12)},
                {ContentSettingsType::BRAVE_REMEMBER_1P_STORAGE, GetBraveHistogramValue(13)},
                {ContentSettingsType::BRAVE_OPEN_AI_CHAT, GetBraveHistogramValue(15)},
                {ContentSettingsType::BRAVE_AUTO_SHRED, GetBraveHistogramValue(16)},
                // Begin webcompat items
                {ContentSettingsType::BRAVE_WEBCOMPAT_NONE, GetBraveHistogramValue(50)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_AUDIO, GetBraveHistogramValue(51)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_CANVAS, GetBraveHistogramValue(52)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_DEVICE_MEMORY, GetBraveHistogramValue(53)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_EVENT_SOURCE_POOL,
                 GetBraveHistogramValue(54)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_FONT, GetBraveHistogramValue(55)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_HARDWARE_CONCURRENCY,
                 GetBraveHistogramValue(56)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_KEYBOARD, GetBraveHistogramValue(57)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_LANGUAGE, GetBraveHistogramValue(58)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_MEDIA_DEVICES, GetBraveHistogramValue(59)},
                {ContentSettingsType::BRAVE_WEBCOMPAT_PLUGINS, GetBraveHistogramValue(60)},
