substitutions:
  - description: |-
      Register the JavaScript content setting on iOS.

      Brave Shields settings read and write it on iOS too, where upstream only
      registers it for Blink builds.
    regex:
      re_pattern: '(Register\(ContentSettingsType::JAVASCRIPT,.*?WebsiteSettingsRegistry::PLATFORM_ANDROID)'
      re_flags: [DOTALL]
      replace: |-
        \1
                       | WebsiteSettingsRegistry::PLATFORM_IOS

  - description: "Register Brave content settings after upstream's."
    regex:
      re_pattern: '(void ContentSettingsRegistry::Init\(\) \{.*?)(\n\}\n)'
      re_flags: [DOTALL]
      replace: |-
        \1
          BraveInit();\2
