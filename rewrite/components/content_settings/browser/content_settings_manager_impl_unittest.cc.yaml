substitutions:
  - description: |-
      Implement Brave's GetBraveShieldsSettings() in the test delegate.

      Brave adds it to ContentSettingsManagerImpl::Delegate as a pure virtual,
      so the delegate couldn't be instantiated without it.
    add_to_public:
      class_name: NoCookieSettingsDelegate
      code: |-
        void GetBraveShieldsSettings(
            const content::GlobalRenderFrameHostToken& frame_token,
            mojom::ContentSettingsManager::GetBraveShieldsSettingsCallback
                callback) override {
          std::move(callback).Run(brave_shields::mojom::ShieldsSettings::New());
        }
