substitutions:
  - description: |-
      Force the cookie controls icon to stay hidden.

      Brave blocks third-party cookies via Shields, so the upstream cookie
      controls page action is redundant. GetCookieControlsIconState is the
      single place that computes the icon's visibility, reached from both
      Update() and UpdateCookieControlsIcon(), so overriding it here covers
      both callers (and any added later) without patching each call site.
    preempt_function_impl:
      function_name: CookieControlsController::GetCookieControlsIconState
      code: |-
        if ((true)) return CookieControlsState::kHidden;
