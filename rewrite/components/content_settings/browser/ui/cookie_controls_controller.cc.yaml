substitutions:
  - description: |-
      Force the cookie controls icon to stay hidden, in Update.

      Brave blocks third-party cookies via Shields, so the upstream cookie
      controls page action is redundant. GetCookieControlsIconState has no
      side effects, so skipping it is safe. `status` stays in use here for
      the OnStatusChanged call just below. Anchored on the
      `Update(content::WebContents*, const GURL&)` overload (rather than
      `UpdateCookieControlsIcon`, below), which is what makes this
      substitution unique to Update even though both functions now call the
      same argument-less `GetStatus()`.
    regex:
      re_pattern: |-
        (::Update\(content::WebContents\* web_contents,\s*const GURL& site_url\) \{.*?)auto status = GetStatus\(\);\n(\s+)const CookieControlsState icon_state =\n\s+GetCookieControlsIconState\(status\.controls_state\);
      re_flags: [DOTALL]
      replace: |-
        \1auto status = GetStatus();
        \2const CookieControlsState icon_state = CookieControlsState::kHidden;

  - description: |-
      Force the cookie controls icon to stay hidden, in
      UpdateCookieControlsIcon.

      Same reasoning as the Update() substitution above, but `status` has no
      other use in this function once GetCookieControlsIconState's call is
      dropped, so the now-unused `auto status = GetStatus(...)` line goes
      with it to avoid an unused-variable build error.
    regex:
      re_pattern: |-
        (::UpdateCookieControlsIcon\(\) \{.*?)auto status = GetStatus\(\);\n\s+const CookieControlsState icon_state =\n\s+GetCookieControlsIconState\(status\.controls_state\);
      re_flags: [DOTALL]
      replace:
        '\1const CookieControlsState icon_state = CookieControlsState::kHidden;'
