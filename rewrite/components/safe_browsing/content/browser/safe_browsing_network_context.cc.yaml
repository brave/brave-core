substitutions:
  - description: |-
      Pass Safe Browsing requests through Brave's system request handler

      The forwarded request gets the handler's changes before it reaches the
      network service, as every other system request does.
    regex:
      re_pattern:
        '(GetURLLoaderFactory\(\)->CreateLoaderAndStart\(\s*std::move\(loader\),
        request_id, options, )request,'
      re_flags: [DOTALL]
      replace: '\1BRAVE_CREATE_LOADER_AND_START,'
