substitutions:
  - description: |-
      Build Brave's Safe Browsing interstitial UI.

      `BraveSafeBrowsingLoudErrorUI`, in the `chromium_src` override, opens
      Brave's help centre article instead of Google's.
    regex:
      pattern: 'std::make_unique<SafeBrowsingLoudErrorUI>('
      replace: 'std::make_unique<security_interstitials::BraveSafeBrowsingLoudErrorUI>('
