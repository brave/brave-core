substitutions:
  - description: |-
      Stub off the network fetcher's StartRequest.

      The callback must actually run: AffiliationFetcherManager keeps this
      fetcher alive in its `fetchers_` vector until the callback fires and
      erases it. Discarding the callback without running it leaks the fetcher
      for as long as the manager is alive.

      `result_callback_` is assigned so that `~HashAffiliationFetcher()` can run
      it before going out of scope, but the callback should normally be run
      asynchronously via CompleteStubbedRequest().
    preempt_function_impl:
      function_name: HashAffiliationFetcher::StartRequest
      code: |-
        result_callback_ = std::move(result_callback);
        base::SequencedTaskRunner::GetCurrentDefault()->PostTask(
            FROM_HERE,
            base::BindOnce(&HashAffiliationFetcher::CompleteStubbedRequest,
                           weak_ptr_factory_.GetWeakPtr()));
        return;
