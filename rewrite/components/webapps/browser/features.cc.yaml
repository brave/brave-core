substitutions:
  - description: |-
      Ship kWebAppsEnableMLModelForPromotion disabled on every platform.

      Doing a manual replacement as the existing macro is chopped by buildflags
      macros.
    regex:
      re_pattern:
        'BASE_FEATURE\(kWebAppsEnableMLModelForPromotion,\s*#if
        BUILDFLAG\(IS_ANDROID\)\s*base::FEATURE_ENABLED_BY_DEFAULT\);\s*#else\s*base::FEATURE_DISABLED_BY_DEFAULT\);\s*#endif[^\S\n]*(?://[^\n]*)?'
      replace: |-
        BASE_FEATURE(kWebAppsEnableMLModelForPromotion,
                     base::FEATURE_DISABLED_BY_DEFAULT);
