# These IPH features are only declared upstream on Win/Apple/Linux (and a few
# other platforms Brave never builds for, e.g. ChromeOS/Fuchsia), so patching
# their BASE_FEATURE call directly inherits that same guard without needing to
# repeat it here.

substitutions:
  - description: 'Ship kIPHAutofillAccountNameEmailSuggestionFeature disabled.'
    set_feature_flag_default_state:
      feature_name: kIPHAutofillAccountNameEmailSuggestionFeature
      value: base::FEATURE_DISABLED_BY_DEFAULT

