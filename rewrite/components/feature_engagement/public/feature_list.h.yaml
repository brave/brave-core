substitutions:
  - description: |-
      Define Brave's IPH variation params.

      `DEFINE_VARIATION_PARAM` is undefined at the end of the header, so
      Brave's params are defined in place, ahead of the demo-mode choices
      that list them.
    regex:
      re_pattern:
        '^((?://[^\n]*\n)*inline constexpr
        flags_ui::FeatureEntry::FeatureVariation\s+kIPHDemoModeChoiceVariations\[\])'
      re_flags: [MULTILINE]
      replace: |-
        BRAVE_FEATURE_ENGAGEMENT_VARIATION_PARAMS

        \1

  - description: |-
      List Brave's IPH features among the demo-mode choices.

      This makes them selectable on their own in the flags page.
    regex:
      re_pattern:
        '(kIPHDemoModeChoiceVariations\[\] = \{\s*// clang-format off\n)'
      replace: |
        \1        BRAVE_FEATURE_ENGAGEMENT_VARIATION_ENTRIES
