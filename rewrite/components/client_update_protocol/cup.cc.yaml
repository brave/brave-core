substitutions:
  - description: |-
      Comment out the CHECK requiring the CUP key to be ML-DSA-44.

      Our CUP key is still ECDSA (see request_sender.cc's BuildSigner()), but
      upstream now requires the CUP public key to be ML-DSA-44. Kept as a
      comment, rather than removed, so the guard stays visible. Revert once we
      rotate to an ML-DSA-44 key of our own.
    regex:
      pattern: 'CHECK(public_key->IsMldsa44());'
      replace: '// CHECK(public_key->IsMldsa44());'
