substitutions:
  - description: |-
      Build the password reuse and weak check utilities on Android too

      Brave uses them on every platform, so their `!is_android` guard goes.
    regex:
      re_pattern:
        'if \(!is_android\) \{(\n\s+sources \+=
        \[\n\s+"reuse_check_utility\.cc",)'
      replace: 'if (true) {\1'
