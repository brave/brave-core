substitutions:
  - description: |-
      Handle kDeviceManagementError on Android too.

      SyncService::UserActionableError::kDeviceManagementError is declared for
      IS_IOS || IS_ANDROID, but these switches only handle it on iOS, because
      upstream does not build the built-in backend on Android. Brave does, so
      the unhandled case breaks -Wswitch.
    count: 3 # UserActionableError is switched on in three places in this file.
    regex:
      # Anchor on the case the guard wraps, not on the guard alone: the file has
      # other IS_IOS blocks unrelated to this error.
      re_pattern:
        '(#if BUILDFLAG\(IS_IOS\))(\s+case SyncError::kDeviceManagementError:)'
      replace: '\1 || BUILDFLAG(IS_ANDROID)\2'
