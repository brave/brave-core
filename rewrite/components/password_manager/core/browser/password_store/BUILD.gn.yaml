substitutions:
  - description: |
      Add the Brave password store sources.

      Upstream only pulls these in on Android, so the addition is made under
      the same condition.
    add_literal_to_list:
      target: password_store_impl
      list_name: sources
      literal: components_password_manager_core_browser_password_store_sources
      conditional: is_android
      import: //brave/components/password_manager/core/browser/password_store/sources.gni
