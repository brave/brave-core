substitutions:
  - description: |
      `login_database.cc` reports a successful decrypt of stored passwords to
      the OSCrypt key history. Anchored on `password_store_impl`'s deps, the
      only list here holding `blink_buildflags`.
    regex:
      re_pattern: '"//build:blink_buildflags",\s+"//components/affiliations/core/browser:affiliations",'
      replace: |-
        "//brave/components/os_crypt_key_history",
            "//build:blink_buildflags",
            "//components/affiliations/core/browser:affiliations",
