substitutions:
  - description: |
      Suppress CHECK when flag is on

      Under kBraveAndroidSyncPasswordsInProfileStore the account store is
      created with kNever (see
      chromium_src/chrome/browser/password_manager/factories/password_store_backend_factory.cc)
      so that the startup migrator can drain it, which otherwise trips
      this CHECK.
    regex:
      re_pattern: ' *CHECK\(!password_store_sync_->IsAccountStore\(\)\);'
      replace: |-
        #if BUILDFLAG(IS_ANDROID)
              CHECK(!password_store_sync_->IsAccountStore() ||
                    base::FeatureList::IsEnabled(
                        brave_sync::features::kBraveAndroidSyncPasswordsInProfileStore));
        #else
              CHECK(!password_store_sync_->IsAccountStore());
        #endif
