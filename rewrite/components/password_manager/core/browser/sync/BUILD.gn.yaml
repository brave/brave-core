substitutions:
  - description: |
      Add the Brave password manager sync deps.

      Brave's `PasswordDataTypeController` and `PasswordSyncBridge` overrides
      read a brave_sync feature.
    insert_into_list:
      target: sync
      list_name: deps
      values:
        - //brave/components/brave_sync:features
