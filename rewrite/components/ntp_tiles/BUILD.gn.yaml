substitutions:
  - description: |-
      Let //brave/browser:core see the popular sites pref names.

      brave_profile_prefs.cc registers the popular sites prefs itself, so it
      needs this header from outside //components/ntp_tiles.
    insert_into_list:
      target: popular_sites_pref_names
      list_name: visibility
      values:
        - //brave/browser:core
