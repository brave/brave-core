substitutions:
  - description: |-
      Ship kPopularSitesBakedInContentFeature disabled.

      Disables fetching suggested web sites favicons.
    set_feature_flag_default_state:
      feature_name: kPopularSitesBakedInContentFeature
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Ship kNtpMostLikelyFaviconsFromServerFeature disabled.

      Disables fetching suggested web sites favicons.
    set_feature_flag_default_state:
      feature_name: kNtpMostLikelyFaviconsFromServerFeature
      value: base::FEATURE_DISABLED_BY_DEFAULT
