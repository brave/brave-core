substitutions:
  - description: |
      Add the Brave-only fields to the ctor arg list

      Adding `self_delete_support` and `device_display_label` so they can be
      used to initialise `self_delete_support_` and `device_display_label_`.

      This regex matches with the constructor declaration, by checking that there is
      a `std::string` somewhere in the list, and adds the Brave arguments as the
      last ones in the list.
    regex:
      re_pattern: '(DeviceInfo\((?=[^)]*std::string).*?)(\);)'
      re_flags: [DOTALL]
      replace: |-
        \1,
                     SelfDeleteSupport self_delete_support =
                         SelfDeleteSupport::kNotSupported,
                     std::string device_display_label = std::string()\2

  - description: |
      Add Brave-specific declarations to DeviceInfo's public interface

      Re-introduces a move constructor, suppressed by the deleted copy
      operations together with the user-declared destructor, so Brave call sites
      can wrap the value-returning upstream `SpecificsToModel` into
      `std::make_unique<DeviceInfo>(...)`. The remaining accessors used to exist
      in Chromium, were dropped at some point, and are reinstated on Brave.
    add_to_public:
      class_name: DeviceInfo
      code: |-
        DeviceInfo(DeviceInfo&&);

        SelfDeleteSupport self_delete_support() const {
          return self_delete_support_;
        }
        void set_self_delete_support(SelfDeleteSupport self_delete_support) {
          self_delete_support_ = self_delete_support;
        }
        // User-chosen label for this device, empty when never renamed. Unlike
        // `client_name()` it is not derived from the OS, so it survives having
        // several channels of Brave installed under one machine name.
        const std::string& device_display_label() const {
          return device_display_label_;
        }
        // Gets the OS in string form.
        std::string GetOSString() const;
        // Gets the device type in string form.
        std::string GetDeviceTypeString() const;
        // Converts the DeviceInfo values to a JS friendly DictionaryValue,
        // which extension APIs can expose to third party apps.
        base::DictValue ToValue() const;

  - description: |
      Add the Brave-only members as the last members of DeviceInfo

      This replacement adds `self_delete_support_` and `device_display_label_`
      as the last members of `DeviceInfo`. The declaration order has to match
      the order they are initialised in by the ctor.
    regex:
      re_pattern: '(class DeviceInfo \{.*)(\n\};)'
      re_flags: [DOTALL]
      replace: |-
        \1
          SelfDeleteSupport self_delete_support_;
          std::string device_display_label_;\2
