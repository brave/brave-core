substitutions:
  - description: |-
      Copy and drag WebUI page URLs with the brave:// scheme

      The omnibox shows Brave's WebUI pages as brave://, so the URL copied or
      dragged from it unmodified must read the same.
    add_after_line:
      line: GURL url = navigation_entry_url;
      code: |2-
          BraveAdjustTextForCopy(&url);
