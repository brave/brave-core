substitutions:
  - description: |-
      Build the accessibility label for history embeddings matches.

      Cherry-pick of crrev.com/c/8431532, to be dropped once it lands: the
      insertion then duplicates the upstream case and the build fails on the
      duplicate label.
    regex:
      re_pattern: '(case IDS_ACC_AUTOCOMPLETE_HISTORY:)'
      replace: |-
        \1
            case IDS_ACC_AUTOCOMPLETE_HISTORY_EMBEDDINGS:
