substitutions:
  - description: Forward declare Brave's semantic history search.
    add_before_line:
      line: 'class TemplateURLService;'
      code: |
        namespace brave_history_embeddings {
        class HistoryEmbeddingsSearch;
        }  // namespace brave_history_embeddings

  - description: |
      Let providers reach Brave's semantic history search.

      Returns null where the profile has none, which is the default.
    add_to_public:
      class_name: AutocompleteProviderClient
      code: |-
        virtual brave_history_embeddings::HistoryEmbeddingsSearch*
        GetBraveHistoryEmbeddingsSearch();
