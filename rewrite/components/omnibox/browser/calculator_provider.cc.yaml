substitutions:
  - description: |
      Guard Start() against null ProviderStateService.

      ProviderStateService is unavailable for incognito/OTR profiles because
      ProviderStateServiceFactory uses ProfileSelection::kOriginalOnly.
      Without the calculator cache, this provider cannot function.
    preempt_function_impl:
      function_name: CalculatorProvider::Start
      code: |-
        if (!client_->GetProviderStateService()) {
          done_ = true;
          return;
        }

  - description: |
      Guard DeleteMatch() against null ProviderStateService.

      ProviderStateService is unavailable for incognito/OTR profiles because
      ProviderStateServiceFactory uses ProfileSelection::kOriginalOnly.
    preempt_function_impl:
      function_name: CalculatorProvider::DeleteMatch
      code: |-
        if (!client_->GetProviderStateService()) {
          return;
        }
