substitutions:
  - description: |
      Let BraveGCMDriverDesktop toggle itself on/off.

      BraveGCMDriverDesktop gates GCM registration on profile state, which
      upstream has no notion of, so it needs a settable enabled flag with a
      no-op default for every other GCMDriver implementation.
    add_to_public:
      class_name: GCMDriver
      code: 'virtual void SetEnabled(bool enabled) {}'
