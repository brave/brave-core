substitutions:
  - description: |-
      Ship kHistoryEmbeddings disabled.

      Users can still enable it via about:flags.
    set_feature_flag_default_state:
      feature_name: kHistoryEmbeddings
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Ship kHistoryEmbeddingsAnswers disabled.

      Not used by Brave.
    set_feature_flag_default_state:
      feature_name: kHistoryEmbeddingsAnswers
      value: base::FEATURE_DISABLED_BY_DEFAULT
