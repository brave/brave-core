substitutions:
  - description: 'Ship kAutofillAiServerModel disabled.'
    regex:
      pattern: 'DEFINE_FEATURE_WITH_MOBILE_COUNTRY_RESTRICTION(kAutofillAiServerModel);'
      replace:
        'BASE_OVERRIDDEN_FEATURE(kAutofillAiServerModel,
        base::FEATURE_DISABLED_BY_DEFAULT);'

  - description: |-
      Ship kAutofillAiWithDataSchema disabled.

      This is the master switch for AI-based autofill, which Brave does not
      offer, and upstream ships it enabled by default on every platform.
    regex:
      pattern: 'DEFINE_FEATURE_WITH_MOBILE_COUNTRY_RESTRICTION(kAutofillAiWithDataSchema);'
      replace:
        'BASE_OVERRIDDEN_FEATURE(kAutofillAiWithDataSchema,
        base::FEATURE_DISABLED_BY_DEFAULT);'

  - description: |-
      Ship kAutofillAmbientAutofill disabled.

      Upstream enables it in the US, where Brave derives the variations country
      from the locale. It adds a Shopping settings card and the personal
      context plumbing, which Brave does not offer.
    regex:
      re_pattern: 'BASE_FEATURE_WITH_COUNTRY_RESTRICTIONS\(kAutofillAmbientAutofill,\s*base::FEATURE_ENABLED_FOR_COUNTRIES,\s*"us"\);'
      replace:
        'BASE_OVERRIDDEN_FEATURE(kAutofillAmbientAutofill,
        base::FEATURE_DISABLED_BY_DEFAULT);'

  - description: |-
      Ship kAutofillAmbientAutofillSuppression disabled.

      This feature makes PersonalContextEntityMetadataManagerFactory build the
      service behind the AUTOFILL_ENTITY_SUPPRESSION sync type.
    regex:
      re_pattern: 'BASE_FEATURE_WITH_COUNTRY_RESTRICTIONS\(kAutofillAmbientAutofillSuppression,\s*base::FEATURE_ENABLED_FOR_COUNTRIES,\s*"us"\);'
      replace:
        'BASE_OVERRIDDEN_FEATURE(kAutofillAmbientAutofillSuppression,
        base::FEATURE_DISABLED_BY_DEFAULT);'
