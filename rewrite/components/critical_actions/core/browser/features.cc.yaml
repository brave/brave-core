substitutions:
  - description: |-
      Ship kCriticalActionHistory disabled.

      This feature controls Critical Action History service which records things
      such as credential access, form filling, OTP filling, logins, and file
      downloads performed by an Actor agent as well as Actor task/conversation
      IDs. This is used for integration of Gemini into history WebUI.
    set_feature_flag_default_state:
      feature_name: kCriticalActionHistory
      value: base::FEATURE_DISABLED_BY_DEFAULT
