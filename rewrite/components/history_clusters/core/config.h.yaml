substitutions:
  - description: |
      Ship Journeys disabled on all platforms

      Upstream removed the kJourneys feature, which Brave used to ship
      disabled, and now enables Journeys on desktop by build-time default.
    regex:
      re_pattern: '(bool is_journeys_enabled_no_locale_check =\s+)[^;]+;'
      replace: '\1false;'
