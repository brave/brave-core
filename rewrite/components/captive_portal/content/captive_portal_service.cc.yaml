substitutions:
  - description: |
      Keep captive portal detection enabled regardless of settings.

      Brave does not enable resolve_errors_with_web_service_ by default,
      which would otherwise leave captive portal detection permanently
      disabled; enabled_ should depend only on the testing state.
    regex:
      re_pattern: |-
        (void CaptivePortalService::UpdateEnabledState\(\)\s*\{.*?enabled_ = testing_state_ != DISABLED_FOR_TESTING) &&\s*resolve_errors_with_web_service_\.GetValue\(\);
      re_flags: [DOTALL]
      replace: '\1;'
