substitutions:
  - description: |
      Use Brave's own endpoint for detecting captive portals.

      Brave replaces the detection URL outright, so the upstream body never
      needs to run.
    preempt_function_impl:
      function_name: CaptivePortalDetector::GetDefaultUrl
      code: |-
        if ((true)) return kBraveDefaultURL;
