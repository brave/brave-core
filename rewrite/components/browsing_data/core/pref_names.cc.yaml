substitutions:
  - description: |
      Register the Brave-specific "clear on exit" prefs.

      RegisterBraveUserPrefs comes from the chromium_src override's
      anonymous namespace.
    after_function_impl:
      function_name: RegisterBrowserUserPrefs
      code: |-
        RegisterBraveUserPrefs(registry);
