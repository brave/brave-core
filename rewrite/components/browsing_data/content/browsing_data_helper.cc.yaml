substitutions:
  - description: |
      Clear Brave-specific site settings data alongside Chromium's.

      BraveRemoveSiteSettingsData clears content-settings types Brave adds on
      top of upstream's own site-settings cleanup.
    after_function_impl:
      function_name: RemoveSiteSettingsData
      code: |-
        BraveRemoveSiteSettingsData(delete_begin, delete_end,
                                     host_content_settings_map);
