substitutions:
  - description: |-
      Drop the rule about Perfetto commit messages.

      Brave's reviews read a pull request's diff, which a rule about the
      commit message cannot be checked against.
    regex:
      re_pattern:
        '\n\s*rules:
        "[^"]*/document-perfetto-diff-test-command-in-commit-message\.md"'
      replace: ''
