substitutions:
  - description: |-
      Review Brave's base library with base's rules on what belongs there

      `brave/base` is Brave's counterpart to `//base`. Most base rules concern
      its own internals (PartitionAlloc, tracing, task scheduling); these three
      decide what may be added to a base library at all.
    regex:
      re_pattern: '\}\s*\Z'
      replace: |2
          capability_groups {
            path_expression: "brave/base/.*"
            rules: "agents/knowledge_base/rules/base/avoid-duplicating-standard-cpp-features.md"
            rules: "agents/knowledge_base/rules/base/avoid-single-feature-utilities-in-base.md"
            rules: "agents/knowledge_base/rules/base/restrict-platform-specific-apis-over-dummy-values.md"
          }
        }
