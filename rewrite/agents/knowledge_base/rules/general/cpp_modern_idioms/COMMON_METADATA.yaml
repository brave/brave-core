substitutions:
  - description: |-
      Drop the rule against Google's Finch codename.

      Brave's variations service is Griffin, and its code names Finch only to
      refer to Chromium's experiments, which is accurate.
    regex:
      re_pattern: '\n\s*rules: "[^"]*/no-finch-in-client-side-identifiers\.md"'
      replace: ''
