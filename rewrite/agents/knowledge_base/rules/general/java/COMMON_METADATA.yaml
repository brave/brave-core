substitutions:
  - description: |-
      Drop the rule asking for a test of all new Java code.

      Brave's rules ask for reasonable coverage instead, and for no test of
      trivial UI such as a switch wired to a pref.
    regex:
      re_pattern: '\n\s*rules: "[^"]*/add-unit-tests-for-new-code\.md"'
      replace: ''
