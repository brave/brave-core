substitutions:
  - description: |-
      Review Brave's permission contexts with the chooser permission rule

      Brave's own contexts in `brave/components/permissions/contexts` (Brave
      Wallet's, Google sign-in's) grant per-origin permissions as Chrome's
      chooser contexts do. The other device rules cover Device APIs Brave
      doesn't implement.
    add_before_line:
      line:
        'rules:
        "agents/knowledge_base/rules/device/isolate-chooser-permissions-across-origins-and-storage-partitions.md"'
      code: |2-
            path_expression: "brave/components/permissions/contexts/.*\\.(?:cc|h|mm)"
