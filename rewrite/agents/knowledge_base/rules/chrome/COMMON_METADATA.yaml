substitutions:
  - description: |-
      Review Brave's browser code with Chrome's rules for any browser feature

      Brave's `app`, `browser`, `common`, `renderer` and `utility` mirror
      `chrome/`, but most Chrome rules name files only Chrome has, which Brave
      changes through overrides already matched under their upstream paths.
      These three hold for any browser feature.
    regex:
      re_pattern: '\}\s*\Z'
      replace: |2
          capability_groups {
            path_expression: "brave/(?:app|browser|common|renderer|utility)/.*"
            rules: "agents/knowledge_base/rules/chrome/gate-tab-strip-layout-changes-on-immersive-mode.md"
            rules: "agents/knowledge_base/rules/chrome/test-preference-registration-and-propagation.md"
            rules: "agents/knowledge_base/rules/chrome/update-ui-strings-across-all-surfaces.md"
          }
        }
