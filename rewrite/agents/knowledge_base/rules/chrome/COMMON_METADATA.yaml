substitutions:
  - description: |-
      Drop the rule naming the updater after Google's.

      Brave ships its own updater, which reviews of Brave's overrides of
      chrome/ must not have renamed GoogleUpdater.
    regex:
      re_pattern:
        '\n\s*rules:
        "[^"]*/refer-to-updater-as-googleupdater-or-chromes-updater\.md"'
      replace: ''
  - description: |-
      Drop the rule about Chrome's PGO and orderfile profile names.

      Brave neither builds nor rolls profiles of its own.
    regex:
      re_pattern:
        '\n\s*rules: "[^"]*/use-dot-separator-in-profile-version-filenames\.md"'
      replace: ''
