substitutions:
  - description: |-
      Review Brave's policy definitions with the dynamic refresh rule

      Brave defines its own enterprise policies under
      `brave/components/policy/resources/templates`. Upstream groups the rule
      with an Autofill one, so Brave's policies get a group of their own.
    regex:
      re_pattern: '\}\s*\Z'
      replace: |2
          capability_groups {
            path_expression: "brave/components/policy/.*"
            rules: "agents/knowledge_base/rules/components/support-dynamic-refresh-for-enterprise-policies.md"
          }
        }
