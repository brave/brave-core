substitutions:
  - description: |-
      Drop the rule about rolling Google's internal Autofill heuristics.

      The heuristics and their test expectations are internal repositories
      Brave's DEPS does not check out.
    regex:
      re_pattern:
        '\n\s*rules:
        "[^"]*/update-autofill-heuristics-test-expectations-in-deps\.md"'
      replace: ''
