substitutions:
  - description: |
      Link the Brave passage embedder hook into the passage embeddings tests.

      The chromium_src override of passage_embedder_impl.cc calls a hook
      defined in //brave/services/passage_embeddings:chromium_impl, which the
      utility process links. Test binaries that include these tests need it
      as well.
    insert_into_list:
      target: tests
      list_name: deps
      values:
        - //brave/services/passage_embeddings:chromium_impl
