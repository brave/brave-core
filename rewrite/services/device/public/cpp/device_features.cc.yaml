substitutions:
  - description: |-
      Ship kLocationProviderManager enabled on every platform.

      Upstream declares this as two separate BASE_FEATURE statements (one
      for Mac/Win, one for the #else branch), so two matches are expected
      here.
    count: 2
    set_feature_flag_default_state:
      feature_name: kLocationProviderManager
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kSensorsAllowAskBlockPermissionModel enabled.'
    set_feature_flag_default_state:
      feature_name: kSensorsAllowAskBlockPermissionModel
      value: base::FEATURE_ENABLED_BY_DEFAULT
