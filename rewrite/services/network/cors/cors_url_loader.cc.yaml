substitutions:
  - description: |
      Taint the origin of cross-origin requests from .onion pages.

      A .onion page must not disclose the address it came from. Setting the
      tainted origin flag gives these requests an opaque origin everywhere
      upstream consults it, including the Origin header of the request and
      of its CORS preflight.
    preempt_function_impl:
      function_name: CorsURLLoader::StartRequest
      code: |-
        if (IsCrossOriginOnionRequest(request_.request_initiator, request_.url)) {
          tainted_ = true;
        }

  - description: |
      Taint the origin when a .onion request redirects cross-origin.

      A redirect followed in place does not go through StartRequest again.
    preempt_function_impl:
      function_name: CorsURLLoader::CheckTainted
      code: |-
        if (IsCrossOriginOnionRequest(request_.request_initiator,
                                      redirect_info.new_url)) {
          tainted_ = true;
        }
