substitutions:
  - description: |
      Send an opaque Origin header for cross-origin requests from .onion pages.

      A .onion page must not disclose the address it came from, which is the
      same treatment upstream already gives a request with a tainted origin.
    regex:
      re_pattern: '(origin_value = )tainted_'
      replace: '\1tainted_ || IsCrossOriginOnionRequest(request_)'
