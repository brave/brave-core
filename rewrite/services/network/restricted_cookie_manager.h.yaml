# COMPONENT_EXPORT sits between `class` and the class name.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Include CookieOptions for the Brave option builders.

      MakeOptionsForSet and MakeOptionsForGet return it by value.
    add_include:
      header:
        - net/cookies/cookie_options.h

  - description: |-
      Declare the Brave cookie-option builders.

      Member calls of MakeOptionsForSet and MakeOptionsForGet bind to these
      instead of the upstream free functions, so ephemeral-storage parameters
      can be filled in.
    add_to_public:
      class_name: RestrictedCookieManager
      code: |-
        net::CookieOptions MakeOptionsForSet(
            mojom::RestrictedCookieManagerRole role,
            const GURL& url,
            const net::SiteForCookies& site_for_cookies,
            const url::Origin& top_frame_origin,
            const CookieSettings& cookie_settings) const;
        net::CookieOptions MakeOptionsForGet(
            mojom::RestrictedCookieManagerRole role,
            const GURL& url,
            const net::SiteForCookies& site_for_cookies,
            const url::Origin& top_frame_origin,
            const CookieSettings& cookie_settings) const;
