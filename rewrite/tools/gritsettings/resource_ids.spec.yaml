substitutions:
  # Brave-only resource id blocks, grouped with their Chromium/Google Chrome
  # counterparts since strings in the same family must start at the same id.

  - description: |-
      Register brave_strings.grd and brave_origin_strings.grd.
    regex:
      re_pattern: '(  "chrome/app/chromium_strings\.grd": \{.*?\n  \},)'
      re_flags: [DOTALL]
      replace: |-
        \1
          "chrome/app/brave_strings.grd": {
            "messages": [800],
          },
          "chrome/app/brave_origin_strings.grd": {
            "messages": [800],
          },

  - description: |-
      Register components_brave_strings.grd and
      components_brave_origin_strings.grd.
    regex:
      re_pattern:
        '(  "components/components_chromium_strings\.grd": \{.*?\n  \},)'
      re_flags: [DOTALL]
      replace: |-
        \1
          "components/components_brave_strings.grd": {
            "messages": [7020],
          },
          "components/components_brave_origin_strings.grd": {
            "messages": [7020],
          },

  # Reserved id ranges Brave needs to grow, because it adds resources of its
  # own into these upstream .grd files elsewhere.

  - description: |-
      Grow the reserved id range for extensions/resources.grd, since Brave
      adds its own <include>s to it.
    regex:
      re_pattern:
        '("<\(SHARED_INTERMEDIATE_DIR\)/chrome/browser/resources/extensions/resources\.grd":
        \{\n    "META": \{"sizes": \{"includes": \[)120(\],\}\},)'
      replace: '\g<1>123\g<2>'

  - description: |-
      Grow the reserved id range for history/resources.grd, since Brave adds
      its own <include>s to it.
    regex:
      re_pattern:
        '("<\(SHARED_INTERMEDIATE_DIR\)/chrome/browser/resources/history/resources\.grd":
        \{\n    "META": \{"sizes": \{"includes": \[)60(\]\}\},)'
      replace: '\g<1>63\g<2>'

  - description: |-
      Grow the reserved id range for settings/resources.grd, since Brave adds
      its own <include>s to it.
    regex:
      re_pattern:
        '("<\(SHARED_INTERMEDIATE_DIR\)/chrome/browser/resources/settings/resources\.grd":
        \{\n    "META": \{"sizes": \{"includes": \[)700(\],\}\},)'
      replace: '\g<1>900\g<2>'

  - description: |-
      Grow the reserved id range for webui_code_cache_resources.grd, since
      Brave adds its own <include>s to it.
    regex:
      re_pattern:
        '("<\(SHARED_INTERMEDIATE_DIR\)/ui/webui/resources/webui_code_cache_resources\.grd":
        \{\n    "META": \{"sizes": \{"includes": \[)250(\]\}\},)'
      replace: '\g<1>252\g<2>'

  - description: |-
      Grow the reserved id range for webui_resources.grd, since Brave adds its
      own <include>s to it.
    regex:
      re_pattern:
        '("<\(SHARED_INTERMEDIATE_DIR\)/ui/webui/resources/webui_resources\.grd":
        \{\n    "META": \{"sizes": \{"includes": \[)1100(\]\}\},)'
      replace: '\g<1>1390\g<2>'
