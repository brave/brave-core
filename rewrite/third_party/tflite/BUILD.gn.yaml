substitutions:
  - description: Let the Brave passage embeddings use the builtin op resolver.
    add_literal_to_list:
      target: tflite_builtin_op_resolver
      type: tflite_static_library
      list_name: visibility
      literal: '[ "//brave/services/passage_embeddings/*" ]'
