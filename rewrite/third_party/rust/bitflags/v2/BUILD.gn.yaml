substitutions:
  - description: Depend on serde for the `serde` feature.
    insert_into_list:
      target: lib
      list_name: deps
      values:
        - //third_party/rust/serde/v1:lib
        - //third_party/rust/serde_core/v1:lib

  - description: Build bitflags with serde support.
    insert_into_list:
      target: lib
      list_name: features
      values:
        - serde
