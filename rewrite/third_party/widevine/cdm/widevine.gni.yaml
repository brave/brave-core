substitutions:
  - description: |-
      Let Linux users supply Widevine on any architecture

      Set before `enable_library_widevine_cdm` is derived from it.
    add_before_line:
      line: enable_library_widevine_cdm =
      code: |
        # Let Linux users manually supply Widevine on architectures where it
        # isn't publicly available.
        if (target_os == "linux") {
          library_widevine_cdm_available = true
        }
