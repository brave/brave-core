substitutions:
  - description: |-
      Build the ChromeOS-only Polymer elements on every desktop platform

      Brave uses them outside ChromeOS too, so their sources, minified
      resources, grdp entries, type definitions and visibility all follow.
    count: 5
    regex:
      re_pattern: 'if \((optimize_webui && )?is_chromeos\) \{'
      replace: 'if (\1!is_android) {'

  - description: Let the Brave WebUI targets use Polymer.
    add_literal_to_list:
      target: library
      list_name: visibility
      literal: brave_polymer_library_visibility
      import: //brave/third_party/polymer/v3_0/sources.gni
