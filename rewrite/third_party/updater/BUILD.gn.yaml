substitutions:
  - description: |
      Don't copy previously released updaters from before install IDs

      IntegrationSansInstallIdTest needs them. Our oldest released updater
      already supports install IDs, so we have no such build. Without it, the
      test skips itself.
    regex:
      re_pattern: '\n\s*"_sans_iid",'
      replace: ''
