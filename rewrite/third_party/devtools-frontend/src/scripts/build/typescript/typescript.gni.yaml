substitutions:
  - description: |-
      Root the Brave DevTools sources next to the upstream ones

      Brave adds new DevTools files from //brave/..., which sit outside this
      target's rootDir. run_with_restat.py hardlinks them next to the upstream
      sources before tsc runs, so everything tsc is told about them has to name
      that in-tree copy. See //brave/docs/devtools_frontend_patching.md.
    add_before_line:
      line: _ts_references = []
      code: |2
          # Brave adds new DevTools files from //brave/..., which sit outside this
          # target's rootDir. run_with_restat.py hardlinks them next to the upstream
          # sources before tsc runs, so everything tsc is told about them -- the
          # tsconfig `files` list, the -dts source list and the computed output paths
          # -- has to name that in-tree copy instead. `_all_sources` keeps the original
          # path, so the actions still list the real file as an input.
          # See //brave/docs/devtools_frontend_patching.md.
          _rooted_sources = []
          foreach(src, invoker.sources) {
            if (label_matches(src, [ "//brave/*" ])) {
              _rooted_sources += [ get_path_info(src, "file") ]
            } else {
              _rooted_sources += [ src ]
            }
          }
          _all_rooted_sources = _rooted_sources + typescript_global_definition_files
          if (defined(invoker.additional_type_definitions)) {
            _all_rooted_sources += invoker.additional_type_definitions
          }

  - description: List the rooted sources as the ones emitting JS.
    regex:
      pattern: _non_dts_sources = filter_exclude(invoker.sources,
      replace: _non_dts_sources = filter_exclude(_rooted_sources,

  - description: Compute the outputs from the rooted sources.
    regex:
      re_pattern: 'foreach\(src, invoker\.sources\) \{(\n\s*_ext = )'
      replace: 'foreach(src, _rooted_sources) {\1'

  - description: Pass the rooted sources to tsc.
    regex:
      pattern: '] + rebase_path(_all_sources, root_build_dir)'
      replace: '] + rebase_path(_all_rooted_sources, root_build_dir)'
