substitutions:
  - description: |-
      Replace `NetworkItemView` with Brave's subclass.

      The subclass adds the Adblock tab to a request's details.
    add_at_end_of_the_file:
      code: |-
        import { PatchNetworkItemView } from './NetworkItemView.patch.js'; (NetworkItemView as any) = PatchNetworkItemView(NetworkItemView);
