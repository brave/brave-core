substitutions:
  - description: Hide the Account settings section.
    regex:
      re_pattern: '(static isSettingVisible\([^)]*\): boolean \{)'
      replace: |-
        \1
            if (setting.uiDescriptor.category === Common.Settings.SettingCategory.ACCOUNT) {
              return false;
            }

  - description:
      Replace the Chrome logo next to the Settings title with Brave's.
    add_import:
      entry: import './SettingsScreen.patch.js';
