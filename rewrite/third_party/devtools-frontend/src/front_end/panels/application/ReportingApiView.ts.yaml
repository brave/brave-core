substitutions:
  - description: |-
      Replace ReportingApiView with the Brave subclass.

      The subclass notes in the panel when Brave has the Reporting API disabled.
    add_at_end_of_the_file:
      code: |-
        import { PatchReportingApiView } from './ReportingApiView.patch.js'; (ReportingApiView as any) = PatchReportingApiView(ReportingApiView);
