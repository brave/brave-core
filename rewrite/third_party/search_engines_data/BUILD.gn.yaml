substitutions:
  - description: Add the Brave prepopulated engine sources.
    add_literal_to_list:
      target: prepopulated_engines
      list_name: additional_sources
      literal: brave_third_party_search_engines_data_prepopulated_engines_sources
      import: //brave/components/search_engines/sources.gni

  - description: Add the Brave prepopulated engine deps.
    add_literal_to_list:
      target: prepopulated_engines
      list_name: deps
      literal: brave_third_party_search_engines_data_prepopulated_engines_deps
      import: //brave/components/search_engines/sources.gni
