substitutions:
  - description: |-
      Upgrade all mixed content.
    set_feature_flag_default_state:
      feature_name: kMixedContentAutoupgrade
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kReducedReferrerGranularity enabled.'
    set_feature_flag_default_state:
      feature_name: kReducedReferrerGranularity
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kUACHOverrideBlank enabled.'
    set_feature_flag_default_state:
      feature_name: kUACHOverrideBlank
      value: base::FEATURE_ENABLED_BY_DEFAULT

  - description: 'Ship kAllowURNsInIframes disabled.'
    set_feature_flag_default_state:
      feature_name: kAllowURNsInIframes
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kBackgroundResourceFetch disabled.'
    set_feature_flag_default_state:
      feature_name: kBackgroundResourceFetch
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kFencedFrames disabled.'
    set_feature_flag_default_state:
      feature_name: kFencedFrames
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: 'Ship kPreloadingEagerViewportHeuristics disabled.'
    set_feature_flag_default_state:
      feature_name: kPreloadingEagerViewportHeuristics
      value: base::FEATURE_DISABLED_BY_DEFAULT
