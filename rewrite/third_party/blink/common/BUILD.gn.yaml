substitutions:
  - description: Add the Brave blink common deps.
    add_literal_to_list:
      target: common
      list_name: deps
      literal: brave_blink_common_deps
      import: //brave/third_party/blink/common/sources.gni

  - description: Add the Brave blink common unit test deps.
    add_literal_to_list:
      target: common_unittests_sources
      list_name: deps
      literal: brave_blink_common_deps
      import: //brave/third_party/blink/common/sources.gni
