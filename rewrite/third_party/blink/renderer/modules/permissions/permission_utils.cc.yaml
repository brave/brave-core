substitutions:
  - description: |-
      Reject the `window-management` permission name unless
      `BraveWindowManagement` is on.

      IDL enum values can't be guarded by a runtime flag, so without this
      `permissions.query()` would still reveal the API.
    regex:
      pattern: 'case V8PermissionName::Enum::kWindowManagement:'
      replace: |-
        case V8PermissionName::Enum::kWindowManagement:
              if (!RuntimeEnabledFeatures::BraveWindowManagementEnabled()) {
                exception_state.ThrowTypeError("Window Management is not enabled.");
                return nullptr;
              }
