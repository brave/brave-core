substitutions:
  - description: |-
      Hide `ScreenDetailed` unless `BraveWindowManagement` is on.

      This keeps the interface from being feature-detected on the global
      object when `Window.getScreenDetails()` is hidden.
    regex:
      re_pattern: '(\w)(\n\] interface ScreenDetailed\b)'
      replace: '\1,\n  RuntimeEnabled=BraveWindowManagement\2'
