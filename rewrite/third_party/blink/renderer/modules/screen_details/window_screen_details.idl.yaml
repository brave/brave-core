substitutions:
  - description: |-
      Hide `Window.getScreenDetails()` unless `BraveWindowManagement` is on.

      It returns the full multi-screen layout, which is a fingerprinting
      vector once the permission is granted.
    regex:
      pattern: 'ImplementedAs=WindowScreenDetails'
      replace: |-
        ImplementedAs=WindowScreenDetails,
            RuntimeEnabled=BraveWindowManagement
