substitutions:
  - description: |-
      Shape no text when language fingerprinting protection is strict.

      `shapeText()` serves `measureText()`, whose metrics reveal the fonts
      installed. The check runs before the style is updated.
    regex:
      re_pattern:
        '(ShapedText\* BaseRenderingContext2D::shapeText\(.*?\n)(
        *canvas->GetDocument\(\)\.UpdateStyleAndLayoutTreeForElement\()'
      re_flags: [DOTALL]
      replace: |-
        \1    if (brave::IsStrictFingerprintingEnabled(
                    GetTopExecutionContext(),
                    ContentSettingsType::BRAVE_WEBCOMPAT_LANGUAGE)) {
              return MakeGarbageCollected<ShapedText>();
            }

        \2
