substitutions:
  - description: |-
      Drop the font data of font families Brave doesn't allow.

      `BRAVE_GET_FONT_DATA` is defined in the `chromium_src` override, which
      reduces font fingerprinting.
    regex:
      re_pattern:
        '(\n( *)result =
        FontCache::Get\(\)\.GetFontData\(font_description,\s*curr_family->FamilyName\(\)\);\n)'
      replace: |
        \1\2BRAVE_GET_FONT_DATA
