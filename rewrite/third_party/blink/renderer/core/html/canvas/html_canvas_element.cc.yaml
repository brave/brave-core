substitutions:
  - description: |-
      Farble the canvas data before `ToDataURLInternal()` encodes it.

      `BRAVE_TO_DATA_URL_INTERNAL` is defined in the `chromium_src` override.
    add_before_line:
      line:
        'String data_url = data_buffer->ToDataURL(encoding_mime_type, quality);'
      code: '    BRAVE_TO_DATA_URL_INTERNAL'
