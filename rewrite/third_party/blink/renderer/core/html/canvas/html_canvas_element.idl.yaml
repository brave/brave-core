substitutions:
  - description: |-
      Pass the `ScriptState` to `toDataURL()`.

      Brave's overload farbles the canvas data with the script's execution
      context, which is valid even when the canvas' own isn't.
    regex:
      re_pattern:
        '\[(MeasureAs=CanvasToDataURL, RaisesException\] DOMString toDataURL\()'
      replace: '[CallWith=ScriptState, \1'
