substitutions:
  - description: |-
      Drop CSP report-uri reports as part of disabling the Reporting API.

      This is conditional on kBraveReportingAPI, a flag available to re-enable
      the Chromium Reporting API.
    preempt_function_impl:
      function_name: PingLoader::SendViolationReport
      return_if: '!base::FeatureList::IsEnabled(features::kBraveReportingAPI)'
