substitutions:
  - description: |
      Override WebFrameWidgetImpl::HitTestResultForContextMenuAt

      See the matching web_frame_widget.h plaster for why this exists.
    regex:
      re_pattern:
        '(WebHitTestResult HitTestResultAt\(const gfx::PointF&\) override;)'
      replace: |-
        \1
          WebHitTestResult HitTestResultForContextMenuAt(const gfx::PointF&) override;
