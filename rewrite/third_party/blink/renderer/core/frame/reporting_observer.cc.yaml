substitutions:
  - description: Headers for the kBraveReportingAPI check.
    add_include:
      header:
        - base/feature_list.h
        - third_party/blink/public/common/features.h
  - description: |-
      No-op ReportingObserver reports as part of disabling the Reporting API.

      This is conditional on kBraveReportingAPI, a flag available to re-enable
      the Chromium Reporting API.
    preempt_function_impl:
      function_name: ReportingObserver::QueueReport
      return_if: '!base::FeatureList::IsEnabled(features::kBraveReportingAPI)'
