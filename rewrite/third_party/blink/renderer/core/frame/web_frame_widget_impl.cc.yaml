substitutions:
  - description: |-
      Fire `change` on `window.screen` only if `BraveWindowManagement` is on.

      Hiding `Screen.onchange` doesn't stop `screen.addEventListener('change')`,
      since `Screen` is an `EventTarget` and the event is dispatched
      unconditionally whenever the screen setup changes.
    regex:
      pattern: 'if (window_screen_has_changed) {'
      replace: |-
        if (window_screen_has_changed &&
                    RuntimeEnabledFeatures::BraveWindowManagementEnabled()) {
