substitutions:
  - description: |-
      Tell WebLocalFrameObservers that the document's WebMCP tools changed.

      Preempted rather than appended so that a page `toolchange` handler which
      detaches the frame can't make the notification be silently dropped.
    preempt_function_impl:
      function_name: ModelContext::NotifyToolChange
      code: |-
        if (auto* web_frame = WebLocalFrameImpl::FromFrame(document_->GetFrame())) {
          web_frame->NotifyScriptToolsChanged();
        }

  - description: |
      Allow chrome-untrusted:// WebUI documents to use the Model Context (WebMCP)
      API.

      The Leo "workspace" tools run on a hidden
      chrome-untrusted://<uuid>.leo-workspace page and register themselves via
      navigator.modelContext. Each workspace has its own subdomain, so the check
      is on the host shape rather than a fixed host.
      `IsAIChatLeoWorkspaceHost()` matches one label followed by the workspace
      host, which excludes the workspace's viewer document at
      chrome-untrusted://view.<uuid>.leo-workspace - it has no tools of its
      own.
    regex:
      re_pattern: '(!document_->GetSettings\(\)->GetWebSecurityEnabled\(\)\));'
      replace: |-
        \1 ||
                 (document_->GetExecutionContext()->GetSecurityOrigin()->Protocol() == "chrome-untrusted" &&
                  ai_chat::IsAIChatLeoWorkspaceHost(document_->GetExecutionContext()->GetSecurityOrigin()->Host().Utf8()));
