substitutions:
  - description: |-
      Tell WebLocalFrameObservers that the document's WebMCP tools changed.

      Preempted rather than appended so that a page `toolchange` handler which
      detaches the frame can't make the notification be silently dropped.
    preempt_function_impl:
      function_name: ModelContext::NotifyToolChange
      code: |-
        if (auto* web_frame = WebLocalFrameImpl::FromFrame(document_->GetFrame())) {
          web_frame->NotifyScriptToolsChanged();
        }

  - description: |
      Allow chrome-untrusted:// WebUI documents to use the Model Context (WebMCP)
      API.

      The Leo "workspace" tools run on a hidden chrome-untrusted://leo-workspace
      page and register themselves via navigator.modelContext.
    regex:
      re_pattern: '(!document_->GetSettings\(\)->GetWebSecurityEnabled\(\)\));'
      replace: |-
        \1 ||
                 (document_->GetExecutionContext()->GetSecurityOrigin()->Protocol() ==
                      "chrome-untrusted" &&
                   document_->GetExecutionContext()->GetSecurityOrigin()->Host() ==
                      ai_chat::kAIChatLeoWorkspaceUIHost);
