substitutions:
  - description: |-
      Tell WebLocalFrameObservers that the document's WebMCP tools changed.

      Preempted rather than appended so that a page `toolchange` handler which
      detaches the frame can't make the notification be silently dropped.
    preempt_function_impl:
      function_name: ModelContext::NotifyToolChange
      code: |-
        if (auto* web_frame = WebLocalFrameImpl::FromFrame(document_->GetFrame())) {
          web_frame->NotifyScriptToolsChanged();
        }
