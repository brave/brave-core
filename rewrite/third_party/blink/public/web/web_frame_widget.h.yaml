substitutions:
  - description: |
      Declare WebFrameWidget::HitTestResultForContextMenuAt

      Exposes the native context menu's penetrating hit test to embedders,
      so an image/link under an overlapping element isn't missed. Declared
      here rather than on `WebWidget`, since `WebPagePopupImpl` also
      implements that and has no use for it.
    add_to_public:
      class_name: WebFrameWidget
      code:
        'virtual WebHitTestResult HitTestResultForContextMenuAt(const
        gfx::PointF&) = 0;'
