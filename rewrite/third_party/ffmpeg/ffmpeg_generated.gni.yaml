substitutions:
  - description: Add the Brave ffmpeg C sources.
    add_literal_to_variable:
      variable: ffmpeg_c_sources
      literal: brave_third_party_ffmpeg_c_sources
      import: //brave/third_party/ffmpeg/sources.gni

  - description: Add the Brave ffmpeg asm sources.
    add_literal_to_variable:
      variable: ffmpeg_asm_sources
      literal: brave_third_party_ffmpeg_asm_sources
      import: //brave/third_party/ffmpeg/sources.gni

  - description: Add the Brave ffmpeg asm deps.
    add_literal_to_variable:
      variable: ffmpeg_asm_deps
      literal: brave_third_party_ffmpeg_asm_deps
      import: //brave/third_party/ffmpeg/sources.gni

  - description: Add the Brave ffmpeg gas sources.
    add_literal_to_variable:
      variable: ffmpeg_gas_sources
      literal: brave_third_party_ffmpeg_gas_sources
      import: //brave/third_party/ffmpeg/sources.gni
