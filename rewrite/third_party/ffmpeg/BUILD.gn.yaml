substitutions:
  - description: |
      Let ffmpeg_internal find the libavcodec headers.

      Appended rather than inserted so the upstream include search order is
      left as it is.
    add_literal_to_list:
      target: ffmpeg_internal
      list_name: include_dirs
      literal: '[ "libavcodec" ]'
