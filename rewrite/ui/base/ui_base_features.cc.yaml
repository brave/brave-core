substitutions:
  - description: |-
      Ship kRoundedIcons disabled.

      Our Leo icon overrides only map the old icons, so the rounded ones would
      fall back to upstream's Material icons.
    set_feature_flag_default_state:
      feature_name: kRoundedIcons
      value: base::FEATURE_DISABLED_BY_DEFAULT
