substitutions:
  - description: |-
      Allow offering the same clipboard data twice.

      The url_sanitizer `JSApi` browser tests offer the same MIME type twice,
      which the check rejects.
    regex:
      re_pattern:
        '^( *)(CHECK_EQ\(data_to_offer_\.count\(mime_type\), 0U[^;]*;)'
      re_flags: [MULTILINE]
      replace: '\1// \2'
