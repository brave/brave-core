substitutions:
  - description: |-
      Ship kReadAnythingOmniboxChip disabled.

      Brave replaces Reading mode with Speedreader, so upstream's omnibox chip,
      page action and IPH must not appear next to it.
    set_feature_flag_default_state:
      feature_name: kReadAnythingOmniboxChip
      value: base::FEATURE_DISABLED_BY_DEFAULT
