substitutions:
  - description: |-
      Apply Brave's menu metrics once the platform config is initialised

      Brave's menus use their own paddings, equal radii and a bubble border.
      The values go after `InitPlatform()` because it overwrites some of them,
      and in the constructor so that `ReloadInstance()` rebuilds them too.
    after_function_impl:
      function_name: MenuConfig::MenuConfig
      code: |-
        item_horizontal_border_padding = 4;
        item_horizontal_padding = 20;
        corner_radius = 8;
        auxiliary_corner_radius = 8;
        touchable_corner_radius = 8;
        use_bubble_border = true;
