substitutions:
  - description: |-
      Re-arm the input protection only when the bubble actually moved.

      The protection exists because the clickable surface may have shifted
      under the cursor, but OnAnchorBoundsChanged() re-arms it whether or not
      re-anchoring moved anything. BrowserView::Layout() re-anchors an open
      permission prompt on every layout pass, so browser UI that animates its
      layout - Brave's vertical tab strip collapsing when the prompt takes
      activation, for one - restarts the cooldown frame after frame, and the
      prompt silently drops the click the user meant. SizeToContents() is what
      moves the bubble here, so its effect on the widget bounds is the signal.
    regex:
      re_pattern:
        '(void BubbleDialogDelegate::OnAnchorBoundsChanged\(\)
        \{.*?)(  SizeToContents\(\);.*?)(  UpdateInputProtectorsTimeStamp\(\);)'
      re_flags: [DOTALL]
      replace: |-
        \1  const gfx::Rect bounds_before_anchoring =
              GetWidget()->GetWindowBoundsInScreen();
        \2  if (GetWidget()->GetWindowBoundsInScreen() != bounds_before_anchoring) {
            UpdateInputProtectorsTimeStamp();
          }
