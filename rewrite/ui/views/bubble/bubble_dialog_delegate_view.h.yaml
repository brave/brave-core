# This is necessary because of the use of `VIEWS_EXPORT` in the class
# declaration.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |
      Let Brave's bubble views construct a BddvPassKey.

      These bubble subclasses live in brave/ and need to call the private
      CreatePassKey() so they can construct anchored bubbles the same way
      upstream code does.
    add_friend:
      class_name: BubbleDialogDelegateView
      friend_type:
        - class ::BraveNewsBubbleView
        - class ::BraveHelpBubbleDelegateView
        - class ::WaybackMachineBubbleView
        - class ::playlist::PlaylistBubbleView
        - class ::SplitViewMenuBubble
        - class ::SidebarItemAddedFeedbackBubble
        - class ::SidebarEditItemBubbleDelegateView
        - class ::SidebarAddItemBubbleDelegateView
        - class ::views::BraveBubbleDialogDelegateView
