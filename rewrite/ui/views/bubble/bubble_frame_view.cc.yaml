substitutions:
  - description: |
      Don't snap the dialog width when the delegate opts out of snapping.
    regex:
      pattern: |-
        dialog_delegate && dialog_delegate->buttons() !=
                                     static_cast<int>(ui::mojom::DialogButton::kNone);
      replace: |-
        dialog_delegate && dialog_delegate->buttons() !=
                                     static_cast<int>(ui::mojom::DialogButton::kNone) &&
                                     !dialog_delegate->should_ignore_snapping();
