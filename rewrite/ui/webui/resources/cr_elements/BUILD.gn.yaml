substitutions:
  - description: Build cr_elements against the Brave WebUI resources.
    add_literal_to_list:
      target: build
      list_name: ts_deps
      literal: '[ "//brave/ui/webui/resources:build_ts" ]'
      conditional: '!is_android && !is_ios'
