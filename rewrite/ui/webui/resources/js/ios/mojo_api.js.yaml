substitutions:
  - description: |-
      Tag every outgoing Mojo message with its originating frame id.

      MojoFacade (see the mojo_facade.h/.mm plasters) uses this to route
      watch callbacks and gate Mojo.bindInterface per chrome-untrusted://
      origin correctly for sub-frames, not just the main frame.
    regex:
      re_pattern:
        '(Mojo\.internal\.sendMessage = async function\(message\) \{\n)'
      replace: '\1  message.args.frameId = __gCrWeb.frameId;\n'
