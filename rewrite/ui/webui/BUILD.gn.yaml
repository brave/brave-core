substitutions:
  - description: Import the extensions buildflags.
    add_import:
      import: //extensions/buildflags/buildflags.gni
  - description: |-
      Build ColorChangeHandler whenever the extensions core is built, matching
      the color_change_listener mojom. Component extensions bind it on mobile
      Android too.
    regex:
      re_pattern:
        'if \(\(!is_android && !is_ios\) \|\|
        is_desktop_android\)(\s*\{\s*public_deps \+=\s*\[
        "//ui/webui/resources/cr_components/color_change_listener:mojom" \])'
      replace: 'if ((!is_android && !is_ios) || enable_extensions_core)\1'
