substitutions:
  - description: |-
      Instantiate Brave's incognito tab switcher pane.

      BraveIncognitoTabSwitcherPane replaces the pane's reference button data so
      that the tab switcher shows Brave's private tab icon rather than
      Chromium's incognito one. This factory holds the only construction site,
      so redirecting it is enough to make Brave's subclass the pane used
      everywhere.
    regex:
      re_pattern: |-
        new (IncognitoTabSwitcherPane\()
      replace: |-
        new Brave\1
