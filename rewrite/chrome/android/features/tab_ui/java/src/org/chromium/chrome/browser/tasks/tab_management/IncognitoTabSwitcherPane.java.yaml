substitutions:
  - description: |-
      Let subclasses replace the pane's reference button data.

      BraveIncognitoTabSwitcherPane points this at Brave's private tab icon
      instead of Chromium's incognito one, so the field has to be visible to the
      subclass. `final` goes as well as `private`, because the subclass assigns
      it from its own constructor, after `super()` has already initialized it.
    regex:
      re_pattern: |-
        private final (ResourceButtonData mReferenceButtonData;)
      replace: |-
        protected \1
