substitutions:
  - description: |-
      Instantiate Brave's tab list editor manager, which hides the "Add tabs to
      new group" multi-select menu item when the "Enable tab groups" master
      switch is off.
    regex:
      re_pattern: |-
        new (TabListEditorManager\()
      replace: |-
        new Brave\1
