substitutions:
  - description: |-
      Import Brave's settings search coordinator next to upstream's, which is
      still referenced as the field type.
    regex:
      re_pattern: |-
        (import org\.chromium\.chrome\.browser\.settings\.search\.)(SettingsSearchCoordinator;)
      replace: |-
        \1Brave\2
        \1\2
  - description: |-
      Instantiate Brave's settings search coordinator.

      BraveSettingsSearchCoordinator keeps the search query field from taking
      the focus a fragment's local search gives up, which would otherwise pop
      back to the search results.
    regex:
      re_pattern: |-
        new (SettingsSearchCoordinator\()
      replace: |-
        new Brave\1
