substitutions:
  - description: 'Add import for UrlConstants.'
    regex:
      pattern: 'import org.chromium.chrome.R;'
      replace: |-
        import org.chromium.chrome.R;
        import org.chromium.components.embedder_support.util.UrlConstants;

  - description: |
      Always make chrome:// schemes install rather than creating a shortcut (shortcuts can't handle chrome: urls).
    regex:
      re_pattern: '(doUniversalInstall(\s|.)+?if \()(controller == null\))'
      re_flags: [MULTILINE]
      replace:
        '\1(currentTab.getUrl() != null &&
        UrlConstants.CHROME_SCHEME.equals(currentTab.getUrl().getScheme())) ||
        \3'

  - description:
      'Skip the Install/Create shortcut bottom sheet and add to Home screen
      directly.'
    regex:
      pattern: |-
        boolean webAppInstalled =
      replace: |-
        if (BraveAppInstallMenuHandlerUtils.shouldAddToHomescreenOnly()) return doAddToHomescreen(activity, windowAndroid, modalDialogManager, currentTab, AppMenuVerbiage.APP_MENU_OPTION_ADD_TO_HOMESCREEN);
                boolean webAppInstalled =
