substitutions:
  - description: |-
      Let BraveReaderModeManager call the constructor.

      The bytecode redirects `new ReaderModeManager(...)` to
      BraveReaderModeManager, whose constructor calls this one, so it has to be
      visible to its package.
    regex:
      pattern: 'private ReaderModeManager('
      replace: 'ReaderModeManager('
