substitutions:
  - description:
      'Add Brave imports beneath the Settings search package declaration.'
    regex:
      re_pattern: '^(package [^;]+;\n)'
      re_flags: [MULTILINE]
      replace: |-
        \1
        import org.chromium.chrome.browser.theme.BraveDynamicColors;
        import org.chromium.components.browser_ui.settings.BraveSettingsIconTintUtils;

  - description: |
      Apply the Dynamic Colors tint to the Settings search icon, right after the
      statement in which upstream first resolves it.
    regex:
      re_pattern:
        '(^([ \t]*)[^;]*?(searchBox\.\w+ViewById\(R\.id\.search_icon\))[^;]*;)'
      re_flags: [MULTILINE]
      replace: |-
        \1
        \2BraveSettingsIconTintUtils.applyIconTint(\3, BraveDynamicColors.isDynamicColorsEnabled());
