substitutions:
  - description: |-
      Only remove a window with zero tabs when Brave allows it
    regex:
      re_pattern: |-
        ( +)private void (closeIfNoTabsAndHomepageEnabled)(\(\n +boolean isPendingClosure, boolean shouldRemoveWindowWithZeroTabs\) \{)
      replace: |-
        \1private void \2\3
        \1    if (getTabModelSelector().getTotalTabCount() == 0) {
        \1        shouldRemoveWindowWithZeroTabs = shouldRemoveWindowWithZeroTabs && org.chromium.chrome.browser.partnercustomizations.CloseBraveManager.shouldCloseAppWithZeroTabs();
        \1    }
        \1    \2_ChromiumImpl(isPendingClosure, shouldRemoveWindowWithZeroTabs);
        \1}

        \1private void \2_ChromiumImpl\3
  - description: |-
      Notify Brave once tab state has been initialized
    regex:
      re_pattern: |-
        ( +)public void (onTabStateInitialized)(\(\) \{)
      replace: |-
        \1public void \2\3
        \1    \2_ChromiumImpl();
        \1    onTabStateInitializedHandler();
        \1}

        \1private void \2_ChromiumImpl\3
  - description: |-
      Import Brave's pane order controller

      The constructor below is redirected to `BraveDefaultPaneOrderController`,
      which lives in the same package, so leaving the upstream import in place
      would trip the `UnusedImports` checkstyle rule.
    regex:
      re_pattern: |-
        import org.chromium.chrome.browser.hub.(DefaultPaneOrderController;)
      replace: |-
        import org.chromium.chrome.browser.hub.Brave\1
  - description: |-
      Instantiate Brave's pane order controller
    regex:
      re_pattern: |-
        new (DefaultPaneOrderController\()
      replace: |-
        new Brave\1
