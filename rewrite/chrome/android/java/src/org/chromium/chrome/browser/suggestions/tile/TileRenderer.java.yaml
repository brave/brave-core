substitutions:
  - description: |-
      Open Brave's NTP top-sites widget menu on long-press of the "Add new"
      custom-links button, matching the long-press menu on regular tiles.
      Part of NTP improvements in PR#39092
    regex:
      re_pattern: '(TileView buildAddCustomLinksButton\(.*?)(return tileView;)'
      re_flags: [DOTALL]
      replace: |-
        \1tileView.setOnLongClickListener(
                        (View v) -> {
                            org.chromium.chrome.browser.ntp.BraveNtpWidgetMenu.show(v);
                            return true;
                        });
                \2
