substitutions:
  - description: |-
      Expose getBookmarkBarVisibilityStateSummaryRes() to Brave's Appearance
      settings.

      AppearancePreferences replaces the upstream settings search index
      provider, so it has to set the bookmark bar visibility summary on the
      indexed row itself. It lives in a different package and calls the mapping
      rather than duplicating the three-state switch, which would silently go
      stale if upstream added a state.
    regex:
      re_pattern: |-
        static (@StringRes int getBookmarkBarVisibilityStateSummaryRes\()
      replace: |-
        public static \1
