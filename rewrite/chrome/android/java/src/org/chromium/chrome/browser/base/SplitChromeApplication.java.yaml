substitutions:
  - description: |
      Defer early feature list init on first run, as Chrome-branded builds do.

      Upstream only waits for the first run variations seed when
      IS_CHROME_BRANDED, which is false for Brave, or with
      --variations-server-url. Otherwise the feature list is initialized early
      without the seed on first run, and the native VariationsService can't
      apply the seed until a restart.

      Waiting whenever the seed is to be fetched lets the native
      VariationsService fetch and apply it in the same launch.

      See https://source.chromium.org/chromium/chromium/src/+/f00d1a3a65153510d612597de0dde2a4365ca130
    regex:
      re_pattern: '\(BuildConfig\.IS_CHROME_BRANDED\s*\|\|.*?\)\)\s*&&\s*(VariationsSeedFetcher\.shouldFetchSeed\(\))'
      re_flags: [DOTALL]
      replace: '\1'
