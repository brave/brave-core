substitutions:
  - description: |-
      Split the public constructor so BraveMostVisitedSites can force
      enableCustomLinks on regardless of the ChromeFeatureList state.
    regex:
      re_pattern: 'public MostVisitedSitesBridge\(Profile profile\) \{.*?\}'
      re_flags: [DOTALL]
      replace: |-
        public MostVisitedSitesBridge(Profile profile) {
                this(profile, ChromeFeatureList.sMostVisitedTilesCustomization.isEnabled());
            }

            MostVisitedSitesBridge(Profile profile, boolean enableCustomLinks) {
                mNativeMostVisitedSitesBridge =
                        MostVisitedSitesBridgeJni.get().init(profile, enableCustomLinks);
            }
