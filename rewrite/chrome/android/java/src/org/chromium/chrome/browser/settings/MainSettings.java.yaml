substitutions:
  - description: |-
      Never show the address bar preference in the main settings list.

      Brave shows it in its own Appearance settings. Removing it once from
      BraveMainPreferencesBase is not enough, because upstream re-adds it on
      configuration changes and on toolbar position changes, neither of which
      goes through onResume.
    regex:
      re_pattern: |-
        (private static boolean shouldShowAddressBarPref\(Context context\) \{)
      replace: |-
        \1
                if ((true)) return false;
