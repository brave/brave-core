substitutions:
  - description: |-
      Instantiate Brave's tabbed incognito snapshot controller instead of
      upstream's.

      Part of Brave's Browser Lock feature: lets the "Entire application"
      lock force FLAG_SECURE on the tabbed browser window regardless of
      whether an incognito tab is showing, which is all upstream's own
      controller considers. Same package as the call site, so no import is
      needed.
    regex:
      re_pattern: |-
        new (IncognitoTabbedSnapshotController\()
      replace: |-
        new Brave\1
