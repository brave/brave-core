substitutions:
  - description: |-
      Instantiate Brave's tabbed incognito snapshot controller instead of
      upstream's — same package, so no import is needed.
    regex:
      re_pattern: |-
        new (IncognitoTabbedSnapshotController\()
      replace: |-
        new Brave\1
