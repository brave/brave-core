substitutions:
  - description: |-
      Instantiate Brave's snackbar manager. Fully-qualified instead of
      imported to avoid colliding with the upstream SnackbarManager import,
      which is still needed elsewhere in this file.
    regex:
      re_pattern: |-
        new (SnackbarManager\()
      replace: |-
        new org.chromium.chrome.browser.ui.messages.snackbar.Brave\1
  - description: |-
      Add a hook called once tab state has been restored, so Brave-side code
      can act on it without having to patch every ChromeActivity subclass.
    regex:
      re_pattern: |-
        ( +)(private void clearToolbarResourceCache\(\) \{)
      replace: |-
        \1public void onTabStateInitializedHandler() {}
        \1\2
  - description:
      'Add Brave screenshot-protection controller import beneath the package
      declaration.'
    regex:
      re_pattern: '^(package [^;]+;\n)'
      re_flags: [MULTILINE]
      replace: |-
        \1
        import org.chromium.chrome.browser.screenshot_protection.BraveScreenshotProtectionController;
  - description: |-
      Instantiate Brave's screenshot-protection controller — see {@link
      BraveScreenshotProtectionController} for why.
    regex:
      re_pattern: |-
        new (ScreenshotProtectionController\()
      replace: |-
        new Brave\1
