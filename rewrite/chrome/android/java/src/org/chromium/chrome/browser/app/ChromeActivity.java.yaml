substitutions:
  - description: |-
      Instantiate Brave's snackbar manager.

      Fully-qualified instead of imported, to avoid colliding with the
      upstream SnackbarManager import — still needed elsewhere in this file.
    regex:
      re_pattern: |-
        new (SnackbarManager\()
      replace: |-
        new org.chromium.chrome.browser.ui.messages.snackbar.Brave\1
  - description: |-
      Add a hook called once tab state has been restored.

      Lets Brave-side code act on it without having to patch every
      ChromeActivity subclass.
    add_before_line:
      line: 'private void clearToolbarResourceCache() {'
      code: '    public void onTabStateInitializedHandler() {}'
