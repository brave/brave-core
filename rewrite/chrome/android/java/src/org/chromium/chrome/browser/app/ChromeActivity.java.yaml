substitutions:
  - description: |-
      Create Brave's snackbar manager.

      `BraveSnackbarManager` carries the custom text, action and click
      handling Brave's snackbars ask for across the views showing them.
    regex:
      pattern: 'new SnackbarManager('
      replace:
        'new
        org.chromium.chrome.browser.ui.messages.snackbar.BraveSnackbarManager('

  - description: |-
      Add a hook for `BraveActivity` once the tab state is initialised.
    add_before_line:
      line: 'private void clearToolbarResourceCache() {'
      code: |2-
            public void onTabStateInitializedHandler() {}
