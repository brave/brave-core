substitutions:
  - description: |-
      Add the Brave top-center notice.

      It replaces the bottom snackbar, which covers subtitles and video
      controls and can outlive its timeout behind other snackbars.
    regex:
      re_pattern: '(public class ExclusiveAccessBubble \{)'
      replace: |-
        \1
            private final BraveExclusiveAccessNotice mBraveNotice;

  - description: |-
      Create the Brave notice with the bubble.
    regex:
      re_pattern: '(mParentContext = parentContext;)'
      replace: |-
        \1
                mBraveNotice = new BraveExclusiveAccessNotice(parentContext);

  - description: |-
      Show the Brave notice instead of the snackbar.

      The snackbar remains the fallback when the activity has no content view.
    regex:
      re_pattern: '(public void show\(\) \{)'
      replace: |-
        \1
                if (mBraveNotice.show(mText)) return;

  - description: |-
      Update the Brave notice instead of the snackbar.
    regex:
      re_pattern:
        '(public void update\(@JniType\("std::u16string"\) String text\) \{)'
      replace: |-
        \1
                if (mBraveNotice.update(text)) {
                    mText = text;
                    return;
                }

  - description: |-
      Hide the Brave notice with the bubble.
    regex:
      re_pattern: '(public void hide\(\) \{)'
      replace: |-
        \1
                mBraveNotice.hide();

  - description: |-
      Report the Brave notice's visibility.
    regex:
      re_pattern: '(public boolean isVisible\(\) \{)'
      replace: |-
        \1
                if (mBraveNotice.isVisible()) return true;
