substitutions:
  - description: |-
      Expose the current fullscreen notice preference to the native bubble.
    regex:
      re_pattern: '(public class ExclusiveAccessBubble\s*\{)'
      replace: |-
        \1
            @CalledByNative
            public boolean shouldShowFullscreenNotice() {
                return org.chromium.chrome.browser.preferences.ChromeSharedPreferences.getInstance()
                        .readBoolean(org.chromium.base.BravePreferenceKeys.BRAVE_SHOW_FULLSCREEN_NOTICES, true);
            }
