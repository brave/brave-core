substitutions:
  - description: |-
      Read the fullscreen notice preference on each legacy display attempt.
    regex:
      re_pattern: '(private void showNotificationToast\(\)\s*\{)'
      replace: |-
        \1
                    if (!org.chromium.chrome.browser.preferences.ChromeSharedPreferences.getInstance()
                            .readBoolean(org.chromium.base.BravePreferenceKeys.BRAVE_SHOW_FULLSCREEN_NOTICES, true)) {
                        hideNotificationToast();
                        return;
                    }
