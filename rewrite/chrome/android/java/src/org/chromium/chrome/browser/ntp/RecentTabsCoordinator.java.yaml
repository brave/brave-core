substitutions:
  - description: |-
      Use Brave's context menu manager, which hides "Open in new tab in group"
      on the Recent tabs page when the "Enable tab groups" master switch is off.
    regex:
      re_pattern: |-
        new (ContextMenuManager\()
      replace: |-
        new org.chromium.chrome.browser.native_page.Brave\1
  - description: |-
      Post nudge for mRecentTabsManager

      Otherwise RecentTabsManager.onUpdateDone is fired when
      RecentTabsManager.mUpdatedCallback is not yet set and the recent tabs
      remains empty if launched after the app start
    regex:
      re_pattern: |-
        (mRecentTabsManager\.setUpdatedCallback\(this::onUpdated\);)
      replace: |-
        \1
                org.chromium.base.task.PostTask.postTask(
                        org.chromium.base.task.TaskTraits.UI_DEFAULT, mRecentTabsManager::syncStateChanged);
