substitutions:
  - description: |-
      Open Brave's bookmark activity from the bookmark manager intent

      `BraveBookmarkActivity` carries Brave's bookmark manager customisations.
    regex:
      re_pattern: '(new Intent\(.*?,\s*)BookmarkActivity\.class\)'
      re_flags: [DOTALL]
      replace: '\1org.chromium.chrome.browser.app.bookmarks.BraveBookmarkActivity.class)'
