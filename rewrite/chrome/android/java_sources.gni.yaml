substitutions:
  - description: |
      Add the Brave java sources.

      `chrome_java_sources` is supplied by an `import()` rather than assigned
      here, so the append goes below the file's imports.
    add_literal_to_variable:
      variable: chrome_java_sources
      literal: brave_java_sources
      assume_defined: true
