substitutions:
  - description: Keep the Brave resources the exclusion regex would drop.
    add_literal_to_list:
      target: target_name
      list_name: resource_exclusion_exceptions
      literal: brave_resources_exclusion_exceptions
      type: target
      template: chrome_common_apk_or_module_tmpl

  - description: Add the Brave ProGuard flags.
    add_literal_to_list:
      target: target_name
      list_name: proguard_configs
      literal: '[ "//brave/android/java/proguard.flags" ]'
      type: target
      conditional: '!is_java_debug'
      template: chrome_common_apk_or_module_tmpl

  - description: Package the WireGuard native library.
    append_to_target:
      target: target_name
      type: target
      template: chrome_common_apk_or_module_tmpl
      code: |-
        _wireguard_target =
            "//brave/third_party/android_deps:com_wireguard_android_J__unpack_aar"
        deps += [ _wireguard_target ]
        _libwireguard_dir =
            get_label_info(
                "//brave/third_party/android_deps:com_wireguard_android($default_toolchain)",
                "target_out_dir") + "/com_wireguard_android_java/jni"
        loadable_modules += [ "$_libwireguard_dir/$android_app_abi/libwg-go.so" ]
