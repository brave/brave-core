substitutions:
  - description: |
      Route base-class calls through BraveMainDelegate

      ChromeMainDelegateAndroid now extends BraveMainDelegate (see
      chrome_main_delegate_android.h.yaml), so its overrides must call up
      through the same base.
    rename_class:
      class_name: ChromeMainDelegate
      rename: BraveMainDelegate
