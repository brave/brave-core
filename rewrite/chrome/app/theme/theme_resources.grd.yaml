substitutions:
  - description: |-
      Match top_sites_factory.cc's extensions condition.

      chrome/browser/history/top_sites_factory.cc uses IDR_WEBSTORE_ICON_32
      whenever BUILDFLAG(ENABLE_EXTENSIONS_CORE) is on, which is also true on
      regular Android now that enable_extensions_core is forced on there; the
      resource ID goes undeclared otherwise.
    count: 2
    regex:
      pattern: 'not is_android or is_desktop_android'
      replace: 'not is_android or enable_extensions_core'
