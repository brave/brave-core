substitutions:
  - description: Add the Brave theme resources on desktop.
    add_literal_to_list:
      target: webui_theme_resources
      list_name: deps
      literal: '[ "//brave/app/theme:brave_theme_resources" ]'
      conditional: '!is_android'

  - description: |-
      Add the Brave unscaled resources on desktop

      The target declares no `deps` to add a conditional after.
    append_to_target:
      target: chrome_unscaled_resources
      code: |-
        if (!is_android) {
          deps = [ "//brave/app/theme:brave_unscaled_resources" ]
        }
