substitutions:
  - description: |
      Point kPerformanceSubPage at the system settings subpage

      Brave's performance settings live under the system subpage instead.
    regex:
      re_pattern:
        '(inline constexpr char kPerformanceSubPage\[\] = )"performance"'
      replace: '\1"system"'
