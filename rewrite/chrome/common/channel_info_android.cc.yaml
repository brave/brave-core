substitutions:
  - description: |
      Brand the Android canary channel as Nightly

      Chrome's CANARY channel is branded as Nightly on Android, not Canary.
    preempt_function_impl:
      function_name: GetChannelName
      return_if: 'GetChannel() == version_info::Channel::CANARY'
      return_value: '"nightly"'
