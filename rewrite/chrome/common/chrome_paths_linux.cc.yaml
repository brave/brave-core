substitutions:
  - description: |
      Use Brave's own user data directory naming scheme

      Brave doesn't use CHROME_CONFIG_HOME or Google Chrome's directory names;
      it always lives under BraveSoftware, with a channel-specific suffix and
      a separate name when Brave Origin branded. This preempts the upstream
      body unconditionally, so it never runs.
    preempt_function_impl:
      function_name: GetDefaultUserDataDirectory
      code: |-
        return BraveGetDefaultUserDataDirectory(result);
