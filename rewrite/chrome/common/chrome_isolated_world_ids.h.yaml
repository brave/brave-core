substitutions:
  - description: |
      Add an isolated world ID for internal Brave features

      Kept before ISOLATED_WORLD_ID_EXTENSIONS, which extensions' dynamically
      assigned isolated worlds treat as a lower bound.
    add_enum_entries:
      enum_name: ChromeIsolatedWorldIDs
      max_value: ISOLATED_WORLD_ID_EXTENSIONS
      entries:
        - ISOLATED_WORLD_ID_BRAVE_INTERNAL
