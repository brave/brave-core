substitutions:
  - description: |
      Rebrand the built-in PDF plugin as Chrome PDF Plugin

      Sites detect the PDF viewer plugin by name; Brave presents the Chrome
      name here regardless of GOOGLE_CHROME_BRANDING.
    after_function_impl:
      function_name: ChromeContentClient::AddPlugins
      code: |-
        RenameChromiumPdfPluginToChrome(plugins);
