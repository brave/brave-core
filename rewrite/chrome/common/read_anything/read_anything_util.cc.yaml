substitutions:
  - description: |-
      Only offer the Read Anything fonts that ship with Brave.
    after_function_impl:
      function_name: GetSupportedFonts
      result_var: font_choices
      code: |-
        UpdateSupportedFonts(font_choices, language_code);
        return font_choices;
