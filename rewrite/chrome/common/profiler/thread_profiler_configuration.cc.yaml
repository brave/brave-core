substitutions:
  - description: |
      Never enable the stack sampling profiler

      Brave disables the stack sampling profiler for all processes and
      threads.
    preempt_function_impl:
      function_name: ThreadProfilerConfiguration::IsProfilerEnabledForCurrentProcessAndThread
      code: |-
        if ((true)) {
          return false;
        }
