substitutions:
  - description: |
      Register Brave's path provider alongside Chrome's

      RegisterPathProvider() is the single entry point that registers path
      providers at startup. Brave's provider piggybacks on it.
    after_function_impl:
      function_name: RegisterPathProvider
      code: |-
        brave::RegisterBravePathProvider();
