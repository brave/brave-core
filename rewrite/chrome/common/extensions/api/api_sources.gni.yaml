substitutions:
  - description: |-
      Leave the mDNS API schema out on mobile Android, matching the
      //chrome/browser/extensions/api/mdns dependency.
    regex:
      re_pattern:
        'if \(enable_service_discovery\)(\s*\{\s*schema_sources_ \+= \[
        "mdns\.idl" \])'
      replace:
        'if (enable_service_discovery && (!is_android || is_desktop_android))\1'
