substitutions:
  - description: |
      Expose cookieStoreId on chrome.tabs.Tab (Firefox-compatible name) so
      extensions can pass it to chrome.cookies as storeId. Values are "0",
      "1", or "containers:<uuid>".
    regex:
      pattern: '"sessionId": {"type": "string", "optional": true, "description": "The session ID used to uniquely identify a tab obtained from the $(ref:sessions) API."}'
      replace: >-
        "sessionId": {"type": "string", "optional": true, "description": "The session ID used to uniquely identify a tab obtained from the $(ref:sessions) API."},
                  "cookieStoreId": {"type": "string", "optional": true, "description": "The cookie store of the tab. Use with $(ref:cookies) as <code>storeId</code>. Values are <code>\"0\"</code> (default), <code>\"1\"</code> (incognito), or <code>\"containers:&lt;uuid&gt;\"</code> for a Brave container tab."}
