substitutions:
  - description: |
      Always provide real CDM host file paths

      Upstream only fills in CDM host file paths (needed for Widevine host
      verification) for official Google Chrome builds, and stubs them out
      otherwise. Brave ships signed binaries like Chrome and needs the real
      paths regardless of GOOGLE_CHROME_BRANDING.
    regex:
      re_pattern: '^#if BUILDFLAG\(GOOGLE_CHROME_BRANDING\)$'
      re_flags: [MULTILINE]
      replace: '#if 1  // Always take the real path below; see description.'
