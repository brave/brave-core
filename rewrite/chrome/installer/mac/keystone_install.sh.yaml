substitutions:
  - description: |-
      Look for Brave instead of Google Chrome on the update image.

      Instead of hardcoding Brave's channel-specific app and framework names,
      derive them from the installed app's CFBundleDisplayName. This also works
      when the user renamed the app on disk, because the display name inside
      the bundle is unaffected by such renames. KS_TICKET_XC_PATH is set by the
      updater and points to the installed app.
    regex:
      re_pattern:
        'readonly APP_DIR_NAMES=\( [^)]+ \)\n\s+readonly FRAMEWORK_NAME="Google
        Chrome Framework"'
      replace: |-
        readonly INSTALLED_APP_PATH=\
        "${GOOGLE_CHROME_UPDATER_TEST_PATH:-${KS_TICKET_XC_PATH:-}}"
          readonly PRODUCT_NAME=\
        "$(infoplist_read "${INSTALLED_APP_PATH}/Contents/Info" \
                          "CFBundleDisplayName")"
          readonly APP_DIR_NAMES=( "${PRODUCT_NAME}.app" )
          readonly FRAMEWORK_NAME="${PRODUCT_NAME} Framework"

  - description: |-
      Try various fixes for exit code 7 failures.

      We anchor on upstream's `exit 7` because it is expected to remain unchanged.
      The reasons are:
       1. The numeric value gets used in telemetry.
       2. It is documented at the top of the script.
       3. Other numeric error values in //chrome/installer are treated as unchangeable.

      We start our custom codes at 70 in order to not clash with upstream's, even in
      case they add new ones beyond the current maximum 14.
    regex:
      pattern: 'exit 7'
      replace: |-
        # Try various remedies; Report in exit code what would have worked.
            local mkdir_stderr
            if ! mkdir_stderr="$(mkdir -p "${new_versioned_dir}" 2>&1 1>/dev/null)"
            then
              # If `mkdir` fails, then other remedies won't work either; Exit with a
              # code that tells us the cause.
              case "${mkdir_stderr}" in
                *"Read-only file system"*)
                  exit 70 ;;
                *"No space left on device"*|*"Disc quota exceeded"*)
                  exit 71 ;;
                *"Operation not permitted"*)
                  exit 72 ;;
                *"Permission denied"*)
                  exit 73 ;;
                *"File exists"*|*"Not a directory"*)
                  exit 74 ;;
                *)
                  exit 75 ;;
              esac
            fi
            # `mkdir` succeeded. Retry the original rsync. If it succeeds, then clean
            # up and return an exit code that tells us that this fix is worth keeping.
            if rsync ${RSYNC_FLAGS} --delete-before "${update_versioned_dir}/" \
                                                    "${new_versioned_dir}"; then
              rm -rf "${new_versioned_dir}"
              exit 76
            fi
            # Another potential remedy is to rsync into the parent directory. As
            # before, if this succeeds, clean up and return a unique exit code that
            # tells us that this workaround is worth keeping.
            if rsync ${RSYNC_FLAGS} --delete-before "${update_versioned_dir}" \
                                                    "${installed_versions_dir}"; then
              rm -rf "${new_versioned_dir}"
              exit 77
            fi
            # Try the same rsync-into-parent, but from a clean slate.
            rm -rf "${new_versioned_dir}"
            if rsync ${RSYNC_FLAGS} --delete-before "${update_versioned_dir}" \
                                                    "${installed_versions_dir}"; then
              rm -rf "${new_versioned_dir}"
              exit 78
            fi
            # None of the attempted remedies worked.
            rm -rf "${new_versioned_dir}"
            exit 79
