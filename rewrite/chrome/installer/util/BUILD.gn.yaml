substitutions:
  - description: Add the Brave installer util deps.
    add_literal_to_list:
      target: with_no_strings
      list_name: deps
      literal: brave_chromium_src_chrome_installer_util_deps
      import: //brave/chromium_src/chrome/installer/util/sources.gni

  - description: Generate the installer strings from the Brave strings.
    insert_into_list:
      target: generate_strings
      list_name: sources
      values:
        - //chrome/app/brave_strings.grd

  - description: Make the Brave installer util sources available.
    add_import:
      import: //brave/installer/util/sources.gni

  - description: Extract the installer strings with the Brave data file.
    append_to_target:
      target: generate_strings
      code: |-
        extractor_datafile =
            brave_installer_util_generate_strings_extractor_datafile
