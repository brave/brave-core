substitutions:
  - description: |-
      Run the browser as a child of the wrapper, ignoring its exit status.

      Replacing the wrapper with `exec -a` made the browser segfault on some
      systems (brave/brave-browser#4142).
    regex:
      pattern: 'exec -a "$0" "$HERE/@@PROGNAME" "$@"'
      replace: '"$HERE/@@PROGNAME" "$@" || true'
