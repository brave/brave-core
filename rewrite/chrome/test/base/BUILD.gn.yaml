substitutions:
  - description: |
      Link the stable farbling tokens Brave's `ChromeTestSuite` holds.

      The chromium_src override of chrome_test_suite.h keeps a
      `ScopedStableFarblingTokensForTesting` for every test binary, including
      those that don't depend on `//chrome/test:test_support`, which otherwise
      brings in Brave's test deps.
    add_literal_to_list:
      target: chrome_test_suite
      list_name: deps
      literal:
        '[ "//brave/components/brave_shields/core/browser:test_support" ]'
