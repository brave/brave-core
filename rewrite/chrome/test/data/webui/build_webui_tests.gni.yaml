substitutions:
  - description: |-
      Pass caller-supplied defines to static test file preprocessing.

      Preserve the default Chromium defines and add any supplied by the caller.
    append_to_target:
      target: preprocess_static_files
      type: preprocess_if_expr
      code: |-
        if (defined(invoker.preprocessor_defines)) {
          defines += invoker.preprocessor_defines
        }
  - description: |-
      Pass caller-supplied defines to TypeScript test preprocessing.

      Use the same defines as static test files so both follow the same conditions.
    append_to_target:
      target: preprocess
      type: preprocess_if_expr
      code: |-
        if (defined(invoker.preprocessor_defines)) {
          defines += invoker.preprocessor_defines
        }
