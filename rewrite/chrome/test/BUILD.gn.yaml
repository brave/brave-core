substitutions:
  - description: Add the deps the Brave test support overrides need.
    add_literal_to_list:
      target: test_support
      list_name: deps
      literal: brave_chromium_src_chrome_test_test_support_deps
      import: //brave/chromium_src/chrome/test/sources.gni

  - description: Add the Brave test support sources.
    add_literal_to_list:
      target: test_support
      list_name: sources
      literal: brave_chromium_src_chrome_test_test_support_sources
      import: //brave/chromium_src/chrome/test/sources.gni

  - description: Add the Brave unit test deps.
    add_literal_to_list:
      target: unit_tests
      type: test
      list_name: deps
      literal: brave_chromium_src_chrome_test_unit_tests_deps
      import: //brave/chromium_src/chrome/test/sources.gni

  - description: Depend on the Brave browser test support.
    insert_into_list:
      target: interactive_ui_tests
      list_name: deps
      values:
        - //brave/test:browser_test_support

  - description: |-
      Gate the desktop Android extension browser tests on desktop Android.

      They are desktop Android specific and Brave sets
      enable_desktop_android_extensions on mobile Android too.
    regex:
      re_pattern:
        'if \(enable_desktop_android_extensions\)(\s*\{\s*deps \+=
        \[\s*"//chrome/browser/extensions:browser_tests",)'
      replace: 'if (is_desktop_android)\1'
