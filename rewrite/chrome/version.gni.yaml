substitutions:
  - description: Provides the Brave version.
    add_import:
      import: //brave/build/version.gni

  - description: Use the Brave version as the Android version name.
    regex:
      pattern: 'chrome_version_name = chrome_version_full'
      replace: 'chrome_version_name = brave_version'
