substitutions:
  - description: |
      Trigger an on-demand install once the CRL Set component registers.

      https://github.com/brave/browser-android-tabs/issues/857
    regex:
      pattern: 'installer->Register(cus, base::OnceClosure());'
      replace: |-
        installer->Register(g_browser_process->component_updater(),
                              base::BindOnce(&OnCRLSetRegistered));
