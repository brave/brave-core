substitutions:
  - description: |-
      Ignore component-updated key pins.

      Brave enforces only its own compiled-in pins. The component's pins go to
      both the network service and the cert verifier service, so they are
      dropped here, before either gets them, still reporting the step done.
    preempt_function_impl:
      function_name: PKIMetadataComponentInstallerService::ProcessKeyPinsListOnUI
      code: |-
        if ((true)) {
          std::move(done_callback).Run();
          return;
        }
