substitutions:
  - description: 'Let callers observe when Widevine CDM registration finishes.'
    regex:
      pattern: 'void RegisterWidevineCdmComponent(ComponentUpdateService* cus);'
      replace:
        'void RegisterWidevineCdmComponent(ComponentUpdateService* cus,
        base::OnceClosure callback = base::OnceClosure());'
