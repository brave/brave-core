substitutions:
  - description:
      'Drop the upstream VLOG; Brave does not log component registration.'
    regex:
      re_pattern:
        '  VLOG\(1\) << "Registering File Type Policies component\.";\n'
      replace: ''

  - description: 'Trigger an on-demand install once the component registers.'
    regex:
      pattern: 'installer->Register(cus, base::OnceClosure());'
      replace:
        'installer->Register(cus,
        base::BindOnce(&OnFileTypePoliciesRegistered));'
