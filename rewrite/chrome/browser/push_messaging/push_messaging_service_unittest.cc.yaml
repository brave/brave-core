substitutions:
  - description: |-
      Base the push messaging test profile on `BraveTestingProfile`.

      Brave keeps GCM off unless `kBraveGCMChannelStatus` is set, which
      `BraveTestingProfile` does, so push subscriptions can work. Other uses
      of `TestingProfile` in the file, such as the profiles
      `TestingProfileManager` returns, stay upstream's.
    regex:
      re_pattern:
        '(class PushMessagingTestingProfile : public )TestingProfile\b'
      replace: '\1BraveTestingProfile'
