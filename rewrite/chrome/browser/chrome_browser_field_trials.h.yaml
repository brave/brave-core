substitutions:
  - description: |-
      Rename upstream's class so Brave's subclass can take its name.

      Brave's `ChromeBrowserFieldTrials`, declared in the `chromium_src` shadow,
      sets up no client-side field trials, and adds Brave's feature overrides.
    rename_class:
      class_name: ChromeBrowserFieldTrials
      rename: ChromeBrowserFieldTrials_ChromiumImpl
