substitutions:
  - description: |-
      Add the deps the Brave autocomplete header overrides need.

      The overridden `chrome_autocomplete_provider_client.h` includes Brave
      buildflags and the commander frontend delegate.
    add_literal_to_list:
      target: autocomplete
      list_name: public_deps
      literal: brave_chromium_src_chrome_browser_autocomplete_public_deps
      import: //brave/chromium_src/chrome/browser/autocomplete/sources.gni
  - description: |-
      Add the deps the Brave autocomplete source overrides need.

      Without them the generated headers those overrides include, such as the
      sidebar's buildflags, are not ordered before this target compiles.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_chromium_src_chrome_browser_autocomplete_impl_deps
