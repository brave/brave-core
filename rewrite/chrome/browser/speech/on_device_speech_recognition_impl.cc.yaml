# The function body opens with a BUILDFLAG(IS_ANDROID) conditional that
# tree-sitter cannot parse, so blank parse-blocking macros before AST matching.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |
      Brave's policy already answers `kDictation`, but upstream refuses it
      before asking unless `kOnDeviceWebSpeechSmallExpertModel` is enabled.
      Treating it as `kCommand` gets past that gate, so `available()` reaches
      the policy as `kCommand`.
    preempt_function_impl:
      function_name: OnDeviceSpeechRecognitionImpl::Available
      code: |-
        if (quality == media::mojom::SpeechRecognitionQuality::kDictation) {
          quality = media::mojom::SpeechRecognitionQuality::kCommand;
        }
