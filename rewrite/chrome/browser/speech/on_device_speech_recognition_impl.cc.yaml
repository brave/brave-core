# Both function bodies open with a BUILDFLAG(IS_ANDROID) conditional that
# tree-sitter cannot parse, so blank parse-blocking macros before AST matching.
blank_macros_for_ast_parsing: true

substitutions:
  - description: |-
      Take upstream's SODA branch for `kDictation` in `available()`.

      Upstream otherwise refuses `kDictation` before it asks Brave's policy,
      unless `kOnDeviceWebSpeechSmallExpertModel` is enabled. The SODA branch
      also reads the same language names that `install()` records for the
      origin. The mapping only selects the branch: Brave's policy answers
      `kCommand` and `kDictation` alike.

      Upstream matches each tag to the first SODA locale of the same language,
      so "es-MX" would give "es-ES". The hook changes the tags to Brave's own
      locale tags, such as "es-US" for "es-MX", and answers `kUnavailable`
      when a tag has no Brave locale.
    preempt_function_impl:
      function_name: OnDeviceSpeechRecognitionImpl::Available
      return_if: |-
        MaybeHandleBraveOnDeviceSpeechAvailable(
                weak_ptr_factory_.GetWeakPtr(), languages, quality, callback)

  - description: |-
      Cancel `install()` in Private, Tor and Guest profiles, and otherwise ask
      before it downloads Brave's model.

      The prompt comes before upstream can start a download. Once the user
      allows it, `Install` runs again from the top, so every upstream check
      runs again.

      As in `available()`, the hook changes the tags to Brave's own locale
      tags, and cancels when a tag has no Brave locale. It also takes
      upstream's SODA branch for `kDictation`. That branch is where
      `BraveSodaInstaller` installs Brave's model. Upstream's other branch,
      the optimization guide one, asks for a model that Brave does not ship.
    preempt_function_impl:
      function_name: OnDeviceSpeechRecognitionImpl::Install
      return_if: |-
        MaybeHandleBraveOnDeviceSpeechInstall(
                CanRenderFrameHostUseOnDeviceSpeechRecognition(),
                weak_ptr_factory_.GetWeakPtr(), languages, quality, callback)
