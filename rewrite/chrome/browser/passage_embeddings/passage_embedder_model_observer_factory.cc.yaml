substitutions:
  - description: |-
      Build the passage embedder model observer when semantic history search
      is enabled for the profile.

      Both embedding services refuse to build without this observer, and
      upstream's own gates (kPassageEmbedder, kPermissionsAIv4) are off in
      Brave. BraveShouldBuildPassageEmbedderModelObserver is defined in the
      chromium_src override.
    regex:
      pattern: 'if (!base::FeatureList::IsEnabled(kPassageEmbedder) &&'
      replace: |-
        if (!BraveShouldBuildPassageEmbedderModelObserver(context) &&
              !base::FeatureList::IsEnabled(kPassageEmbedder) &&
