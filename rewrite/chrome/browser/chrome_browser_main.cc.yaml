substitutions:
  - description: |-
      Only prompt for updater promotion when Brave is using Omaha 4.

      Most macOS users are still updated by Sparkle, which manages promotion
      itself, so the Keystone promotion infobar must not reach them.
    preempt_function_impl:
      function_name: PromptUpdaterPromotion
      return_if: '!ShouldPromptUpdaterPromotion()'
