substitutions:
  - description: |
      Fully qualify `features::kImmersiveReadAnything`.

      It is not clear how this is building fine in upstream but failing with
      brave, as no `chromium_src` uses are involved, so we are patching it for
      the moment.
    regex:
      pattern: 'features::kImmersiveReadAnything'
      replace: '::features::kImmersiveReadAnything'
