substitutions:
  - description: |-
      Skip platform auth (Cloud AP SSO) for container tabs.

      SSO must not run in contained tabs: it would leak the device-account
      identity between the default profile and containers, with no way for the
      user to prevent that.
    preempt_function_impl:
      function_name: PlatformAuthNavigationThrottle::MaybeCreateAndAdd
      return_if: brave::ShouldSkipPlatformAuth(registry)
