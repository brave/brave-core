substitutions:
  - description:
      'Track kAdBlockDeveloperMode alongside the other tracked prefs.'
    regex:
      re_pattern: |-
        (const auto kTrackedPrefs = std::to_array<prefs::TrackedPreferenceMetadata>\(\{.*?)(\n\}\);)
      re_flags: [DOTALL]
      replace: |-
        \1
            {90, brave_shields::prefs::kAdBlockDeveloperMode,
             EnforcementLevel::ENFORCE_ON_LOAD, PrefTrackingStrategy::ATOMIC,
             ValueType::IMPERSONAL},\2
