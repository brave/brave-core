substitutions:
  - description: Count Brave's avatar icons.
    regex:
      re_pattern: '(kDefaultAvatarIconsCount = 56);'
      replace: '\1 + kBraveDefaultAvatarIconsCount;'

  - description: Let Brave adjust where the modern avatar icons start.
    add_before_line:
      line: 'return GetPlaceholderAvatarIndex() + 1;'
      code: |2-
          BRAVE_GET_MODERN_AVATAR_ICON_START_INDEX

  - description: Let Brave supply its avatar icon resources.
    add_after_line:
      line: 'CHECK_LT(index, kDefaultAvatarIconsCount);'
      code: |2-
          BRAVE_GET_DEFAULT_AVATAR_ICON_RESOURCE_INFO

  - description:
      Let Brave adjust the avatar list for profiles without an account.
    add_after_line:
      line: 'base::Value(std::move(generic_avatar_info)));'
      code: |2-
            BRAVE_GET_ICONS_AND_LABELS_FOR_PROFILE_AVATAR_SELECTOR_NOT_SIGNED_IN

  - description: |-
      Select neither the account picture nor a preset while a custom image is
      selected.

      The custom image replaces the stored preset and the account picture
      without clearing them.
    add_after_line:
      line: 'using_gaia ? SIZE_MAX : entry->GetAvatarIconIndex();'
      code: |2-
          if (BraveIsCustomProfileImageSelected(*entry)) {
            using_gaia = false;
            selected_avatar_idx = SIZE_MAX;
          }

  - description: |-
      Choosing a preset avatar replaces a custom profile image.

      An unchanged pref emits no update, and observers must see the new preset
      when the custom image is deactivated, so update the entry directly.
    add_before_line:
      line: 'ProfileMetrics::LogProfileAvatarSelection(avatar_icon_index);'
      code: |2-
          if (ProfileAttributesEntry* entry =
                  g_browser_process->profile_manager()
                      ->GetProfileAttributesStorage()
                      .GetProfileAttributesWithPath(profile->GetPath())) {
            entry->SetAvatarIconIndex(avatar_icon_index);
            BraveSelectFallbackProfileImage(*entry);
          }
