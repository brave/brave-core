substitutions:
  - description: Make Tor profiles behave like incognito profiles.
    preempt_function_impl:
      function_name: Profile::IsIncognitoProfile
      code: |-
        if (IsTor()) {
          return true;
        }

  - description: Make Tor profiles behave like incognito profiles.
    preempt_function_impl:
      function_name: Profile::IsPrimaryOTRProfile
      code: |-
        if (IsTor()) {
          return true;
        }

  - description: Make Tor profiles behave like incognito profiles.
    regex:
      pattern: 'if (*this == PrimaryID() || IsDevTools() ||'
      replace: 'if (*this == PrimaryID() || IsDevTools() || *this == TorID() ||'
