substitutions:
  - description: Run Brave's profile attribute migrations.
    preempt_function_impl:
      function_name: ProfileAttributesEntry::MigrateObsoleteProfileAttributes
      code: |-
        BRAVE_PROFILE_ATTRIBUTES_ENTRY_MIGRATE_OBSOLETE_PROFILE_ATTRIBUTES

  - description: Use the active custom profile image before any other avatar.
    preempt_function_impl:
      function_name: ProfileAttributesEntry::GetAvatarIconWithType
      code: |-
        if (gfx::Image custom_image = BraveGetCustomProfileImage(*this);
            !custom_image.IsEmpty()) {
          return {custom_image, AvatarIconType::kNonPlaceholder};
        }
