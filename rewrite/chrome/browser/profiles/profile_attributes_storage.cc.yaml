substitutions:
  - description: |-
      Delete the custom profile image with its profile.

      The deletion runs on the image file sequence after any accepted write.
    preempt_function_impl:
      function_name: ProfileAttributesStorage::RemoveProfile
      code: |-
        if (ProfileAttributesEntry* entry =
                GetProfileAttributesWithPath(profile_path)) {
          BraveRemoveCustomProfileImage(*entry);
        }
