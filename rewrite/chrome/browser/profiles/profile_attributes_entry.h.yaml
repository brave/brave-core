substitutions:
  - description: |-
      Define the destructor out of line.

      Brave adds a member that owns the custom profile image state, which makes
      the destructor non-trivial.
    regex:
      pattern: 'virtual ~ProfileAttributesEntry() = default;'
      replace: 'virtual ~ProfileAttributesEntry();'

  - description: Let the custom profile image keep its state on the entry.
    add_friend:
      class_name: ProfileAttributesEntry
      friend_type: class custom_profile_image::ProfileImage

  - description: |-
      Hold the custom profile image state.

      The entry owns it so its lifetime matches the profile's attributes. The
      base type gives it a virtual destructor without including profile_image.h,
      which is desktop only.
    add_to_protected:
      class_name: ProfileAttributesEntry
      code: |-
        std::unique_ptr<base::SupportsUserData::Data> custom_profile_image_;
