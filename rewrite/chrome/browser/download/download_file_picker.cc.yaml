substitutions:
  - description: |-
      Title the save dialog with the origin that started the download.

      `GetTitle()`, in the chromium_src override, builds Brave's title from the
      initiating frame's origin and the download's caller.
    regex:
      re_pattern: '(select_file_dialog_->SelectFile\(\s*ui::SelectFileDialog::SELECT_SAVEAS_FILE,\s*)std::u16string\(\)'
      replace: |-
        \1GetTitle(
                  content::DownloadItemUtils::GetRenderFrameHost(download_item_),
                  std::u16string(), &caller)
