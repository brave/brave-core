substitutions:
  - description: >-
      Our get_installed_version_mac.mm override includes the updater buildflags
      header.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: '[ "//brave/browser/updater:buildflags" ]'
      conditional: is_mac
