substitutions:
  - description: |
      Correct the screenshot overlay's bounds for
      NativeViewHostManagesLayers.

      CreateAndAddUIOverlay() and ResetUIOverlayBounds() both compute the
      overlay bounds identically, so the same fix applies in both places.
      See https://github.com/brave/brave-browser/issues/58258.
    count: 2
    regex:
      pattern: 'const gfx::Rect bounds = native_window->bounds();'
      replace: |-
        const gfx::Rect bounds = AdjustScreenshotOverlayBounds(native_window->bounds());
