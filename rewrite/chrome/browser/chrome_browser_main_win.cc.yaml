substitutions:
  - description: |
      Do not treat a failed OSCrypt init as a programming error.

      Brave declines to mint a replacement key when the stored one cannot be
      read or decrypted, so `Init()` now returns false for an ordinary
      environment condition that resolves on a later launch. Asserting on it
      would crash developer builds every time it happened.
      See https://github.com/brave/brave-browser/issues/40375.
    regex:
      pattern: 'DCHECK(os_crypt_init);'
      replace: |-
        LOG_IF(ERROR, !os_crypt_init)
              << "OSCrypt was not initialized; encrypted data is unavailable "
                 "for this session.";

  - description: |
      Point the OSCrypt key history recorder at this installation's key.

      Runs here because `Local State` is loaded and the user data directory is
      known, and because it is before anything can decrypt. Nothing is written
      until a decrypt of stored data proves the key still works.
    regex:
      pattern: |-
        base::SetExtraNoExecuteAllowedPath(chrome::DIR_USER_DATA);
      replace: |-
        {
            base::FilePath user_data_dir;
            base::PathService::Get(chrome::DIR_USER_DATA, &user_data_dir);
            brave::InitializeOSCryptKeyHistoryRecorder(user_data_dir,
                                                       local_state);
          }

          base::SetExtraNoExecuteAllowedPath(chrome::DIR_USER_DATA);
