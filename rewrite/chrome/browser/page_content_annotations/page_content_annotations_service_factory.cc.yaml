substitutions:
  - description: |-
      Gate the page content annotation pipeline on Brave's feature check.

      Brave runs it only for its own History Embeddings, so the upstream
      feature flags don't turn it on. The check is in the `chromium_src`
      shadow.
    regex:
      re_pattern: '(page_content_annotations::features::\s*ShouldEnablePageContentAnnotations)\(\)'
      replace: '\1_Brave()'
