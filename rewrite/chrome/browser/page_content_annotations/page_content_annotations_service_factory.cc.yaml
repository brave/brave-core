substitutions:
  - description: |-
      Keep the page content annotation pipeline off.

      Brave only ran it for History Embeddings, which upstream removed, so
      the upstream feature flags don't turn it on.
    regex:
      re_pattern: 'page_content_annotations::features::\s*ShouldEnablePageContentAnnotations\(\)'
      replace: 'false'
