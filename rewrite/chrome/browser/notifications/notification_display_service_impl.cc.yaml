substitutions:
  - description: |-
      Register Brave's notification handlers.

      Brave Ads and Brave Wallet show notifications of their own types, which
      need handlers alongside upstream's for every profile.
    regex:
      re_pattern:
        '(NotificationDisplayServiceImpl::NotificationDisplayServiceImpl\(.*?\n\s*if
        \(profile_\) \{)'
      re_flags: [DOTALL]
      replace: |-
        \1
            AddBraveNotificationHandlers(*this, *profile_);
