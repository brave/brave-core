substitutions:
  - description: |-
      Add notification handler types for Brave Ads and Brave Wallet.

      These are registered with NotificationDisplayServiceImpl so Brave's own
      notifications can be dispatched to their own handlers, the same way
      upstream types are.
    add_enum_entries:
      enum_name: Type
      max_value: MAX
      entries:
        - BRAVE_ADS
        - BRAVE_WALLET
