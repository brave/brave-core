substitutions:
  - description: |-
      Add the deps the off-the-record URLLoaderFactory override needs.

      The chromium_src override waits for an off-the-record profile through
      FullBrowserTransitionManager and forwards requests to its factory.
    insert_into_list:
      target: image_fetcher
      list_name: deps
      values:
        - //chrome/browser/transition_manager
        - //services/network/public/cpp
        - //services/network/public/mojom
