substitutions:
  - description: |
      Make the Android feature-list targets depend on the V8 buildflags.

      The chrome_feature_list.cc override includes brave_browser_features.h,
      which includes the generated brave/components/v8/buildflags/buildflags.h.
      Without this dependency a remote compile can run before that header
      exists.
    insert_into_list:
      target: java_flags
      list_name: deps
      values:
        - //brave/components/v8/buildflags

  - description: |
      Make :flags_android_impl depend on the V8 buildflags.

      Same generated header as the java_flags target: both compile the
      chrome_feature_list.cc override.
    insert_into_list:
      target: flags_android_impl
      list_name: deps
      values:
        - //brave/components/v8/buildflags
