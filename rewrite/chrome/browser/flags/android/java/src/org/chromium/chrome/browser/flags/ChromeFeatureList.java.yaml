substitutions:
  - description: |-
      Show the bottom bar on the NTP by default.

      Brave's New Tab Page keeps the real address bar rather than replacing it
      with a fakebox, so there is no reason to take the bottom bar away there.
      Options of the flag that set `disable_on_ntp` themselves still win, this
      only moves the value the plain "Enabled" option falls back to.
    regex:
      re_pattern: |-
        (newBooleanCachedFeatureParam\(ANDROID_BOTTOM_BAR, "disable_on_ntp", )true\)
      replace: |-
        \1false)
