substitutions:
  - description: |
      Prefer an explicit window_title_id when set.

      Lets "Bookmark selected tabs..." use its own dialog title instead of
      Chromium's NEW_FOLDER-with-children title ("Bookmark all tabs").
    preempt_function_impl:
      function_name: BookmarkEditor::EditDetails::GetWindowTitleId
      code: |-
        if (window_title_id.has_value()) {
          return *window_title_id;
        }
