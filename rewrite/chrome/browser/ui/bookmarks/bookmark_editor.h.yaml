substitutions:
  - description: |
      Allow callers to override the bookmark editor dialog title.

      Used so "Bookmark selected tabs..." can show IDS_BOOKMARK_SELECTED_TABS_DIALOG_TITLE
      instead of Chromium's NEW_FOLDER-with-children title ("Bookmark all tabs").

      Uses regex rather than add_to_public so the patch does not add an empty
      line at the hunk boundary (presubmit CheckPatchFile).
    regex:
      pattern: "    BookmarkData bookmark_data;\n\n   private:"
      replace:
        "    BookmarkData bookmark_data;\n\n    // When set, overrides
        GetWindowTitleId() (e.g. \"Bookmark selected
        tabs\").\n    std::optional<int> window_title_id;\n   private:"
