substitutions:
  - description: |
      Handle TREE_NODE type in TabModel::UpdateProperties().

      A tree-tab node behaves like an unpinned tab for pinned/group/split
      state purposes, so it falls through with UNPINNED.
    regex:
      pattern: |-
        case TabCollection::Type::UNPINNED:
      replace: |-
        case TabCollection::Type::TREE_NODE:
              case TabCollection::Type::UNPINNED:

  - description: |
      Use BraveTabFeatures instead of TabFeatures.

      BraveTabFeatures (brave/browser/ui/tabs/public/brave_tab_features.h,
      included by this shadow) subclasses TabFeatures to add Brave-specific
      per-tab features.
    regex:
      pattern: |-
        tab_features_ = std::make_unique<TabFeatures>();
      replace: |-
        tab_features_ = std::make_unique<BraveTabFeatures>();
