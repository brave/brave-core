substitutions:
  - description: |
      Append Brave-specific entries to switch statements in TabStripModel::ExecuteContextMenuCommand().

      Avoids enumeration values not handled in switch error.
    regex:
      re_pattern: |
        (void\ TabStripModel::ExecuteContextMenuCommand\(.*switch\s*\(command_id\)\s*\{)
      re_flags: ['DOTALL']
      replace: |-
        \1
            case CommandRestoreTab:
            case CommandBookmarkTab:
            case CommandShowVerticalTabs:
            case CommandToggleTabMuted:
            case CommandBringAllTabsToThisWindow:
            case CommandCloseDuplicateTabs:
            case CommandOpenInContainer:
            case CommandRenameTab:
              NOTREACHED();\n

  - description: |
      Rename `DraggingTabsSession` to `DraggingTabsSessionChromium`.

      This avoids a name collision with Brave's `DraggingTabsSession` class.
    rename_class:
      class_name: DraggingTabsSession
      rename: DraggingTabsSessionChromium

  - description: |
      Set opener_was_set_for_empty_new_tab() flag for new tabs with TYPED transition at last index.

      Avoids creating a nested tree node when a new tab is added via a typed
      transition at the last index.
    regex:
      re_pattern: |
        (if\ \(ui::PageTransitionTypeIncludingQualifiersIs\(transition,\s*ui::PAGE_TRANSITION_TYPED\)\ &&\s*index\ ==\ count\(\)\)\ {)
      replace: |
        \1
            tab->set_opener_was_set_for_empty_new_tab();

  - description: |
      Pass `opener` to AddTabRecursive() for tree tab support.

      Stores opener in a local variable before calling AddTabRecursive() since
      tab_model will be moved.

      Passes nullptr when the new tab is created from an empty new tab, i.e.
      when opener_was_set_for_empty_new_tab is true.
    regex:
      re_pattern: '(contents_data_->AddTabRecursive\(.*?)(\);)'
      re_flags: ['DOTALL']
      replace: |-
        auto* opener = tab_model->opener_was_set_for_empty_new_tab() ? nullptr : tab_model->opener();
          \1, opener\2
