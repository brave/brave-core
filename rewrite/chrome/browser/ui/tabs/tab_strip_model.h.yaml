substitutions:
  - description: |
      Add Brave-specific ContextMenuCommand entries, keeping CommandLast as max.

      CommandRestoreTab - Restores a recently closed tab from history
      CommandBookmarkAllTabs - Bookmarks all tabs in the current window
      CommandShowVerticalTabs - Toggles vertical tab strip display mode
      CommandToggleTabMuted - Toggles mute/unmute state of selected tabs
      CommandBringAllTabsToThisWindow
        - Moves all tabs from other windows to the current window
      CommandCloseDuplicateTabs - Closes duplicate tabs with the same URL
      CommandOpenInContainer - Container submenu
      CommandRenameTab - Allows renaming a tab with custom title
    add_enum_entries:
      enum_name: ContextMenuCommand
      max_value: CommandLast
      entries:
        - CommandRestoreTab
        - CommandBookmarkAllTabs
        - CommandShowVerticalTabs
        - CommandToggleTabMuted
        - CommandBringAllTabsToThisWindow
        - CommandCloseDuplicateTabs
        - CommandOpenInContainer
        - CommandRenameTab

  - description: Make the destructor virtual for subclassing.
    make_virtual:
      class_name: TabStripModel
      method_name: '~TabStripModel'

  - description: Make the SelectRelativeTab virtual for subclassing.
    make_virtual:
      class_name: TabStripModel
      method_name: 'SelectRelativeTab'

  - description: |
      Rename `DraggingTabsSession` to `DraggingTabsSessionChromium`.

      This avoids a name collision with Brave's `DraggingTabsSession` class.
    count: 0
    rename_class:
      class_name: DraggingTabsSession
      rename: DraggingTabsSessionChromium

  - description: Let the Brave subclass reach private members.
    add_friend:
      class_name: TabStripModel
      friend_type: class BraveTabStripModel

  - description: |
      Let DetachedTabCollection have tabs::TreeTabNodeTabCollection in collection_.

      This extends std::variant for DetachedTabCollection to hold a TreeTabNodeTabCollection.
    count: 0
    regex:
      re_pattern: '(std::variant<std::unique_ptr<tabs::TabGroupTabCollection>,\s*std::unique_ptr<tabs::SplitTabCollection>)(>)'
      replace: |-
        \1, std::unique_ptr<tabs::TreeTabNodeTabCollection>\2

  - description: Make the DetachTabsAndCollectionsForInsertion method virtual
    make_virtual:
      class_name: TabStripModel
      method_name: 'DetachTabsAndCollectionsForInsertion'

  - description: |
      Add DetachTreeTabNodeForInsertion() for drag-and-drop.

      This method is used to detach a tab while keep its tree structure intact.
    add_to_public:
      class_name: TabStripModel
      code: |
        std::unique_ptr<DetachedTabCollection> DetachTreeTabNodeForInsertion(tabs::TabInterface* subtree_root_tab, const std::vector<tabs::TabInterface*>& moving_tabs);

  - description: |
      Add InsertDetachedTreeTabNodeAt() for drag-and-drop.

      This method is used to insert a detached tree tab node into the tab strip.
    add_to_public:
      class_name: TabStripModel
      code: |
        gfx::Range InsertDetachedTreeTabNodeAt(std::unique_ptr<DetachedTabCollection> tree_node, int index);
