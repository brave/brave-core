substitutions:
  - description: |
      Add the Brave ContextMenuCommand , keeping CommandLast.

      CommandRestoreTab - Restores a recently closed tab from history
      CommandBookmarkAllTabs - Bookmarks all tabs in the current window
      CommandShowVerticalTabs - Toggles vertical tab strip display mode
      CommandToggleTabMuted - Toggles mute/unmute state of selected tabs
      CommandBringAllTabsToThisWindow
        - Moves all tabs from other windows to the current window
      CommandCloseDuplicateTabs - Closes duplicate tabs with the same URL
      CommandOpenInContainer - Container submenu
      CommandRenameTab - Allows renaming a tab with custom title
    add_enum_entries:
      enum_name: ContextMenuCommand
      max_value: CommandLast
      entries:
        - CommandRestoreTab
        - CommandBookmarkAllTabs
        - CommandShowVerticalTabs
        - CommandToggleTabMuted
        - CommandBringAllTabsToThisWindow
        - CommandCloseDuplicateTabs
        - CommandOpenInContainer
        - CommandRenameTab

  - description: Make the destructor virtual for subclassing.
    make_virtual:
      class_name: TabStripModel
      method_name: '~TabStripModel'

  - description: Make the SelectRelativeTab virtual for subclassing.
    make_virtual:
      class_name: TabStripModel
      method_name: 'SelectRelativeTab'

  - description: |
      Rename instances of `DraggingTabsSession` to `DraggingTabsSessionChromium`
      to avoid name collision with Brave's DraggingTabsSession class.
    count: 0
    rename_class:
      class_name: DraggingTabsSession
      rename: DraggingTabsSessionChromium

  - description: Let the Brave subclass reach private members.
    add_friend:
      class_name: TabStripModel
      friend_type: class BraveTabStripModel
