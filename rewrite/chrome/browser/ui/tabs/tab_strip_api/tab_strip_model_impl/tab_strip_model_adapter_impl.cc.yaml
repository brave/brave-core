substitutions:
  - description: |-
      Treat TREE_NODE as an unsupported target, like SPLIT/TABSTRIP.

      Anchored on switch-case TABSTRIP/SPLIT handling, which forms a fallthrough
      group so this doesn't also match TREE_NODE handling.
    count: 2
    regex:
      re_pattern: |-
        (case\ tabs::TabCollection::Type::(?:(?:SPLIT)|(?:TABSTRIP)):)(\s*?NOTIMPLEMENTED\(\))
      replace: |-
        \1
            case tabs::TabCollection::Type::TREE_NODE:\2
