substitutions:
  - description: |
      Return shared-pinned-tab data early when the tab is a shared pinned
      dummy.
    preempt_function_impl:
      function_name: TabData::FromTabInterface
      code: |-
        if (auto tab_data = MaybeGetSharedPinnedTabData(tab_interface)) {
          return *tab_data;
        }

  - description: |
      Apply Brave's favicon-theming/unloaded-status overrides before
      returning.
    after_function_impl:
      function_name: TabData::FromTabInterface
      result_var: tab_data
      code: |-
        ApplyBraveTabDataOverrides(tab_interface, tab_data);
        return tab_data;
