substitutions:
  - description: |-
      Do not create FontPrewarmerTabHelper

      Brave does not prewarm the fonts of search results pages.
    count: 2 # Created in TabFeatures::Init() and WillDiscardContents().
    regex:
      re_pattern: '^( *)(font_prewarmer_tab_helper_ =[^;]*;)'
      re_flags: [MULTILINE]
      replace: '\1/* \2 */'
