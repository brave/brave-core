substitutions:
  - description: |
      Consider `ShouldHideCompletelyWhenCollapsed()` and
      `IsToggleButtonHidden()` when determining if expand on hover is enabled.
      Without the toggle button there is no other way to expand the strip.

    preempt_function_impl:
      function_name: 'VerticalTabStripStateControllerImpl::IsExpandOnHoverEnabled'
      return_if: 'ShouldHideCompletelyWhenCollapsed() || IsToggleButtonHidden()'
      return_value: 'true'
