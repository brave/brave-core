substitutions:
  - description: |
      Add Brave-specific callbacks to TabStripModelObserver.

      * TabCustomTitleChanged(): BraveBrowser stores the custom title in the
        session service so it can be restored even after browser restarts.
      * OnTreeTabChanged(): Notifies observers of tree-tab structure changes.
    add_to_public:
      class_name: TabStripModelObserver
      code: |-
        virtual void TabCustomTitleChanged(content::WebContents* contents, const std::optional<std::string>& custom_title) {}
        virtual void OnTreeTabChanged(const TreeTabChange& change) {}
