substitutions:
  - description: |-
      Notify TabStripModelObserver of tree tab changes

      `OnTreeTabChanged()` reports changes to the tree tab structure, such as a
      node being created, collapsed or reparented.
    add_to_public:
      class_name: TabStripModelObserver
      code: 'virtual void OnTreeTabChanged(const TreeTabChange& change) {}'
