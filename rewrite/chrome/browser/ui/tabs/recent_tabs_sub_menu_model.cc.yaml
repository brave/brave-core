substitutions:
  - description: |-
      Always show the "no device tabs" placeholder.

      Brave doesn't offer the "sign in to see tabs from other devices" flow;
      always show the same placeholder regardless of sign-in state. i.e.
      always fallback to showing the "no device tabs" placeholder.
    regex:
      re_pattern: |-
        (if\ \(!open_tabs\ \|\|\ !open_tabs->GetAllForeignSessions\(&sessions\)\)\ {.*?)if\ \(open_tabs\)
      re_flags: [DOTALL]
      replace: |-
        \1if ((true))

  - description: |
      Append a "more tabs" stub item when a device has more tabs than shown.
    regex:
      pattern: |-
        CreateOtherDeviceSubMenu(session, tabs_in_session);
      replace: |-
        CreateOtherDeviceSubMenu(session, tabs_in_session);
            MaybeAppendOverflowStubTab(tabs_in_session, kMaxSessionsToShow,
                                       device_menu_model.get());
