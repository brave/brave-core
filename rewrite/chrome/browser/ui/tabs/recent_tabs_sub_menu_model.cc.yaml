substitutions:
  - description: |-
      Always show the "no device tabs" placeholder and return early.

      Brave doesn't offer the "sign in to see tabs from other devices" flow;
      always show the same placeholder regardless of sign-in state.
    regex:
      re_pattern: |-
        (if\ \(!open_tabs\ \|\|\ !open_tabs->GetAllForeignSessions\(&sessions\)\)\ {)
      replace: |-
        \1
            AddItemWithStringId(IDC_RECENT_TABS_NO_DEVICE_TABS,
                                IDS_RECENT_TABS_NO_DEVICE_TABS);
            return;

  - description: |
      Append a "more tabs" stub item when a device has more tabs than shown.
    regex:
      pattern: |-
        CreateOtherDeviceSubMenu(session, tabs_in_session);
      replace: |-
        CreateOtherDeviceSubMenu(session, tabs_in_session);
            MaybeAppendOverflowStubTab(tabs_in_session, kMaxSessionsToShow,
                                       device_menu_model.get());
