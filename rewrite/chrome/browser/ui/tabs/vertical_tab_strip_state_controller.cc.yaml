substitutions:
  - description: |
      Append Brave-specific entries to `RequestType`

      This plaster is generic enough to guarantee that our entries are always last,
      and that they also become the new kMaxValue.
    preempt_function_impl:
      function_name: 'VerticalTabStripStateController::IsExpandOnHoverEnabled'
      return_if: 'ShouldHideCompletelyWhenCollapsed()'
      return_value: 'true'
