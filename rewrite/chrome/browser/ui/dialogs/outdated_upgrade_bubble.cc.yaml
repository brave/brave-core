substitutions:
  - description: |
      Reinstall via `BraveGetUpdateUrl()` instead of Chrome's redirect URL.

      Swap the URL passed to `OpenURLParams::CreateBrowserInitiated()` in
      `OnDialogAccepted()` for `BraveGetUpdateUrl()` (defined in the
      chromium_src shadow), which builds the download URL for Brave's channel
      instead of Chrome's.
    regex:
      re_pattern: '(OnDialogAccepted\(.*?CreateBrowserInitiated\(\s*)GURL\(update_browser_redirect_url\)'
      re_flags: [DOTALL]
      replace: '\1BraveGetUpdateUrl()'
