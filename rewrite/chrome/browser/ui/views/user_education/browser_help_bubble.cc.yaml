substitutions:
  - description: |-
      Brave allows the user to remove the shortcut for focusing the next pane.
    regex:
      pattern: '  CHECK(provider->GetAcceleratorForCommandId(kAccelerator, &accelerator));'
      replace: |2-
          if (!provider->GetAcceleratorForCommandId(kAccelerator, &accelerator)) {
            return {};
          }
  - description: |-
      Omit the shortcut hint in both promos and tutorials when it is unbound.
    count: 2
    add_after_line:
      line: 'GetFocusBubbleAcceleratorText(accelerator_provider);'
      code: |2-
          if (accelerator_text.empty()) {
            return {};
          }
