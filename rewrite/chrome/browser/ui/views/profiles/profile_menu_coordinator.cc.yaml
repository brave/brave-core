substitutions:
  - description: |
      Create Brave's incognito profile menu view.

      BraveIncognitoMenuView is declared in
      brave/browser/ui/views/profiles/brave_incognito_menu_view.h, which the
      chromium_src override includes.
    rename_class:
      class_name: IncognitoMenuView
      rename: BraveIncognitoMenuView

  - description: |
      Create Brave's profile menu view.

      BraveProfileMenuView is declared in
      brave/browser/ui/views/profiles/brave_profile_menu_view.h, which the
      chromium_src override includes.
    rename_class:
      class_name: ProfileMenuView
      rename: BraveProfileMenuView
