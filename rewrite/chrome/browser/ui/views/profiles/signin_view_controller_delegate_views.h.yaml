substitutions:
  - description: |-
      Allow the local profile customization dialog to open a file chooser.

      The implementation keeps the default cancellation behavior for other dialogs.
    add_to_public:
      class_name: SigninViewControllerDelegateViews
      code: |-
        void RunFileChooser(content::RenderFrameHost* render_frame_host,
                            scoped_refptr<content::FileSelectListener> listener,
                            const blink::mojom::FileChooserParams& params) override;

  - description: |-
      Keep the generated declaration beside existing members without an extra gap.

    regex:
      re_pattern: '\n(  void RunFileChooser\([^;]+;)'
      replace: '\1'
