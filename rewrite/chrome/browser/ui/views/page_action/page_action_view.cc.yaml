substitutions:
  - description: |
      Also show the page action label when it must always be shown.

      Upstream only animates the chip in when it is acting as a suggestion
      chip. Brave has page actions whose label must remain visible regardless,
      so we widen the condition to also cover `model.GetAlwaysShowLabel()`.
    regex:
      re_pattern: 'if \((model.ShouldShowSuggestionChip\(\))\)'
      replace: 'if (\1 || model.GetAlwaysShowLabel())'

  - description: |
      Let Brave adjust the border insets before UpdateBorder() applies them.

      UpdateBorder() computes `border_insets` and hands them straight to
      SetBorder(). Inserting a MaybeOverrideBorder() hook just before that call
      gives Brave a chance to tweak the insets without duplicating the whole
      method.
    regex:
      re_pattern: '(void PageActionView::UpdateBorder\(\).*?)(SetBorder\()'
      re_flags: [DOTALL]
      replace: |-
        \1MaybeOverrideBorder(observation_.GetSource(), border_insets);
          \2

  - description: |
      Propagate the click event flags through the page action invocation.

      Upstream's ActionInvocationContext does not carry the originating event's
      modifier flags, so Brave action handlers cannot tell e.g. a plain click
      from a ctrl/shift click. We attach them via `kBravePageActionEventFlagKey`
      on the builder in NotifyClick() right before it is invoked.
    regex:
      re_pattern: |-
        (void PageActionView::NotifyClick\(.*?)(\n\s*action_item_->InvokeAction\(std::move\(builder\)\.Build\(\)\);)
      re_flags: [DOTALL]
      replace: |-
        \1
          builder = std::move(builder).SetProperty(
              kBravePageActionEventFlagKey,
              event.IsMouseEvent() ? event.flags() : ui::EF_NONE);\2

  - description: |
      Give page action chips a Brave-controlled background.

      Early-return from GetBackgroundColor() via the GetBraveBackgroundColor()
      hook (defined in the chromium_src override), which honours the model's
      SkColor override and otherwise keeps chips transparent.
    preempt_function_impl:
      function_name: PageActionView::GetBackgroundColor
      code: |-
        if (auto color = GetBraveBackgroundColor(observation_.GetSource())) {
          return *color;
        }

  - description: |
      Give page action chips a Brave-controlled foreground color.

      Early-return from GetForegroundColor() via the GetBraveForegroundColor()
      hook (defined in the chromium_src override), which honours the model's
      SkColor override and otherwise falls through to Chromium's own logic
      (including internal callers such as UpdateIconImage()).
    preempt_function_impl:
      function_name: PageActionView::GetForegroundColor
      code: |-
        if (auto color = GetBraveForegroundColor(observation_.GetSource())) {
          return *color;
        }

  - description: |
      Use default (non-tonal) colors for page action chips even when
      expanded.
    regex:
      pattern: 'SetUseTonalColorsWhenExpanded(true)'
      replace: 'SetUseTonalColorsWhenExpanded(false)'

  - description: |
      Let Brave override the page action's minimum size and label width.

      GetOverrideHeight()/ShouldAlwaysShowLabel() (declared in
      page_action_view.h.yaml) are driven by the model's height override and
      always-show-label flag.
    after_function_impl:
      function_name: PageActionView::GetMinimumSize
      result_var: size
      code: |-
        if (auto override_height = GetOverrideHeight()) {
          size.set_height(*override_height);
        }
        if (ShouldAlwaysShowLabel()) {
          size.set_width(
              GetSizeForLabelWidth(label()->GetPreferredSize().width()).width());
        }
        return size;

  - description: |
      Refresh Brave's model-driven visual state after activating a
      controller.
    after_function_impl:
      function_name: PageActionView::OnNewActiveController
      code: |-
        OnPageActionModelVisualRefresh(observation_.GetSource());

  - description: |
      Propagate the model's triggerable event flags and border after every
      model change.
    after_function_impl:
      function_name: PageActionView::OnPageActionModelChanged
      code: |-
        const PageActionModelInterface* source = observation_.GetSource();
        if (source) {
          // ui::EF_LEFT_MOUSE_BUTTON is the default triggerable event flags of
          // Button class.
          SetTriggerableEventFlags(source->GetOverrideTriggerableEvent().value_or(
              ui::EF_LEFT_MOUSE_BUTTON));
        }
        UpdateBorder();
