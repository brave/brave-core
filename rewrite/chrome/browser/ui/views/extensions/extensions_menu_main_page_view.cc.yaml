substitutions:
  - description: |
      Use BraveExtensionsMenuEntryView for each menu entry.

      Early-returns before upstream's own ExtensionsMenuEntryView
      construction, deferring to CreateAndInsertBraveMenuEntry() (defined in
      the chromium_src override) to build a BraveExtensionsMenuEntryView with
      the same callbacks instead.
    preempt_function_impl:
      function_name: ExtensionsMenuMainPageView::CreateAndInsertMenuEntry
      code: |-
        if ((true)) {
          CreateAndInsertBraveMenuEntry(browser_, menu_handler_, action_model,
                                        entry_state, index, menu_entries_);
          return;
        }
