substitutions:
  - description: |
      Use Brave's main page view in ExtensionsMenuDelegateDesktop::OpenMainPage().

      Brave subclasses ExtensionsMenuMainPageView to restyle the menu; swap the
      concrete type created for the main page. The Brave header is supplied by
      the chromium_src override.
    regex:
      re_pattern:
        'auto main_page =\s*std::make_unique<ExtensionsMenuMainPageView>'
      replace: |-
        auto main_page =
              std::make_unique<BraveExtensionsMenuMainPageView>
