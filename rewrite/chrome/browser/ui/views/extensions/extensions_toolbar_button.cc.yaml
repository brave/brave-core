substitutions:
  - description:
      'Follow kToolbarButtonIconSize instead of the hardcoded non-touch size, so
      the icon honors #toolbars-small-icons like other toolbar buttons.'
    regex:
      pattern: 'return kDefaultIconSizeChromeRefresh;'
      replace: 'return GetLayoutConstant(LayoutConstant::kToolbarButtonIconSize);'
