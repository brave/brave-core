substitutions:
  - description: |
      Replace creation of ExtensionMenuItemView with our sub-classed
      implementation.

      The Brave header is supplied by the chromium_src override.
    regex:
      pattern: 'new ExtensionMenuItemView('
      replace: 'new BraveExtensionMenuItemView('
