substitutions:
  - description: Include what the member below needs.
    add_include:
      header:
        - base/callback_list.h

  - description: |-
      Hold Brave's subscription to the download button being shown.

      Brave updates the icon whenever the button shows, as a newly shown button
      doesn't have Brave's insecure download icon yet.
    add_to_protected:
      class_name: DownloadToolbarUIController
      code:
        'base::CallbackListSubscription
        brave_download_button_shown_subscription_;'
