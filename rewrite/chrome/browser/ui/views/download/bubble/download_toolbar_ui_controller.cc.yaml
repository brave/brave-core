substitutions:
  - description: |
      Override icon color and replace icon for insecure downloads.

      This replacement adds a `UpdateIcon_BraveImpl` call after the upstream image
      update to apply Brave's icon color and replace the icon when an insecure file
      is downloaded.
    regex:
      re_pattern: '(badge_background_color\);)'
      re_flags: [MULTILINE]
      replace: |-
        \1
          UpdateIcon_BraveImpl(browser_view_, *new_icon, state_, active_, action_item_);

  - description: |-
      Update the icon whenever the download button shows.

      Brave's insecure download icon is applied to the button itself, which a
      newly shown button doesn't have yet.
    after_function_impl:
      function_name: DownloadToolbarUIController::DownloadToolbarUIController
      code: |-
        ObserveDownloadButtonShown_BraveImpl(
            weak_factory_.GetWeakPtr(), browser_view_,
            brave_download_button_shown_subscription_);
