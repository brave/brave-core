substitutions:
  - description: |-
      Remove histogramming call.

      The original code calls base::UmaHistogramEnumeration to record download
      command executions. Brave-specific commands (COPY_DOWNLOAD_LINK) are not
      defined in upstream's DownloadCommands enum, which would cause a crash
      when converting them to an enum index. This substitution replaces the
      histogramming call with base::DoNothing() to safely bypass recording for
      commands that may be outside the expected enum range.
    regex:
      re_pattern: base::UmaHistogramEnumeration\(.*?\);
      re_flags: [DOTALL]
      replace: ''
