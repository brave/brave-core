substitutions:
  - description: |-
      Start the group header chip where a Brave horizontal tab's contents do.
    after_function_impl:
      function_name: TabGroupStyle::GetTitleChipOffset
      result_var: offset
      code: |-
        if (tabs::HorizontalTabsUpdateEnabled()) {
          offset.set_x(tabs::kHorizontalTabInset);
        }
        return offset;

  - description: |-
      Include what the substitution above uses
    add_include:
      header:
        - chrome/browser/ui/tabs/features.h
