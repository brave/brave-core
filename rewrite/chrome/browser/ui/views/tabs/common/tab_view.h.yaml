substitutions:
  - description: |
      Add a dummy implementation of IsTabMuteIndicatorNotClickable, as Brave
      extended AlertIndicatorButton::Delegate.
    add_to_public:
      class_name: TabView
      code: 'bool IsTabMuteIndicatorNotClickable() override;'

  - description: |
      Include header for collapse/expand button
    add_include:
      header:
        - 'ui/views/controls/button/image_button.h'

  - description: |-
      Declare the tree tab collapse/expand button of TabView.

      Defined in chromium_src.
    add_to_public:
      class_name: TabView
      code: |2-
        // Updates the tree tab toggle button for the current tree tab node.
        void UpdateTreeToggleButton();
        bool ShouldShowTreeToggleButton() const;
        views::ImageButton* tree_toggle_button_for_testing() {
          return tree_toggle_button_;
        }

  - description: |-
      Declare the members for the tree tab toggle button of TabView.
    add_to_protected:
      class_name: TabView
      code: |2-
        void MaybeInitTreeToggleButton();
        void OnTreeToggleButtonPressed();
        raw_ptr<views::ImageButton> tree_toggle_button_ = nullptr;
