substitutions:
  - description: |
      Handle TREE_NODE collection type in the OnChildMoved().

      Tree nodes are not rendered in the vertical tab strip view tree (see the
      sibling CreateViewForNode() switch, which marks TREE_NODE NOTREACHED), so
      a moved tree node needs no scroll handling.
    regex:
      re_pattern:
        '(OnChildMoved\([^)]*\)\s*\{.*?switch \(moved_node->type\(\)\) \{)'
      re_flags: [DOTALL]
      replace: |-
        \1
              case TabCollectionNode::Type::TREE_NODE:
                break;

  - description: |
      Create a vertical scroll bar that follows the "show scroll bar" pref, and
      apply the pref-aware scroll bar mode right away.
    regex:
      re_pattern: 'std::make_unique<VerticalTabStripScrollBar>\(\s*(collection_node_->GetController\(\)->GetStateController\(\))\)\)'
      replace: |-
        CreateBraveVerticalTabStripScrollBar(
                \1,
                collection_node_->GetController()
                    ->GetBrowserView()
                    ->GetProfile()
                    ->GetPrefs()));
            scroll_view->SetVerticalScrollBarMode(
                GetBraveVerticalTabStripScrollBarMode(scroll_view))

  - description: |
      Don't force the vertical scroll bar to be visible when its overflow
      visuals are enabled; honor the "show scroll bar" pref instead.
    regex:
      re_pattern: '(::EnableOverflowVisuals\(.*?SetVerticalScrollBarMode\()\s*views::ScrollView::ScrollBarMode::kEnabled\)'
      re_flags: [DOTALL]
      replace: |-
        \1
                GetBraveVerticalTabStripScrollBarMode(scroll_view))
