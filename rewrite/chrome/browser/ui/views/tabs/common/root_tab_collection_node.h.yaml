substitutions:
  - description: |-
      Observe tree tab changes in RootTabCollectionNode.

      The root node is already the TabStripModelObserver driving the tab
      views, so it relays tree tab node creation and destruction to the layout.
    add_to_public:
      class_name: RootTabCollectionNode
      code: |-
        void OnTreeTabChanged(const TreeTabChange& change) override;
