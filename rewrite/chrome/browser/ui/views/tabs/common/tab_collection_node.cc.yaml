substitutions:
  - description: |-
      Map Brave's TREE_NODE collection type in GetTypeFromNode().
    regex:
      re_pattern:
        '(TabCollectionNode::Type GetTypeFromNode\(.*?switch \(.*?->type\(\)\)\s*\{.*?)(\n\s*\})'
      re_flags: [DOTALL]
      replace: |-
        \1
              case tabs::TabCollection::Type::TREE_NODE:
                return TabCollectionNode::Type::TREE_NODE;\2

  - description: |-
      Never create a view for a TREE_NODE in CreateViewForNode().

      Tree tab node collections are not mirrored in the view model, see
      MaybeInitializeTreeTabChildren().
    regex:
      re_pattern:
        '(TabCollectionNode::CreateViewForNode\(.*?switch \(node_for_view->type\(\)\)\s*\{.*?)(\n\s*\})'
      re_flags: [DOTALL]
      replace: |-
        \1
            case Type::TREE_NODE:
              NOTREACHED();\2

  - description: |-
      Mirror children of tree tab node collections in their place in
      TabCollectionNode::Initialize().
    regex:
      re_pattern:
        '(TabCollectionNode::Initialize\(\) \{.*?const tabs::TabCollection\* collection =\s*std::get<tabs::ConstDanglingUntriagedTabCollection>\(node_data_\);)'
      re_flags: [DOTALL]
      replace: |-
        \1
            if (MaybeInitializeTreeTabChildren(*collection)) {
              return node_view;
            }

  - description: |-
      Remove children mirrored in place of tree tab node collections in
      TabCollectionNode::Deinitialize().
    regex:
      re_pattern:
        '(TabCollectionNode::Deinitialize\(\) \{.*?const tabs::TabCollection\* collection =\s*std::get<tabs::ConstDanglingUntriagedTabCollection>\(node_data_\);)'
      re_flags: [DOTALL]
      replace: |-
        \1
            if (MaybeDeinitializeTreeTabChildren(*collection)) {
              return;
            }
