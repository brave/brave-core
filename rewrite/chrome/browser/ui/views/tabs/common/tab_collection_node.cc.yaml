substitutions:
  - description: |-
      Map Brave's TREE_NODE collection type in GetTypeFromNode().

      TREE_NODE is Brave-specific type and we need to map collection and node types
    regex:
      re_pattern: |-
        (TabCollectionNode::Type GetTypeFromNode\([^)]*\)\s*\{.*?\n\s*switch[^{]*\{)
      re_flags: [DOTALL]
      replace: |-
        \1
              case tabs::TabCollection::Type::TREE_NODE:
                return TabCollectionNode::Type::TREE_NODE;

  - description: |-
      Never create a view for a TREE_NODE in CreateViewForNode().

      Tree tab node collections are unwrapped in the view model, see
      brave/browser/ui/views/tabs/tree_tab_view_utils.h.
    regex:
      re_pattern: |-
        (TabCollectionNode::CreateViewForNode\([^)]*\)\s*\{.*?\n\s*switch[^{]*\{)
      re_flags: [DOTALL]
      replace: |-
        \1
            case Type::TREE_NODE:
              NOTREACHED();

  - description: |-
      Walk the children without tree tab node collections

      In TabCollectionNode::Initialize() and TabCollectionNode::Deinitialize(),
      TabCollectionNode iterate all children. But we don't want for 
      ViewModel(TabCollectionNode) to know about tree node. So we should iterate
      skipping tree node.
    count: 2
    regex:
      pattern: 'for (const auto& child_data : collection->GetChildren())'
      replace: |-
        for (const tabs::Child& child_data : tree_tab_view_utils::GetUnwrappedChildren(*collection))
