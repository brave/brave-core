substitutions:
  - description: Let the Brave hover test reach private members.
    add_friend:
      class_name: TabHoverCardController
      friend_type: class BraveTabHoverTest

  - description: Let the Brave subclass reach private members.
    add_friend:
      class_name: TabHoverCardController
      friend_type: class BraveTabHoverCardController

  - description: Let the Brave subclass override CreateHoverCard.
    make_virtual:
      class_name: TabHoverCardController
      method_name: CreateHoverCard

  - description: Let the Brave subclass override OnHovercardImagesEnabledChanged.
    make_virtual:
      class_name: TabHoverCardController
      method_name: OnHovercardImagesEnabledChanged
