substitutions:
  - description: |-
      Expose HorizontalTabStyleViews's private members to BraveVerticalTabStyle.

      Brave subclasses HorizontalTabStyleViews (in
      chromium_src/chrome/browser/ui/views/tabs/tab_style_views.cc), so it needs
      friend access to reach the base's private members and override its private
      virtuals.
    add_friend:
      class_name: HorizontalTabStyleViews
      friend_type: class BraveVerticalTabStyle

  - description: |-
      Virtualise GetSeparatorBounds for BraveVerticalTabStyle.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: GetSeparatorBounds

  - description: |-
      Virtualise IsHovering for BraveVerticalTabStyle.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: IsHovering

  - description: |-
      Virtualise GetSeparatorOpacity for BraveVerticalTabStyle.

      Virtualising to tweak separator visibility for vertical tabs and split
      tabs.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: GetSeparatorOpacity

  - description: |-
      Virtualise GetCurrentTabBackgroundColor for BraveVerticalTabStyle.

      Virtualising to supply its own vertical-tab background colors.
    make_virtual:
      class_name: HorizontalTabStyleViews
      method_name: GetCurrentTabBackgroundColor

  - description: |-
      Square off the extension corner in HorizontalTabStyleViews::GetPath, so Brave
      tabs don't carry upstream's rounded extension.
    regex:
      re_pattern:
        '(  float left_extension_corner_radius = extension_corner_radius;)'
      replace: '  extension_corner_radius = 0;\n\1'

  - description: |-
      Fully round the tab separators in HorizontalTabStyleViews::PaintSeparators

      This patch computes a radius of half the separator width.
    regex:
      re_pattern:
        '(void HorizontalTabStyleViews::PaintSeparators\(.*?\n)(  cc::PaintFlags
        flags;)'
      re_flags: [DOTALL]
      replace: |-
        \1  // Even if |separator_radius| becomes 1 native pixel the 'roundedness'
          // will be approximated with color, although extremely subtle and
          // likely only on screens >= 2x (i.e. separator width is 2+px)!
          const int separator_radius = separator_bounds.leading.width() / 2;
        \2

  - description: |-
      Use the fully-rounded separator radius for both separator draws.
    regex:
      re_pattern: 'tab_style\(\)->GetSeparatorCornerRadius\(\) \* scale'
      replace: 'separator_radius'
    count: 2

  - description: |-
      Disable the upstream `TabStyleViews::Create` factory.

      It must return `BraveVerticalTabStyle`, which inherits from the `.cc`-local
      `HorizontalTabStyleViews` and so can only be defined after it. A forward
      declaration isn't enough for `make_unique`, so we disable the whole
      upstream factory and re-define it in `chromium_src` where the full type is
      visible.
    regex:
      re_pattern: '(// static\n[^\n]*\bTabStyleViews::Create\(.*?\{.*?\n\})'
      re_flags: [DOTALL]
      replace: |-
        #if 0  // TabStyleViews::Create declared in the chromium_src.
        \1
        #endif
