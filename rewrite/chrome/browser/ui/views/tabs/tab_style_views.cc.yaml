substitutions:
  - description: |-
      Disable the upstream `TabStyleViews::Create` factory.

      It must return `BraveVerticalTabStyle`, which inherits from
      `HorizontalTabStyleViews`.
    regex:
      re_pattern: '(// static\n[^\n]*\bTabStyleViews::Create\(.*?\{.*?\n\})'
      re_flags: [DOTALL]
      replace: |-
        #if 0  // TabStyleViews::Create declared in the chromium_src.
        \1
        #endif
