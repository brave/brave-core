substitutions:
  - description: 'Add nesting_info accessor methods'
    regex:
      re_pattern: '(  bool IsClosed\(\) const;)'
      replace: '\n        const TabNestingInfo& nesting_info() const;\n        void set_nesting_info(const TabNestingInfo& info);\n\1'

  - description: 'Add nesting_info member variable'
    add_to_protected:
      class_name: TabLayoutState
      code: TabNestingInfo nesting_info_;
