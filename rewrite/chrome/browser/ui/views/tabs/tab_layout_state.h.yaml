substitutions:
  - description: Add header for Brave specific customization
    add_include:
      header:
        - 'chrome/browser/ui/views/tabs/tab_strip_layout_types.h'

  - description: Add methods to get and set the nesting information for a tab.
    add_to_public:
      class_name: TabLayoutState
      code: |
        const TabNestingInfo& nesting_info() const { return nesting_info_; }
        void set_nesting_info(const TabNestingInfo& info) {
          nesting_info_ = info;
        }

  - description: Add member for storage of the nesting information for a tab.
    add_to_protected:
      class_name: TabLayoutState
      code: TabNestingInfo nesting_info_;
