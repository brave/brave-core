substitutions:
  - description: 'Use BraveTabGroupHeader instead of TabGroupHeader'
    regex:
      pattern: 'std::make_unique<TabGroupHeader>'
      replace: 'std::make_unique<BraveTabGroupHeader>'

  - description: 'Use BraveTabGroupUnderline instead of TabGroupUnderline'
    regex:
      pattern: 'std::make_unique<TabGroupUnderline>'
      replace: 'std::make_unique<BraveTabGroupUnderline>'
    count: 2

  - description: 'Use BraveTabGroupHighlight instead of TabGroupHighlight'
    regex:
      pattern: 'std::make_unique<TabGroupHighlight>'
      replace: 'std::make_unique<BraveTabGroupHighlight>'
