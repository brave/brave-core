substitutions:
  - description: |
      Rename the class so the Brave subclass can reuse the name.

      The Brave TabGroupStyleViews subclass is defined in the chromium_src
      override of this file.
    rename_class:
      class_name: TabGroupStyleViews
      rename: TabGroupStyleViews_ChromiumImpl

  - description: Use BraveTabGroupUnderline for the underline stroke thickness.
    rename_class:
      class_name: TabGroupUnderline
      rename: BraveTabGroupUnderline
