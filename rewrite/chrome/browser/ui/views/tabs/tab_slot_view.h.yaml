substitutions:
  - description: 'Add tree_tab_node_id member and accessor to TabSlotView'
    regex:
      re_pattern: '(virtual void SetGroup\(std::optional<tab_groups::TabGroupId> group\);)'
      replace: |
        void set_tree_tab_node(const std::optional<tree_tab::TreeTabNodeId>& id);
        const std::optional<tree_tab::TreeTabNodeId>& tree_tab_node() const;
        \1

  - description: 'Add GetTabNestingInfo and IsInCollapsedTreeTabNode virtual methods'
    add_to_public:
      class_name: TabSlotView
      code: |
        virtual TabNestingInfo GetTabNestingInfo() const;
        virtual bool IsInCollapsedTreeTabNode() const;

  - description: 'Add tree_tab_node_id member variable to protected section'
    add_to_protected:
      class_name: TabSlotView
      code: std::optional<tree_tab::TreeTabNodeId> tree_tab_node_id_;
