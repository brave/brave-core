# TabStripLayoutHelper's destructor is not virtual, so Brave adds state and
# non-virtual methods rather than subclassing it.
substitutions:
  - description: |
      Add setters for the vertical and tree tab modes and the owning tab strip.

      BraveTabStrip is forward declared in the chromium_src override of this
      header.
    add_to_public:
      class_name: TabStripLayoutHelper
      code: |
        void set_use_vertical_tabs(bool vertical) { use_vertical_tabs_ = vertical; }
        void set_tab_strip(TabStrip* tab_strip) { tab_strip_ = tab_strip; }
        void set_use_tree_tabs(bool tree) { use_tree_tabs_ = tree; }

  - description: Add a non-const version of group_header_ideal_bounds().
    add_to_public:
      class_name: TabStripLayoutHelper
      code: |
        std::map<tab_groups::TabGroupId, gfx::Rect>& group_header_ideal_bounds() {
          return group_header_ideal_bounds_;
        }

  - description: Let BraveTabContainer reach the private vertical tab state.
    add_friend:
      class_name: TabStripLayoutHelper
      friend_type: class BraveTabContainer

  - description: |
      Add the private vertical tab methods and state.

      Regex because no rewriter adds to a class's private section; this
      appends to the end of the existing one. The methods are defined in the
      chromium_src override of tab_strip_layout_helper.cc because
      TabStripLayoutHelper::TabSlot is only visible there.
    regex:
      pattern: 'std::map<tab_groups::TabGroupId, gfx::Rect> group_header_ideal_bounds_;'
      replace: |-
        std::map<tab_groups::TabGroupId, gfx::Rect> group_header_ideal_bounds_;

          // Brave: vertical and tree tab layout.
          bool FillGroupInfo(std::vector<TabWidthConstraints>& tab_widths);
          bool FillNestingInfo(std::vector<TabWidthConstraints>& tab_widths);
          BraveTabStrip* GetBraveTabStrip() const;
          bool use_vertical_tabs_ = false;
          bool use_tree_tabs_ = false;
          raw_ptr<TabStrip> tab_strip_ = nullptr;
