substitutions:
  - description: |-
      Pass through the model_index unchanged instead of updating from
      split_tabs::GetIndexOfLastActiveTab(). We want to activate clicked tab.

      Upstream activates the most recently focused tab in the split when
      selecting a split tab. The PassThrough helper ensures we use the
      original clicked tab's model_index.
    regex:
      pattern: 'split_tabs::GetIndexOfLastActiveTab(model_, split_id.value())'
      replace: 'GetIndexOfLastActiveTab(model_index)'
