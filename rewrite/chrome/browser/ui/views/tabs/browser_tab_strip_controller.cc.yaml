substitutions:
  - description: |
      Activate the clicked tab when selecting a split tab.

      Upstream activates the most recently focused tab in the split instead,
      by updating `model_index` from split_tabs::GetIndexOfLastActiveTab().

      This is a regex because no rewriter drops a single statement.
    regex:
      re_pattern: >-
        (model_index = split_tabs::GetIndexOfLastActiveTab\(model_,
        split_id\.value\(\)\);)
      replace: // \1

  - description: |
      Create the tab menu model through the virtual CreateTabMenuModel() so
      the Brave subclass can return BraveTabMenuModel.
    regex:
      pattern: 'std::make_unique<TabMenuModel>('
      replace: 'CreateTabMenuModel('
