substitutions:
  - description: |
      Never show the upstream "learn more" footer.

      Its "learn more" link points to Chrome's Google support page
      (support.google.com/chrome), and its text describes saving across
      signed-in devices, which doesn't match Brave Sync.

      A limit of 0 makes `ShouldShowSavedFooter()` always false.
    regex:
      pattern: 'constexpr int kFooterDisplayLimit = 5;'
      replace: 'constexpr int kFooterDisplayLimit = 0;'
