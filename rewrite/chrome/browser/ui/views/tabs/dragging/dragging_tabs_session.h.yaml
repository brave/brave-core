substitutions:
  - description:
      'Remove final keyword from DraggingTabsSession to allow subclassing'
    drop_final:
      class_name: DraggingTabsSession

  - description:
      'Make the DraggingTabsSession destructor virtual to allow subclassing'
    make_virtual:
      class_name: DraggingTabsSession
      method_name: '~DraggingTabsSession'

  - description: |
      Rename the upstream class so Brave can replace it with its own
      DraggingTabsSession.

      The Brave class is declared in the chromium_src override of this header.
    count: 0 # Every use of the class name.
    rename_class:
      class_name: DraggingTabsSession
      rename: DraggingTabsSessionChromium

  - description: |
      Let the Brave version call the private methods it overrides and
      GetPassKey().

      DraggingTabsSessionBrave is an alias to the Brave class, declared in the
      chromium_src override of this header.
    add_friend:
      class_name: DraggingTabsSessionChromium
      friend_type: DraggingTabsSessionBrave

  - description: |
      Provide GetPassKey() so the Brave version of DraggingTabsSession can call
      TabStripModel's methods with the passkey.

      This is a regex because no rewriter adds to a class's private section.
      The method is defined in the chromium_src override of
      dragging_tabs_session.cc.
    regex:
      pattern: 'void MoveAttachedImpl(gfx::Point point_in_screen, bool just_attached);'
      replace: |-
        base::PassKey<DraggingTabsSessionChromium> GetPassKey();
          void MoveAttachedImpl(gfx::Point point_in_screen, bool just_attached);

  - description: Make MoveAttached() virtual to override it in Brave.
    make_virtual:
      class_name: DraggingTabsSessionChromium
      method_name: MoveAttached

  - description: Make GetAttachedDragPoint() virtual to override it in Brave.
    make_virtual:
      class_name: DraggingTabsSessionChromium
      method_name: GetAttachedDragPoint

  - description: Make CalculateGroupForDraggedTabs() virtual to override it in Brave.
    make_virtual:
      class_name: DraggingTabsSessionChromium
      method_name: CalculateGroupForDraggedTabs
