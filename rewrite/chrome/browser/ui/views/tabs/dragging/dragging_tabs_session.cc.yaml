substitutions:
  - description: |
      Remove the drag threshold when it's a vertical tab strip. The standard
      width is multiplied by 0 then, and by 1 otherwise so nothing changes.

      This is a regex because no rewriter wraps a call's result, and the
      pattern matches both uses of the standard width.
    count: 2 # The move threshold and GetDraggedViewTabStripBounds().
    regex:
      re_pattern: '(TabStyle::Get\(\)->GetStandardWidth\(/\*is_split=\*/false\))'
      replace: '\1 * VerticalTabsDragThresholdScale(*attached_context_)'

  - description: |
      Rename the upstream class so Brave can replace it with its own
      DraggingTabsSession.
    count: 0 # Every use of the class name.
    rename_class:
      class_name: DraggingTabsSession
      rename: DraggingTabsSessionChromium
