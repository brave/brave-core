substitutions:
  - description: |-
      Use Brave's GetTabSpinningColor() instead of GetCascadingAccentColor().

      No rewriter replaces a call to a free function with another, so this uses
      a literal regex. GetTabSpinningColor() is defined in the chromium_src
      override before the upstream include.
    regex:
      pattern: GetCascadingAccentColor
      replace: GetTabSpinningColor
    count: 2
