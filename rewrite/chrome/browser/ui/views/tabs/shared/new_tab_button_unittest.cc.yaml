substitutions:
  - description: |
      Pass a null vertical tab controller to WindowFeatureController.

      Brave's WindowFeatureController constructor takes an extra
      vertical_tab_controller argument. This test doesn't exercise vertical
      tabs, so a null weak pointer is enough.
    regex:
      re_pattern: '(std::make_unique<WindowFeatureController>\(.*?GetUnownedUserDataHost\(\))\)'
      re_flags: [DOTALL]
      replace: |-
        \1,
                /*vertical_tab_controller=*/nullptr)
