substitutions:
  - description:
      'Use Brave vertical tabs bounds in CalculateBoundsForDraggedViews() when
      applicable'
    preempt_function_impl:
      function_name: CalculateBoundsForDraggedViews
      code: |-
        if (auto bounds = tabs::MaybeCalculateBoundsForVerticalDraggedViews(
                views, tab_strip_)) {
          return *bounds;
        }

  - description:
      'Skip the upstream logic in CalculateInsertionIndex() when Brave handled
      the candidate for vertical tabs'
    regex:
      re_pattern:
        '(int CalculateInsertionIndex\(const gfx::Rect&
        dragged_bounds,[\s\S]*continue;\n\s*}\n)(\n\s*// If there)'
      replace: |-
        \1
              if (tabs::MaybeUpdateInsertionIndexForVerticalTabs(
                      dragged_bounds, first_dragged_tab_index, num_dragged_tabs,
                      GetTabAt(first_dragged_tab_index)->group().has_value(),
                      candidate_index, tab_strip_->controller_.get(),
                      tab_strip_->tab_container_.get(), min_distance,
                      min_distance_index, tab_strip_)) {
                continue;
              }\2

  - description:
      'allow to expand tab groups only when tabstrip is editable inside
      SetSelection()'
    regex:
      re_pattern:
        '(TabStrip::SetSelection\(const ui::ListSelectionModel& new_selection\)
        {[\s\S]*if \()(IsGroupCollapsed\(new_group\))'
      replace: '\1\2 && IsTabStripEditable()'

  - description: 'Use BraveTabContainer instead of TabContainer'
    regex:
      pattern: 'std::make_unique<TabContainer>('
      replace: 'std::make_unique<BraveTabContainer>('

  - description: 'Use BraveTabDragController instead of TabDragController'
    regex:
      pattern: 'std::make_unique<TabDragController>()'
      replace: 'std::make_unique<BraveTabDragController>()'

  - description: Create BraveTab instead of Tab in AddTabsAt().
    regex:
      pattern: 'std::make_unique<Tab>(tab_data.handle, this)'
      replace: 'std::make_unique<BraveTab>(tab_data.handle, this)'

  - description: Use BraveTabHoverCardController.
    count: 2 # The constructor parameter and the unique_ptr in the constructor.
    rename_class:
      class_name: TabHoverCardController
      rename: BraveTabHoverCardController
