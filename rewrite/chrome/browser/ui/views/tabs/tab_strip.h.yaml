substitutions:
  - description: Let Brave specific classes reach private members.
    add_friend:
      class_name: TabStrip
      friend_type:
        - class BraveTabDragContext
        - class BraveTabHoverTest
        - class BraveTabStrip
        - class BraveVerticalTabStripRegionView

  - description: Implement the TabSlotController methods Brave added.
    add_to_public:
      class_name: TabStrip
      code: |
        bool ShouldAlwaysHideCloseButton() const override;
        bool CanCloseTabViaMiddleButtonClick() const override;
        bool IsVerticalTabsFloating() const override;
        bool IsVerticalTabsAnimatingButNotFinalState() const override;
        bool ShouldPaintTabAccent(const Tab* tab) const override;
        std::optional<TabAccentColors> GetTabAccentColors(
            const Tab* tab) const override;
        ui::ImageModel GetTabAccentIcon(const Tab* tab) const override;
        bool ShouldAlwaysShowMiniTabAccent() const override;
        int GetTreeHeight(const tree_tab::TreeTabNodeId& id) const override;
        const tabs::TreeTabNode* GetTreeTabNode(
            const tree_tab::TreeTabNodeId& id) const override;
        void SetTreeTabNodeCollapsed(const tree_tab::TreeTabNodeId& id,
                                     bool collapsed) override {}
        bool IsInCollapsedTreeTabNode(
            const tree_tab::TreeTabNodeId& id) const override;
        brave_tabs::TabMinWidthMode GetTabMinWidthMode() const override;
        bool IsHorizontalScrollingEnabled() const override;

  - description: Allow BraveTabStrip to override GetDragContext.
    make_virtual:
      class_name: TabStrip
      method_name: GetDragContext

  - description: Allow BraveTabStrip to override AddTabToGroup.
    count: 2 # The tab-index and `TabHandle` overloads.
    make_virtual:
      class_name: TabStrip
      method_name: AddTabToGroup

  - description: Allow BraveTabStrip to override MoveTab.
    make_virtual:
      class_name: TabStrip
      method_name: MoveTab

  - description: Allow BraveTabStrip to override OnTabPinnedStateChanged.
    count: 2 # The tab-index and `TabHandle` overloads.
    make_virtual:
      class_name: TabStrip
      method_name: OnTabPinnedStateChanged

  - description: |
      Use BraveTabHoverCardController, which is forward declared in the
      chromium_src override of this header.
    rename_class:
      class_name: TabHoverCardController
      rename: BraveTabHoverCardController
