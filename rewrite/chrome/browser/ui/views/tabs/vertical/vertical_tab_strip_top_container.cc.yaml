substitutions:
  - description: |
      Skip the collapse button in layout and size calculations when it is
      hidden. Brave hides the button when the user turns off the "Show toggle
      button" setting, by hiding the button's action item.
    count: 4
    regex:
      pattern: 'if (collapse_button_) {'
      replace: 'if (collapse_button_ && collapse_button_->GetVisible()) {'
