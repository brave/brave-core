substitutions:
  - description: |
      Add Brave's pure virtual methods to TabSlotController.

      The types they use are declared in the chromium_src override of
      tab_slot_controller.h, which is included before this header. Their
      implementations live in BraveTabStrip and the TabStrip overrides.
    add_to_public:
      class_name: TabSlotController
      code: |
        // Whether to hide the close button regardless of its state.
        virtual bool ShouldAlwaysHideCloseButton() const = 0;

        // Whether vertical tabs are in floating mode.
        virtual bool IsVerticalTabsFloating() const = 0;
        virtual bool IsVerticalTabsAnimatingButNotFinalState() const = 0;

        // Returns whether the tab should have an accent painted (e.g.,
        // container tab, or other features that require visual accent). This
        // allows the tab style to determine if accent painting is needed
        // without exposing implementation details.
        virtual bool ShouldPaintTabAccent(const Tab* tab) const = 0;

        // Returns the accent colors (border, background) for the tab if it
        // should have an accent painted. Returns nullopt if the tab should not
        // have an accent or colors cannot be determined.
        virtual std::optional<TabAccentColors> GetTabAccentColors(
            const Tab* tab) const = 0;

        // Returns the accent icon for the tab if it should have an accent
        // painted. Returns an empty ImageModel if the tab should not have an
        // accent or icon cannot be determined.
        virtual ui::ImageModel GetTabAccentIcon(const Tab* tab) const = 0;

        // Returns whether tabs should always show the mini (small) accent icon
        // instead of the large one, regardless of the tab's width.
        virtual bool ShouldAlwaysShowMiniTabAccent() const = 0;

        // Whether tabs can be closed via middle mouse button click.
        virtual bool CanCloseTabViaMiddleButtonClick() const = 0;

        // Tree Tab operations.
        virtual int GetTreeHeight(const tree_tab::TreeTabNodeId& id) const = 0;
        virtual const tabs::TreeTabNode* GetTreeTabNode(
            const tree_tab::TreeTabNodeId& id) const = 0;
        virtual void SetTreeTabNodeCollapsed(const tree_tab::TreeTabNodeId& id,
                                             bool collapsed) = 0;
        virtual bool IsInCollapsedTreeTabNode(
            const tree_tab::TreeTabNodeId& id) const = 0;

        // Horizontal tab minimum width mode and horizontal scroll state.
        virtual brave_tabs::TabMinWidthMode GetTabMinWidthMode() const = 0;
        virtual bool IsHorizontalScrollingEnabled() const = 0;
