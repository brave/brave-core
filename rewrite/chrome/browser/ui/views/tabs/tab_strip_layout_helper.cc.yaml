substitutions:
  - description: |
      Use the vertical tab layout when vertical tabs are enabled.

      Regex because the call is in the middle of a long function that
      preempt_function_impl would have to replace wholesale.
    add_before_line:
      line: 'return CalculateTabBounds(tab_widths, available_width);'
      code: |2-
          if (use_vertical_tabs_) {
            FillGroupInfo(tab_widths);
            FillNestingInfo(tab_widths);
            return tabs::CalculateVerticalTabBounds(
                tab_widths, available_width,
                GetBraveTabStrip()->ShouldShowPinnedTabsInGrid());
          }
