substitutions:
  - description: |-
      Use CR foreground token for default active icon color.

      Apply ultra-dark postprocessing of kColorNewTabButtonCRForegroundFrameActive
      to horizontal new-tab, workspaces, and scroll buttons.
    regex:
      pattern: 'kColorTabForegroundInactiveFrameActive'
      replace: 'kColorNewTabButtonCRForegroundFrameActive'

  - description: |-
      Use CR background tokens for tab strip control buttons.

      Makes idle tab-strip control buttons (workspaces and scroll chevrons)
      not paint a solid frame-colored chip. Matches TabStripComboButton /
      TabStripFlatEdgeButton.
    regex:
      pattern: 'kColorNewTabButtonBackgroundFrameActive'
      replace: 'kColorNewTabButtonCRBackgroundFrameActive'

  - description: 'Use CR inactive background token for idle tab-strip buttons'
    regex:
      pattern: 'kColorNewTabButtonBackgroundFrameInactive'
      replace: 'kColorNewTabButtonCRBackgroundFrameInactive'
