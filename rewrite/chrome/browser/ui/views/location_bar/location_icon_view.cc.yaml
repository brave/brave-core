substitutions:
  - description: |-
      Return early from `UpdateBackground` after setting the background color.

      This avoids resetting the ink drop and clearing the current ink drop
      state. Since we always use the same background color, there is no need to
      reset the ink drop.

      Additionally, when the user toggles the Shields status while the page
      info bubble is open, we intentionally keep the bubble open. Since the
      Shields status update triggers a call to this method, the early return
      prevents the ink drop from disappearing while the bubble is open.

      The return is mid-function, so `preempt_function_impl` (top of body) does
      not apply and no other rewriter fits.
    regex:
      re_pattern: |-
        (void LocationIconView::UpdateBackground\(.*?SetBackgroundColor\(.*?\);)
      re_flags: [DOTALL]
      replace: |-
        \1
          if ((true)) return;
