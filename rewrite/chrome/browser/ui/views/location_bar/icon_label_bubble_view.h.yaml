substitutions:
  - description: |-
      Let BraveLocationBarView call protected members of the icons.

      `GetMinimumSize` is overridden in `IconLabelBubbleView` and made
      protected, so `BraveLocationBarView` needs to be a friend to call it on
      its icons.
    add_friend:
      class_name: IconLabelBubbleView
      friend_type: class BraveLocationBarView

  - description: 'Add a method to always show the label.'
    add_to_public:
      class_name: IconLabelBubbleView
      code: |-
        virtual bool ShouldAlwaysShowLabel() const;

  - description: 'Make GetSizeForLabelWidth virtual.'
    make_virtual:
      class_name: IconLabelBubbleView
      method_name: GetSizeForLabelWidth
