substitutions:
  - description: |
      Show the spark icon in the @history scope with semantic history search

      `IsSemanticHistoryKeyword` lives in the chromium_src shadow.
    preempt_function_impl:
      function_name: SelectedKeywordView::GetKeywordIcon
      code: |-
        if (IsSemanticHistoryKeyword(keyword, omnibox_controller, profile)) {
          return ui::ImageModel::FromVectorIcon(
              features::IsRoundedIconsEnabled() ? omnibox::kSearchSparkIcon
                                                : omnibox::kSearchSparkOldIcon,
              kForegroundColorId,
              GetLayoutConstant(LayoutConstant::kLocationBarIconSize));
        }
