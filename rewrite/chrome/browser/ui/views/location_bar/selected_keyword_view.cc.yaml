substitutions:
  - description: |
      Show the spark icon in the @history scope for Brave's semantic history
      search.

      Upstream's history embeddings never run in Brave, so its profile check
      is always false.
    regex:
      pattern: 'history_embeddings::IsHistoryEmbeddingsEnabledForProfile('
      replace: 'BraveIsHistoryEmbeddingsEnabledForProfile('
