substitutions:
  - description: |-
      Give Brave the Views download button.

      Brave's download icon override recolours the button and swaps its vector
      icon, which the `DownloadButton` interface hides. Only the Views and web
      app toolbars implement it; other providers have no such button, and
      return null.
    add_to_public:
      class_name: ToolbarButtonProvider
      code: 'virtual ToolbarButton* GetDownloadButton();'
