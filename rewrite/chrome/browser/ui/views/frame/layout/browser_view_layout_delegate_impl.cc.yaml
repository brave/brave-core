substitutions:
  - description: |-
      Skip browser layout while the frame view is still placing the browser.

      During the Mac fullscreen exit animation, a layout with vertical tabs and
      the window title would use browser bounds outside the client area.
    preempt_function_impl:
      function_name: BrowserViewLayoutDelegateImpl::GetBrowserLayoutParams
      code: |-
        if (ShouldWaitForFrameToPlaceBrowserView(
                *this, GetFrameView(), browser_view(), use_browser_bounds)) {
          return BrowserLayoutParams();
        }
