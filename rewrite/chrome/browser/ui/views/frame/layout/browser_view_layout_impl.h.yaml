substitutions:
  - description: |-
      Add non-const version of ProposedLayout::GetLayoutFor()

      Brave layouts need to modify the layout found for a descendant.
    regex:
      re_pattern: |-
        const (ProposedLayout\* GetLayoutFor\(const views::View\* descendant\)) const;
      replace: |-
        const \1 const;
          \1;
