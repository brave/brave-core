substitutions:
  - description: |
      Zero out `kHandleResizeAxisPadding`.

      Brave sizes the split divider to match `kRoundedCornersContentsViewMargin`.
      `OnLayoutUpdated()` recomputes the resize area's preferred size from this
      constant on every layout change, so setting the preferred size from the
      Brave subclass is lost when a split flips between stacked and
      side-by-side.
    regex:
      pattern: 'kHandleResizeAxisPadding = 6;'
      replace: 'kHandleResizeAxisPadding = 0;'
