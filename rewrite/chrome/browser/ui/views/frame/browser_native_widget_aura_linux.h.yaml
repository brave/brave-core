substitutions:
  - description: |-
      Let the PiP window take its source window's identity.

      BraveVideoOverlayWindowViews reads GetWindowClass() so a Picture-in-Picture
      window gets the same WM_CLASS and Wayland app id as the browser or web app
      window it came from, and the desktop groups the two together.
    add_friend:
      class_name: BrowserNativeWidgetAuraLinux
      friend_type: class BraveVideoOverlayWindowViews
