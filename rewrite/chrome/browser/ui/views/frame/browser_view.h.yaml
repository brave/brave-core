substitutions:
  - description: Make the CreateMacOverlayView virtual for subclassing.
    make_virtual:
      class_name: BrowserView
      method_name: 'CreateMacOverlayView'
  - description:
      Let Brave preserve bookmark ownership when using floating placement.
    make_virtual:
      class_name: BrowserView
      method_name: MaybeShowBookmarkBar
  - description: Let Brave report visibility for the floating bookmarks bar.
    make_virtual:
      class_name: BrowserView
      method_name: IsBookmarkBarVisible
