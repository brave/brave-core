substitutions:
  - description: |-
      Keep the GTK headerbar off windows that show Brave's vertical tabs

      Upstream uses the headerbar layout whenever IsTabStripVisible() is false,
      intending it for popup and app windows. With our vertical tabs,
      IsTabStripVisible() is also false in tabbed windows that show the title,
      which would give them a headerbar-height title bar.
    preempt_function_impl:
      function_name: BrowserFrameViewLayoutLinuxNative::ShouldUseNativeHeaderBar
      return_if: delegate_->ShouldShowBraveVerticalTabs()
      return_value: 'false'
