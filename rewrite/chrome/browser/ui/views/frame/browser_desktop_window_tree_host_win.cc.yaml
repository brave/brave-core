substitutions:
  - description: |-
      Rename BrowserDesktopWindowTreeHostWin to ChromiumImpl

      Matches the rename in the header; the chromium_src shadow header defines
      a Brave subclass using the original name.
    rename_class:
      class_name: BrowserDesktopWindowTreeHostWin
      rename: BrowserDesktopWindowTreeHostWin_ChromiumImpl

  - description: |-
      Create the Brave BrowserDesktopWindowTreeHostWin from the factory

      The rename above also renamed the instantiation in
      CreateBrowserDesktopWindowTreeHost(); restore the original name, which
      now refers to the Brave subclass.
    regex:
      pattern: |-
        return new BrowserDesktopWindowTreeHostWin_ChromiumImpl(
      replace: |-
        return new BrowserDesktopWindowTreeHostWin(
