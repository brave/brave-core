substitutions:
  - description:
      Rename VerticalTabStripRegionView to
      VerticalTabStripRegionView_ChromiumImpl
    rename_class:
      class_name: 'VerticalTabStripRegionView'
      rename: 'VerticalTabStripRegionView_ChromiumImpl'

  - description: Replace kVerticalTabStripCollapsedWidth with dynamic getter
    count: 0
    regex:
      pattern: 'tabs::kVerticalTabStripCollapsedWidth'
      replace: 'GetCollapsedWidth()'

  - description: 'Consider IsMouseInHotCorner even if mouse is not hovered'
    count: 0
    regex:
      pattern: 'IsMouseHovered()'
      replace: '(IsMouseHovered() || IsMouseInHotCorner())'
