substitutions:
  - description: 'Observe "Hide Completely When Collapsed" preference'
    after_function_impl:
      function_name: 'VerticalTabStripRegionView::VerticalTabStripRegionView'
      code: 'ObserveHideCompletelyPref();'

  - description: Replace kCollapsedWidth with dynamic getter
    count: 0
    regex:
      pattern: 'kCollapsedWidth'
      replace: 'GetCollapsedWidth()'

  - description: |-
      Early return 0 minimum width for "Hide completely when collapsed" feature
    preempt_function_impl:
      function_name: 'VerticalTabStripRegionView::GetMinimumSize'
      return_if: |-
        state_controller_->ShouldHideCompletelyWhenCollapsed() &&
          (state_controller_->IsCollapsed() || IsAnimatingSize())
      return_value: '{}'

  - description: 'Consider IsMouseInHotCorner even if mouse is not hovered'
    count: 0
    regex:
      pattern: 'IsMouseHovered()'
      replace: '(IsMouseHovered() || IsMouseInHotCorner())'
