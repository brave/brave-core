substitutions:
  - description: |
      Build Brave's mini toolbar in place of upstream's.

      `CreateBraveMiniToolbar` is declared in the chromium_src override of this
      source and defined in //brave/browser/ui/views/frame/split_view, so
      upstream gains no compile-time dependency on Brave's view. Replacing the
      construction here lets BraveContentsContainerView skip removing and
      destroying the toolbar this constructor would otherwise have created.
    regex:
      pattern: 'std::make_unique<MultiContentsViewMiniToolbar>'
      replace: 'CreateBraveMiniToolbar'

  - description: |
      Build Brave's contents outline in place of upstream's.

      Brave's outline draws per-corner radii and its own active/inactive
      styles. Declared and defined alongside `CreateBraveMiniToolbar`.
    regex:
      pattern: 'std::make_unique<ContentsContainerOutline>'
      replace: 'CreateBraveContainerOutline'
