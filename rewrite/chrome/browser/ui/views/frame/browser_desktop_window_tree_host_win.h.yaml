substitutions:
  - description: |-
      Rename BrowserDesktopWindowTreeHostWin to _ChromiumImpl

      The chromium_src shadow defines a Brave subclass that takes the original
      name so that all other users get the Brave implementation.
    rename_class:
      class_name: BrowserDesktopWindowTreeHostWin
      rename: BrowserDesktopWindowTreeHostWin_ChromiumImpl

  - description: |-
      Allow the Brave BrowserDesktopWindowTreeHostWin to access private members

      The Brave subclass calls private members such as UpdateWorkspace().
    add_friend:
      class_name: BrowserDesktopWindowTreeHostWin_ChromiumImpl
      friend_type: class BrowserDesktopWindowTreeHostWin
