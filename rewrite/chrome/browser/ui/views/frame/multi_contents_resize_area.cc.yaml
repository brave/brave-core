substitutions:
  - description: |-
      Reset resize area position when double clicked instead of swap

      ResetResizeArea() is declared as a virtual hook on MultiContentsView and
      overridden by BraveMultiContentsView.
    regex:
      pattern: 'multi_contents_view_->OnSwap();'
      replace: 'multi_contents_view_->ResetResizeArea();'
    count: 2
