substitutions:
  - description: |-
      Tell the layout whether the window shows Brave's vertical tabs

      Its tab strip is then hidden although the window is tabbed, which
      IsTabStripVisible() and IsToolbarVisible() can't tell apart from a popup.
      It returns false unless overridden, so upstream's delegates and fakes need
      nothing.
    add_to_public:
      class_name: OpaqueBrowserFrameViewLayoutDelegate
      code: 'virtual bool ShouldShowBraveVerticalTabs() const;'
