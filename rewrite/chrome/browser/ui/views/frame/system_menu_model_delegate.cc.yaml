substitutions:
  - description: |-
      Handle Brave-specific commands such as vertical tabs and focus mode

      The shadow includes the implementation needed by this code.
    preempt_function_impl:
      function_name: SystemMenuModelDelegate::IsCommandIdChecked
      code: |-
        if (auto result = MaybeHandleBraveCommand(command_id, browser_); result.has_value()) {
          return *result;
        }

  - description: |-
      Handle the label for Brave-specific commands

      The shadow includes the implementation needed by this code.
    preempt_function_impl:
      function_name: SystemMenuModelDelegate::GetLabelForCommandId
      code: |-
        if (auto label = MaybeGetLabelForBraveCommand(command_id, browser_)) {
          return *label;
        }
