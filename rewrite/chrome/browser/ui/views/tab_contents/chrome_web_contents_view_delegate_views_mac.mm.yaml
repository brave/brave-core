substitutions:
  - description: |-
      Add Brave's RenderViewContextMenuMacCocoa and
      RenderViewContextMenuMacRemoteCocoa subclasses, used below to defer
      the context menu show for gestures.
    regex:
      pattern: |-
        #include "chrome/browser/ui/cocoa/renderer_context_menu/render_view_context_menu_mac_cocoa.h"
        #include "chrome/browser/ui/cocoa/renderer_context_menu/render_view_context_menu_mac_remote_cocoa.h"
      replace: |-
        #include "chrome/browser/ui/cocoa/renderer_context_menu/render_view_context_menu_mac_cocoa.h"
        #include "chrome/browser/ui/cocoa/renderer_context_menu/render_view_context_menu_mac_remote_cocoa.h"
        #include "brave/browser/ui/views/renderer_context_menu/brave_render_view_context_menu_mac_cocoa.h"
        #include "brave/browser/ui/views/renderer_context_menu/brave_render_view_context_menu_mac_remote_cocoa.h"

  - description: |-
      Build Brave's RenderViewContextMenuMacRemoteCocoa, which defers
      showing the menu until any in-progress gesture resolves.
    regex:
      pattern: 'menu = std::make_unique<RenderViewContextMenuMacRemoteCocoa>('
      replace:
        'menu = std::make_unique<BraveRenderViewContextMenuMacRemoteCocoa>('

  - description: |-
      Build Brave's RenderViewContextMenuMacCocoa, which defers showing the
      menu until any in-progress gesture resolves.
    regex:
      pattern: 'menu = std::make_unique<RenderViewContextMenuMacCocoa>('
      replace: 'menu = std::make_unique<BraveRenderViewContextMenuMacCocoa>('
