substitutions:
  - description: |-
      Widen the label width budget of the subtext rows for Email Alias suggestions.

      It allows long descriptions for Email Alias suggestions to be shown.
    regex:
      re_pattern: '(FormatLabel\(\*label, label_text, main_filling_product,\s*)kAutofillSuggestionMaxWidth( / label_row\.size\(\)\);)'
      replace: |-
        \1((suggestion.brave_new_email_alias_suggestion || suggestion.brave_email_alias_suggestion)? 512: kAutofillSuggestionMaxWidth)\2

  - description: |-
      Widen the main text width in CreatePopupRowContentView for Email Alias suggestions.

      This is the row content view Email Alias suggestions are rendered with, and
      alias emails are longer than the upstream maximum. Other suggestions keep
      passing no width, so upstream still derives it from the filling product.
    regex:
      re_pattern: '(std::unique_ptr<PopupRowContentView> CreatePopupRowContentView\(.*?FormatLabel\(\*main_text_label, suggestion\.main_text,\s*main_filling_product)(\);)'
      re_flags: [DOTALL]
      replace: |-
        \1, (suggestion.brave_new_email_alias_suggestion || suggestion.brave_email_alias_suggestion)? std::optional<int>(512): std::nullopt\2

  - description: |-
      Replace the view creation for kAutocompleteEntry in the case of email alias suggestions.
      By default, the kAutocompleteEntry view contains a delete button, which is not needed
      for email suggestions, so this patch switches to the base view that displays only the text
      and description.
    regex:
      pattern: |-
        if (type == SuggestionType::kAutocompleteEntry)
      replace: |-
        if (type == SuggestionType::kAutocompleteEntry && !suggestion.brave_email_alias_suggestion)
