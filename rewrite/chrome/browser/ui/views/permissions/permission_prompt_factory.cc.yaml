substitutions:
  - description: |-
      Create Brave Wallet permission prompts for wallet requests.

      IsBraveWalletRequest() and CreateBraveWalletPermissionPrompt() are
      defined in the chromium_src shadow above the upstream include, since
      they need brave/browser headers.
    preempt_function_impl:
      function_name: CreatePermissionPrompt
      code: |-
        if (IsBraveWalletRequest(delegate)) {
          return CreateBraveWalletPermissionPrompt(web_contents, delegate);
        }
