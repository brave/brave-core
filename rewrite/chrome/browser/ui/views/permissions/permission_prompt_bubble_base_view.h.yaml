substitutions:
  - description: |-
      Add the z-order manager member to the permission prompt bubble.

      PermissionPromptBubbleZOrderManager is declared in the chromium_src
      shadow header, which must be included before this header. The manager
      is created in PermissionPromptBubbleBaseView::CreateWidget (see the
      matching .cc yaml).
    add_to_protected:
      class_name: PermissionPromptBubbleBaseView
      code: |-
        std::unique_ptr<PermissionPromptBubbleZOrderManager> z_order_manager_;
