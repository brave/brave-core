substitutions:
  - description: |-
      Comment out the DCHECK guarding kDesktopPWAsTabStripSettings's compiled
      default.

      Brave ships this feature enabled by default (see
      chrome/common/chrome_features.cc), unlike upstream, so the assertion
      that its compiled default stays disabled no longer holds. Kept as a
      comment, rather than removed, so the guard stays visible.
    regex:
      pattern: |-
        DCHECK_EQ(features::kDesktopPWAsTabStripSettings.default_state,
                    base::FEATURE_DISABLED_BY_DEFAULT);
      replace: |-
        // DCHECK_EQ(features::kDesktopPWAsTabStripSettings.default_state,
          //           base::FEATURE_DISABLED_BY_DEFAULT);
