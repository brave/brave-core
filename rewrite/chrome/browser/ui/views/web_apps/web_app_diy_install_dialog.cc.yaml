substitutions:
  - description: |-
      Change the default dialog button from kCancel to kNone.

      Brave does not want the install dialog to focus Cancel by default.
    regex:
      pattern: OverrideDefaultButton(ui::mojom::DialogButton::kCancel)
      replace: OverrideDefaultButton(ui::mojom::DialogButton::kNone)
