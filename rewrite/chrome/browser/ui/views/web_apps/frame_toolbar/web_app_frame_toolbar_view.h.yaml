substitutions:
  - description: |-
      Give Brave the web app toolbar's download button.

      Brave's download icon override reaches it through
      `ToolbarButtonProvider::GetDownloadButton()`.
    add_to_public:
      class_name: WebAppFrameToolbarView
      code: 'ToolbarButton* GetDownloadButton() override;'
