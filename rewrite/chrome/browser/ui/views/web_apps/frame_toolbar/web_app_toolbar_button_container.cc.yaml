substitutions:
  - description: |-
      Add the Shields toolbar button to PWA windows.

      MaybeAddPwaShieldsToolbarButton() is defined by the chromium_src override
      of this file, ahead of the upstream include.
    preempt_function_impl:
      function_name: WebAppToolbarButtonContainer::AddedToWidget
      code: |-
        MaybeAddPwaShieldsToolbarButton(this);
