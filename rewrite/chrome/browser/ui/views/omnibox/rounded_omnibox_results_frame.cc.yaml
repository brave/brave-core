substitutions:
  - description: |
      Use Brave's own corner-radius token set for the omnibox results frame.
    count: 2
    regex:
      pattern: 'views::ShapeContextTokens::kOmniboxExpandedRadius'
      replace: 'views::ShapeContextTokensOverride::kOmniboxExpandedRadius'
