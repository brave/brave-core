substitutions:
  - description: |
      Use the same corner radius as `BraveRoundedOmniboxResultsFrame`'s
      shadow border, instead of `kOmniboxExpandedRadius`, which other upstream
      views share.
    count: 2
    regex:
      pattern: 'ChromeShapeContextTokens::kOmniboxExpandedRadius'
      replace: 'views::Emphasis::kHigh'
