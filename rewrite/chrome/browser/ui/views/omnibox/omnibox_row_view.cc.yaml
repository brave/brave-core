substitutions:
  - description: Use BraveOmniboxResultView instead of OmniboxResultView
    rename_class:
      class_name: OmniboxResultView
      rename: BraveOmniboxResultView

  - description: 'Remove the insets of OmniboxRowView.'
    preempt_function_impl:
      function_name: OmniboxRowView::GetInsets
      code: if ((true)) return gfx::Insets();
