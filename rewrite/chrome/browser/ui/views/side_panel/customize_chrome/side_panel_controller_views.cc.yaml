substitutions:
  - description: |-
      Binds the UI's close callback in CreateCustomizeChromeView()

    after_function_impl:
      function_name: SidePanelControllerViews::CreateCustomizeChromeView
      result_var: customize_chrome_web_view
      code: |-
        CHECK(customize_chrome_ui_);
        customize_chrome_ui_->SetClosePanelCallback(
            base::BindRepeating(&SidePanelControllerViews::CloseSidePanel,
                                weak_ptr_factory_.GetWeakPtr()));
        return customize_chrome_web_view;
