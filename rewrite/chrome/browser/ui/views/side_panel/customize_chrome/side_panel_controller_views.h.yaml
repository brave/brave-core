substitutions:
  - description: |-
      Give SidePanelControllerViews a WeakPtrFactory, declared last so it is
      destroyed first.

      CreateCustomizeChromeWebView() binds a callback to CloseSidePanel()
      through it, which must not fire once this object starts tearing down.
    regex:
      re_pattern: '(class SidePanelControllerViews[^{]*\{.*?)\n\};'
      re_flags: [DOTALL]
      replace: |-
        \1
          base::WeakPtrFactory<SidePanelControllerViews> weak_ptr_factory_{this};
        };
