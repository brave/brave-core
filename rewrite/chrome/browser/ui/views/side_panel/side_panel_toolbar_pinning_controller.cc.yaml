substitutions:
  - description: |-
      Skip updating the active state when there is no pinned toolbar actions
      container.

      Brave may not have a pinned actions container, which upstream assumes
      always exists.
    preempt_function_impl:
      function_name: SidePanelToolbarPinningController::UpdateActiveState
      return_if: |-
        auto* toolbar_button_provider = ToolbarButtonProvider::From(&*browser_);
            !toolbar_button_provider ||
            !toolbar_button_provider->GetPinnedToolbarActions()
