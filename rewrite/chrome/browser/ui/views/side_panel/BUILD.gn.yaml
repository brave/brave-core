substitutions:
  - description: Add the deps the Brave side panel additions need.
    add_literal_to_list:
      target: side_panel
      list_name: deps
      literal: brave_browser_ui_views_side_panel_deps
      import: //brave/browser/ui/views/side_panel/sources.gni

  - description: Add the public_deps the Brave side panel additions need.
    add_literal_to_list:
      target: side_panel
      list_name: public_deps
      literal: brave_browser_ui_views_side_panel_public_deps
      import: //brave/browser/ui/views/side_panel/sources.gni
