substitutions:
  - description: |-
      Make SetHighlight virtual

      Brave's ToolbarButton subclass overrides SetHighlight.
    make_virtual:
      class_name: ToolbarButton
      method_name: SetHighlight

  - description: |-
      Rename ToolbarButton to ToolbarButton_ChromiumImpl

      Brave's chromium_src toolbar_button.h declares a ToolbarButton subclass
      that reuses the upstream name.
    rename_class:
      class_name: ToolbarButton
      rename: ToolbarButton_ChromiumImpl

  - description: |-
      Declare Brave menu model and vector icon accessors

      These are defined in chromium_src toolbar_button.cc.
    add_to_public:
      class_name: ToolbarButton_ChromiumImpl
      code: |-
        void SetMenuModel(std::unique_ptr<ui::MenuModel> model);
        bool HasVectorIcons() const;
        const gfx::VectorIcon& GetVectorIcon() const;
        const gfx::VectorIcon& GetVectorTouchIcon() const;
