substitutions:
  - description: |-
      Use Brave's ink drop configuration for toolbar buttons

      Delegate to ConfigureBraveInkDrop instead of the upstream opacity and
      base color settings.
    preempt_function_impl:
      function_name: ConfigureInkDrop
      code: |-
        if ((true)) {
          ConfigureBraveInkDrop(host, std::move(highlight_generator));
          return;
        }
