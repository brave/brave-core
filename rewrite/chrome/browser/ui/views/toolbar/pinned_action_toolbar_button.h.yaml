substitutions:
  - description: |-
      Declare Brave's `ShouldShowMenu()` override.

      Pinned container buttons show no context menu: only the downloads button
      is pinned, and Brave has no toolbar customization UI for it yet.
    add_to_public:
      class_name: PinnedActionToolbarButton
      code: 'bool ShouldShowMenu() override;'
