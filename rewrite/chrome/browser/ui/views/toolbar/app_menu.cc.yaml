substitutions:
  - description: |
      Use a smaller corner radius for menu-row backgrounds.

      Shrink the kBackgroundCornerRadius passed to
      MenuItemView::MenuItemBackground by 6px versus upstream's default.
    regex:
      re_pattern: |-
        (MenuItemView::MenuItemBackground\(.*?kBackgroundCornerRadius)
      re_flags: [DOTALL]
      replace: |-
        \1 - 6

  - description: |
      Cancel `target_profile_row_height` unused variable.

      This value goes unused due to our changes.
    regex:
      re_pattern: |-
        (void AppMenu::PopulateMenu\(.*?\n)(\s*)(int target_profile_row_height =.*?;)
      re_flags: [DOTALL]
      replace: |-
        \1if ((false)) { [[maybe_unused]]
        \2\3
        }

  - description: |
      Cancel `icon_height` unused variable.

      This value goes unused due to our changes.
    regex:
      re_pattern: |-
        (void AppMenu::PopulateMenu\(.*?\n)(\s*)(int icon_height =.*?;)
      re_flags: [DOTALL]
      replace: |-
        \1if ((false)) { [[maybe_unused]]
        \2\3
        }

  - description: |
      Pin every menu-row vertical margin to 8px.

      Brave uses a fixed vertical margin regardless of the value upstream
      computes, at both set_vertical_margin() call sites.
    count: 2
    regex:
      re_pattern: |-
        set_vertical_margin\(.*?\);
      re_flags: [DOTALL]
      replace: |-
        set_vertical_margin(8);
