substitutions:
  - description: |-
      Don't pin any actions

      We don't want anything pinned. The downloads button is shown
      ephemerally on download status change.
    preempt_function_impl:
      function_name: PinnedToolbarActionsContainer::UpdateActionState
      code: if ((true)) return;

  - description: |-
      Only show the downloads and send-tab-to-self actions ephemerally

      We only want to allow these buttons in the pinned toolbar container.
    preempt_function_impl:
      function_name: PinnedToolbarActionsContainer::ShowActionEphemerallyInToolbar
      return_if: 'id != kActionShowDownloads && id != kActionSendTabToSelf'
