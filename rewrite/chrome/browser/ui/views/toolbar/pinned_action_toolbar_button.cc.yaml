blank_metadata_header_macros: true

substitutions:
  - description: |-
      Keep `ToolbarButton`'s icon color override while the action is engaged.

      Preempting the body covers every caller, including upstream's own calls
      such as `SetEngagedIndicatorStyle()`.
    preempt_function_impl:
      function_name: PinnedActionToolbarButton::UpdateIcon
      code: |-
        if (HasIconEnabledColorsOverride() && action_engaged_) {
          ToolbarButton::UpdateIcon();
          return;
        }
