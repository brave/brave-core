substitutions:
  - description: |-
      Replace SavedTabGroupButton with BraveSavedTabGroupButton

      Note that we're using regex instead of rename_class so that other places
      still usage SavedTabGroupButton except construction time. This will help
      us to reduce additional patches with polymorphism.
    regex:
      pattern: 'make_unique<SavedTabGroupButton>'
      replace: 'make_unique<BraveSavedTabGroupButton>'
