substitutions:
  - description: 'Inject Brave bookmark context menu items for Containers'
    add_before_line:
      line: |-
        if (menu_model->GetCommandIdAt(i) == IDC_BOOKMARK_BAR_SUBMENU) {
      code: |-
        MaybeAppendContainerSubmenu(i, menu_model, menu_);

  - description: |-
      Rename BookmarkContextMenuController to BraveBookmarkContextMenuController
    rename_class:
      class_name: 'BookmarkContextMenuController'
      rename: 'BraveBookmarkContextMenuController'
