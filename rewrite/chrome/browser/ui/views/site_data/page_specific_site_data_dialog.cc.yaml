substitutions:
  - description: |-
      Also remove Brave's non-model per-origin data (e.g. PSST) when the
      dialog deletes a site's stored objects.
    regex:
      pattern: |-
        browsing_data::RecordDeleteBrowsingDataAction(
                browsing_data::DeleteBrowsingDataAction::kCookiesInUseDialog);
      replace: |-
        browsing_data::RecordDeleteBrowsingDataAction(
                browsing_data::DeleteBrowsingDataAction::kCookiesInUseDialog);
            browsing_data::BraveRemoveNonModelDataForOrigin(host_content_settings_map_,
                                                            origin.GetURL());
