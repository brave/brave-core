substitutions:
  - description: |-
      Add //brave/components/containers/buildflags to public_deps of the
      navigator target.

      The chromium_src overrides of browser_navigator_params.h and
      browser_navigator.cc include the containers buildflags header.
    insert_into_list:
      target: navigator
      list_name: public_deps
      values: //brave/components/containers/buildflags
