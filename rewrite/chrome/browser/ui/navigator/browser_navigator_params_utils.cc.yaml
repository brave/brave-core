substitutions:
  - description: |
      Drop `params->url_typed_with_http_scheme ||` condition for force_no_https_upgrade

      We want URLs that were manually typed with HTTP scheme to be HTTPS
      upgradable, but preserve upstream's behavior regarding captive portals (like
      hotel login pages, which typically aren't configured to work with HTTPS)

    regex:
      re_pattern: |
        (bool force_no_https_upgrade =)(\s*?params->url_typed_with_http_scheme \|\|)
      replace: \1\n

  - description: |
      Call BraveAdjustLoadURLParams after building main-frame navigation UI data.

      Anchored on the navigation_ui_data assignment in the WebContents*
      overload so Brave can adjust load params before LoadURLWithParams.
      The hook is forward-declared in the chromium_src shadow and implemented
      by //brave/browser/ui/navigator:chromium_impl.
    regex:
      re_pattern: |-
        ( *)(load_url_params\.navigation_ui_data = .*)
      replace: |-
        \1\2
        \1BraveAdjustLoadURLParams(params, target_contents);
