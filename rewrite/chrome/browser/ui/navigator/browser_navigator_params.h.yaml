substitutions:
  - description: |
      Add `storage_partition_config` to NavigateParams for Brave's container support.
    regex:
      re_pattern: '(struct NavigateParams\ {\n)'
      replace: |-
        \1#if BUILDFLAG(ENABLE_CONTAINERS)
          std::optional<content::StoragePartitionConfig> storage_partition_config;
        #endif\n
