substitutions:
  - description: |-
      The chromium_src override of browser_ui_controller.cc includes Brave
      sidebar headers, which pull in generated buildflags. Depend on
      //brave/browser/ui/sidebar so those headers exist at compile time.
    insert_into_list:
      target: impl
      list_name: deps
      values: //brave/browser/ui/sidebar
