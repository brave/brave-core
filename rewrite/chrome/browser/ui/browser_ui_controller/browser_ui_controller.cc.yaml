substitutions:
  - description: |-
      Update the sidebar UI when the active tab's URL changes.

      This used to live in BraveBrowser::ScheduleUIUpdate, but
      Browser::ScheduleUIUpdate moved into BrowserUiController and is no
      longer virtual, so hook into it here instead.
    preempt_function_impl:
      function_name: BrowserUiController::ScheduleUIUpdate
      code: |-
        MaybeUpdateSidebarForUrlChange(*browser_, *tab_strip_model_, source,
                                       changed_flags);
