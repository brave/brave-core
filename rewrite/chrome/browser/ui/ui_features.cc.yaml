substitutions:
  - description: 'Ship kFewerUpdateConfirmations disabled.'
    set_feature_flag_default_state:
      feature_name: kFewerUpdateConfirmations
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Ship kPdfInfoBar disabled.

      PDF infobar is only used on Windows and macOS upstream.
    set_feature_flag_default_state:
      feature_name: kPdfInfoBar
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Ship kTabHoverCardImages disabled.

      https://github.com/brave/brave-browser/issues/46337: Re-enable scrim
      views if needed.
    set_feature_flag_default_state:
      feature_name: kTabHoverCardImages
      value: base::FEATURE_DISABLED_BY_DEFAULT
