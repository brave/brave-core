substitutions:
  - description: |-
      Add Brave specific page action icon types.

      Appended before kMaxValue so they stay within the upstream enum range.
    add_enum_entries:
      enum_name: PageActionIconType
      max_value: kMaxValue
      entries:
        - kBravePlaylist
        - kBraveWaybackMachine
        - kBraveSpeedreader
        - kBravePartitionedStorage
        - kBravePsst
        - kBraveOnionLocation
        - kBraveNews
