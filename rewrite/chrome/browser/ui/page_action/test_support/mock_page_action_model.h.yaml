substitutions:
  - description: |-
      Mock the methods Brave adds to PageActionModelInterface.

      MockPageActionModel must override the pure virtuals added to
      PageActionModelInterface (see page_action_model.h.yaml) to stay
      instantiable.
    add_to_public:
      class_name: MockPageActionModel
      code: |-
        MOCK_METHOD(void, SetAlwaysShowLabel, (PageActionPassKey, bool), (override));
        MOCK_METHOD(void,
                    SetOverrideChipColors,
                    (PageActionPassKey,
                     std::optional<SkColor>,
                     std::optional<SkColor>),
                    (override));
        MOCK_METHOD(std::optional<SkColor>,
                    GetOverrideBackgroundColor,
                    (),
                    (const, override));
        MOCK_METHOD(std::optional<SkColor>,
                    GetOverrideForegroundColor,
                    (),
                    (const, override));
        MOCK_METHOD(bool, GetAlwaysShowLabel, (), (const, override));
        MOCK_METHOD(void,
                    SetOverrideHeight,
                    (PageActionPassKey, std::optional<int>),
                    (override));
        MOCK_METHOD(std::optional<int>, GetOverrideHeight, (), (const, override));
        MOCK_METHOD(void,
                    SetOverrideTriggerableEvent,
                    (PageActionPassKey, std::optional<int>),
                    (override));
        MOCK_METHOD(std::optional<int>,
                    GetOverrideTriggerableEvent,
                    (),
                    (const, override));
        MOCK_METHOD(void,
                    SetOverrideBorder,
                    (PageActionPassKey, std::optional<gfx::Insets>),
                    (override));
        MOCK_METHOD(std::optional<gfx::Insets>,
                    GetOverrideBorder,
                    (),
                    (const, override));
