substitutions:
  - description: |
      Pull in the variable list for the Brave additions to `source_set("impl")`.

      Inserted at the top of the file.
    regex:
      re_pattern: '(# found in the LICENSE file\.\n\n)'
      replace: |
        \1import("//brave/browser/ui/web_applications/sources.gni")

  - description: |
      Append Brave deps to `source_set("impl")`.
    regex:
      re_pattern: '(source_set\("impl"\).*?\bdeps\s*=\s*\[\])'
      re_flags: [DOTALL]
      replace: '\1\n  deps += brave_chrome_browser_ui_web_applications_deps'
