substitutions:
  - description: |
      Append the Brave additions to `source_set("impl")`.

      The deps are a variable list, imported from the `.gni` defining it.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_chrome_browser_ui_web_applications_deps
      import: //brave/browser/ui/web_applications/sources.gni
