substitutions:
  - description: |-
      Consider the pin PWA install button pref in UpdateVisibility().

      Only show the page action when the pref allows it with
      CheckPinPwaInstallButtonPref()
    regex:
      pattern: manager_->IsProbablyPromotableWebApp()
      replace: >-
        manager_->IsProbablyPromotableWebApp() &&
        CheckPinPwaInstallButtonPref(web_contents)
