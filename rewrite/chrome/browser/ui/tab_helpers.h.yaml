substitutions:
  - description: |-
      Let PeekContents attach the tab helpers.

      Peek shows a page over the active tab and can promote it to a tab, so it
      needs the full set of tab helpers.
    add_friend:
      class_name: TabHelpers
      friend_type: class PeekContents
