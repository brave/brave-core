substitutions:
  - description: |-
      Let the Android bridge supply the notice preference; test bridges retain upstream behavior.
    regex:
      re_pattern: '(class Bridge\s*\{\s*public:)'
      replace: |-
        \1
            virtual bool ShouldShowFullscreenNotice() const;

  - description: |-
      Share the fullscreen notice suppression check between display paths.
    regex:
      re_pattern: '(class ExclusiveAccessBubbleAndroid\b.*?\n private:)'
      re_flags: [DOTALL]
      replace: |-
        \1
          bool ShouldSuppressFullscreenNotice(ExclusiveAccessBubbleType type) const;
