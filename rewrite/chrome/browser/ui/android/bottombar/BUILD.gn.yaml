substitutions:
  - description: |-
      Embed Brave's bottom bar sources into the upstream component.

      BottomBarCoordinator constructs BraveBottomBarButtonManager, so a target of
      its own would have to be depended on by the component it depends on.
    regex:
      re_pattern: |-
        (android_library\("java"\) \{\n  sources = \[.+?\n  \]\n)
      re_flags: [DOTALL]
      replace: |
        \1  sources += brave_bottombar_java_sources
