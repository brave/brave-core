substitutions:
  - description: |-
      Default the bottom bar setting to Brave's prior bottom toolbar choices.
    regex:
      re_pattern: |-
        (ChromePreferenceKeys\.BOTTOM_BAR_ENABLED,\s*)(ChromeFeatureList\.sAndroidBottomBarDefaultUserEnabled\.getValue\(\))
      replace: |-
        \1BraveBottomBarUserPrefs.getDefaultUserEnabled(\2)
