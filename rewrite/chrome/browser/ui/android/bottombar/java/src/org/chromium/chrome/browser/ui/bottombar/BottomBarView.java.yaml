substitutions:
  - description: |-
      Resolve Brave's bookmark action to the shared extra container.

      Brave's bookmark button occupies the container upstream shares between Glic
      and AI Mode, so it has to resolve to it alongside them - BottomBarViewBinder
      looks the container up by the action id that owns the slot.
    regex:
      re_pattern: |-
        ( *)(case ActionId\.AI_MODE:)
      replace: |-
        \1\2
        \1case ActionId.BRAVE_BOOKMARK:
