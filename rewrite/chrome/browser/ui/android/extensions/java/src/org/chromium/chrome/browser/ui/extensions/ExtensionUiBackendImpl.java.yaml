substitutions:
  - description: |
      Show the extensions UI only on tablets with BraveAndroidExtensions on.

      The phone UI isn't supported yet.
    count: 1
    regex:
      re_pattern:
        '(public boolean isEnabled\(Profile profile\) \{\s*)return true;'
      replace: |-
        \1return org.chromium.chrome.browser.flags.ChromeFeatureList.isEnabled(
                        "BraveAndroidExtensions")
                        && org.chromium.ui.base.DeviceFormFactor.isNonMultiDisplayContextOnTablet(
                                org.chromium.base.ContextUtils.getApplicationContext());
