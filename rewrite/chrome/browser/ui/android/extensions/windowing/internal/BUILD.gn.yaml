substitutions:
  - description: Import the extensions buildflags.
    add_import:
      import: //extensions/buildflags/buildflags.gni
  - description: |-
      Build the window controller bridge whenever the extensions core is built.
      Without it no Android window is visible to the extensions tabs and
      windows APIs.
    regex:
      pattern: 'assert(is_desktop_android)'
      replace: 'assert(is_desktop_android || enable_extensions_core)'
