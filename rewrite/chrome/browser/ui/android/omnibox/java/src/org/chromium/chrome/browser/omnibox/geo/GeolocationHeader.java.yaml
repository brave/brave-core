substitutions:
  - description: |
      Guard geolocation after TemplateUrlService native teardown.

      Android can recreate an activity while the Java TemplateUrlService
      remains after native code clears its pointer. Both the default search
      engine priming and omnibox URL loads reach geoHeaderStateForUrl, so return
      UNSUITABLE_URL there before calling JNI methods such as
      getUrlForSearchQuery when the native object is gone.
    count: 1
    regex:
      re_pattern: '(if\s*\(\s*profile\s*==\s*null\s*\|\|\s*service\s*==\s*null\s*\)\s*return\s+HeaderState\.UNSUITABLE_URL;)'
      replace: |-
        \1
                    if (!service.hasNativeService()) return HeaderState.UNSUITABLE_URL;
