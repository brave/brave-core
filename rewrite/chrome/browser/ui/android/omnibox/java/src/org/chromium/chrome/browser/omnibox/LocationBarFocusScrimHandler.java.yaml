substitutions:
  - description: |-
      Apply the omnibox focus scrim to the navigation bar.

      Brave hides its bottom toolbar while the omnibox is focused. The system
      navigation area must use the same scrim treatment as the focused page.
      Upstream's Android bottom bar owns the bottom controls when enabled, so
      keep upstream behavior there.
    regex:
      re_pattern: '^( *)(public LocationBarFocusScrimHandler.*?\{.*?)(\n^\1\})'
      re_flags: [DOTALL, MULTILINE]
      replace: |-
        \1\2\n\1\1if (!ChromeFeatureList.sAndroidBottomBar.isEnabled()) {\n\1\1\1mScrimModel.set(ScrimProperties.AFFECTS_NAVIGATION_BAR, true);\n\1\1}\3
  - description: |-
      Set the omnibox focus scrim bottom margin to zero.

      The focused omnibox hides Brave's bottom toolbar, so it must not reserve
      the bottom-chin area. This keeps the gesture-navigation region covered.
      Upstream's Android bottom bar keeps upstream's margin.
    regex:
      re_pattern: '^( *)(public void updateScrimVisualState\(\) \{.*?)(\n^\1\})'
      re_flags: [DOTALL, MULTILINE]
      replace: |-
        \1\2\n\1\1if (!ChromeFeatureList.sAndroidBottomBar.isEnabled()) {\n\1\1\1mScrimModel.set(ScrimProperties.BOTTOM_MARGIN, 0);\n\1\1}\3
