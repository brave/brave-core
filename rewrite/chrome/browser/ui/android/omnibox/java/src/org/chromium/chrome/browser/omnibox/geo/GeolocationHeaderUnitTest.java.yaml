substitutions:
  - description: |
      Treat the TemplateUrlService mock as native-backed in geolocation tests.

      Chromium test cases exercise normal geolocation-header behavior, which
      requires the mock to report an active native service.
    regex:
      re_pattern: '(public\s+void\s+setUp\s*\(\s*\)\s*\{)'
      replace: |-
        \1
                when(mTemplateUrlServiceMock.hasNativeService()).thenReturn(true);
