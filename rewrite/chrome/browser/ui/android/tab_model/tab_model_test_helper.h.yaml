substitutions:
  - description: Needed by the IS_ANDROID check below.
    add_after_line:
      line: '#include "base/sequence_checker.h"'
      code: |-
        #include "build/build_config.h"

  - description: |-
      Guard AssociateWithBrowserWindow on IS_ANDROID instead of
      IS_DESKTOP_ANDROID: BrowserWindowInterface is available on all
      Android, not just desktop Android, so there is no reason to tie this
      to is_desktop_android (or to enable_extensions_core, which is about
      its only current caller, windowing/internal's extensions unit test,
      not about this header's availability).
    regex:
      re_pattern:
        '// BrowserWindowInterface is available on desktop Android, but not
        other Android\s*// builds\.\s*#if
        BUILDFLAG\(IS_DESKTOP_ANDROID\)\s*(void
        AssociateWithBrowserWindow\(BrowserWindowInterface\*
        browser_window\);)\s*#endif'
      replace: |-
        // BrowserWindowInterface is available on all Android.
        #if BUILDFLAG(IS_ANDROID)
          \1
        #endif
