substitutions:
  - description: |-
      TestTabModel::AssociateWithBrowserWindow is desktop-Android-only test
      scaffolding; the production TabModelJniBridge equivalent is
      unconditional. Widen it to match, now that enable_extensions_core
      compiles windowing/internal's unit tests on regular Android too.
    regex:
      re_pattern:
        '// BrowserWindowInterface is available on desktop Android, but not
        other Android\s*// builds\.\s*#if BUILDFLAG\(IS_DESKTOP_ANDROID\)\s*void
        (AssociateWithBrowserWindow\(BrowserWindowInterface\*
        browser_window\);)\s*#endif'
      replace: '  void \1'
