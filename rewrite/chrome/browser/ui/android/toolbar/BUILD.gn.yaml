substitutions:
  - description: Add the Brave toolbar java sources.
    add_literal_to_list:
      target: core_java
      list_name: sources
      literal: brave_browser_ui_android_toolbar_sources

  - description: Depend on the Brave toolbar java resources.
    insert_into_list:
      target: java_resources
      list_name: deps
      values:
        - //brave/browser/ui/android/toolbar:java_resources

  - description: |-
      Depend on Brave's bottom bar user settings.

      isToolbarUiRefactorEnabled() answers to the "Enable bottom bar" setting.
      The dependency is kept to Brave's leaf target rather than the bottom bar
      component, which this one deliberately does not depend on.
    insert_into_list:
      target: variation_utils_java
      list_name: deps
      values:
        - //brave/browser/ui/android/bottombar:prefs_java
