substitutions:
  - description: Add the Brave toolbar java sources.
    add_literal_to_list:
      target: core_java
      list_name: sources
      literal: brave_browser_ui_android_toolbar_sources

  - description: Depend on the Brave toolbar java resources.
    insert_into_list:
      target: java_resources
      list_name: deps
      values:
        - //brave/browser/ui/android/toolbar:java_resources
