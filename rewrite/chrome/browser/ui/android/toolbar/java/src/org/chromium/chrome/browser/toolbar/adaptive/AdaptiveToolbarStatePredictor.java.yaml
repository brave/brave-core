substitutions:
  - description: |-
      Make isVariantEnabled() overridable.

      BraveAdaptiveToolbarStatePredictor keeps the New tab variant enabled
      with the bottom bar on, as Brave's bottom bar has no New tab button.
    regex:
      re_pattern: |-
        private (boolean isVariantEnabled\()
      replace: |-
        protected \1
