substitutions:
  - description: |-
      Don't create the toolbar's sign-in button.

      The button signs in to a Google account, which Brave doesn't offer.
      Without its stub no SigninButtonCoordinator is created, and the toolbar
      handles a null one.
    regex:
      re_pattern:
        '(ViewStub
        signinButtonStub\s*=\s*)mToolbarLayout\.findViewById\(R\.id\.signin_button_stub\);'
      replace: '\1null;'
