substitutions:
  - description: |
      Refresh the Brave toolbar button tint before Chromium's cached-color early return.

      A private-to-standard tab switch can replace Brave button backgrounds. Refreshing the color
      at the start of the method ensures the toolbar displays correctly, and this refresh call
      is not ignored by upstream's early-exit due to the cached color being unchanged.
    regex:
      re_pattern: '(private void updateModernLocationBarColor\([^)]*\)\s*\{)'
      replace: |-
        \1
                BraveToolbarLayout.class.cast(this).updateModernLocationBarColorImpl(color);
  - description: |
      Skip location bar layout when the Brave location bar is unavailable.

      Check the Brave location bar at the start of the expansion-layout update.
    regex:
      re_pattern: '(private\s+void\s+updateLocationBarLayoutForExpansionAnimation\(\)\s*\{)'
      replace: |-
        \1
                if (!BraveToolbarLayout.class.cast(this).isLocationBarValid(mLocationBar)) return;
  - description: |
      Require omnibox focus for the DSE icon focus-animation offset.

      Upstream moves focus to a 1px thief view inside the location bar when an
      omnibox session ends, so the View#hasFocus() this is called with stays
      true once unfocused and the offset that makes room for the DSE icon is
      never undone. Brave keeps the real omnibox visible on the NTP, where that
      leaves the status icon shifted out of the location bar background.
    regex:
      re_pattern: '(int\s+getLocationBarOffsetForFocusAnimation\([^)]*\)\s*\{)'
      replace: |-
        \1
                if (!urlHasFocus()) return 0;
  - description: |
      Draw Brave's toolbar animation overlay with the Chromium toolbar buttons.

      Place the overlay before the tab-switcher button in the toolbar's custom draw pass.
    regex:
      re_pattern:
        '(void\s+drawWithoutBackground\(Canvas\s+canvas\)\s*\{.*?\n[ \t]*\n)([
        \t]*// Draw the tab stack button and associated text if necessary\.)'
      re_flags: [DOTALL]
      replace: |-
        \1        BraveToolbarLayout.class.cast(this).drawAnimationOverlay(mToolbarButtonsContainer, canvas);
        \2
  - description: |
      Keep the home button disabled in the Brave phone toolbar.

      Override Chromium's home-button state before updating button visibility.
    regex:
      re_pattern: '(public\s+void\s+onHomeButtonIsEnabledUpdate\(boolean\s+(\w+)\)\s*\{\s*)mIsHomeButtonEnabled\s*=\s*\2;'
      replace: '\1mIsHomeButtonEnabled = false;'
  - description: |
      Skip legacy focus animations when the Brave location bar is unavailable.

      Check the Brave location bar at the start of the legacy focus-animation setup.
    regex:
      re_pattern: '(private\s+void\s+createAndRunFocusAnimatorLegacy\([^)]*\)\s*\{)'
      replace: |-
        \1
                if (!BraveToolbarLayout.class.cast(this).isLocationBarValid(mLocationBar)) return;
  - description: |
      Let Brave update the NTP toolbar background color.

      The coordinator is in the same Java package, so package-private mutable access is sufficient.
    regex:
      re_pattern: '\bprivate\s+final\s+(@ColorInt\s+int\s+mToolbarBackgroundColorForNtp\b)'
      replace: '\1'
  - description: |
      Let Brave update the NTP location bar background color.

      The coordinator is in the same Java package, so package-private mutable access is sufficient.
    regex:
      re_pattern: '\bprivate\s+final\s+(@ColorInt\s+int\s+mLocationBarBackgroundColorForNtp\b)'
      replace: '\1'
