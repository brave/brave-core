substitutions:
  - description: |-
      Route the Android autofill availability query through Brave's jni_zero-generated
      BraveAutofillClientProviderUtils stub.

      The declaration for the Brave version comes from the chromium_src override's
      include of the generated Brave JNI header (BraveAutofillClientProviderUtils_jni.h).
    regex:
      pattern: Java_AutofillClientProviderUtils_getAndroidAutofillFrameworkAvailability
      replace: Java_BraveAutofillClientProviderUtils_getAndroidAutofillFrameworkAvailability
