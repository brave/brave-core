substitutions:
  - description: |-
      Also require the offer to not be a promo code offer.

      BraveIsOfferValid (defined in the chromium_src override) replicates
      the functionality that the removed upstream flag
      kAutofillEnableOfferNotificationForPromoCodes used to have.
    after_function_impl:
      function_name: OfferNotificationHandler::ValidOfferExistsForUrl
      result_var: valid_offer_exists
      code: |-
        return valid_offer_exists &&
               BraveIsOfferValid(offer_manager_->GetOfferForUrl(url));
