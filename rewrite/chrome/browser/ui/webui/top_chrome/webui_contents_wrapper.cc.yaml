substitutions:
  - description: |-
      Redirect new popup contents to the browser window

      The bubble doesn't allow opening popups, so new popup content is
      redirected to the browser window via chrome::AddWebContents() (forcing
      kNewPopup). The popups are tracked so they can be closed together with
      the bubble.
    preempt_function_impl:
      function_name: WebUIContentsWrapper::AddNewContents
      code: |-
        if (browser_) {
          auto* contents = chrome::AddWebContents(
              browser_.get(), source, std::move(new_contents), target_url,
              WindowOpenDisposition::kNewPopup, window_features,
              NavigateParams::WindowAction::kShowWindow, user_gesture);
          if (!contents) {
            return nullptr;
          }
          tracked_popups_.push_back(contents->GetWeakPtr());
          return contents;
        }

  - description: |-
      Define popup tracking methods
    regex:
      pattern: 'content::WebContents* WebUIContentsWrapper::AddNewContents('
      replace: |-
        void WebUIContentsWrapper::SetWebContentsAddNewContentsBrowser(
            base::WeakPtr<BrowserWindowInterface> browser) {
          browser_ = std::move(browser);
        }

        void WebUIContentsWrapper::CloseTrackedPopups() {
          for (auto& web_contents : tracked_popups_) {
            if (web_contents) {
              web_contents->Close();
            }
          }
          tracked_popups_.clear();
        }

        content::WebContents* WebUIContentsWrapper::AddNewContents(
    count: 1
