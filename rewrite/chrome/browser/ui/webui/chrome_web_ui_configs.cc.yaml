substitutions:
  - description: |-
      Register Brave WebUI configs after the upstream ones.

      Chromium WebUIs that Brave replaces are removed first, because the map
      doesn't allow multiple entries for the same origin.
    after_function_impl:
      function_name: RegisterChromeWebUIConfigs
      code: |-
        RegisterBraveWebUIConfigs();
