substitutions:
  - description: |-
      Use Brave's own default favicon resource names, instead of shadowing
      the real ones.
    regex:
      pattern: |-
        resource_id =
                  dark_mode ? IDR_DEFAULT_FAVICON_DARK_64 : IDR_DEFAULT_FAVICON_64;
      replace: |-
        resource_id = dark_mode ? BRAVE_IDR_DEFAULT_FAVICON_DARK_64
                                      : BRAVE_IDR_DEFAULT_FAVICON_64;

  - description: |-
      Use Brave's own default favicon resource names, instead of shadowing
      the real ones.
    regex:
      pattern: |-
        resource_id =
                  dark_mode ? IDR_DEFAULT_FAVICON_DARK_32 : IDR_DEFAULT_FAVICON_32;
      replace: |-
        resource_id = dark_mode ? BRAVE_IDR_DEFAULT_FAVICON_DARK_32
                                      : BRAVE_IDR_DEFAULT_FAVICON_32;
