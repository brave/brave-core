substitutions:
  - description: |-
      Use the Brave channel logo

      Brave has no GOOGLE_CHROME_BRANDING and only runs development builds on
      the UNKNOWN channel, so the logo is chosen by
      CurrentChannelBraveLogoResourceId() defined in the chromium_src override.
    preempt_function_impl:
      function_name: CurrentChannelLogoResourceId
      code: |-
        return CurrentChannelBraveLogoResourceId();
