substitutions:
  - description: |-
      Show Brave's version number on brave://version.

      GetBraveVersionNumberForDisplay is declared in
      brave/components/version_info/version_info.h, which the chromium_src
      shadow includes. rename_class does not apply as this is a function in a
      namespace, not a class.
    count: 2
    regex:
      pattern: version_info::GetVersionNumber
      replace: version_info::GetBraveVersionNumberForDisplay
