substitutions:
  - description: |-
      Return BraveWebUIControllerFactory.

      Brave's factory wraps the Chromium one and adds Brave WebUIs.
    preempt_function_impl:
      function_name: ChromeWebUIControllerFactory::GetInstance
      code: |-
        if ((true)) {
          return BraveWebUIControllerFactory::GetInstance();
        }
