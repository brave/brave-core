substitutions:
  - description: |
      Add Leo omnibox icons to `VectorIconToResourceName`.

      Brave's icons are checked where upstream gives up on an icon with no
      resource. This function is used for the WebUI Omnibox, which isn't
      enabled in Brave, so other icons fall back to the default icon instead
      of hitting `DUMP_WILL_BE_NOTREACHED`.
    regex:
      # Scoped to the `resource_name.empty()` block of
      # `VectorIconToResourceName`; the match can't leave the function.
      re_pattern: |-
        (std::string SearchboxHandler::VectorIconToResourceName\((?:(?!\n\}\n).)*?\n  if \(resource_name\.empty\(\)\) \{\n)(    DUMP_WILL_BE_NOTREACHED\(\))
      re_flags: [DOTALL]
      replace: |-
        \1    if (icon.name == kLeoWindowTabNewIcon.name) {
              return kLeoWindowTabNewIconResourceName;
            } else if (icon.name == kLeoMessageBubbleAskIcon.name) {
              return kLeoMessageBubbleAskIconResourceName;
            }
            if ((true)) {
              return "";
            }
        \2

  - description: |
      Force keyword mode in the NTP realbox.

      We tweak a few AutocompleteInput settings because unlike Chromium we only
      want keyword search results.
    regex:
      pattern: 'bool is_keyword_selected = false;'
      replace: 'bool is_keyword_selected = true;'
