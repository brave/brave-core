substitutions:
  - description: |-
      Use Brave's title for brave://downloads.

      IDS_DOWNLOADS_TITLE is declared in brave/grit/brave_generated_resources.h,
      which the chromium_src shadow includes. rename_class does not apply as
      this is a resource id, not a class.
    regex:
      pattern: IDS_DOWNLOAD_HISTORY_TITLE
      replace: IDS_DOWNLOADS_TITLE
