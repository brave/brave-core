substitutions:
  - description: |-
      Rename TabSearchUI so Brave can subclass it.

      The chromium_src shadow header defines a Brave TabSearchUI deriving from
      TabSearchUI_ChromiumImpl.
    rename_class:
      class_name: TabSearchUI
      rename: TabSearchUI_ChromiumImpl

  - description: |-
      Rename TabSearchUIConfig so Brave can re-define it.

      The shadow header re-defines TabSearchUIConfig on top of the Brave
      TabSearchUI.
    rename_class:
      class_name: TabSearchUIConfig
      rename: TabSearchUIConfig_Unused
