substitutions:
  - description: |-
      Rename TabSearchPageHandler so Brave can subclass it.

      The chromium_src shadow header defines a Brave TabSearchPageHandler
      deriving from TabSearchPageHandler_ChromiumImpl.
    rename_class:
      class_name: TabSearchPageHandler
      rename: TabSearchPageHandler_ChromiumImpl

  - description: |-
      Let the Brave TabSearchPageHandler access private members.

      The Brave subclass uses private members such as page_ and web_ui_.
    add_friend:
      class_name: TabSearchPageHandler_ChromiumImpl
      friend_type: class TabSearchPageHandler
