substitutions:
  - description: |-
      Initialize brave://history's data source through BraveHistoryUIInitializer.

      BraveHistoryUIInitializer is defined in the chromium_src shadow. It runs
      ManagedUIHandler::Initialize() and then adds what the
      brave-history-embeddings element needs. The upstream constructor calls
      ManagedUIHandler::Initialize() exactly once, at a point where the data
      source has been created and is in scope.
    rename_class:
      class_name: ManagedUIHandler
      rename: BraveHistoryUIInitializer
