substitutions:
  - description: |-
      Keep the synced tabs page on the pre-UnoPhase2 sign-in path.

      Brave has no Google sign-in, so `HistorySignInState` is always
      `SIGNED_OUT`. With the sign-in promo variant enabled,
      `synced_device_manager.ts` shows a `sign in and sync history` banner and
      wipes the device list on every identity state update, hiding tabs synced
      through a Brave sync chain.

      Only the WebUI is opted out. Disabling
      `kReplaceSyncPromosWithSigninPromosNewSignin` itself would also change
      `SyncPrefs::IsTypeSelectedByDefaultInTransportMode()`, but this plaster
      way is selected to be ready to the upsteram flag drop.
    regex:
      re_pattern: |-
        source->AddBoolean\("replaceSyncPromosWithSignInPromos",\s+syncer::IsReplaceSyncPromosWithSignInPromosEnabled\(\)\);
      replace: 'source->AddBoolean("replaceSyncPromosWithSignInPromos", false);'
