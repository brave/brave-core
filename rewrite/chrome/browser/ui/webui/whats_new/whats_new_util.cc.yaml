substitutions:
  - description: |-
      Use Brave's What's New decision.

      Brave decides whether to show What's New from its own prefs and channel
      version, not from the upstream promotional tab state.
    preempt_function_impl:
      function_name: ShouldShowForState
      code: |-
        if ((true)) {
          return ShouldShowBraveWhatsNewForState(local_state);
        }
