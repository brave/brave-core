substitutions:
  - description: |-
      Start the Brave What's New flow instead of the upstream fetch.

      Brave shows its own What's New page, so the upstream fetch must never run.
    preempt_function_impl:
      function_name: StartWhatsNewFetch
      code: |-
        if ((true)) {
          StartBraveWhatsNew(browser);
          return;
        }
