substitutions:
  - description: |-
      Use SparkleVersionUpdater unless Omaha4 is enabled
    regex:
      pattern: 'return base::WrapUnique(new VersionUpdaterMac());'
      replace: |-
        #if BUILDFLAG(ENABLE_OMAHA4)
          return base::WrapUnique(
              brave_updater::ShouldUseOmaha4()
                  ? new VersionUpdaterMac()
                  : static_cast<VersionUpdater*>(new SparkleVersionUpdater()));
        #else
          return base::WrapUnique(new VersionUpdaterMac());
        #endif
    count: 1
