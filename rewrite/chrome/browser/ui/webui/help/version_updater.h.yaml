substitutions:
  - description: |-
      Add GetIsSparkleForTesting

      Lets tests detect whether the Sparkle updater is in use.
    regex:
      pattern: 'virtual void PromoteUpdater() = 0;'
      replace: |-
        #if BUILDFLAG(ENABLE_SPARKLE)
          virtual void GetIsSparkleForTesting(bool& result) const {}
        #endif
          virtual void PromoteUpdater() = 0;
    count: 1
