substitutions:
  - description: |-
      Serve no colors.css for the system profile.

      Unlike Chromium, Brave also loads the ThemeSource in the system profile,
      where the ThemeService is null.
    regex:
      pattern: 'is_grayscale = theme_service->GetIsGrayscale();'
      # The pattern starts after the line's indentation, so the inserted lines
      # are indented relative to that point.
      replace: |-
        if (!theme_service) {
              CHECK(profile->IsSystemProfile());
              std::move(callback).Run(nullptr);
              return;
            }
            is_grayscale = theme_service->GetIsGrayscale();
