substitutions:
  - description: |-
      Add Brave resources and strings to the password manager data source

      Adds the Brave logo and the fill labels.
    regex:
      pattern: |-
        IDR_PASSWORD_MANAGER_PASSWORD_MANAGER_HTML);
      replace: |-
        IDR_PASSWORD_MANAGER_PASSWORD_MANAGER_HTML);
          AddBravePasswordManagerSourceData(source);
    count: 1

  - description: |-
      Use the Brave empty state string for syncing users

      Brave does not have separate syncing and signed out strings.
    regex:
      pattern: |-
        IDS_PASSWORD_MANAGER_UI_EMPTY_STATE_SYNCING_USERS
      replace: |-
        IDS_BRAVE_PASSWORD_MANAGER_UI_EMPTY_STATE_SIGNEDOUT_USERS
    count: 1

  - description: |-
      Use the Brave empty state string for signed out users

      Brand the upstream string for Brave.
    regex:
      pattern: |-
        IDS_PASSWORD_MANAGER_UI_EMPTY_STATE_SIGNEDOUT_USERS
      replace: |-
        IDS_BRAVE_PASSWORD_MANAGER_UI_EMPTY_STATE_SIGNEDOUT_USERS
    count: 1

  - description: |-
      Use the Brave import description string for syncing users

      Brave does not have separate syncing and signed out strings.
    regex:
      pattern: |-
        IDS_PASSWORD_MANAGER_UI_IMPORT_DESCRIPTION_SYNCING_USERS
      replace: |-
        IDS_BRAVE_PASSWORD_MANAGER_UI_IMPORT_DESCRIPTION_SIGNEDOUT_USERS
    count: 1

  - description: |-
      Use the Brave import description string for signed out users

      Brand the upstream string for Brave.
    regex:
      pattern: |-
        IDS_PASSWORD_MANAGER_UI_IMPORT_DESCRIPTION_SIGNEDOUT_USERS
      replace: |-
        IDS_BRAVE_PASSWORD_MANAGER_UI_IMPORT_DESCRIPTION_SIGNEDOUT_USERS
    count: 1
