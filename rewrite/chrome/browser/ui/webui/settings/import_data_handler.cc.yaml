substitutions:
  - description: |-
      Use BraveExternalProcessImporterHost.

      Brave's importer host supports importing extensions and payments.
    rename_class:
      class_name: ExternalProcessImporterHost
      rename: BraveExternalProcessImporterHost

  - description: |-
      Read the Brave import dialog selections.

      NOTE: When we add a new import feature, also consider adding it for
      importing in the welcome page. See IMPORT_BROWSER_DATA_REQUESTED action in
      welcome_reducer.ts.
    regex:
      pattern: |-
        selected_items |= user_data_importer::SEARCH_ENGINES;
          }
      replace: |-
        selected_items |= user_data_importer::SEARCH_ENGINES;
          }
          if (type_dict.FindBool(kImportDialogExtensions).value_or(false)) {
            selected_items |= user_data_importer::EXTENSIONS;
          }
          if (type_dict.FindBool(kImportDialogPayments).value_or(false)) {
            selected_items |= user_data_importer::PAYMENTS;
          }
    count: 1

  - description: |-
      Report Brave-supported import services to the WebUI.

      Extensions and payments are importable in Brave in addition to the
      upstream data types.
    regex:
      pattern:
        (browser_services & user_data_importer::AUTOFILL_FORM_DATA) != 0);
      replace: |-
        (browser_services & user_data_importer::AUTOFILL_FORM_DATA) != 0);
            browser_profile.Set(
                "extensions",
                (browser_services & user_data_importer::EXTENSIONS) != 0);
            browser_profile.Set(
                "payments", (browser_services & user_data_importer::PAYMENTS) != 0);
    count: 1
