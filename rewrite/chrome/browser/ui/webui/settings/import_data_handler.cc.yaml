substitutions:
  - description: |-
      Use BraveExternalProcessImporterHost.

      Brave's importer host supports importing extensions and payments.
    rename_class:
      class_name: ExternalProcessImporterHost
      rename: BraveExternalProcessImporterHost

  - description: |-
      Read the Brave import dialog selections.

      See AddBraveSelectedItems() in the chromium_src override of this file.
    regex:
      re_pattern:
        '(selected_items \|= user_data_importer::SEARCH_ENGINES;\s*\})'
      replace: |-
        \1
          AddBraveSelectedItems(type_dict, selected_items);
    count: 1

  - description: |-
      Report Brave-supported import services to the WebUI.

      Extensions and payments are importable in Brave in addition to the
      upstream data types. See SetBraveBrowserProfileServices() in the
      chromium_src override of this file.
    add_before_line:
      line: 'browser_profiles.Append(std::move(browser_profile));'
      code:
        '    SetBraveBrowserProfileServices(browser_profile, browser_services);'
