substitutions:
  - description: |-
      Use BraveSecureDnsHandler with Brave VPN on Windows.

      It updates the page's secure DNS settings when the VPN's DNS protection
      changes the DNS config.
    regex:
      re_pattern:
        '\n(
        *)AddSettingsPageUIHandler\(std::make_unique<SecureDnsHandler>\(\)\);'
      replace: |-

        #if BUILDFLAG(IS_WIN) && BUILDFLAG(ENABLE_BRAVE_VPN)
        \1AddSettingsPageUIHandler(std::make_unique<BraveSecureDnsHandler>());
        #else
        \1AddSettingsPageUIHandler(std::make_unique<SecureDnsHandler>());
        #endif
