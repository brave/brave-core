substitutions:
  - description: |-
      Clear Leo history when the Brave AI Chat data type is selected.

      Brave adds BrowsingDataType::BRAVE_AI_CHAT, which maps to the Leo history
      data type in the remove mask.
    regex:
      pattern: 'case BrowsingDataType::HOSTED_APPS_DATA:'
      replace: |-
        #if BUILDFLAG(ENABLE_AI_CHAT)
        case BrowsingDataType::BRAVE_AI_CHAT:
          remove_mask |= chrome_browsing_data_remover::DATA_TYPE_BRAVE_LEO_HISTORY;
          break;
        #endif
        case BrowsingDataType::HOSTED_APPS_DATA:

  - description: |-
      Remove the Windows jump list when history is cleared.

      BraveRemoveJumplist is defined in the browsing_data namespace by the
      chromium_src override of this file.
    regex:
      pattern: 'browsing_data::RecordDeleteBrowsingDataAction('
      replace: |-
        #if BUILDFLAG(IS_WIN)
        browsing_data::BraveRemoveJumplist(remove_mask, profile_);
        #endif
        browsing_data::RecordDeleteBrowsingDataAction(
