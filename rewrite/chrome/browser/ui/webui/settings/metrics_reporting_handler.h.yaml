substitutions:
  - description: |-
      Force-enable MetricsReportingHandler declaration

      The class is declared as if GOOGLE_CHROME_BRANDING was on, because Brave
      code refers to it.
    regex:
      pattern:
        '#if BUILDFLAG(GOOGLE_CHROME_BRANDING) && !BUILDFLAG(IS_CHROMEOS)'
      replace:
        '#if ((true /*BUILDFLAG(GOOGLE_CHROME_BRANDING)*/)) &&
        !BUILDFLAG(IS_CHROMEOS)'
    count: 1
