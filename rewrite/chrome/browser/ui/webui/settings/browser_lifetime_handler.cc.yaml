substitutions:
  - description: |-
      Relaunch through Sparkle on macOS when it is enabled.

      Brave updates through Sparkle on macOS, so a relaunch from settings must
      go through the Sparkle relaunch handler first.
    preempt_function_impl:
      function_name: BrowserLifetimeHandler::HandleRelaunch
      code: |-
        #if BUILDFLAG(ENABLE_SPARKLE)
        if (brave_relaunch_handler::RelaunchOnMac()) {
          return;
        }
        #endif
