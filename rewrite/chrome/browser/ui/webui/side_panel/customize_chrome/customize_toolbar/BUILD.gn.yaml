substitutions:
  - description: |
      Depend on Brave's customize toolbar actions.

      The customize_toolbar_handler.cc override includes brave_action.h and
      list_action_modifiers.h, which need the generated Brave vector icons.
    insert_into_list:
      target: customize_toolbar
      list_name: deps
      values:
        - //brave/browser/ui/webui/side_panel/customize_chrome
