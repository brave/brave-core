substitutions:
  - description: |-
      Use a Brave-specific label for the appearance header.
    regex:
      pattern: 'IDS_NTP_CUSTOMIZE_APPEARANCE_LABEL'
      replace: 'IDS_BRAVE_NTP_CUSTOMIZE_APPEARANCE_LABEL'

  - description: |-
      Never show the device theme toggle.

      Brave does not support following the device theme here.
    regex:
      re_pattern: |-
        #if (BUILDFLAG\(IS_CHROMEOS\) \|\| BUILDFLAG\(IS_WIN\))
      replace: |-
        #if 0   // \1

  - description: |-
      Add Brave-specific strings and booleans to the WebUI data source.

      Adds the Brave toolbar label, the customize chrome strings and a boolean
      for the Darker Theme toggle.
    after_function_impl:
      function_name: CustomizeChromeUI::CustomizeChromeUI
      code: |-
        UpdateBraveDataSource(profile_);

  - description: |-
      Hand the new page handler a reference to CustomizeChromeUI.

      The Brave CustomizeChromePageHandler closes the side panel through it.
    after_function_impl:
      function_name: CustomizeChromeUI::CreatePageHandler
      code: |-
        CHECK(customize_chrome_page_handler_);
        customize_chrome_page_handler_->set_customize_chrome_ui(
            weak_ptr_factory_.GetWeakPtr());
