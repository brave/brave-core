substitutions:
  - description: |-
      Add a close panel callback to CustomizeChromeUI.

      The Brave CustomizeChromePageHandler closes the side panel through this
      callback, which is set by the side panel owner.
    add_to_public:
      class_name: CustomizeChromeUI
      code: |-
        void SetClosePanelCallback(base::RepeatingClosure close_panel_callback);
        base::RepeatingClosure close_panel_callback() const {
          return close_panel_callback_;
        }

  - description: |-
      Store the close panel callback in CustomizeChromeUI.
    add_to_protected:
      class_name: CustomizeChromeUI
      code: base::RepeatingClosure close_panel_callback_;
