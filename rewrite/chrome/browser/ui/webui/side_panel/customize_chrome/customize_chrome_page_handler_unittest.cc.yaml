substitutions:
  - description: |-
      Mock OnUseDarkerThemeChanged in MockPage.

      Brave adds OnUseDarkerThemeChanged to the CustomizeChromePage mojom
      interface, so the mock must implement it.
    add_to_public:
      class_name: MockPage
      code: |-
        MOCK_METHOD(void, OnUseDarkerThemeChanged, (bool use_darker_theme));
