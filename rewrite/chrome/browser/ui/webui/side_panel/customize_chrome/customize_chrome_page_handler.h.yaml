substitutions:
  - description: |-
      Rename CustomizeChromePageHandler so Brave can subclass it.

      The chromium_src shadow header defines a Brave CustomizeChromePageHandler
      deriving from CustomizeChromePageHandler_Chromium.
    rename_class:
      class_name: CustomizeChromePageHandler
      rename: CustomizeChromePageHandler_Chromium

  - description: |-
      Let the Brave CustomizeChromePageHandler access private members.

      The Brave subclass uses private members such as profile_ and page_.
    add_friend:
      class_name: CustomizeChromePageHandler_Chromium
      friend_type: class CustomizeChromePageHandler
