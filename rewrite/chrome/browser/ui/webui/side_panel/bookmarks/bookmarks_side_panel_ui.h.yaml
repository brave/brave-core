substitutions:
  - description: |-
      Rename BookmarksSidePanelUIConfig so Brave can re-define it.

      The chromium_src shadow header re-defines BookmarksSidePanelUIConfig on
      top of the Brave BookmarksSidePanelUI.
    rename_class:
      class_name: BookmarksSidePanelUIConfig
      rename: BookmarksSidePanelUIConfig_Unused

  - description: |-
      Rename BookmarksSidePanelUI so Brave can subclass it.

      The chromium_src shadow header defines a Brave BookmarksSidePanelUI
      deriving from BookmarksSidePanelUI_ChromiumImpl.
    rename_class:
      class_name: BookmarksSidePanelUI
      rename: BookmarksSidePanelUI_ChromiumImpl
