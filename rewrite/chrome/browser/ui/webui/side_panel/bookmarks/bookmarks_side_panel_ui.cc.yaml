substitutions:
  - description: |-
      Rename BookmarksSidePanelUIConfig so Brave can re-define it.

      The chromium_src shadow defines the Brave BookmarksSidePanelUIConfig
      methods.
    rename_class:
      class_name: BookmarksSidePanelUIConfig
      rename: BookmarksSidePanelUIConfig_Unused

  - description: |-
      Rename BookmarksSidePanelUI so Brave can subclass it.

      The chromium_src shadow defines the Brave BookmarksSidePanelUI
      constructor and destructor on top of BookmarksSidePanelUI_ChromiumImpl.
    rename_class:
      class_name: BookmarksSidePanelUI
      rename: BookmarksSidePanelUI_ChromiumImpl
