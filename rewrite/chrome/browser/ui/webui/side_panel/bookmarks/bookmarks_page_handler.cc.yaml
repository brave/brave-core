substitutions:
  - description: |-
      Use BookmarksSidePanelUI_ChromiumImpl in BookmarksPageHandler.

      The Brave BookmarksSidePanelUI derives from
      BookmarksSidePanelUI_ChromiumImpl, which is what the page handler's
      upstream-facing code refers to.
    rename_class:
      class_name: BookmarksSidePanelUI
      rename: BookmarksSidePanelUI_ChromiumImpl
