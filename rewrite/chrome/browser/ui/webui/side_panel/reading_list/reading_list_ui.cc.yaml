substitutions:
  - description: |-
      Create BraveReadingListPageHandler for the reading list side panel.

      BraveReadingListPageHandler derives from ReadingListPageHandler and is
      declared in
      brave/browser/ui/webui/side_panel/reading_list/brave_reading_list_page_handler.h,
      which the chromium_src shadow includes.
    rename_class:
      class_name: ReadingListPageHandler
      rename: BraveReadingListPageHandler
