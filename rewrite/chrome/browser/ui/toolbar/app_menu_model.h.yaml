substitutions:
  - description: |-
      Include bookmark_sub_menu_model.h

      Upstream only forward declares BookmarkSubMenuModel; Brave's subclasses
      need the full definition.
    add_include:
      header:
        - chrome/browser/ui/toolbar/bookmark_sub_menu_model.h

  - description: |-
      Expose sub_menus_ to subclasses

      BraveAppMenuModel needs to manipulate the private sub_menus_ vector.
    add_to_protected:
      class_name: AppMenuModel
      code: |-
        std::vector<std::unique_ptr<SimpleMenuModel>>& sub_menus() {
          return sub_menus_;
        }
