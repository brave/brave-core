substitutions:
  - description: |-
      Disable Chrome Labs

      Brave does not ship Chrome Labs, so IsChromeLabsEnabled always returns
      false.
    preempt_function_impl:
      function_name: IsChromeLabsEnabled
      code: if ((true)) return false;
