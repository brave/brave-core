substitutions:
  - description: |-
      Keep the window's UnownedUserDataHost.

      Brave's window feature checks look up the window's VerticalTabController
      through this host when they run.
    add_to_protected:
      class_name: WindowFeatureController
      code: 'raw_ptr<ui::UnownedUserDataHost> unowned_user_data_host_;'
