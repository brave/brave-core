substitutions:
  - description: 'Create BraveBrowserWindowFeatures with the embedder features.'
    preempt_function_impl:
      function_name: >-
        EmbedderBrowserWindowFeatures::EmbedderBrowserWindowFeatures
      code: |-
        brave_browser_window_features_ =
            std::make_unique<BraveBrowserWindowFeatures>(*browser);

  - description: 'Initialise BraveBrowserWindowFeatures.'
    preempt_function_impl:
      function_name: EmbedderBrowserWindowFeatures::Init
      code: 'brave_browser_window_features_->Init();'

  - description: 'Forward InitPostWindowConstruction().'
    preempt_function_impl:
      function_name: EmbedderBrowserWindowFeatures::InitPostWindowConstruction
      code: 'brave_browser_window_features_->InitPostWindowConstruction();'

  - description: 'Forward TearDownPreBrowserWindowDestruction().'
    preempt_function_impl:
      function_name: >-
        EmbedderBrowserWindowFeatures::TearDownPreBrowserWindowDestruction
      code: 'brave_browser_window_features_->TearDownPreBrowserWindowDestruction();'
