substitutions:
  - description: |-
      Derive JitChromeContentBrowserClient from BraveContentBrowserClient.

      The Brave header is supplied by the chromium_src override.
    regex:
      pattern: 'public ChromeContentBrowserClient {'
      replace: 'public BraveContentBrowserClient {'
