# Do not set NSDockTile.contentView: Brave's appearance variants exist only
# as Dock-composited IconImageStacks, and a contentView replaces them with a
# flattened bitmap. Report downloads via badgeLabel. Leave DockTileView unused.

substitutions:
  - description: |
      Keep the download state on DockIcon.

      The Dock tile's content view is left unset so that the Dock can keep
      compositing the layered icon, so the state that used to live on that
      view has to live here.
    regex:
      pattern: '@implementation DockIcon {'
      replace: |
        @implementation DockIcon {
          // The number of downloads in progress.
          int _downloads;

          // Whether the progress of those downloads is known yet.
          BOOL _indeterminate;

          // The progress made on those downloads. Ranges from [0..1].
          float _progress;

  - description: |
      Do not install a Dock tile content view.

      A content view replaces the icon rather than drawing over it, which is
      what stops the layered icon from following the system appearance.
    regex:
      re_pattern:
        '\s*NSApp\.dockTile\.contentView = \[\[DockTileView alloc\] init\];'
      replace: ''

  - description: |
      Update the badge instead of redrawing a content view.
    regex:
      pattern: '[NSApp.dockTile display];'
      replace: |-
        NSApp.dockTile.badgeLabel =
              DockBadgeLabel(_downloads, _indeterminate, _progress);

  - description: |
      Take the download state off the Dock tile's content view.

      The setters below write to the `DockIcon` ivars instead.
    count: 3 # setDownloads:, setIndeterminate: and setProgress:.
    regex:
      re_pattern:
        '\s*DockTileView\* dockTileView
        =\s+base::apple::ObjCCast<DockTileView>\(NSApp\.dockTile\.contentView\);'
      replace: ''

  - description: 'Count the downloads in progress on DockIcon.'
    count: 2 # Read and then written by setDownloads:.
    regex:
      pattern: 'dockTileView.downloads'
      replace: '_downloads'

  - description: 'Track whether download progress is known on DockIcon.'
    count: 2 # Read and then written by setIndeterminate:.
    regex:
      pattern: 'dockTileView.indeterminate'
      replace: '_indeterminate'

  - description: 'Track download progress on DockIcon.'
    regex:
      pattern: 'dockTileView.progress'
      replace: '_progress'
