substitutions:
  - description:
      'Add the Brave Material colors after the upstream Material colors.'
    after_function_impl:
      function_name: AddMaterialChromeColorMixer
      code: |-
        #if !BUILDFLAG(IS_ANDROID)
        AddMaterialBraveColorMixer(provider, key);
        #endif  // #if !BUILDFLAG(IS_ANDROID)

  - description: |-
      Include what the substitutions above use
    add_include:
      header:
        - brave/browser/ui/color/material_brave_color_mixer.h
