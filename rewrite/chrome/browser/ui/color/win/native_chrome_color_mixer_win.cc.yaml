substitutions:
  - description: |-
      Use the fake accent color observer on Windows.

      Brave does not use the system accent color, so the real
      ui::AccentColorObserver (which queries the OS) is replaced with
      ui::FakeAccentColorObserver defined in the shadow; it reports no accent
      colors and never fires updates.
    rename_class:
      class_name: AccentColorObserver
      rename: FakeAccentColorObserver
