substitutions:
  - description: |-
      Never add upstream's Material tab strip colors.

      Brave has not used upstream's Material tab strip colors since the
      Chromium 127 tabstrip style fix, so AddMaterialTabStripColorMixer()
      must stay a no-op.
    preempt_function_impl:
      function_name: AddMaterialTabStripColorMixer
      return_if: '(true)'
