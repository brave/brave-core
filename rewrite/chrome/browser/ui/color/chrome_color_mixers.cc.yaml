substitutions:
  - description: |-
      Skip the Material Chrome mixer here; Brave registers it from
      AddBravifiedChromeThemeColorMixer() where call order matters.
    regex:
      pattern: 'AddMaterialChromeColorMixer(provider, key);'
      replace: 'EmptyColorMixer(provider, key);'
  - description: |-
      Skip the Material Omnibox mixer here; Brave registers it from
      AddBravifiedChromeThemeColorMixer() where call order matters.
    regex:
      pattern: 'AddMaterialOmniboxColorMixer(provider, key);'
      replace: 'EmptyColorMixer(provider, key);'
  - description: |-
      Skip the Material Side Panel mixer here; Brave registers it from
      AddBravifiedChromeThemeColorMixer() where call order matters.
    regex:
      pattern: 'AddMaterialSidePanelColorMixer(provider, key);'
      replace: 'EmptyColorMixer(provider, key);'
  - description: |-
      Skip the Material Tab Strip mixer here; Brave registers it from
      AddBravifiedChromeThemeColorMixer() where call order matters.
    regex:
      pattern: 'AddMaterialTabStripColorMixer(provider, key);'
      replace: 'EmptyColorMixer(provider, key);'
