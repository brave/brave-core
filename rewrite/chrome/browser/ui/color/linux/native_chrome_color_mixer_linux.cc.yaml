substitutions:
  - description: |-
      Re-check the omnibox icon chip colors after the upstream native mixer.

      Our transparent `kColorOmniboxIconBackground` override runs before the
      upstream mixer, so its readability check never sees the real toolbar
      color.
    after_function_impl:
      function_name: AddNativeChromeColorMixer
      code: |-
        AddBraveNativeChromeColorMixer(provider, key);
