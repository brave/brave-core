substitutions:
  - description: |-
      Never apply upstream's Material color overrides.

      Brave installs its own Material-based colors, so upstream's
      ShouldApplyChromeMaterialOverrides() decision must be false for every
      key; otherwise the upstream Material mixers would apply their overrides
      on top of Brave's colors.
    regex:
      re_pattern: bool ShouldApplyChromeMaterialOverrides\(const ui::ColorProviderKey& key\) \{.*?\n\}
      re_flags: [DOTALL]
      replace: |-
        bool ShouldApplyChromeMaterialOverrides(const ui::ColorProviderKey& key) {
          return false;
        }
