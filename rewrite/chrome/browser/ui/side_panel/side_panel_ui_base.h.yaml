substitutions:
  - description: |-
      Let BraveSidePanelCoordinator reach SidePanelUIBase internals.

      BraveSidePanelCoordinator overrides some of its protected and private
      methods and needs access to the private current_key_ member. Inheritance:
      BraveSidePanelCoordinator -> SidePanelCoordinator -> SidePanelUIBase.
    add_friend:
      class_name: SidePanelUIBase
      friend_type: class BraveSidePanelCoordinator
