substitutions:
  - description: |-
      Show the share omnibox icon only for web pages, and only when pinned.

      Internal pages get no share icon, and the icon follows Brave's
      kPinShareMenuButton pref.
    preempt_function_impl:
      function_name: SharingHubBubbleControllerDesktopImpl::ShouldOfferOmniboxIcon
      code: |-
        if (!ShouldOfferBraveShareIcon(GetWebContents())) {
          return false;
        }
