substitutions:
  - description: |
      Don't display the default browser prompt menu item.

      Keeping show_app_menu_item_ false is enough for ShouldShowAppMenuItem
      to always report false too, so the item never shows.
    preempt_function_impl:
      function_name: DefaultBrowserPromptManager::SetAppMenuItemVisibility
      code: |-
        if (show) {
          show_app_menu_item_ = false;
          return;
        }
