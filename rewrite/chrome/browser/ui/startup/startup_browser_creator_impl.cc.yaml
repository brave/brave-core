substitutions:
  - description: 'Modify navigation params before Navigate call for startup tab'
    count: 2
    regex:
      pattern: 'Navigate(&params);'
      replace: 'BraveNavigateStartupTab(tab, browser, params);'
  - description:
      'Skip opening a startup tab whose URL is scheduled for ephemeral storage
      cleanup'
    regex:
      re_pattern:
        '(?s)(BrowserWindowInterface\*
        StartupBrowserCreatorImpl::OpenTabsInBrowser\((?:(?!\n}\n).)*?\n  for
        \(auto& tab : tabs\) \{\n)'
      replace:
        '\1    if (BraveIsScheduledForCleanup(tab.url, profile_))
        {\n      continue;\n    }\n\n'
