substitutions:
  - description: 'Modify navigation params before Navigate call for startup tab'
    count: 2
    regex:
      pattern: 'Navigate(&params);'
      replace: 'BraveNavigateStartupTab(tab, browser, params);'
  - description:
      'Skip opening a startup tab whose URL is scheduled for ephemeral storage
      cleanup'
    add_after_line:
      line: 'for (auto& tab : tabs) {'
      code: |2-
            if (BraveIsScheduledForCleanup(tab.url, profile_)) {
              continue;
            }

  - description:
      'Use BraveStartupTabProviderImpl for startup tab determination

      Brave customizes the startup tabs (e.g. welcome/onboarding) through
      BraveStartupTabProviderImpl, declared in
      brave/browser/ui/startup/brave_startup_tab_provider_impl.h, which the
      chromium_src shadow includes.'
    rename_class:
      class_name: StartupTabProviderImpl
      rename: BraveStartupTabProviderImpl
