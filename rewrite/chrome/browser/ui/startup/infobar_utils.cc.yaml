substitutions:
  - description: |-
      Show the session crashed bubble through Brave's wrapper.

      The wrapper asks for crash report permission first when needed, and
      that dialog shows the session crashed bubble once it closes.
    regex:
      pattern: 'ShowSessionCrashedBubbleIfNotOffTheRecordProfile('
      replace: 'ShowSessionCrashedBubbleIfNotOffTheRecordProfileBrave('
