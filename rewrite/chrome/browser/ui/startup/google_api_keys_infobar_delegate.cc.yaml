substitutions:
  - description:
      'Point the API keys help link to the Brave community site

      Upstream links to the Google API keys developer documentation. Brave
      has no Google API keys, so link to https://community.brave.app instead.
      A literal symbol swap: rename_class is not applicable because
      kAPIKeysDevelopersHowToURL is a constant, not a class.'
    regex:
      pattern: 'google_apis::kAPIKeysDevelopersHowToURL'
      replace: '"https://community.brave.app"'
