substitutions:
  - description: 'Append Brave members at the end of struct StartupTab'
    regex:
      re_pattern: '(struct StartupTab \{.*?)(\n\};)'
      re_flags: [DOTALL]
      replace: |-
        \1

        #if BUILDFLAG(ENABLE_CONTAINERS)
          containers::ContainerSpecifier container;
        #endif

          StartupTab(const StartupTab&);
          StartupTab& operator=(const StartupTab&);
          StartupTab(StartupTab&&) noexcept;
          StartupTab& operator=(StartupTab&&) noexcept;\2

  - description: |-
      Include what the substitutions above use
    add_include:
      header: '"brave/components/containers/buildflags/buildflags.h"'

  - description: |-
      Include what the substitutions above use in `ENABLE_CONTAINERS` builds
    add_after_includes:
      code: |-
        #if BUILDFLAG(ENABLE_CONTAINERS)
        #include "brave/components/containers/core/browser/container_specifier.h"
        #endif
