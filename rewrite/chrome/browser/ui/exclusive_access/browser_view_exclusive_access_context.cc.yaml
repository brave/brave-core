substitutions:
  - description: |-
      Hide the fullscreen exit reminder when Brave's setting turns it off.
    preempt_function_impl:
      function_name: BrowserViewExclusiveAccessContext::UpdateExclusiveAccessBubble
      code: |-
        if (ShouldHideFullscreenReminder(params, GetProfile())) {
          return;
        }
