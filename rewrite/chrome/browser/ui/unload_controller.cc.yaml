substitutions:
  - description: |
      Keep the window open when its last tab closes, if that is disabled

      Brave's `kEnableClosingLastTab` pref lets the window stay open (with a
      fresh tab) instead of closing.
    regex:
      re_pattern: '(void UnloadController::TabStripEmpty\(\) \{\n)'
      replace: |
        \1  if (!browser_->GetProfile()->GetPrefs()->GetBoolean(kEnableClosingLastTab)) {
            return;
          }
  - description: |
      Re-run closing confirmation after the user declines a close warning

      Otherwise the cached confirmation would skip the dialog next time.
    regex:
      re_pattern:
        '(void
        UnloadController::FinishWarnBeforeClosing\(WarnBeforeClosingResult
        result\) \{\n)'
      replace: |
        \1  if (result == WarnBeforeClosingResult::kDoNotClose) {
            confirmed_to_close_ = false;
          }
  - description: |
      Skip the closing confirmation for programmatic window closes

      No user is present to prompt, e.g. when deleting a profile.
    regex:
      re_pattern:
        '(bool UnloadController::RunBeforeUnloadForShutdown\(.*?\) \{\n)'
      re_flags: [DOTALL]
      replace: |
        \1  confirmed_to_close_ = true;
  - description: |
      Clear the cached close confirmation when a close attempt is reset

      Pairs with the confirmation set in `RunBeforeUnloadForShutdown()` so the
      next attempt prompts again.
    regex:
      re_pattern:
        '(void UnloadController::ResetBeforeUnloadForShutdown\(\) \{\n)'
      replace: |
        \1  confirmed_to_close_ = false;
  - description: |
      Let SharedPinnedTabService detach shared pinned tabs before they close

      Its `BrowserClosing()` must run before `TabStripModel::CloseAllTabs()`,
      or the shared contents are torn down like ordinary tabs.
    regex:
      re_pattern:
        '(if \(tab_restore_service && notify_restore_service\) [\s\S]+?\n  \}\n)'
      replace: |
        \1  if (MaybeHandleSharedPinnedTabsClosing(browser_)) {
            return;
          }
