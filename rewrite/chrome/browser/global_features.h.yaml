substitutions:
  - description: |
      Expose BraveGlobalFeatures

      Brave's global features are owned by GlobalFeatures, like upstream's
      EmbedderBrowserWindowFeatures is by BrowserWindowFeatures. Test fakes
      derive from GlobalFeatures, so they carry it too.
    add_to_public:
      class_name: GlobalFeatures
      code: |
        BraveGlobalFeatures* brave_global_features() {
          return brave_global_features_.get();
        }

  - description: |
      Own BraveGlobalFeatures

      Declared in the protected section so it is available to subclasses and
      does not require an extra private section.
    add_to_protected:
      class_name: GlobalFeatures
      code: 'std::unique_ptr<BraveGlobalFeatures> brave_global_features_;'
