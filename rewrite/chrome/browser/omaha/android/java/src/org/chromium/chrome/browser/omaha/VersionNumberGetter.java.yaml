substitutions:
  - description: |-
      Report the installed version as its version code.

      Brave feeds the latest version from Play, which only reports a version
      code (see BraveUpdateStatusHelper), so both sides must use codes. The
      "0.0.0." prefix is there because VersionNumber.fromString() only parses
      four dot-separated numbers.
    regex:
      pattern: 'return ApkInfo.getPackageVersionName();'
      replace: 'return "0.0.0." + ApkInfo.getPackageVersionCode();'
