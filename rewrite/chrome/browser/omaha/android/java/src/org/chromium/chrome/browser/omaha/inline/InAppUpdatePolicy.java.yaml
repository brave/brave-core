substitutions:
  - description: |-
      Allow the in-app update flow in official Brave builds.

      Brave is not Chrome branded, which upstream otherwise requires.
    regex:
      re_pattern: |-
        (boolean isBrandedOfficialBuild\(\).*?)BuildConfig\.IS_CHROME_BRANDED
      re_flags: [DOTALL]
      replace: '\1true'
