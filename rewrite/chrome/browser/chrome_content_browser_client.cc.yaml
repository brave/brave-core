substitutions:
  - description:
      'Accept the optional WebSocket request context in
      ChromeContentBrowserClient.'
    regex:
      re_pattern:
        '(void ChromeContentBrowserClient::CreateWebSocket\([^{}]*?)(\)\s*\{)'
      re_flags: [DOTALL]
      replace: |-
        \1,
            std::optional<content::GlobalRenderFrameHostId>,
            std::optional<url::Origin>\2
