substitutions:
  - description: Expose the Brave News buildflags to the browsing data
    regex:
      re_pattern: '(include_rules = \[\s(\s+))'
      re_flags: [DOTALL]
      replace: |-
        \1"+brave/components/brave_news/common/buildflags/buildflags.h",\n\2
