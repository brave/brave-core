substitutions:
  - description: |-
      Let Brave's legacy confirm infobars get a creation pass key.

      They create their infobars directly rather than through
      `infobars::BrowserInfoBarManager`, like upstream's burndown list.
    add_friend:
      class_name: ConfirmInfoBarCreationAllowlist
      friend_type:
        - class BraveConfirmP3AInfoBarDelegate
        - class RequestOTRInfoBarDelegate
        - class SyncCannotRunInfoBarDelegate
        - class brave_ads::CreativeSearchResultAdClickedInfoBarDelegate
        - class ntp_background_images::NewTabTakeoverInfoBarDelegate
        - class psst::PsstInfoBarDelegate
