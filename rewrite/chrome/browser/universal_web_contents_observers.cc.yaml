substitutions:
  - description: |-
      Attach Brave's privacy-sensitive helpers to every WebContents.

      Shields and ephemeral storage must cover tabs, the contents that replaces
      a discarded tab's, and WebContents that are not tabs, such as background
      contents, so they are attached as each WebContents is created.
    preempt_function_impl:
      function_name: AttachUniversalWebContentsObservers
      code: |-
        brave::AttachPrivacySensitiveTabHelpers(web_contents);
