substitutions:
  - description: |-
      Set the variations country from the locale for the first run seed

      Lets studies filtered by country apply to the installer seed, before the
      first seed fetch reports a country.
    regex:
      re_pattern:
        '(ChromeFeatureListCreator::SetupInitialPrefs\(\)
        \{.*?)(\n#endif[^\n]*\n\})'
      re_flags: [DOTALL]
      replace: |-
        \1
          MaybeSetVariationsCountry(compressed_variations_seed, *local_state_);\2
