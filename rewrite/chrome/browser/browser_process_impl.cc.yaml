substitutions:
  - description: |
      Construct a stub `SodaInstaller` as the global one, because Brave ships
      no SODA. Upstream's reports SODA's languages as downloadable and then
      parks an install() reply on a download that never arrives.

      `CreateBraveSodaInstaller` is defined in the chromium_src override of
      this source.
    regex:
      pattern: 'std::make_unique<speech::SodaInstallerImpl>()'
      replace: 'speech::CreateBraveSodaInstaller()'
