substitutions:
  - description: |-
      Skip the brandcode config fetch.

      Brave doesn't use brandcoded reset settings, so the fetcher only runs
      its callback, without a network request.
    preempt_function_impl:
      function_name: BrandcodeConfigFetcher::BrandcodeConfigFetcher
      code: |-
        ReportFetchSkipped(fetch_callback_);
        return;
