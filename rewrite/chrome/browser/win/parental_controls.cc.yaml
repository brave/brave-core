substitutions:
  - description: |-
      Skip the Windows parental-controls COM call in tests.

      Tests never call InitializeWinParentalControls(). Falling through to
      CoCreateInstance allocates with the system heap, and AddressSanitizer
      aborts in malloc_usable_size. Tests do not enable these controls, so
      the failed-lookup result is correct.
    add_after_line:
      line: 'CHECK_IS_TEST();'
      code: '      return std::nullopt;'
