substitutions:
  - description: |-
      Accept the optional WebSocket request context in
      ChromeContentBrowserClient.

      Matches the extra CreateWebSocket parameters needed for frameless
      SharedWorker and ServiceWorker handshakes (crbug.com/40195467).
    regex:
      re_pattern: '(\bvoid CreateWebSocket\([^;]*?)(\)\s*override;)'
      re_flags: [DOTALL]
      replace: |-
        \1,
              std::optional<int> process_id,
              std::optional<url::Origin> initiator_origin\2
