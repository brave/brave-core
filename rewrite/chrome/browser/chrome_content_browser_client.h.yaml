substitutions:
  - description:
      'Accept the optional WebSocket request context in
      ChromeContentBrowserClient.'
    regex:
      re_pattern: '(\bvoid CreateWebSocket\([^;]*?)(\)\s*override;)'
      re_flags: [DOTALL]
      replace: |-
        \1,
              std::optional<content::GlobalRenderFrameHostId> frame_id,
              std::optional<url::Origin> initiator_origin\2
