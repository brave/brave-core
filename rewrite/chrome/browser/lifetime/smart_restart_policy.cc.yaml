substitutions:
  - description: |-
      Block the zero-window SmartRestart while Sparkle is the updater.

      Sparkle replaces the whole app bundle when it installs an update on quit,
      so a SmartRestart relaunch can start the old version while its Versions
      folder is being removed, and the relaunched browser crashes at startup.
    preempt_function_impl:
      function_name: SmartRestartPolicy::CanZeroWindowRestartProceed
      code: |-
        if (IsSmartRestartBlockedByBrave()) {
          return false;
        }

  - description: |-
      Block the lock-screen SmartRestart while Sparkle is the updater.

      Its restart races Sparkle's app bundle replacement the same way the
      zero-window restart does.
    preempt_function_impl:
      function_name: SmartRestartPolicy::CanLockScreenRestartProceed
      code: |-
        if (IsSmartRestartBlockedByBrave()) {
          return ExtendedExecutionOutcome::kBlockedByPolicy;
        }
