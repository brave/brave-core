substitutions:
  - description: |
      Close sidebar web panels before the session services shut down

      Panels are pinned tabs, and `BrowserCloseManager::CloseBrowsers()`
      finalizes the session before any window starts closing, so they would be
      restored as regular pinned tabs.

      The call only has any effect immediately before the session services go
      down, hence the anchor: should upstream move or drop that call, this
      match is meant to fail and be looked at again.
    add_before_line:
      line: 'ProfileManager::ShutdownSessionServices();'
      code: '  sidebar::CloseAllWebPanels();'
  - description: |-
      Mark closing all browsers as started

      Read by `BrowserCloseManager::BrowserClosingStarted()`.
    preempt_function_impl:
      function_name: BrowserCloseManager::StartClosingBrowsers
      code: g_browser_closing_started = true;
  - description: |-
      Clear the closing flag when the close is cancelled

      Otherwise `BraveBrowser` keeps skipping its window closing confirmation
      for the rest of the session after a quit is cancelled, e.g. from a
      beforeunload dialog.
    preempt_function_impl:
      function_name: BrowserCloseManager::CancelBrowserClose
      code: g_browser_closing_started = false;
