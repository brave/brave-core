substitutions:
  - description: |-
      Report the profile as not eligible for personal context when the
      eligibility service is absent.

      Brave disables kPersonalContext, so the service is never created and
      upstream CHECKs on it.
    preempt_function_impl:
      function_name: DeviceInfoSyncClientImpl::GetLocalPersonalContextInfo
      code: |-
        if (!PersonalContextEligibilityServiceFactory::GetForProfile(profile_)) {
          return syncer::DeviceInfo::PersonalContextInfo::NotEligible();
        }
