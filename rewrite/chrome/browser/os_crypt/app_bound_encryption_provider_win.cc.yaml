substitutions:
  - description: |
      Keep a copy of any app-bound key that is about to be replaced.

      `StoreKey()` is the single point through which every new app-bound key
      reaches `Local State`, including the one minted after a decryption failure
      is classified as permanent.
    regex:
      pattern:
        'local_state_->SetString(kAppBoundEncryptedKeyPrefName, base64_key);'
      replace: |-
        BraveBackUpAppBoundKeyBeforeReplacing(local_state_,
                                                kAppBoundEncryptedKeyPrefName);
          local_state_->SetString(kAppBoundEncryptedKeyPrefName, base64_key);

  - description: |
      Register the pref holding the backup app-bound key.
    regex:
      pattern:
        'registry->RegisterStringPref(kAppBoundEncryptedKeyPrefName,
        std::string());'
      replace: |-
        registry->RegisterStringPref(kAppBoundEncryptedKeyPrefName, std::string());
          registry->RegisterStringPref(kBraveAppBoundEncryptedKeyBackupPrefName,
                                       std::string());
