substitutions:
  - description: |-
      Expose kBraveReportingAPI to DevTools, so the Reporting API panel can
      explain that Brave disables the Reporting API.
    regex:
      re_pattern:
        '(DevToolsUIBindings::GetHostConfigDictionary\(.*?)(?=\n  return
        response_dict;\n\}\n)'
      replace: |
        \1
          response_dict.Set(
              "braveReportingApi",
              base::DictValue().Set("enabled",
                                    base::FeatureList::IsEnabled(
                                        blink::features::kBraveReportingAPI)));
      re_flags: [DOTALL]
