substitutions:
  - description: Add the deps the Brave updater scheduler needs.
    add_literal_to_list:
      target: updater
      list_name: deps
      literal: brave_chrome_updater_scheduler_deps
      conditional: enable_updater && (is_mac || is_win)
      import: //brave/browser/updater/sources.gni
