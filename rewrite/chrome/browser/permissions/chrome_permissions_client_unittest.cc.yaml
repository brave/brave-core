substitutions:
  - description: |
      Pass a content settings type to `CanBypassEmbeddingOriginCheck`

      Brave adds the parameter to the function. These tests check the WebUI
      origins, which bypass the check whatever the permission is.
    regex:
      re_pattern: '(CanBypassEmbeddingOriginCheck\()\s*'
      replace: '\1ContentSettingsType::GEOLOCATION, '
    # Every call in the file.
    count: 10
