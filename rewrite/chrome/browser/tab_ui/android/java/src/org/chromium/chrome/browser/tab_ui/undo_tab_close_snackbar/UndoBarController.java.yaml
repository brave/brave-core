substitutions:
  - description: |-
      Add the imports for the preference check below.

      Anchored on the package statement rather than on neighbouring imports, so
      an upstream import churn cannot break this.
    regex:
      re_pattern: |-
        ^(package org\.chromium\.chrome\.browser\.tab_ui\.undo_tab_close_snackbar;)$
      re_flags: [MULTILINE]
      replace: |-
        \1

        import org.chromium.base.BravePreferenceKeys;
        import org.chromium.chrome.browser.preferences.ChromeSharedPreferences;

  - description: |-
      Honour Brave's "show undo when tabs closed" preference.

      With the preference off there is no snackbar left to dismiss, so the
      closures must be committed here or the tabs stay pending forever. The
      entry is out of the queue and not tracked as shown, so the commits
      cannot change its remaining tabs.

      Anchored after the empty-entry early return, so an empty entry still
      returns before any commit.
    regex:
      re_pattern: |-
        (private void showUndoBar\(UndoBarEntry entry\) \{\n.*?\n        \}\n)
      re_flags: [DOTALL]
      replace: |
        \1        if (!ChromeSharedPreferences.getInstance()
                        .readBoolean(BravePreferenceKeys.SHOW_UNDO_WHEN_TABS_CLOSED, true)) {
                    for (@TabId int tabId : entry.mRemainingTabIds) {
                        commitTabClosure(tabId);
                    }
                    return;
                }
