substitutions:
  - description: 'Modify navigation params before Navigate call for startup tab'
    regex:
      re_pattern: |-
        (.+)(Navigate\(&params\);)
      replace: |-
        \1BraveModifyStartupTabNavigationParams(startup_tab, browser, params);
        \1\2
  - description: 'Insert MaybeCleanupEphemeralStorage before AddRestoredTab call'
    regex:
      re_pattern: |-
        ( *)(// Apply the stored group\.\n *WebContents\* web_contents = chrome::AddRestoredTab\()
      replace: |-
        \1const bool cleaned = MaybeCleanupEphemeralStorage(tab.navigations[selected_index].virtual_url(), tab.timestamp, profile_);

        \1\2
  - description: 'Wrap restored_tabs.push_back in ephemeral storage cleaned check'
    regex:
      re_pattern: |-
        ( *)(restored_tabs\.push_back\(restored_tab\);)
      replace: |-
        \1if (!cleaned) {
        \1  \2
        \1}