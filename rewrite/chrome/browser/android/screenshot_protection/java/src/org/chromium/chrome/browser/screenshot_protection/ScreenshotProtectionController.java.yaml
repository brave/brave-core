substitutions:
  - description:
      'Add Brave browser-lock import beneath the package declaration.'
    regex:
      re_pattern: '^(package [^;]+;\n)'
      re_flags: [MULTILINE]
      replace: |-
        \1
        import org.chromium.chrome.browser.privacy.BraveBrowserLockManager;
  - description: |-
      Defer to BraveBrowserLockManager's own FLAG_SECURE decision for the
      "Entire application" lock + "Prevent capture" combination — otherwise
      this method unconditionally clears FLAG_SECURE whenever its own
      tab/policy-based decision doesn't require it, fighting with the lock.
    regex:
      re_pattern: |-
        ( +)private void updateScreenshotProtectionState\(\) \{
      replace: |-
        \1private void updateScreenshotProtectionState() {
        \1    if (BraveBrowserLockManager.shouldForceSecureWindow()) return;
