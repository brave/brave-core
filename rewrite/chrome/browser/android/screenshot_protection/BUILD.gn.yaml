substitutions:
  - description: |-
      Let ScreenshotProtectionController defer to BraveBrowserLockManager's
      own FLAG_SECURE decision.
    regex:
      re_pattern: |-
        ( +)"//base:tasks_java",
      replace: |-
        \1"//base:tasks_java",
        \1"//brave/browser/browser_lock/android:java",
