substitutions:
  - description: |-
      Don't fill passwords when Brave's password autofill is turned off.

      Users of a third-party password manager can turn off "Autofill passwords
      using Brave" so Brave doesn't compete with it over the same login fields.
      IsBravePasswordFillingDisabled is defined in this file's chromium_src
      override.
    preempt_function_impl:
      function_name: ChromePasswordManagerClient::IsFillingEnabled
      return_if: 'IsBravePasswordFillingDisabled(web_contents())'
      return_value: 'false'

  - description: |-
      Don't offer to save passwords when Brave's password autofill is off.

      Turning off "Autofill passwords using Brave" hands password management
      over to a third-party password manager, so Brave shouldn't prompt to
      save credentials either. IsBravePasswordFillingDisabled is defined in this
      file's chromium_src override.
    preempt_function_impl:
      function_name: ChromePasswordManagerClient::IsSavingAndFillingEnabled
      return_if: 'IsBravePasswordFillingDisabled(web_contents())'
      return_value: 'false'
