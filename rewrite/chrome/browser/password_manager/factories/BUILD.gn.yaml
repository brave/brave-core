substitutions:
  - description: |
      Widen the backend factory's visibility for Brave's test of it.

      Upstream limits the declaration to its own directory, so the test of
      Brave's `CreatePasswordStoreBackend` override cannot include it.
    add_literal_to_list:
      target: backend_factory
      list_name: visibility
      literal: brave_password_manager_backend_factory_visibility
      import: //brave/browser/password_manager/factories/sources.gni
