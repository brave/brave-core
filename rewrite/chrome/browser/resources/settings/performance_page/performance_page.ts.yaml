substitutions:
  - description: |-
      Drop the discard ring toggle's handlers.

      Brave's mangler removes the toggle, and
      `@webui-eslint/lit-member-visibility` rejects protected methods the
      template doesn't reference.
    regex:
      re_pattern:
        '\n  protected onDiscardRingChange_\(\) \{\n.*?\n  \}\n\n  protected
        onDiscardRingTreatmentSubLabelLinkClicked_\(\) \{\n.*?\n  \}\n'
      re_flags: [DOTALL]
      replace: ''
