substitutions:
  - description: |
      Free `settings-system-page` for the Brave subclass to register.

      chromium_src/.../system_page/system_page.ts subclasses
      SettingsSystemPageElement and registers that subclass under the same tag.
      A tag can only be registered once, so upstream's own registration has to
      go.
    drop_custom_element_registration:
      class_name: SettingsSystemPageElement
