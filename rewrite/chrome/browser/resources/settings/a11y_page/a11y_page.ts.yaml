substitutions:
  - description: |-
      Make `hasScreenReader_` private.

      Brave's mangler removes the image labels toggle, the only markup that
      reads it, and `@webui-eslint/lit-member-visibility` rejects protected
      properties the template doesn't reference.
    regex:
      pattern: 'protected accessor hasScreenReader_:'
      replace: 'private accessor hasScreenReader_:'
