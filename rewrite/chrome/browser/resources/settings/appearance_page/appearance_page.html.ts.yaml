substitutions:
  - description:
      Display the combined mode without persisting a fourth synced value.
    regex:
      pattern: '.menuOptions="${this.bookmarksBarOptions_}"'
      replace: |-
        .menuOptions="${this.bookmarksBarOptions_}"
                    .noSetPref="${this.floatingBookmarkBarEnabled_}"
                    .value="${this.bookmarksBarSelectedValue_}"
