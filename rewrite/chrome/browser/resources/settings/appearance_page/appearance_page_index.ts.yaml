substitutions:
  - description: |
      Free `settings-appearance-page-index` for the Brave subclass to register.

      chromium_src/.../appearance_page/appearance_page_index.ts subclasses
      SettingsAppearancePageIndexElement to show Brave's Tabs and Sidebar
      views alongside the upstream Appearance one, and registers that subclass
      under the same tag. A tag can only be registered once, so upstream's own
      registration has to go.
    drop_custom_element_registration:
      class_name: SettingsAppearancePageIndexElement
