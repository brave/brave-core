substitutions:
  - description: |
      Keep `braveCookieType` on expanded exceptions, so `site-list-entry` can
      disable the reset button of Shields and Google sign-in cookie exceptions.
    regex:
      re_pattern: '(controlledBy: controlledBy,\n)'
      replace: '\1            braveCookieType: exception.braveCookieType,\n'
