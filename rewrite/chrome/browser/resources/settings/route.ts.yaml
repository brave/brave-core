substitutions:
  - description: |
      Import Brave's routes so the Brave sections can be added to the router.
    add_import:
      import: import addBraveRoutes from './brave_routes.js'

  - description: |
      Wire Brave's routes into the router `createRoutes()` builds.
    regex:
      re_pattern: '(\n  \}\n)\n(  return r as unknown as SettingsRoutes;)'
      replace: |-
        \1
          addBraveRoutes(r);
        \2

  - description: |
      Send guests to Brave's get-started route instead of upstream's.
    regex:
      pattern: return routes.PEOPLE;
      replace: return routes.GET_STARTED;
