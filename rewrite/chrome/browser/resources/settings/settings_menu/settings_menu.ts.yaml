substitutions:
  - description: |-
      Drop `onExtensionsLinkClick_()`.

      Brave's mangler replaces the extensions link with its own menu item, and
      `@webui-eslint/lit-member-visibility` rejects protected methods the
      template doesn't reference.
    regex:
      re_pattern: '\n  protected onExtensionsLinkClick_\(\) \{\n.*?\n  \}\n'
      re_flags: [DOTALL]
      replace: ''
