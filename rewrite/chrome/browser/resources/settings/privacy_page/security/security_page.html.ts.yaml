substitutions:
  - description: |-
      Import loadTimeData for the template.

      Brave's lit_mangler hides the HTTPS-only mode toggle behind a
      loadTimeData check, and a mangler can't add imports.
    add_import:
      entry: import {loadTimeData} from '../../i18n_setup.js';
