substitutions:
  - description: |-
      Show Brave's personalization options above Clear browsing data.
    regex:
      re_pattern: '^([ ]*)(<cr-link-row id="clearBrowsingData")'
      re_flags: [MULTILINE]
      replace: |-
        \1<settings-personalization-options></settings-personalization-options>
        \1\2
