substitutions:
  - description: 'Offer the custom bookmark order last in the sort menu.'
    regex:
      re_pattern: '(sortTypes_: SortOption\[\] = \[.*?)(\n\s*\];)'
      re_flags: [DOTALL]
      replace: |-
        \1
            { sortOrder: SortOrder.kCustom, label: loadTimeData.getString('sortCustom'), lowerLabel: loadTimeData.getString('sortCustomLower'), },\2
