substitutions:
  - description: |
      Let chromium_src register `power-bookmarks-list` after restyling it.

      chromium_src/.../side_panel/bookmarks/power_bookmarks_list.ts calls
      injectStyle() on PowerBookmarksListElement, which only takes effect while
      the element is still unregistered. So the shadow file registers the class
      itself, once the style override is in place, and upstream's own
      registration -- which would otherwise win the race -- has to go.
    drop_custom_element_registration:
      class_name: PowerBookmarksListElement
