substitutions:
  - description: |-
      Allow the PDF viewer to load chrome://theme/ so the colors.css injected by
      Brave's colors_css_updater override can provide the theme colors, and so
      the theme source gets registered for the extension.
    regex:
      re_pattern: '(\n(\s*)"chrome://resources/",)'
      replace: '\1\n\2"chrome://theme/",'
