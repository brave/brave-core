substitutions:
  - description: Add the Brave history TypeScript files.
    add_literal_to_list:
      target: build
      list_name: ts_files
      literal: brave_history_ts_files
      import: //brave/browser/resources/history/sources.gni

  - description: Add the Brave history CSS files.
    add_literal_to_list:
      target: build
      list_name: css_files
      literal: brave_history_css_files
      import: //brave/browser/resources/history/sources.gni

  - description: Add the Brave history icons.
    add_literal_to_list:
      target: build
      list_name: icons_html_files
      literal: brave_history_icons_html_files
      import: //brave/browser/resources/history/sources.gni

  - description:
      Keep the Brave history TypeScript out of Chromium's preprocessing.
    add_literal_to_list:
      target: build
      list_name: exclude_ts_preprocess_files
      literal: brave_history_ts_files
      import: //brave/browser/resources/history/sources.gni

  - description:
      Keep the Brave history CSS and icons out of Chromium's preprocessing.
    add_literal_to_list:
      target: build
      list_name: exclude_html_css_preprocess_files
      literal: brave_history_exclude_html_css_preprocess_files
      import: //brave/browser/resources/history/sources.gni

  - description: Depend on the Brave history preprocessing.
    add_literal_to_list:
      target: build
      list_name: preprocess_deps
      literal: brave_history_preprocess_deps
      import: //brave/browser/resources/history/sources.gni

  - description: |-
      Add the Brave history mojo files and their deps, only with local AI.

      build_webui() copies mojo_files whenever mojo_files_deps is set, and an
      empty copy is an error.
    append_to_target:
      target: build
      type: build_webui
      code: |-
        if (enable_local_ai) {
          mojo_files_deps = brave_history_mojo_files_deps
          mojo_files = brave_history_mojo_files
        }

  - description: |-
      Pass the Brave history preprocessor defines to build_webui().

      The app.ts override imports the history embeddings element only with
      local AI.
    append_to_target:
      target: build
      type: build_webui
      code: |-
        preprocessor_defines = brave_history_preprocessor_defines
