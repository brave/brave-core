substitutions:
  - description: |
      Load Brave's Polymer overrides before this page's components.

      polymer_overriding.js hooks Polymer's registration so Brave's branding
      overrides (e.g. for `cr-button`) are picked up as each component is
      defined, which means it has to run before any of them. Anchoring on the
      end of the license header puts the import ahead of every other one in the
      module; a chromium_src shadow file cannot do this, since importing the
      upstream module is what runs its imports.
    regex:
      re_pattern: '(// found in the LICENSE file\.\n\n)'
      replace: |
        \1import 'chrome://resources/brave/polymer_overriding.js';

  - description: |
      Free `profile-customization-app` for the Brave subclass to register.

      chromium_src/.../profile_customization/profile_customization_app.ts
      subclasses ProfileCustomizationAppElement to confirm the dialog on Enter,
      and registers that subclass under the same tag. A tag can only be
      registered once, so upstream's own registration has to go.
    drop_custom_element_registration:
      class_name: ProfileCustomizationAppElement
