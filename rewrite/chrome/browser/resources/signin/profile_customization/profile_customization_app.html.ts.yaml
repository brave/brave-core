substitutions:
  - description: Import Lit's empty template value for the custom image row.
    regex:
      pattern: "import {html} from '//resources/lit/v3_0/lit.rollup.js';"
      replace:
        "import {html, nothing} from '//resources/lit/v3_0/lit.rollup.js';"
