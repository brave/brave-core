substitutions:
  - description: |-
      Drop `getIncognitoInfoWarningString_()`.

      Brave's template shows its own Private window warning instead, and
      `@webui-eslint/lit-member-visibility` rejects protected methods the
      template doesn't reference.
    regex:
      re_pattern:
        '\n  protected getIncognitoInfoWarningString_\(\): string
        \{\n.*?\n  \}\n'
      re_flags: [DOTALL]
      replace: ''
