substitutions:
  - description: |-
      Build the metrics reporting calls in non-Chrome-branded builds

      Brave's settings show the metrics reporting toggle, which upstream only
      builds into Google Chrome. The guards cover the `sendWithPromise`
      import and the proxy's interface and implementation.
    count: 3
    regex:
      pattern: '<if expr="_google_chrome and not is_chromeos">'
      replace: '<if expr="not is_chromeos">'
