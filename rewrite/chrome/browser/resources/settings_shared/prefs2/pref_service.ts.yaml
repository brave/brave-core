substitutions:
  - description: |-
      Add Brave's site-settings categories to the category default prefs.

      `settings-category-default-radio-group` keeps its selection in a
      `synthetic.settings.category_default.<category>` pref, which `PrefService`
      only creates for the listed categories. Without Brave's, their default
      radios show no selection and don't save.
    regex:
      re_pattern: >-
        (const CATEGORY_DEFAULT_SYNTHETIC_PREFS: string\[\] = \[.*?)(\n\];)
      re_flags: [DOTALL]
      replace: |-
        \1
          'autoplay',
          'braveOpenAIChat',
          'cardano',
          'ethereum',
          'googleSignIn',
          'solana',\2
