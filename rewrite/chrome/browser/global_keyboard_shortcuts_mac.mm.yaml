substitutions:
  - description: |
      Append the `IDC_NEW_OFFTHERECORD_WINDOW_TOR` (Cmd+Shift+N) shortcut to the
      end of the `keys({ ... })` initializer list in
      `GetShortcutsNotPresentInMainMenu`.
    regex:
      re_pattern: '(GetShortcutsNotPresentInMainMenu\(\)[^\n]*\n.*?)(\n\s*\}\);)'
      re_flags: [DOTALL]
      replace: |-
        \1
              {true,  false, false, true,  kVK_ANSI_N,            IDC_NEW_OFFTHERECORD_WINDOW_TOR},\2

  - description: |
      Change the `IDC_NEW_SPLIT_TAB` shortcut key from `kVK_ANSI_N` to
      `kVK_ANSI_T` (Cmd+Shift+T) in the `keys.push_back` call.
    regex:
      re_pattern: 'keys\.push_back\(\{true,\s*false,\s*false,\s*true,\s*kVK_ANSI_N,\s*IDC_NEW_SPLIT_TAB\}\)'
      replace:
        'keys.push_back({true, false, false, true, kVK_ANSI_T,
        IDC_NEW_SPLIT_TAB})'
