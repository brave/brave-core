substitutions:
  - description: |-
      Gate the discovery test support on desktop Android, not on extensions.

      discovery:test_support asserts is_desktop_android, which Brave's
      enable_desktop_android_extensions on mobile Android does not imply.
    regex:
      re_pattern:
        'if \(!is_android \|\| enable_desktop_android_extensions\)(\s*\{\s*deps
        \+= \[\s*"//chrome/browser/media/router/discovery:test_support")'
      replace: 'if (!is_android || is_desktop_android)\1'
