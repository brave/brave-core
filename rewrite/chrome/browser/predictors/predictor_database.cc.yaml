substitutions:
  - description: |-
      Clear loading predictor data left behind by earlier versions.

      With the predictor disabled (see the plaster for
      chrome/browser/predictors/loading_predictor_config.cc) nothing reads or
      writes these tables again, so a profile that collected data before it
      was turned off would keep it forever. MaybeClearLoadingPredictorData()
      is defined by the chromium_src override for this file.
    regex:
      pattern: 'resource_prefetch_tables_->Initialize(db_.get());'
      replace: |-
        MaybeClearLoadingPredictorData(db_.get(), is_loading_predictor_enabled_);
          resource_prefetch_tables_->Initialize(db_.get());
