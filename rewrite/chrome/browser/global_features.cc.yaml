substitutions:
  - description: |
      Create BraveGlobalFeatures

      `Init()` runs on every GlobalFeatures, including test fakes, so
      `brave_global_features()` is always valid once it has run.
    preempt_function_impl:
      function_name: GlobalFeatures::Init
      code: 'brave_global_features_ = std::make_unique<BraveGlobalFeatures>();'
