# Swap the upstream history semantic search disclaimer IDS references to
# Brave-owned strings. Brave's implementation runs entirely on-device (see
# brave/browser/history_embeddings/README.md), so the upstream text about
# data being sent to Brave and seen by human reviewers is inaccurate. The
# IDS_BRAVE_* definitions are pulled in by the chromium_src override at
# brave/chromium_src/chrome/browser/history_embeddings/history_embeddings_utils.cc.

substitutions:
  - description:
      'Swap IDS_HISTORY_EMBEDDINGS_DISCLAIMER_LOGGING_OFF to the Brave-owned
      string.'
    regex:
      re_pattern: '\bIDS_HISTORY_EMBEDDINGS_DISCLAIMER_LOGGING_OFF\b'
      replace: 'IDS_BRAVE_HISTORY_EMBEDDINGS_DISCLAIMER'

  - description:
      'Swap IDS_HISTORY_EMBEDDINGS_DISCLAIMER to the Brave-owned string.'
    regex:
      re_pattern: '\bIDS_HISTORY_EMBEDDINGS_DISCLAIMER\b'
      replace: 'IDS_BRAVE_HISTORY_EMBEDDINGS_DISCLAIMER'

  - description: 'Ship kLaunchedHistoryEmbeddings disabled.'
    set_feature_flag_default_state:
      feature_name: kLaunchedHistoryEmbeddings
      value: base::FEATURE_DISABLED_BY_DEFAULT

  - description: |-
      Keep upstream's history embeddings off.

      Brave runs its own fork in //brave/components/history_embeddings.
      Every upstream consumer reaches the feature through this function,
      including HistoryEmbeddingsServiceFactory, so returning false here keeps
      upstream's service from being built and its UI from showing, whatever
      the feature flags say.
    preempt_function_impl:
      function_name: IsHistoryEmbeddingsFeatureEnabled
      return_if: 'true'
      return_value: 'false'

  - description: |-
      Force IsHistoryEmbeddingsSettingVisible off.

      kBraveHistoryEmbeddingsEnabled is surfaced by Brave's own settings UI,
      so the chrome://settings/ai History Search entry is never surfaced.
    preempt_function_impl:
      function_name: IsHistoryEmbeddingsSettingVisible
      code: |-
        if ((true)) return false;
