substitutions:
  - description: Add the Brave importer sources.
    add_literal_to_list:
      target: importer
      list_name: sources
      literal: brave_browser_importer_sources
      import: //brave/browser/importer/sources.gni

  - description: Add the Brave importer public_deps.
    add_literal_to_list:
      target: importer
      list_name: public_deps
      literal: brave_browser_importer_public_deps
      import: //brave/browser/importer/sources.gni

  - description: Add the Brave importer implementation sources.
    add_literal_to_list:
      target: impl
      list_name: sources
      literal: brave_browser_importer_impl_sources
      import: //brave/browser/importer/sources.gni

  - description: Add the Brave importer implementation deps.
    add_literal_to_list:
      target: impl
      list_name: deps
      literal: brave_browser_importer_impl_deps
      import: //brave/browser/importer/sources.gni
