substitutions:
  - description: |
      Add a RequestImage overload that takes an explicit traffic annotation.

      RewardsServiceFactory needs to supply its own network traffic
      annotation tag instead of the one baked into the public RequestImage
      overload.
    add_to_public:
      class_name: BitmapFetcherService
      code: |-
        RequestId RequestImageWithNetworkTrafficAnnotationTag(
            const GURL& url,
            BitmapFetchedCallback callback,
            const net::NetworkTrafficAnnotationTag& traffic_annotation);
