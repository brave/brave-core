substitutions:
  - description: |-
      Override the dialog title for INSTALL_PROMPT.

      Returns Brave's unvetted-extension title directly from the
      INSTALL_PROMPT case.
    regex:
      re_pattern: 'id = IDS_EXTENSION_INSTALL_PROMPT_TITLE;'
      replace: |-
        return l10n_util::GetStringUTF16(IDS_UNVETTED_EXTENSION_INSTALL_PROMPT_TITLE);
