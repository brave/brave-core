substitutions:
  - description: |
      Don't track the Tor profile as the primary OTR profile.

      Brave's Profile::IsPrimaryOTRProfile() is true for Tor, so the watcher
      would observe it and then DCHECK when the real primary OTR is created.
    regex:
      pattern: 'if (!off_the_record->IsPrimaryOTRProfile()) {'
      replace:
        'if (!off_the_record->IsPrimaryOTRProfile() || off_the_record->IsTor())
        {'
