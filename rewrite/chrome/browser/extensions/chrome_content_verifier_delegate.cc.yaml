substitutions:
  - description: |
      Default to ENFORCE_STRICT on official builds, not just Google Chrome.

      `VerifyInfo::Mode::ENFORCE_STRICT` is only defaulted for Google Chrome
      upstream. Brave wants the same default for its own official builds.
    regex:
      pattern: '#if BUILDFLAG(GOOGLE_CHROME_BRANDING)'
      replace: '#if defined(OFFICIAL_BUILD)'
