substitutions:
  - description: Import the image fetcher factory for the fallback fetcher.
    regex:
      re_pattern: '(import org\.chromium\.chrome\.browser\.profiles\.Profile;)'
      replace: |-
        \1
        import org.chromium.components.image_fetcher.ImageFetcherConfig;
        import org.chromium.components.image_fetcher.ImageFetcherFactory;

  - description: |
      The native AutofillImageFetcher is disabled. Upstream UI expects a
      non-null fetcher, so hand out a cache-only one. Prefetches only come
      from native, so it never fetches anything.
    regex:
      pattern:
        'return AutofillImageFetcherFactoryJni.get().getForProfile(profile);'
      replace: |-
        if (sBraveFetcher == null) {
                    sBraveFetcher =
                            new AutofillImageFetcher(
                                    ImageFetcherFactory.createImageFetcher(
                                            ImageFetcherConfig.DISK_CACHE_ONLY,
                                            profile.getOriginalProfile().getProfileKey()));
                }
                return sBraveFetcher;

  - description: Hold the cache-only fetcher.
    regex:
      re_pattern:
        '(private @Nullable static AutofillImageFetcher
        sAutofillImageFetcherForTesting;)'
      replace: |-
        \1
            private @Nullable static AutofillImageFetcher sBraveFetcher;
