substitutions:
  - description: |
      Import the Settings bottom inset provider.

    regex:
      re_pattern: '(package org.chromium.chrome.browser.autofill;)'
      replace: |-
        \1

        import org.chromium.chrome.browser.settings.BottomInsetViewProvider;

  - description: |
      Let Autofill editors supply their bottom inset target.

    regex:
      re_pattern: '(class AutofillEditorBase extends Fragment\s+implements )'
      replace: '\1BottomInsetViewProvider, '

  - description: |
      Inset the whole Autofill editor so its footer clears system navigation.

      The editor uses a ScrollView rather than the preference RecyclerView
      that Settings insets by default.
    regex:
      re_pattern: '(class AutofillEditorBase\b[^{]*\{)'
      replace: |
        \1
            @Override
            public View getBottomInsetView(View fragmentView) {
                return fragmentView;
            }
