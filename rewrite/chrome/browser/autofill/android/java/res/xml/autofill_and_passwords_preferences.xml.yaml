substitutions:
  - description: 'Use BravePasswordsPreference.'
    regex:
      pattern: '<org.chromium.chrome.browser.password_manager.settings.PasswordsPreference'
      replace: '<org.chromium.chrome.browser.password_manager.settings.BravePasswordsPreference'
  - description: 'Use the location icon for contact info.'
    regex:
      pattern: 'android:icon="@drawable/ic_outline_email_24dp"'
      replace: 'android:icon="@drawable/ic_location_on"'
  - description: 'Use the autofill icon for autofill settings.'
    regex:
      pattern: 'android:icon="@drawable/ic_settings_24dp"'
      replace: 'android:icon="@drawable/ic_autofill"'
