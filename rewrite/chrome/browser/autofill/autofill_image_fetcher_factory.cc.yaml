substitutions:
  - description: |
      Disable AutofillImageFetcher. It only fetches Google Payments/Wallet
      images; data managers already handle a null fetcher.
    preempt_function_impl:
      function_name: AutofillImageFetcherFactory::BuildServiceInstanceForBrowserContext
      return_if: '(true)'
      return_value: 'nullptr'
