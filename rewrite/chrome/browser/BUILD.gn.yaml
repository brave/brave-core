substitutions:
  - description: Depend on the Brave browser core.
    insert_into_list:
      target: browser
      list_name: public_deps
      values:
        - //brave/browser:core

  - description: Add the Brave browser public_deps.
    add_literal_to_list:
      target: browser_public_dependencies
      list_name: public_deps
      literal: brave_chrome_browser_public_deps
      import: //brave/browser/sources.gni
