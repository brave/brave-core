substitutions:
  - description: |-
      Since depot_tools 4cc1ba6be, autoninja sets the environment variable
      NoDefaultCurrentDirectoryInExePath=1 on Windows. Upstream then fails to
      launch its tagging tool by bare name, which breaks the updater_tests
      build. This substitution fixes the problem by launching the tool via its
      absolute path.
    regex:
      pattern: "[self._tagging_exe, '--set-tag'"
      replace: "[os.path.abspath(self._tagging_exe), '--set-tag'"
