substitutions:
  - description: |
      Look for "actives" files where the updater looks for them.

      Upstream's test helper composes the directory from the company short
      name. The updater uses the keystone name. Both give "GoogleSoftwareUpdate"
      for Google, but "BraveSoftwareSoftwareUpdate" vs. "BraveSoftwareUpdate"
      for us. This made IntegrationTest.ReportsActive and
      IntegrationTest.CRURegistrationReportsActive fail on macOS.
    regex:
      pattern: 'COMPANY_SHORTNAME_STRING "SoftwareUpdate"'
      replace: 'KEYSTONE_NAME'
