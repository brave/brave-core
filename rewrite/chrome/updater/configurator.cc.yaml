substitutions:
  - description: |
      Disable CUP signing for the updater.

      Our CUP key is still ECDSA, but upstream's verification path now only
      accepts ML-DSA-44 signatures (see
      patches/components-client_update_protocol-cup.cc.patch), so a signed
      response can never validate. Force this off until we have an ML-DSA-44
      key of our own.
    preempt_function_impl:
      function_name: Configurator::EnabledCupSigning
      code: |-
        if ((true)) {
          return false;
        }
