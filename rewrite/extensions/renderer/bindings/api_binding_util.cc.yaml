substitutions:
  - description: |-
      Report desktop_android on all Android, matching
      Feature::GetCurrentPlatform().
    regex:
      re_pattern:
        '#elif BUILDFLAG\(IS_DESKTOP_ANDROID\)(\s*return "desktop_android";)'
      replace: '#elif BUILDFLAG(IS_ANDROID)\1'
