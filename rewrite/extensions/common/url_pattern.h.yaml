substitutions:
  - description: |-
      Declare `CanonicalizeHostForMatching()` as a public static member.

      Debounce and Request-OTR rules canonicalise hosts the way URL patterns
      do, and call upstream's helper rather than keeping copies of it.
    add_to_public:
      class_name: URLPattern
      code: |-
        // Removes trailing dot(s) from `host_piece` if any.
        static std::string_view CanonicalizeHostForMatching(
            std::string_view host_piece);
