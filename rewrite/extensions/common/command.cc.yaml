substitutions:
  - description: Use the desktop-android keybinding platform on all Android.
    regex:
      re_pattern:
        '#elif BUILDFLAG\(IS_DESKTOP_ANDROID\)(\s*// For now, we use linux
        keybindings)'
      replace: '#elif BUILDFLAG(IS_ANDROID)\1'
