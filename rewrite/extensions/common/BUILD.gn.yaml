substitutions:
  - description: |-
      constants.h uses BUILDFLAG(ENABLE_EXTENSIONS_CORE), but nothing in
      constants_impl's deps generates that header, so GN/Ninja has no
      ordering guarantee between generating it and compiling against it.
    add_literal_to_list:
      target: constants_impl
      list_name: public_deps
      literal: '[ "//extensions/buildflags" ]'
