substitutions:
  - description: |
      Let the embedder augment the extension blocklist with Brave's own list.

      `//extensions/browser` cannot depend on `//brave/components`, so Blocklist
      reaches the Brave-distributed malware list through this client instead.
      BraveExtensionsBrowserClientImpl overrides it; the default returns false,
      so upstream and other embedders are unaffected.
    add_to_public:
      class_name: ExtensionsBrowserClient
      code: |-
        virtual bool IsOnBraveMalwareExtensionList(
            const ExtensionId& extension_id) const;
