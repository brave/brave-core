substitutions:
  - description: |
      Resolve Brave's malicious-extension list as BLOCKLISTED_MALWARE.

      Brave distributes its own malware list via a component, so those IDs never
      enter the upstream `blocklisted_ids` set and never reach the state fetcher.
      Wrapping `callback` ahead of the whole body means the verdicts also apply
      on the early-return path taken when there is no database manager.
    preempt_function_impl:
      function_name: Blocklist::GetBlocklistedIDs
      code: |-
        callback = base::BindOnce(&MergeBraveMalwareIDs, ids, std::move(callback));
