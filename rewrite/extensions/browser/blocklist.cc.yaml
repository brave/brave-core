substitutions:
  - description: |
      Report embedder-blocklisted extensions as BLOCKLISTED_MALWARE.

      Wrapping the callback ahead of the Safe Browsing early return keeps the
      embedder list enforced when Safe Browsing is unavailable, and covers both
      callers: the install-time BlocklistCheck and the periodic sweep.
    preempt_function_impl:
      function_name: Blocklist::GetBlocklistedIDs
      code: |-
        callback = base::BindOnce(&AddEmbedderMalwareStates, ids,
                                  std::move(callback));
