substitutions:
  - description: Use the Linux CPU info provider on Android with the core.
    regex:
      pattern:
        'if (is_linux || is_chromeos || enable_desktop_android_extensions) {'
      replace:
        'if (is_linux || is_chromeos || (is_android && enable_extensions_core))
        {'
