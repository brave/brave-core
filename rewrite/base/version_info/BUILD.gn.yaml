substitutions:
  - description: |
      Build version_info against the Brave version config.

      `configs` is populated by `set_defaults` rather than assigned here, so
      it is appended to rather than created.
    add_literal_to_list:
      target: version_info
      list_name: configs
      literal: '[ "//brave/build:version" ]'
      assume_defined: true

  - description: Depend on the Brave version_info component.
    insert_into_list:
      target: version_info
      list_name: deps
      values:
        - //brave/components/version_info
