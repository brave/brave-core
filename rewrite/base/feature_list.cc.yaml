substitutions:
  - description: |-
      Check for the compile-time override of a feature's default state.
    count: 2
    regex:
      pattern: 'feature.default_state == FEATURE_ENABLED_BY_DEFAULT'
      replace: 'GetCompileTimeFeatureState(feature)'

  - description: Extend `IsFeatureOverridden` for Brave-specific values.
    after_function_impl:
      function_name: FeatureList::IsFeatureOverridden
      result_var: 'result'
      code: |-
        if (result) {
          return result;
        }
        return internal::IsFeatureOverridden(feature_name);

  - description: Extend `GetStateIfOverridden` for Brave-specific values.
    after_function_impl:
      function_name: FeatureList::GetStateIfOverridden
      result_var: result
      code: |-
        if (result.has_value()) {
          return result;
        }
        return internal::GetStateIfOverridden(feature);
