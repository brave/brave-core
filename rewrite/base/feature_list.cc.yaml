substitutions:
  - description: |
      Treat features selected by Brave at compile time as overridden.
    preempt_function_impl:
      function_name: FeatureList::IsFeatureOverridden
      code: |-
        if (IsCompileOverriddenFeature(feature_name)) {
          return true;
        }

  - description: |
      Return the effective state for features overridden at compile time.
    after_function_impl:
      function_name: FeatureList::IsFeatureEnabledIfOverridden
      result_var: state
      code: |-
        if (!state.has_value() && IsCompileOverriddenFeature(feature.name)) {
          return IsFeatureEnabled(feature);
        }
        return state;
