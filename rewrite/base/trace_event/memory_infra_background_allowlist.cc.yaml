substitutions:
  - description: |
      Consult IsMemoryAllocatorDumpNameInBraveAllowlist (defined in the
      chromium_src override) first: it reports whether the name is one of
      Brave's own exceptions, falling through to the upstream check otherwise.
    preempt_function_impl:
      function_name: IsMemoryAllocatorDumpNameInAllowlist
      code: |-
        if (IsMemoryAllocatorDumpNameInBraveAllowlist(name)) {
          return true;
        }
