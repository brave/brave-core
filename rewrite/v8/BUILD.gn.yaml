substitutions:
  - description: |
      Put the Brave v8 overrides ahead of upstream's include dirs.

      gn refuses to overwrite a non-empty list, so the upstream value is
      captured, cleared, and re-assigned behind the Brave path.
    append_to_target:
      target: internal_config_base
      type: config
      code: |-
        _include_dirs = include_dirs
        include_dirs = []
        include_dirs = [ "//brave/chromium_src/v8" ] + _include_dirs

  - description: Add the Brave v8 header sources.
    add_literal_to_list:
      target: v8_headers
      type: v8_header_set
      list_name: sources
      literal: brave_v8_headers_sources
      import: //brave/v8/sources.gni

  - description: Add the Brave v8 header public_deps.
    add_literal_to_list:
      target: v8_headers
      type: v8_header_set
      list_name: public_deps
      literal: brave_v8_headers_public_deps
      import: //brave/v8/sources.gni

  - description: |
      metagen parses v8 headers that reach Brave's generated page graph
      buildflags header, so it must be generated before the harvest runs.
    add_literal_to_list:
      target: metagen_instance_types_h
      type: action
      list_name: deps
      literal: brave_v8_headers_public_deps
      import: //brave/v8/sources.gni

  - description: |
      Upstream demoted `:v8_snapshot` from public_deps to deps in `//v8:v8`,
      breaking GN's visibility chain to `:run_mksnapshot_default` for
      embedders that bundle snapshot_blob.bin directly rather than through
      //tools/v8_context_snapshot. Restore it for that case only, in both
      the component and non-component variants of the `v8` target.
    add_literal_to_list:
      target: v8
      type: v8_component
      list_name: public_deps
      literal: '[ ":v8_snapshot" ]'
      conditional: '!use_v8_context_snapshot || include_both_v8_snapshots'
      import: //tools/v8_context_snapshot/v8_context_snapshot.gni

  - description: |
      Same as above, for the non-component-build `group("v8")` variant.
    add_literal_to_list:
      target: v8
      type: group
      list_name: public_deps
      literal: '[ ":v8_snapshot" ]'
      conditional: '!use_v8_context_snapshot || include_both_v8_snapshots'
      import: //tools/v8_context_snapshot/v8_context_snapshot.gni
