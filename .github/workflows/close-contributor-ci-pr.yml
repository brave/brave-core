name: Close contributor CI PR

on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-contributor-ci-pr:
    runs-on: ubuntu-slim
    steps:
      - name: Close associated contributor CI PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 3) {
                        nodes {
                          number
                          author {
                            login
                          }
                          merged
                          isDraft
                          title
                          url
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, oid: context.sha });

            const pullRequests =
              result.repository.object?.associatedPullRequests?.nodes ?? [];
            if (pullRequests.length !== 2) {
              core.info(
                `Expected 2 pull requests for push ${context.sha}; found ${pullRequests.length}.`);
              return;
            }

            const sourcePr = pullRequests.find((pr) => pr.merged);
            if (!sourcePr) {
              core.info(`No merged pull request found for push ${context.sha}.`);
              return;
            }

            const ciTitle = `CI run for contributor PR #${sourcePr.number}`;
            const ciPr = pullRequests.find((pr) =>
              pr.number !== sourcePr.number &&
              pr.author.login === 'brave-builds' &&
              pr.isDraft &&
              pr.title === ciTitle);
            if (!ciPr) {
              core.info(`No open contributor CI PR found for PR #${sourcePr.number}.`);
              return;
            }

            core.info(`Closing associated contributor CI PR #${ciPr.number}: ${ciPr.url}`);
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: ciPr.number,
              state: 'closed',
            });
