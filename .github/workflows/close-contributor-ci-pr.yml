name: Close contributor CI PR

on:
  pull_request_target:
    branches: [master]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-contributor-ci-pr:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-slim
    steps:
      - name: Close associated contributor CI PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 3) {
                        nodes {
                          number
                          author {
                            login
                          }
                          isDraft
                          title
                          url
                        }
                      }
                    }
                  }
                }
              }
            `, {
              owner,
              repo,
              oid: context.payload.pull_request.merge_commit_sha,
            });

            const pullRequests =
              result.repository.object?.associatedPullRequests?.nodes ?? [];
            if (pullRequests.length !== 2) {
              core.info(
                `Expected 2 pull requests for merge commit ${context.payload.pull_request.merge_commit_sha}; found ${pullRequests.length}.`);
              return;
            }

            const sourcePrNumber = context.payload.pull_request.number;
            const ciTitle = `CI run for contributor PR #${sourcePrNumber}`;
            const ciPr = pullRequests.find((pr) =>
              pr.number !== sourcePrNumber &&
              pr.author.login === 'brave-builds' &&
              pr.isDraft &&
              pr.title === ciTitle);
            if (!ciPr) {
              core.info(`No open contributor CI PR found for PR #${sourcePrNumber}.`);
              return;
            }

            core.info(`Closing associated contributor CI PR #${ciPr.number}: ${ciPr.url}`);
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: ciPr.number,
              state: 'closed',
            });
