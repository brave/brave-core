name: Close contributor CI PR

on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-contributor-ci-pr:
    runs-on: ubuntu-slim
    steps:
      - name: Close associated contributor CI PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 10) {
                        nodes {
                          number
                          merged
                          isDraft
                          title
                          body
                          url
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, oid: context.sha });

            const pullRequests =
              result.repository.object?.associatedPullRequests?.nodes ?? [];
            const sourcePr = pullRequests.find((pr) => pr.merged);
            if (!sourcePr) {
              core.info(`No merged pull request found for push ${context.sha}.`);
              return;
            }

            const ciTitle = `CI run for contributor PR #${sourcePr.number}`;
            const matches = pullRequests.filter((pr) =>
              pr.number !== sourcePr.number &&
              pr.isDraft &&
              pr.title === ciTitle &&
              pr.body?.includes(`proposed in PR #${sourcePr.number}`));
            if (matches.length === 0) {
              core.info(`No open contributor CI PR found for PR #${sourcePr.number}.`);
              return;
            }

            for (const pr of matches) {
              core.info(`Closing associated contributor CI PR #${pr.number}: ${pr.url}`);
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }
