name: Close contributor CI PR

on:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-contributor-ci-pr:
    runs-on: ubuntu-slim
    steps:
      - name: Close associated contributor CI PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const query = `
              query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $repo) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 1) {
                        nodes {
                          number
                          merged
                          headRefName
                          headRepositoryOwner {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner,
              repo,
              oid: context.sha,
            });
            const sourcePr = result.repository.object?.associatedPullRequests
              ?.nodes?.[0];
            if (!sourcePr?.merged) {
              core.info(`No merged pull request found for push ${context.sha}.`);
              return;
            }

            const ciTitle = `CI run for contributor PR #${sourcePr.number}`;
            const headOwner = sourcePr.headRepositoryOwner?.login;
            const expectedHeadRef = headOwner
              ? `contributor-${headOwner}-${sourcePr.headRefName}`
              : undefined;

            const candidates = expectedHeadRef
              ? await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  head: `${owner}:${expectedHeadRef}`,
                  state: 'open',
                  per_page: 100,
                })
              : [];

            const matches = candidates.filter((pr) =>
              pr.number !== sourcePr.number &&
              pr.draft &&
              pr.title === ciTitle &&
              pr.body?.includes(`proposed in PR #${sourcePr.number}`));

            if (matches.length === 0) {
              core.info(`No open contributor CI PR found for PR #${sourcePr.number}.`);
              return;
            }

            for (const pr of matches) {
              core.info(`Closing associated contributor CI PR #${pr.number}: ${pr.html_url}`);
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }
