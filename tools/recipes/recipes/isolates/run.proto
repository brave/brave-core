syntax = "proto3";

package recipes.brave.isolates.run;

message InputProperties {
  // The tree's digest, as `<hash>/<size>`, from `isolates/archive`.
  string digest = 1;

  // The command the suite runs with, and the directory in the tree it runs
  // in, both from `isolates/archive`.
  repeated string command = 2;
  string cwd = 3;
}
