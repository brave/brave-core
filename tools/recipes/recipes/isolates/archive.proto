syntax = "proto3";

package recipes.brave.isolates.archive;

message InputProperties {
  // The Chromium checkout the suites were built in; the workspace's when
  // unset.
  string src_dir = 1;

  // The build directory, relative to `src_dir`, e.g. `out/Release`.
  string build_dir = 2;

  // The test suites to archive, e.g. `brave_unit_tests`.
  repeated string targets = 3;
}
