syntax = "proto3";

package recipes.brave.cr.autolift_gerrit_upload;

message InputProperties {
  // Gerrit SSH user the upload authenticates as.
  string gerrit_user = 1;

  // Only reads Gerrit, and says what the upload would change, as for an
  // autolift dry run.
  bool dry_run = 2;
}
