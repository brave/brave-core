syntax = "proto3";

package recipes.brave.cr.autolift;

message InputProperties {
  // The milestone of the `cr<N>` branch to lift; the latest `cr<N>` branch on
  // brave-core when unset.
  int32 milestone = 1;

  // Carries on with a run that stopped before finishing, in the checkout,
  // out dir and `.autolift/cr<N>/` as it left them, rather than starting over.
  bool resume = 2;
}
