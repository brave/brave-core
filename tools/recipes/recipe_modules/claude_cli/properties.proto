syntax = "proto3";

package recipe_modules.brave.claude_cli;

message EnvProperties {
  // What the `opus` and `sonnet` model aliases resolve to, as Claude reads
  // them itself, e.g. Bedrock inference profile ARNs. Empty means Claude's
  // default model for the alias.
  string ANTHROPIC_DEFAULT_OPUS_MODEL = 1;
  string ANTHROPIC_DEFAULT_SONNET_MODEL = 2;
}
