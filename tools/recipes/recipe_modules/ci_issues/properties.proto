syntax = "proto3";

package recipe_modules.brave.ci_issues;

// Where CI files what a build found. Each repository is CI's to give: none
// files nothing of that kind.
message InputProperties {
  // The repository to file sanitiser findings in, as `owner/name`.
  string sanitizer_repository = 1;

  // The repository to file failing tests in, as `owner/name`.
  string test_repository = 2;

  // The build's page, which issues and comments link to.
  string build_url = 3;

  // The labels every issue gets besides its own, e.g. the branch it was
  // built from.
  repeated string labels = 4;
}
