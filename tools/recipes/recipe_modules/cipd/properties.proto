syntax = "proto3";

package recipe_modules.brave.cipd;

message EnvProperties {
  // The machine's CIPD cache, which `cipd` reads itself: the packages it has
  // downloaded and the versions it has resolved, kept between runs. Without
  // it, every run downloads its tools again.
  string CIPD_CACHE_DIR = 1;
}
