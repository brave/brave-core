syntax = "proto3";

package recipe_modules.brave.cas;

message InputProperties {
  // The remote execution service whose CAS trees go to, with its port; the
  // one Brave builds use when unset.
  string service = 1;

  // Its instance name; `default` when unset.
  string instance = 2;
}

message EnvProperties {
  // The mTLS client certificate and key the service authenticates with, as
  // Siso reads them for a build.
  string RBE_TLS_CLIENT_AUTH_CERT = 1;
  string RBE_TLS_CLIENT_AUTH_KEY = 2;
}
