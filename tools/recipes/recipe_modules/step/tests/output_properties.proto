syntax = "proto3";

package recipe_modules.brave.step.tests.output_properties;

message Artefact {
  string url = 1;
  string sha256 = 2;
  repeated string platforms = 3;
}

message InputProperties {
  // An artefact exported by an earlier run, fed back in as input.
  Artefact artefact = 1;
}
